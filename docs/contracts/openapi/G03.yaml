  # --- E38 leave_balance_adjustments (P01 request → ledger ADJUSTMENT) --------
  /atl/leave-balance-adjustments:
    post:
      tags: [Leave Balances & Ledger]
      summary: Request a leave balance adjustment (maker; P01 maker-checker) (v3.2)
      description: >
        Raises an approvable balance-adjustment request. On approval it posts a
        single `ADJUSTMENT` entry to the append-only `leave_ledger_entries`
        SSOT under optimistic lock.
      operationId: requestLeaveBalanceAdjustment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveBalanceAdjustmentCreate' }
      responses:
        '201':
          description: Adjustment request raised (pending checker approval).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveBalanceAdjustment' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }
    get:
      tags: [Leave Balances & Ledger]
      summary: List leave balance adjustment requests (v3.2)
      operationId: listLeaveBalanceAdjustments
      parameters:
        - name: employeeId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AdjustmentStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of adjustment requests.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/LeaveBalanceAdjustment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /atl/leave-balance-adjustments/{id}/decision:
    post:
      tags: [Leave Balances & Ledger]
      summary: Approve or reject a balance adjustment (checker; P01, SoD) (v3.2)
      description: >
        Checker decision. Approve applies the ADJUSTMENT ledger entry under
        optimistic lock; maker == checker is blocked (403 SoD). Stale
        `expectedVersion` → 409 OPTIMISTIC_LOCK_CONFLICT.
      operationId: decideLeaveBalanceAdjustment
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowDecision' }
      responses:
        '200':
          description: Decision applied.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveBalanceAdjustment' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Optimistic-lock or state conflict (OPTIMISTIC_LOCK_CONFLICT).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '500': { $ref: '#/components/responses/Internal' }

  # --- E39 leave_revocations (post-approval revocation → AVAIL_REVERSAL) ------
  /atl/leave-revocations:
    post:
      tags: [Leave Applications]
      summary: Request post-approval revocation of an approved leave (P01) (v3.2)
      description: >
        Revokes an already-APPROVED leave (distinct from pre-start withdrawal).
        On approval it posts an `AVAIL_REVERSAL` refund to the ledger on the
        same `leave_spell_lineage_id` and, if the period is locked, emits a
        next-period payroll feed adjustment.
      operationId: requestLeaveRevocation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveRevocationCreate' }
      responses:
        '201':
          description: Revocation request raised (pending approval).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRevocation' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >
            Application not in a revocable (APPROVED) state, or leave already
            availed/past (CANNOT_CANCEL_PAST).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/Internal' }
    get:
      tags: [Leave Applications]
      summary: List leave revocation requests (v3.2)
      operationId: listLeaveRevocations
      parameters:
        - name: employeeId
          in: query
          schema: { type: string, format: uuid }
        - name: applicationId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of revocation requests.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/LeaveRevocation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /atl/leave-revocations/{id}/decision:
    post:
      tags: [Leave Applications]
      summary: Approve or reject a leave revocation (P01) (v3.2)
      operationId: decideLeaveRevocation
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowDecision' }
      responses:
        '200':
          description: Decision applied; AVAIL_REVERSAL enqueued on approve.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRevocation' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '500': { $ref: '#/components/responses/Internal' }

  # --- E40 attendance_lock_periods (monthly lock / unlock) -------------------
  /atl/attendance-lock-periods:
    post:
      tags: [Attendance Lock]
      summary: Lock an attendance month at org scope (v3.2)
      description: >
        Locks a `YYYY-MM` attendance cycle for a scope. While LOCKED, roster /
        holiday / regularisation / leave edits touching the month are refused
        (PERIOD_LOCKED) and corrections route to next-period feed adjustments.
      operationId: lockAttendancePeriod
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceLockCreate' }
      responses:
        '201':
          description: Attendance month locked.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceLockPeriod' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Month already locked for the scope (PERIOD_ALREADY_LOCKED).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/Internal' }
    get:
      tags: [Attendance Lock]
      summary: List attendance lock periods (v3.2)
      operationId: listAttendanceLockPeriods
      parameters:
        - name: lockMonth
          in: query
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        - name: scopeOrgUnitId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/LockStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of attendance lock periods.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AttendanceLockPeriod' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /atl/attendance-lock-periods/{id}/unlock:
    post:
      tags: [Attendance Lock]
      summary: Reopen (unlock) a locked attendance month (v3.2)
      operationId: unlockAttendancePeriod
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Attendance month reopened (status REOPENED).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceLockPeriod' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Period not locked, or payroll already closed for the month (CONFLICT).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/Internal' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Bearer JWT carrying the session's resolved roles and tenant/entity
        scope. Endpoints never re-implement permission logic; they call P02
        `Authorization.check`.

  headers:
    XCorrelationId:
      description: >
        Correlation id echoed on every response and written to every P05 audit
        and log line for the request.
      schema: { type: string }

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Required on workflow-initiating / unsafe POSTs. A repeat within 24h
        returns the original result rather than creating a duplicate.
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      description: Page size (default 25, max 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `next_cursor`.
      schema: { type: string }
    Sort:
      name: sort
      in: query
      description: Sort spec, e.g. `created_at:desc`.
      schema:
        type: string
        pattern: '^[a-zA-Z_]+:(asc|desc)$'

  responses:
    ValidationFailed:
      description: Input failed a VAL-* / VAL-G03-* rule (VALIDATION_FAILED).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: No, invalid, expired or revoked session/token (UNAUTHENTICATED).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not permitted; never leaks out-of-scope existence (FORBIDDEN).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource absent or out of the caller's scope (NOT_FOUND).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Idempotency replay, duplicate workflow start, or state/uniqueness/version conflict (CONFLICT).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionFailed:
      description: A required precondition is not met, incl. retryable upstream unavailability (PRECONDITION_FAILED).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Rate limit or brute-force lockout exceeded (RATE_LIMITED).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Internal:
      description: Unexpected server error or non-retryable upstream failure (INTERNAL).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    # --- Core envelope & shared -------------------------------------------
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: >
                One of the 8 platform wire codes (VALIDATION_FAILED,
                UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT,
                PRECONDITION_FAILED, RATE_LIMITED, INTERNAL) OR a G03 domain
                reason / ERR-G03-* message id carried in this field.
              examples: [INSUFFICIENT_BALANCE, OPTIMISTIC_LOCK_CONFLICT, ERR-G03-COMMUTED-HPL]
            message:
              type: string
              description: Human-readable copy resolved from an ERR-*/MSG-* id.
            field:
              type: [string, 'null']
              description: Offending field for validation errors.
            details:
              type: [object, 'null']
              description: 'Structured discriminators, e.g. { reason: <REASON> }.'
              additionalProperties: true
      examples:
        - error:
            code: INSUFFICIENT_BALANCE
            message: Available EL balance 1.5 (after reservations) is less than requested 2.5.
            field: days
            details: { reason: INSUFFICIENT_BALANCE }

    Page:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {}
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page; null when no further pages.

    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: Justification (VAL-COMMENT / ERR-REASON-REQ).

    WorkflowDecision:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT, SEND_BACK]
        comment:
          type: string
        expectedVersion:
          type: integer
          description: Optimistic-lock version the caller last observed.

    JobRunAck:
      type: object
      required: [runId, status]
      properties:
        runId: { type: string, format: uuid }
        jobId: { type: string, examples: [JOB-M04-ACCRUAL] }
        status:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED, PARTIAL, FAILED]
        scopeOrgUnitId: { type: [string, 'null'], format: uuid }

    # --- Enums -------------------------------------------------------------
    LeaveApplicationStatus:
      type: string
      enum: [DRAFT, SUBMITTED, RECOMMENDED, APPROVED, REJECTED, CANCELLED, WITHDRAWN]

    SrPostingStatus:
      type: string
      enum: [NOT_REQUIRED, PENDING, POSTED, FAILED]

    AnomalyStatus:
      type: string
      enum: [OPEN, CONFIRMED_VALID, CONFIRMED_FRAUD, ESCALATED]

    # --- Shifts & rosters --------------------------------------------------
    ShiftCreate:
      type: object
      required: [shiftCode, name, startTime, endTime, halfDayThresholdMinutes, fullDayThresholdMinutes]
      properties:
        shiftCode: { type: string, maxLength: 20 }
        name: { type: string, maxLength: 100 }
        startTime: { type: string, examples: ['09:30'] }
        endTime: { type: string, examples: ['17:30'] }
        graceMinutes: { type: integer, default: 10 }
        halfDayThresholdMinutes: { type: integer }
        fullDayThresholdMinutes: { type: integer }
        breakMinutes: { type: integer, default: 0 }
        isNightShift: { type: boolean, default: false }
        dateAnchorRule:
          type: string
          enum: [SHIFT_START_LOCAL_DATE, PUNCH_LOCAL_DATE]
          default: SHIFT_START_LOCAL_DATE
        displayTimezone: { type: string, default: Asia/Kolkata }
        orgUnitScopeId: { type: [string, 'null'], format: uuid }
        # --- v3.2 field-reconciliation additions (SQL SECTION 13b/13c) ---
        isWfhShift: { type: boolean, default: false, description: 'v3.2 — Is WFH shift?' }
        shiftType:
          type: string
          enum: [FIXED, FLEXIBLE, ROTATIONAL]
          default: FIXED
          description: v3.2 — structural shift type (flex window rides in shift_config).
        leaveDeductionFactor: { type: [number, 'null'], description: v3.2 — leave-deduction factor. }
        standardWorkingMinutes: { type: [integer, 'null'], description: v3.2 — standard working hours (minutes). }
        attendancePolicyId: { type: [string, 'null'], format: uuid, description: v3.2 — governing attendance_policies (E32). }
        overtimePolicyId: { type: [string, 'null'], format: uuid, description: v3.2 — overtime_policies (E33) enabled in shift. }
    Shift:
      allOf:
        - $ref: '#/components/schemas/ShiftCreate'
        - type: object
          required: [shiftId, status]
          properties:
            shiftId: { type: string, format: uuid }
            status: { type: string, enum: [ACTIVE, INACTIVE] }
            tenantId: { type: string, format: uuid }
            entityId: { type: string, format: uuid }

    RosterCreate:
      type: object
      required: [employeeId, shiftId, effectiveFrom, weeklyOffPattern]
      properties:
        employeeId: { type: string, format: uuid }
        shiftId: { type: string, format: uuid }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, 'null'], format: date }
        weeklyOffPattern:
          type: array
          items: { type: string }
          examples: [[SUN, SAT2, SAT4]]
    Roster:
      allOf:
        - $ref: '#/components/schemas/RosterCreate'
        - type: object
          required: [rosterId, status]
          properties:
            rosterId: { type: string, format: uuid }
            status: { type: string, enum: [DRAFT, PUBLISHED, SUPERSEDED] }

    # --- Holidays ----------------------------------------------------------
    HolidayCalendarCreate:
      type: object
      required: [calendarCode, name, year]
      properties:
        calendarCode: { type: string, maxLength: 30 }
        name: { type: string, maxLength: 120 }
        year: { type: integer }
        locationScopeId: { type: [string, 'null'], format: uuid }
        rhCap: { type: integer, default: 2 }
    HolidayCalendar:
      allOf:
        - $ref: '#/components/schemas/HolidayCalendarCreate'
        - type: object
          required: [calendarId, status]
          properties:
            calendarId: { type: string, format: uuid }
            status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }

    HolidayCreate:
      type: object
      required: [holidayDate, name, holidayType]
      properties:
        holidayDate: { type: string, format: date }
        name: { type: string, maxLength: 120 }
        holidayType:
          type: string
          enum: [GAZETTED, RESTRICTED, SECTIONAL, OPTIONAL]
        isRestrictedOptional: { type: boolean, default: false }
        # --- v3.2 field-reconciliation additions ---
        dayName: { type: [string, 'null'], description: v3.2 — day-of-week label. }
        repeatNextYear: { type: boolean, default: false, description: v3.2 — import-forward next year. }
        isNational: { type: boolean, default: false, description: v3.2 — national holiday flag. }
        recurrenceType:
          type: string
          enum: [STATIC_DATE, DAY_OF_MONTH]
          default: STATIC_DATE
          description: v3.2 — static-date vs nth-day-of-month recurrence.
        recurrenceConfig:
          type: [object, 'null']
          additionalProperties: true
          description: 'v3.2 — { occurrence, month, day } for DAY_OF_MONTH.'
        holidayCategory:
          type: [string, 'null']
          enum: [NATIONAL, REGIONAL, RELIGIOUS, COMPANY_SPECIFIC, null]
          description: v3.2 — holiday category.
        description: { type: [string, 'null'], description: v3.2 — notes / description. }
    Holiday:
      allOf:
        - $ref: '#/components/schemas/HolidayCreate'
        - type: object
          required: [holidayId, calendarId]
          properties:
            holidayId: { type: string, format: uuid }
            calendarId: { type: string, format: uuid }

    RhElectionCreate:
      type: object
      required: [employeeId, calendarId, holidayId, leaveYear]
      properties:
        employeeId: { type: string, format: uuid }
        calendarId: { type: string, format: uuid }
        holidayId: { type: string, format: uuid }
        leaveYear: { type: integer }
    RhElection:
      allOf:
        - $ref: '#/components/schemas/RhElectionCreate'
        - type: object
          required: [electionId, status]
          properties:
            electionId: { type: string, format: uuid }
            status: { type: string, enum: [ELECTED, CANCELLED] }

    # --- Punches -----------------------------------------------------------
    PunchInput:
      type: object
      required: [employeeId, punchTime, captureMethod]
      properties:
        employeeId: { type: string, format: uuid }
        deviceId: { type: [string, 'null'], format: uuid }
        punchTime: { type: string, format: date-time }
        punchDirection: { type: string, enum: [IN, OUT, AUTO] }
        captureMethod:
          type: string
          enum: [BIOMETRIC, RFID, MOBILE_GEO, WEB, MANUAL, OTP_FALLBACK]
        geoLat: { type: [number, 'null'] }
        geoLong: { type: [number, 'null'] }
        livenessScore: { type: [number, 'null'] }
        photoDocumentId: { type: [string, 'null'], format: uuid }
        sourceRef:
          type: [string, 'null']
          description: Device-side raw event id used for idempotent ingestion.
        sourceIp:
          type: [string, 'null']
          description: >
            v3.2 — capture source IP, checked against attendance_networks (E34)
            IP-restriction ranges for network-bound punch governance.
    PunchBatchIngest:
      type: object
      required: [deviceId, punches]
      properties:
        deviceId: { type: string, format: uuid }
        punches:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PunchInput' }
    Punch:
      allOf:
        - $ref: '#/components/schemas/PunchInput'
        - type: object
          required: [punchId, attendanceDate, ingestionStatus]
          properties:
            punchId: { type: string, format: uuid }
            attendanceDate: { type: string, format: date }
            consentId: { type: [string, 'null'], format: uuid }
            ingestionStatus:
              type: string
              enum: [ACCEPTED, DUPLICATE, REJECTED, FLAGGED_FOR_REVIEW]
            anomalyFlags:
              type: [array, 'null']
              items: { type: string }
    PunchBatchResult:
      type: object
      required: [accepted, duplicate, rejected, flagged, results]
      properties:
        accepted: { type: integer }
        duplicate: { type: integer }
        rejected: { type: integer }
        flagged: { type: integer }
        results:
          type: array
          items: { $ref: '#/components/schemas/Punch' }
    MobilePunchCreate:
      allOf:
        - $ref: '#/components/schemas/PunchInput'
        - type: object
          properties:
            consentId: { type: [string, 'null'], format: uuid }

    # --- Attendance --------------------------------------------------------
    AttendanceProcessRequest:
      type: object
      required: [dateFrom, dateTo]
      properties:
        scopeOrgUnitId: { type: [string, 'null'], format: uuid }
        employeeId: { type: [string, 'null'], format: uuid }
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date }
        triggerType:
          type: string
          enum: [SCHEDULED, ON_DEMAND, RECOMPUTE_ENQUEUED]
          default: ON_DEMAND
    AttendanceProcessingRun:
      type: object
      required: [runId, status, dateFrom, dateTo]
      properties:
        runId: { type: string, format: uuid }
        scopeOrgUnitId: { type: [string, 'null'], format: uuid }
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date }
        triggerType:
          type: string
          enum: [SCHEDULED, ON_DEMAND, RECOMPUTE_ENQUEUED]
        status:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED, PARTIAL, FAILED]
        employeesProcessed: { type: integer, default: 0 }
        employeesFailed: { type: integer, default: 0 }
    AttendanceDayAllocation:
      type: object
      required: [allocationId, segmentStatus, dayFraction, countsAsPresent]
      properties:
        allocationId: { type: string, format: uuid }
        segmentStatus:
          type: string
          enum: [PRESENT, ON_LEAVE, WFH, ON_DUTY, HOLIDAY, WEEKLY_OFF, ABSENT, HALF_DAY, MISSING_PUNCH]
        dayFraction: { type: number, minimum: 0, maximum: 1 }
        countsAsPresent: { type: boolean }
        sourceRefType:
          type: [string, 'null']
          enum: [LEAVE_APPLICATION, EXCEPTION, PUNCH, HOLIDAY, SYSTEM, null]
        sourceRefId: { type: [string, 'null'], format: uuid }
    AttendanceDaily:
      type: object
      required: [attendanceDailyId, employeeId, attendanceDate, status, presentUnits]
      properties:
        attendanceDailyId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        attendanceDate: { type: string, format: date }
        rosterId: { type: [string, 'null'], format: uuid }
        firstIn: { type: [string, 'null'], format: date-time }
        lastOut: { type: [string, 'null'], format: date-time }
        workedMinutes: { type: integer, default: 0 }
        status: { type: string }
        presentUnits: { type: number, default: 0 }
        lateMinutes: { type: integer, default: 0 }
        earlyExitMinutes: { type: integer, default: 0 }
        isRegularised: { type: boolean, default: false }
        leaveApplicationId: { type: [string, 'null'], format: uuid }
        allocations:
          type: array
          items: { $ref: '#/components/schemas/AttendanceDayAllocation' }

    # --- Regularisation ----------------------------------------------------
    RegularisationCreate:
      type: object
      required: [attendanceDailyId, employeeId, requestedStatus, reason]
      properties:
        attendanceDailyId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        requestedStatus: { type: string }
        proposedFirstIn: { type: [string, 'null'], format: date-time }
        proposedLastOut: { type: [string, 'null'], format: date-time }
        reason: { type: string }
        supportingDocumentId: { type: [string, 'null'], format: uuid }
    Regularisation:
      allOf:
        - $ref: '#/components/schemas/RegularisationCreate'
        - type: object
          required: [regularisationId, status]
          properties:
            regularisationId: { type: string, format: uuid }
            workflowInstanceId: { type: [string, 'null'], format: uuid }
            status:
              type: string
              enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, CANCELLED]

    # --- Overtime ----------------------------------------------------------
    OvertimeCreate:
      type: object
      required: [employeeId, attendanceDate, otMinutes, otTreatment]
      properties:
        employeeId: { type: string, format: uuid }
        attendanceDate: { type: string, format: date }
        otMinutes: { type: integer }
        otTreatment: { type: string, enum: [PAID, COMP_OFF] }
        rateMultiplier: { type: [number, 'null'] }
        # --- v3.2 field-reconciliation additions ---
        overtimePolicyId: { type: [string, 'null'], format: uuid, description: v3.2 — governing overtime_policies (E33). }
        reason: { type: [string, 'null'], description: v3.2 — reason / comments (request-ot). }
        workedOnHoliday: { type: boolean, default: false, description: v3.2 — worked on holiday. }
        workedOnWeeklyOff: { type: boolean, default: false, description: v3.2 — worked on weekly off. }
    OvertimeDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [APPROVE, REJECT] }
        otTreatment: { type: string, enum: [PAID, COMP_OFF] }
        comment: { type: string }
    Overtime:
      allOf:
        - $ref: '#/components/schemas/OvertimeCreate'
        - type: object
          required: [overtimeId, status]
          properties:
            overtimeId: { type: string, format: uuid }
            workflowInstanceId: { type: [string, 'null'], format: uuid }
            status:
              type: string
              enum: [SUBMITTED, APPROVED, REJECTED, PAID, CONVERTED_TO_COMPOFF]

    # --- Attendance exceptions --------------------------------------------
    AttendanceExceptionCreate:
      type: object
      required: [employeeId, exceptionType, startDate, endDate, reason]
      properties:
        employeeId: { type: string, format: uuid }
        exceptionType: { type: string, enum: [WFH, ON_DUTY, TOUR] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        dayPortion:
          type: string
          enum: [FULL, FIRST_HALF, SECOND_HALF]
          default: FULL
        locationText: { type: [string, 'null'] }
        reason: { type: string }
        supportingDocumentId: { type: [string, 'null'], format: uuid }
    AttendanceException:
      allOf:
        - $ref: '#/components/schemas/AttendanceExceptionCreate'
        - type: object
          required: [exceptionId, status]
          properties:
            exceptionId: { type: string, format: uuid }
            workflowInstanceId: { type: [string, 'null'], format: uuid }
            status:
              type: string
              enum: [SUBMITTED, APPROVED, REJECTED, CANCELLED]

    # --- Comp-off ----------------------------------------------------------
    CompOffBalance:
      type: object
      required: [employeeId, balance]
      properties:
        employeeId: { type: string, format: uuid }
        balance: { type: number }
        expiringSoon: { type: number }
    CompOffRedeem:
      type: object
      required: [employeeId, days]
      properties:
        employeeId: { type: string, format: uuid }
        days: { type: number }
        againstDate: { type: [string, 'null'], format: date }
        remarks: { type: [string, 'null'] }
    CompOffLedgerEntry:
      type: object
      required: [compOffEntryId, employeeId, entryType, days, balanceAfter]
      properties:
        compOffEntryId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        entryType: { type: string, enum: [EARN, REDEEM, EXPIRE, ADJUST] }
        days: { type: number }
        sourceRefType:
          type: [string, 'null']
          enum: [OVERTIME, HOLIDAY_WORK, LEAVE_APPLICATION, MANUAL, null]
        sourceRefId: { type: [string, 'null'], format: uuid }
        earnedOn: { type: [string, 'null'], format: date }
        expiresOn: { type: [string, 'null'], format: date }
        balanceAfter: { type: number }
        remarks: { type: [string, 'null'] }

    # --- Leave configuration ----------------------------------------------
    LeaveTypeCreate:
      type: object
      required: [leaveCode, name, category, isAccruable, isEncashable, affectsPay, genderEligibility, requiresDocument]
      properties:
        leaveCode: { type: string, maxLength: 20, examples: [EL, HPL, COMMUTED, CCL, MAT] }
        name: { type: string, maxLength: 120 }
        category: { type: string, enum: [PAID, HALF_PAY, UNPAID, SPECIAL] }
        isAccruable: { type: boolean }
        isSanctionBased: { type: boolean, default: false }
        isEncashable: { type: boolean }
        isEncashableOnRetirement: { type: boolean, default: false }
        affectsPay: { type: boolean }
        genderEligibility: { type: string, enum: [ALL, FEMALE, MALE] }
        requiresDocument: { type: boolean }
        debitRatio: { type: number, default: 1.0, description: Units per availed day (COMMUTED = 2.00). }
        debitsAgainstLeaveTypeId:
          type: [string, 'null']
          format: uuid
          description: Pot debited (COMMUTED → HPL).
        yearBasis:
          type: string
          enum: [CALENDAR, FINANCIAL, CAREER, EVENT]
          default: CALENDAR
        sandwichRule:
          type: string
          enum: [EXCLUDE, INCLUDE_IF_SANDWICHED, ALWAYS_INCLUDE]
          default: EXCLUDE
        requiresReturnToWorkCert: { type: boolean, default: false }
        maxContinuousDays: { type: [integer, 'null'] }
        # --- v3.2 field-reconciliation additions (leave_types) ---
        isHourlyLeave: { type: boolean, default: false, description: 'v3.2 — Is hourly leave?' }
        hoursPerDay: { type: [number, 'null'], description: v3.2 — hours in a day (hourly-leave basis). }
        hourlyMinMinutes: { type: [integer, 'null'], description: v3.2 — min leave duration per application (minutes). }
        hourlyMultipleMinutes: { type: [integer, 'null'], description: v3.2 — hourly leave only in multiples of (minutes). }
        allowHourlyAcrossMidnight: { type: boolean, default: false, description: v3.2 — allow hourly leave across midnight. }
        maxDaysPerYear: { type: [number, 'null'], description: v3.2 — maximum leave allowed per year. }
        maxAvailedPerYear: { type: [number, 'null'], description: v3.2 — maximum leave availed per year. }
        maxDaysPerMonth: { type: [number, 'null'], description: v3.2 — maximum leave allowed per month. }
        minAdvanceNoticeDays: { type: [integer, 'null'], description: v3.2 — minimum advance notice (days). }
        maxFutureApplyDays: { type: [integer, 'null'], description: v3.2 — max future days leave is allowed for. }
        allowHalfDay: { type: boolean, default: true, description: v3.2 — allow half-day. }
        attachmentMandatoryBeyondDays: { type: [integer, 'null'], description: v3.2 — attachment mandatory beyond X days. }
        isSpecialLeave: { type: boolean, default: false, description: v3.2 — is this a special leave. }
        hasUnlimitedBalance: { type: boolean, default: false, description: v3.2 — leave with unlimited balance. }
    LeaveType:
      allOf:
        - $ref: '#/components/schemas/LeaveTypeCreate'
        - type: object
          required: [leaveTypeId, status]
          properties:
            leaveTypeId: { type: string, format: uuid }
            status: { type: string, enum: [ACTIVE, INACTIVE] }

    LeaveAccrualPolicyCreate:
      type: object
      required: [leaveTypeId, effectiveFrom]
      properties:
        leaveTypeId: { type: string, format: uuid }
        accrualRatePerPeriod: { type: [number, 'null'] }
        accrualFrequency:
          type: [string, 'null']
          enum: [MONTHLY, QUARTERLY, HALF_YEARLY, YEARLY, null]
        roundingMode:
          type: [string, 'null']
          enum: [NONE, UP, DOWN, NEAREST, null]
        prorationMethod: { type: [string, 'null'] }
        carryForwardCap: { type: [number, 'null'] }
        maxBalanceCap: { type: [number, 'null'] }
        advanceAllowed: { type: boolean, default: false }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, 'null'], format: date }
    LeaveAccrualPolicy:
      allOf:
        - $ref: '#/components/schemas/LeaveAccrualPolicyCreate'
        - type: object
          required: [policyId, status]
          properties:
            policyId: { type: string, format: uuid }
            status: { type: string, enum: [ACTIVE, SUPERSEDED, DRAFT] }

    # --- Balances & ledger -------------------------------------------------
    AccrualRunRequest:
      type: object
      required: [leaveYear]
      properties:
        leaveYear: { type: integer }
        leaveTypeId: { type: [string, 'null'], format: uuid }
        scopeOrgUnitId: { type: [string, 'null'], format: uuid }
        asOfDate: { type: [string, 'null'], format: date }
    LeaveBalance:
      type: object
      required: [balanceId, employeeId, leaveTypeId, leaveYear, currentBalance, availableBalance, version]
      properties:
        balanceId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        leaveTypeId: { type: string, format: uuid }
        leaveYear: { type: integer }
        openingBalance: { type: number, default: 0 }
        accrued: { type: number, default: 0 }
        availed: { type: number, default: 0 }
        encashed: { type: number, default: 0 }
        lapsed: { type: number, default: 0 }
        reserved: { type: number, default: 0 }
        currentBalance: { type: number }
        availableBalance:
          type: number
          description: currentBalance − reserved.
        version: { type: integer, description: Optimistic-lock version. }
    LeaveLedgerEntry:
      type: object
      required: [ledgerEntryId, employeeId, leaveTypeId, leaveYear, entryType, amount, balanceAfter, effectiveDate]
      properties:
        ledgerEntryId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        leaveTypeId: { type: string, format: uuid }
        leaveYear: { type: integer }
        entryType:
          type: string
          enum: [ACCRUAL, OPENING, AVAIL, AVAIL_REVERSAL, ENCASHMENT, LAPSE, CARRY_FORWARD, ADJUSTMENT, HPL_CONVERSION, CLAWBACK]
        amount: { type: number, description: Signed (+credit / −debit). }
        balanceAfter: { type: number }
        sourceRefType:
          type: [string, 'null']
          enum: [LEAVE_APPLICATION, ACCRUAL_RUN, YEAR_CLOSE, ENCASHMENT, MANUAL, EXIT_CLAWBACK, null]
        sourceRefId: { type: [string, 'null'], format: uuid }
        effectiveDate: { type: string, format: date }
        remarks: { type: [string, 'null'] }
    LeaveLedgerAdjustCreate:
      type: object
      required: [employeeId, leaveTypeId, leaveYear, amount, reason]
      properties:
        employeeId: { type: string, format: uuid }
        leaveTypeId: { type: string, format: uuid }
        leaveYear: { type: integer }
        amount: { type: number, description: Signed adjustment (maker proposes; checker approves via P01). }
        effectiveDate: { type: [string, 'null'], format: date }
        reason: { type: string }

    # --- Leave applications ------------------------------------------------
    LeaveApplicationDay:
      type: object
      required: [leaveDate, dayPortion, dayUnits]
      properties:
        leaveDate: { type: string, format: date }
        dayPortion: { type: string, enum: [FULL, FIRST_HALF, SECOND_HALF] }
        dayUnits: { type: number, enum: [0.5, 1.0] }
        isNonWorking: { type: boolean, default: false }
    LeaveApplicationCreate:
      type: object
      required: [employeeId, leaveTypeId, startDate, endDate, reason, days]
      properties:
        employeeId: { type: string, format: uuid }
        leaveTypeId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        reason: { type: string }
        isBackdated: { type: boolean, default: false }
        contactDuringLeave: { type: [string, 'null'] }
        supportingDocumentId: { type: [string, 'null'], format: uuid }
        appliedOnBehalfBy: { type: [string, 'null'], format: uuid }
        # --- v3.2 field-reconciliation additions (leave_applications) ---
        approverNote: { type: [string, 'null'], description: v3.2 — optional context to approver (distinct from reason). }
        hourlyMinutes: { type: [integer, 'null'], description: v3.2 — hourly-leave duration; total_days remains the debit basis. }
        days:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/LeaveApplicationDay' }
    BalancePreview:
      type: object
      properties:
        before: { type: number }
        reserved: { type: number }
        available: { type: number }
        sandwichCountedDays: { type: number }
    LeaveApplication:
      type: object
      required: [applicationId, applicationNo, employeeId, leaveTypeId, startDate, endDate, totalDays, ledgerDebitUnits, status, srPostingStatus, leaveSpellLineageId]
      properties:
        applicationId: { type: string, format: uuid }
        applicationNo: { type: string, maxLength: 30 }
        employeeId: { type: string, format: uuid }
        leaveTypeId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        totalDays: { type: number }
        ledgerDebitUnits: { type: number, description: totalDays × debitRatio. }
        reason: { type: string }
        isBackdated: { type: boolean, default: false }
        contactDuringLeave: { type: [string, 'null'] }
        supportingDocumentId: { type: [string, 'null'], format: uuid }
        reservationId: { type: [string, 'null'], format: uuid }
        workflowInstanceId: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/LeaveApplicationStatus' }
        srPostingStatus: { $ref: '#/components/schemas/SrPostingStatus' }
        leaveSpellLineageId:
          type: string
          format: uuid
          description: >
            Stable correlation key for the leave spell, constant across
            approve→amend→cancel. Minted by G03 and exposed on the signed
            approved-leave event consumed by G04 (dedupe by
            `leave_spell_lineage_id + event_sequence`). G03 never writes the SR
            ledger.
        returnToWorkStatus:
          type: [string, 'null']
          enum: [NOT_REQUIRED, PENDING, CLEARED, null]
        appliedOnBehalfBy: { type: [string, 'null'], format: uuid }
        approverNote: { type: [string, 'null'], description: v3.2 — optional context to approver. }
        hourlyMinutes: { type: [integer, 'null'], description: v3.2 — hourly-leave duration (debit basis stays total_days). }
        balancePreview: { $ref: '#/components/schemas/BalancePreview' }
        days:
          type: array
          items: { $ref: '#/components/schemas/LeaveApplicationDay' }
    LeaveDecision:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT, RECOMMEND, SEND_BACK]
        comment: { type: string }
        expectedVersion:
          type: integer
          description: Balance version the approver last observed; stale → 409 OPTIMISTIC_LOCK_CONFLICT.
    ReturnToWorkRequest:
      type: object
      required: [fitnessCertificateDocumentId]
      properties:
        fitnessCertificateDocumentId: { type: string, format: uuid }
        actualReturnDate: { type: string, format: date }
        remarks: { type: [string, 'null'] }
    LeaveConflict:
      type: object
      required: [date, employeeIds, conflictCount]
      properties:
        date: { type: string, format: date }
        orgUnitId: { type: string, format: uuid }
        employeeIds:
          type: array
          items: { type: string, format: uuid }
        conflictCount: { type: integer }
        thresholdBreached: { type: boolean }
    TeamCalendarEntry:
      type: object
      properties:
        employeeId: { type: string, format: uuid }
        date: { type: string, format: date }
        status: { type: string }
        leaveTypeCode: { type: [string, 'null'] }
    TeamCalendar:
      type: object
      required: [managerId, month, entries]
      properties:
        managerId: { type: string, format: uuid }
        month: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        entries:
          type: array
          items: { $ref: '#/components/schemas/TeamCalendarEntry' }

    # --- Year close --------------------------------------------------------
    YearCloseRequest:
      type: object
      required: [leaveYear]
      properties:
        leaveYear: { type: integer }
        scopeOrgUnitId: { type: [string, 'null'], format: uuid }
    YearCloseCommit:
      allOf:
        - $ref: '#/components/schemas/YearCloseRequest'
        - type: object
          required: [simulationRunId]
          properties:
            simulationRunId:
              type: string
              format: uuid
              description: The prior SIMULATED run being committed.
    YearCloseRun:
      type: object
      required: [closeRunId, leaveYear, runStatus]
      properties:
        closeRunId: { type: string, format: uuid }
        leaveYear: { type: integer }
        scopeOrgUnitId: { type: [string, 'null'], format: uuid }
        runStatus: { type: string, enum: [DRAFT, SIMULATED, COMMITTED, FAILED] }
        employeesProcessed: { type: integer, default: 0 }
        totalCarried: { type: number, default: 0 }
        totalLapsed: { type: number, default: 0 }
        totalConverted: { type: number, default: 0 }
        simulationReportDocId: { type: [string, 'null'], format: uuid }

    # --- Encashment --------------------------------------------------------
    EncashmentCreate:
      type: object
      required: [employeeId, leaveTypeId, encashmentType, daysRequested, effectiveDate]
      properties:
        employeeId: { type: string, format: uuid }
        leaveTypeId: { type: string, format: uuid }
        encashmentType: { type: string, enum: [IN_SERVICE, RETIREMENT, LTC] }
        daysRequested: { type: number }
        elDaysComponent: { type: [number, 'null'] }
        hplDaysComponent: { type: [number, 'null'] }
        ltcBlockRef: { type: [string, 'null'] }
        effectiveDate: { type: string, format: date }
    Encashment:
      allOf:
        - $ref: '#/components/schemas/EncashmentCreate'
        - type: object
          required: [encashmentId, status]
          properties:
            encashmentId: { type: string, format: uuid }
            daysApproved: { type: [number, 'null'] }
            amountEstimated: { type: [number, 'null'] }
            workflowInstanceId: { type: [string, 'null'], format: uuid }
            payrollFeedId: { type: [string, 'null'], format: uuid }
            status:
              type: string
              enum: [SUBMITTED, APPROVED, REJECTED, SETTLED, CANCELLED]

    # --- Payroll feed ------------------------------------------------------
    PayrollFeedGenerate:
      type: object
      required: [payPeriod]
      properties:
        payPeriod: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        scopeOrgUnitId: { type: [string, 'null'], format: uuid }
    PayrollFeedRow:
      type: object
      required: [feedId, payPeriod, employeeId, exportStatus]
      properties:
        feedId: { type: string, format: uuid }
        payPeriod: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        employeeId: { type: string, format: uuid }
        lwpDays: { type: number, default: 0 }
        halfPayDays: { type: number, default: 0 }
        paidOtMinutes: { type: integer, default: 0 }
        presentUnits: { type: number }
        encashmentAmount: { type: number, default: 0 }
        exportStatus: { type: string, enum: [PENDING, EXPORTED, ACKED, FAILED] }
        isLocked: { type: boolean, default: false }
        exportedAt: { type: [string, 'null'], format: date-time }
        g10BatchRef: { type: [string, 'null'] }
    PayrollFeedAdjustment:
      type: object
      required: [adjustmentId, originalFeedId, appliedInPayPeriod, employeeId, adjustmentType, deltaValue, reason, status]
      properties:
        adjustmentId: { type: string, format: uuid }
        originalFeedId: { type: string, format: uuid }
        appliedInPayPeriod: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        employeeId: { type: string, format: uuid }
        adjustmentType:
          type: string
          enum: [LWP_DELTA, HALF_PAY_DELTA, OT_DELTA, PRESENT_DELTA, ENCASHMENT_DELTA]
        deltaValue: { type: number }
        reason: { type: string }
        sourceRefType:
          type: string
          enum: [REGULARISATION, ROSTER_EDIT, HOLIDAY_EDIT, LEAVE_CANCEL, MANUAL]
        sourceRefId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [PENDING, EXPORTED, ACKED] }
    PayrollFeedAck:
      type: object
      required: [g10BatchRef]
      properties:
        g10BatchRef: { type: string }
        acceptedCount: { type: [integer, 'null'] }

    # --- Self-service ------------------------------------------------------
    SelfServiceSummary:
      type: object
      properties:
        employeeId: { type: string, format: uuid }
        balances:
          type: array
          items: { $ref: '#/components/schemas/LeaveBalance' }
        pendingApplications: { type: integer }
        upcomingLeaveDays: { type: integer }
        compOffBalance: { type: number }
    ApprovalTask:
      type: object
      required: [workflowInstanceId, subjectType, subjectRef, stage]
      properties:
        workflowInstanceId: { type: string, format: uuid }
        subjectType:
          type: string
          enum: [LEAVE, REGULARISATION, OVERTIME, EXCEPTION, ENCASHMENT, ANOMALY, RETURN_TO_WORK]
        subjectRef: { type: string, format: uuid }
        stage: { type: string }
        employeeId: { type: string, format: uuid }
        slaDueAt: { type: [string, 'null'], format: date-time }
    Notification:
      type: object
      required: [notificationId, messageId, status]
      properties:
        notificationId: { type: string, format: uuid }
        messageId: { type: string, examples: [MSG-G03-LEAVE-SUBMITTED] }
        status: { type: string, enum: [UNREAD, READ] }
        createdAt: { type: string, format: date-time }
        deepLink: { type: [string, 'null'] }

    # --- Delegations -------------------------------------------------------
    DelegationCreate:
      type: object
      required: [delegatorUserId, delegateUserId, fromDate, toDate]
      properties:
        delegatorUserId: { type: string, format: uuid }
        delegateUserId: { type: string, format: uuid }
        scopeOrgUnitId: { type: [string, 'null'], format: uuid }
        requestTypes:
          type: [array, 'null']
          items: { type: string, enum: [LEAVE, REGULARISATION, OT, WFH, OD, ENCASHMENT] }
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date }
        autoOnSlaBreach: { type: boolean, default: true }
    Delegation:
      allOf:
        - $ref: '#/components/schemas/DelegationCreate'
        - type: object
          required: [delegationId, status]
          properties:
            delegationId: { type: string, format: uuid }
            status: { type: string, enum: [ACTIVE, EXPIRED, REVOKED] }

    # --- Anomaly review ----------------------------------------------------
    AnomalyReview:
      type: object
      required: [reviewId, punchId, employeeId, anomalyType, detectedAt, status]
      properties:
        reviewId: { type: string, format: uuid }
        punchId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        anomalyType:
          type: string
          enum: [IMPOSSIBLE_TRAVEL, DUPLICATE_SECOND, GEO_MISMATCH, LOW_LIVENESS, DEVICE_BINDING_MISMATCH]
        detectedAt: { type: string, format: date-time }
        reviewerUserId: { type: [string, 'null'], format: uuid }
        workflowInstanceId: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/AnomalyStatus' }
        resolutionNotes: { type: [string, 'null'] }
    AnomalyDecision:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [CONFIRM_VALID, CONFIRM_FRAUD, ESCALATE]
        resolutionNotes: { type: [string, 'null'] }

    # --- Consent -----------------------------------------------------------
    ConsentCreate:
      type: object
      required: [employeeId, lawfulBasis, captureTypes, consentStatus]
      properties:
        employeeId: { type: string, format: uuid }
        lawfulBasis:
          type: string
          enum: [STATUTORY_DUTY, CONSENT, EMPLOYMENT_CONTRACT]
        captureTypes:
          type: array
          items: { type: string, enum: [BIOMETRIC, GEO, PHOTO] }
        consentStatus: { type: string, enum: [GRANTED, WITHDRAWN, NOT_REQUIRED] }
        fallbackMethod:
          type: [string, 'null']
          enum: [RFID, MANUAL, OTP, null]
        consentDocumentId: { type: [string, 'null'], format: uuid }
        retentionUntil: { type: [string, 'null'], format: date }
    Consent:
      allOf:
        - $ref: '#/components/schemas/ConsentCreate'
        - type: object
          required: [consentId]
          properties:
            consentId: { type: string, format: uuid }
            grantedAt: { type: [string, 'null'], format: date-time }
            withdrawnAt: { type: [string, 'null'], format: date-time }
    ConsentWithdraw:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
        fallbackMethod:
          type: [string, 'null']
          enum: [RFID, MANUAL, OTP, null]

    RetentionPurgeRequest:
      type: object
      required: [asOfDate]
      properties:
        asOfDate:
          type: string
          format: date
          description: Purge biometric/geo data whose retention_until is on or before this date.
        scopeOrgUnitId: { type: [string, 'null'], format: uuid }
        dryRun: { type: boolean, default: false }

    # --- Entitlements ------------------------------------------------------
    Entitlement:
      type: object
      required: [entitlementId, employeeId, leaveTypeId, quotaBasis, totalQuotaDays, consumedDays, remainingDays]
      properties:
        entitlementId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        leaveTypeId: { type: string, format: uuid }
        quotaBasis: { type: string, enum: [CAREER, EVENT, ANNUAL] }
        totalQuotaDays: { type: number }
        consumedDays: { type: number, default: 0 }
        remainingDays: { type: number }
        eligibilityPredicate:
          type: [object, 'null']
          additionalProperties: true
        validFrom: { type: [string, 'null'], format: date }
        validTo: { type: [string, 'null'], format: date }
    EntitlementAdjust:
      type: object
      required: [entitlementId, deltaDays, reason]
      properties:
        entitlementId: { type: string, format: uuid }
        deltaDays: { type: number }
        reason: { type: string }

    # --- Absence programs --------------------------------------------------
    BalanceForecast:
      type: object
      required: [employeeId, asOf, projectedAvailable]
      properties:
        employeeId: { type: string, format: uuid }
        leaveTypeId: { type: [string, 'null'], format: uuid }
        asOf: { type: string, format: date }
        currentAvailable: { type: number }
        scheduledAccrual: { type: number }
        reservedDeductions: { type: number }
        projectedAvailable: { type: number }
    MassLeaveRequest:
      type: object
      required: [leaveTypeId, startDate, endDate, scopeOrgUnitId, reason]
      properties:
        leaveTypeId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        scopeOrgUnitId: { type: string, format: uuid }
        reason: { type: string }
        dayPortion:
          type: string
          enum: [FULL, FIRST_HALF, SECOND_HALF]
          default: FULL

    # =====================================================================
    # v3.2 FIELD-RECONCILIATION SCHEMAS (E32–E40) — ADD-ONLY
    # =====================================================================

    # --- Shared v3.2 enums -------------------------------------------------
    AdjustmentStatus:
      type: string
      enum: [SUBMITTED, APPROVED, REJECTED, APPLIED, CANCELLED]
    LockStatus:
      type: string
      enum: [OPEN, LOCKED, REOPENED]

    # --- E36 leave_reasons -------------------------------------------------
    LeaveReasonCreate:
      type: object
      required: [reasonCode, name]
      properties:
        reasonCode: { type: string, maxLength: 30 }
        name: { type: string, maxLength: 120 }
        category: { type: [string, 'null'], description: Medical/Compassionate/Family/Statutory (tenant-configurable). }
        description: { type: [string, 'null'] }
        applicableLeaveTypeIds:
          type: [array, 'null']
          items: { type: string }
          description: Applicable leave types (e.g. ["EL","SL"]).
        docRequired: { type: boolean, default: false }
        hrbpAutoRoute: { type: boolean, default: false }
        autoApproveThresholdDays: { type: [number, 'null'] }
        effectiveFrom: { type: [string, 'null'], format: date }
    LeaveReasonUpdate:
      type: object
      properties:
        name: { type: [string, 'null'], maxLength: 120 }
        category: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        applicableLeaveTypeIds:
          type: [array, 'null']
          items: { type: string }
        docRequired: { type: [boolean, 'null'] }
        hrbpAutoRoute: { type: [boolean, 'null'] }
        autoApproveThresholdDays: { type: [number, 'null'] }
        status: { type: [string, 'null'], enum: [ACTIVE, INACTIVE, null] }
    LeaveReason:
      allOf:
        - $ref: '#/components/schemas/LeaveReasonCreate'
        - type: object
          required: [reasonId, status]
          properties:
            reasonId: { type: string, format: uuid }
            status: { type: string, enum: [ACTIVE, INACTIVE] }
            tenantId: { type: [string, 'null'], format: uuid }
            entityId: { type: [string, 'null'], format: uuid }

    # --- E37 attendance_reasons -------------------------------------------
    AttendanceReasonCreate:
      type: object
      required: [reasonCode, name]
      properties:
        reasonCode: { type: string, maxLength: 30 }
        name: { type: string, maxLength: 120 }
        category: { type: [string, 'null'], description: MISS/MED/SYS/TRV/TRN/EMRG/WFH (tenant-configurable). }
        description: { type: [string, 'null'] }
        applicableScope:
          type: [object, 'null']
          additionalProperties: true
          description: Applicable leave types / regularisation kinds.
        docRequired: { type: boolean, default: false }
        autoApprove: { type: boolean, default: false, description: Always auto-approve (e.g. system downtime). }
        autoApproveThresholdDays: { type: [number, 'null'] }
        frequencyCap: { type: [integer, 'null'], description: Usage limit per period (null = unlimited). }
        frequencyPeriod: { type: [string, 'null'], enum: [MONTH, QUARTER, YEAR, null] }
    AttendanceReasonUpdate:
      type: object
      properties:
        name: { type: [string, 'null'], maxLength: 120 }
        category: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        applicableScope:
          type: [object, 'null']
          additionalProperties: true
        docRequired: { type: [boolean, 'null'] }
        autoApprove: { type: [boolean, 'null'] }
        autoApproveThresholdDays: { type: [number, 'null'] }
        frequencyCap: { type: [integer, 'null'] }
        frequencyPeriod: { type: [string, 'null'], enum: [MONTH, QUARTER, YEAR, null] }
        status: { type: [string, 'null'], enum: [ACTIVE, INACTIVE, null] }
    AttendanceReason:
      allOf:
        - $ref: '#/components/schemas/AttendanceReasonCreate'
        - type: object
          required: [reasonId, status]
          properties:
            reasonId: { type: string, format: uuid }
            status: { type: string, enum: [ACTIVE, INACTIVE] }
            tenantId: { type: [string, 'null'], format: uuid }
            entityId: { type: [string, 'null'], format: uuid }

    # --- E32 attendance_policies ------------------------------------------
    AttendancePolicyCreate:
      type: object
      required: [policyCode, name]
      properties:
        policyCode: { type: string, maxLength: 30 }
        name: { type: string, maxLength: 120 }
        description: { type: [string, 'null'] }
        graceInMinutes: { type: integer, default: 0 }
        graceOutMinutes: { type: integer, default: 0 }
        includeGraceInLate: { type: boolean, default: false }
        includeGraceInEarlyOut: { type: boolean, default: false }
        allowWfhCheckin: { type: boolean, default: false }
        allowOutdutyCheckin: { type: boolean, default: false }
        markAttendanceBasis: { type: [string, 'null'] }
        bufferPreMinutes: { type: integer, default: 0 }
        bufferPostMinutes: { type: integer, default: 0 }
        backdatedEditLimitDays: { type: [integer, 'null'] }
        rosterChangeLimitDays: { type: [integer, 'null'] }
        abscondingTriggerDays: { type: [integer, 'null'] }
        optionalHolidayLimitDays: { type: [integer, 'null'] }
        autoApproveOptionalHoliday: { type: boolean, default: false }
        nightShiftDifferentialEnabled: { type: boolean, default: false }
        nsdMultiplier: { type: [number, 'null'] }
        wfhCapPerMonth: { type: [integer, 'null'] }
        workingDaysPerWeek: { type: [number, 'null'] }
        dailyRequiredMinutes: { type: [integer, 'null'] }
        policyConfig:
          type: [object, 'null']
          additionalProperties: true
          description: Request windows, leave-deduction rules, hide/display flags (config, not data).
    AttendancePolicyUpdate:
      allOf:
        - $ref: '#/components/schemas/AttendancePolicyCreate'
        - type: object
          properties:
            status: { type: [string, 'null'], enum: [ACTIVE, INACTIVE, null] }
    AttendancePolicy:
      allOf:
        - $ref: '#/components/schemas/AttendancePolicyCreate'
        - type: object
          required: [policyId, status]
          properties:
            policyId: { type: string, format: uuid }
            status: { type: string, enum: [ACTIVE, INACTIVE] }

    # --- E33 overtime_policies --------------------------------------------
    OvertimePolicyCreate:
      type: object
      required: [policyCode, name]
      properties:
        policyCode: { type: string, maxLength: 30 }
        name: { type: string, maxLength: 120 }
        description: { type: [string, 'null'] }
        calculationFrequency:
          type: string
          enum: [DAILY, WEEKLY, BIWEEKLY, SEMI_MONTHLY, MONTHLY, QUARTERLY, YEARLY]
          default: DAILY
        compensation: { type: string, enum: [PAID, COMP_OFF], default: COMP_OFF }
        minOtMinutes: { type: integer, default: 0 }
        dailyCapMinutes: { type: [integer, 'null'] }
        weeklyCapMinutes: { type: [integer, 'null'] }
        monthlyCapMinutes: { type: [integer, 'null'] }
        yearlyCapMinutes: { type: [integer, 'null'] }
        weekdayMultiplier: { type: [number, 'null'] }
        weeklyOffMultiplier: { type: [number, 'null'] }
        holidayMultiplier: { type: [number, 'null'] }
        nsdMultiplier: { type: [number, 'null'] }
        compoffMinMinutesFull: { type: [integer, 'null'] }
        compoffMinMinutesHalf: { type: [integer, 'null'] }
        compoffLapseDays: { type: [integer, 'null'] }
        compoffMaxPerMonth: { type: [number, 'null'] }
        slabs:
          type: [array, 'null']
          items:
            type: object
            additionalProperties: true
          description: '[{ slab_name, multiplication_factor }] (Overtime_Slabs).'
        thresholds:
          type: [object, 'null']
          additionalProperties: true
          description: '{ weekly_pct, monthly_pct, quarterly_pct, yearly_pct }.'
        indexingRules:
          type: [object, 'null']
          additionalProperties: true
        policyConfig:
          type: [object, 'null']
          additionalProperties: true
          description: Per-frequency approval routing, rounding, deduction rules (config).
    OvertimePolicyUpdate:
      allOf:
        - $ref: '#/components/schemas/OvertimePolicyCreate'
        - type: object
          properties:
            status: { type: [string, 'null'], enum: [ACTIVE, INACTIVE, null] }
    OvertimePolicy:
      allOf:
        - $ref: '#/components/schemas/OvertimePolicyCreate'
        - type: object
          required: [policyId, status]
          properties:
            policyId: { type: string, format: uuid }
            status: { type: string, enum: [ACTIVE, INACTIVE] }

    # --- E35 geofences -----------------------------------------------------
    GeofenceCreate:
      type: object
      required: [fenceCode, name, latitude, longitude, radiusMeters]
      properties:
        fenceCode: { type: string, maxLength: 30 }
        name: { type: string, maxLength: 120 }
        latitude: { type: number }
        longitude: { type: number }
        radiusMeters: { type: integer, minimum: 1 }
        tag: { type: [string, 'null'] }
        locationOrgUnitId: { type: [string, 'null'], format: uuid }
        address: { type: [string, 'null'], description: Full street address. }
        maxEmployees: { type: [integer, 'null'], description: Office capacity / max employees. }
    GeofenceUpdate:
      type: object
      properties:
        name: { type: [string, 'null'], maxLength: 120 }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
        radiusMeters: { type: [integer, 'null'], minimum: 1 }
        tag: { type: [string, 'null'] }
        locationOrgUnitId: { type: [string, 'null'], format: uuid }
        address: { type: [string, 'null'] }
        maxEmployees: { type: [integer, 'null'] }
        status: { type: [string, 'null'], enum: [ACTIVE, INACTIVE, null] }
    Geofence:
      allOf:
        - $ref: '#/components/schemas/GeofenceCreate'
        - type: object
          required: [fenceId, status]
          properties:
            fenceId: { type: string, format: uuid }
            status: { type: string, enum: [ACTIVE, INACTIVE] }

    # --- E34 attendance_networks (IP restriction) --------------------------
    AttendanceNetworkCreate:
      type: object
      required: [networkCode, name, ipFrom, ipTo]
      properties:
        networkCode: { type: string, maxLength: 30 }
        name: { type: string, maxLength: 120 }
        ipFrom: { type: string, description: IP address range start (inet). }
        ipTo: { type: string, description: IP address range end (inet). }
        tag: { type: [string, 'null'] }
    AttendanceNetworkUpdate:
      type: object
      properties:
        name: { type: [string, 'null'], maxLength: 120 }
        ipFrom: { type: [string, 'null'] }
        ipTo: { type: [string, 'null'] }
        tag: { type: [string, 'null'] }
        status: { type: [string, 'null'], enum: [ACTIVE, INACTIVE, null] }
    AttendanceNetwork:
      allOf:
        - $ref: '#/components/schemas/AttendanceNetworkCreate'
        - type: object
          required: [networkId, status]
          properties:
            networkId: { type: string, format: uuid }
            status: { type: string, enum: [ACTIVE, INACTIVE] }

    # --- E38 leave_balance_adjustments -------------------------------------
    LeaveBalanceAdjustmentCreate:
      type: object
      required: [employeeId, leaveTypeId, adjustmentType, detailedReason, effectiveDate]
      properties:
        employeeId: { type: string, format: uuid }
        leaveTypeId: { type: string, format: uuid }
        adjustmentType: { type: string, enum: [CREDIT, DEBIT, RESET] }
        amountDays: { type: [number, 'null'], description: Signed magnitude for CREDIT/DEBIT. }
        resetToValue: { type: [number, 'null'], description: Target balance for RESET. }
        reasonCategory: { type: [string, 'null'] }
        detailedReason: { type: string, description: Why justified (audit-logged). }
        supportingReference: { type: [string, 'null'] }
        effectiveDate: { type: string, format: date }
    LeaveBalanceAdjustment:
      allOf:
        - $ref: '#/components/schemas/LeaveBalanceAdjustmentCreate'
        - type: object
          required: [adjustmentId, status]
          properties:
            adjustmentId: { type: string, format: uuid }
            workflowInstanceId: { type: [string, 'null'], format: uuid }
            resultingLedgerEntryId: { type: [string, 'null'], format: uuid }
            status: { $ref: '#/components/schemas/AdjustmentStatus' }

    # --- E39 leave_revocations ---------------------------------------------
    LeaveRevocationCreate:
      type: object
      required: [applicationId, employeeId, detailedReason]
      properties:
        applicationId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        revocationType: { type: string, enum: [FULL, PARTIAL], default: FULL }
        daysToRevoke: { type: [number, 'null'], description: Required for PARTIAL. }
        reasonCategory: { type: [string, 'null'] }
        detailedReason: { type: string, description: Why justified (audit-logged). }
        refundToBalance: { type: boolean, default: true }
    LeaveRevocation:
      allOf:
        - $ref: '#/components/schemas/LeaveRevocationCreate'
        - type: object
          required: [revocationId, status]
          properties:
            revocationId: { type: string, format: uuid }
            workflowInstanceId: { type: [string, 'null'], format: uuid }
            resultingLedgerEntryId: { type: [string, 'null'], format: uuid }
            status:
              type: string
              enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, CANCELLED]

    # --- E40 attendance_lock_periods ---------------------------------------
    AttendanceLockCreate:
      type: object
      required: [lockMonth]
      properties:
        lockMonth: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        scopeOrgUnitId: { type: [string, 'null'], format: uuid, description: null = entity-wide. }
        lockDeadline: { type: [string, 'null'], format: date }
        resolutionMode:
          type: string
          enum: [AUTO_APPROVE, AUTO_DENY, MANUAL]
          default: MANUAL
          description: Disposition of regularisations pending at lock.
        autoTriggerPayroll: { type: boolean, default: false }
        lockNote: { type: [string, 'null'] }
    AttendanceLockPeriod:
      allOf:
        - $ref: '#/components/schemas/AttendanceLockCreate'
        - type: object
          required: [lockPeriodId, status]
          properties:
            lockPeriodId: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/LockStatus' }
            totalEmployeeDays: { type: [integer, 'null'] }
            pendingAtLock: { type: [integer, 'null'] }
            lockedBy: { type: [string, 'null'], format: uuid }
            lockedAt: { type: [string, 'null'], format: date-time }
            payrollStatus: { type: [string, 'null'] }
            payrollClosedAt: { type: [string, 'null'], format: date-time }
