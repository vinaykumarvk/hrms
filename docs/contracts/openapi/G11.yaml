          type: object
          properties:
            org_unit_id: { type: [string, "null"], format: uuid }
            pda_id: { type: [string, "null"], format: uuid }
            all_pensioners: { type: boolean, default: false }
        rule_version_ref: { type: [string, "null"], format: uuid }
    DisbursementRequest:
      type: object
      required: [pda_id, period_month, period_year]
      properties:
        pda_id: { type: string, format: uuid }
        period_month: { type: integer, minimum: 1, maximum: 12 }
        period_year: { type: integer }
        disbursement_type: { type: string, enum: [MONTHLY_PENSION, FIRST_PENSION, TERMINAL, GRATUITY, GPF, COMMUTED_VALUE, ARREAR] }
    AccountVerifyRequest:
      type: object
      required: [account_no, ifsc, account_name]
      properties:
        pensioner_id: { type: [string, "null"], format: uuid }
        account_no: { type: string, description: Tier-2 financial PII; masked on serialization by P02 }
        ifsc: { type: string }
        account_name: { type: string }
    DisbursementAck:
      type: object
      required: [lines]
      properties:
        payload_contract_version: { type: string }
        control_total_ack: { $ref: '#/components/schemas/Money' }
        lines:
          type: array
          items:
            type: object
            required: [line_no, ack_status]
            properties:
              line_no: { type: integer }
              ack_status: { type: string, enum: [PAID, FAILED, RETURNED] }
              ack_reference: { type: [string, "null"] }
              failure_code: { type: [string, "null"], enum: [ACCOUNT_CLOSED, ACCOUNT_FROZEN, NAME_MISMATCH, INVALID_IFSC, LIMIT_EXCEEDED, DUPLICATE, PENSIONER_DECEASED, OTHER, null] }
              paid_at: { type: [string, "null"], format: date-time }
    EstimateRequest:
      type: object
      properties:
        employee_id: { type: [string, "null"], format: uuid }
        as_of_retirement_date: { type: [string, "null"], format: date }
        commuted_fraction: { $ref: '#/components/schemas/Rate' }
        emoluments_method: { $ref: '#/components/schemas/EmolumentsMethod' }
        scheme: { $ref: '#/components/schemas/PensionScheme' }
    MyOptionsRequest:
      type: object
      properties:
        commuted_fraction: { $ref: '#/components/schemas/Rate' }
        nominees:
          type: [array, "null"]
          items: { $ref: '#/components/schemas/NomineeShare' }
        current_family_member_id: { type: [string, "null"], format: uuid }
        bank_account:
          type: [object, "null"]
          properties:
            account_no: { type: string }
            ifsc: { type: string }
            account_name: { type: string }
