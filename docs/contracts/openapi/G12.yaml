        '500': { $ref: '#/components/responses/Internal' }

  /sr/dr/reconcile-anchor:
    post:
      tags: [Retention]
      summary: DR restore gate — reconcile restored heads to the external anchor
      operationId: reconcileAnchor
      description: Post-restore verification; a stale restore (`SR_STALE_RESTORE`) is a gated failure.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DrReconcileRequest' }
      responses:
        '200':
          description: Reconciliation report.
