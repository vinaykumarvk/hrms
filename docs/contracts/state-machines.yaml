        terminal: [CLOSED]
        transitions:
          - {from: OPEN, action: "freeze inputs + snapshot (X.1)", to: INPUT_LOCKED, trigger: SYSTEM, guard: "after cutoff; snapshot frozen", side_effects: ""}
          - {from: INPUT_LOCKED, action: "start FINAL run", to: COMPUTING, trigger: PAYROLL_OFFICER, guard: "no in-flight run", side_effects: ""}
          - {from: COMPUTING, action: "compute success", to: COMPUTED, trigger: SYSTEM, guard: "totals tie (incl. rounding)", side_effects: ""}
          - {from: COMPUTING, action: "engine fault", to: OPEN, trigger: SYSTEM, guard: "", side_effects: "run FAILED; no commit; lock released"}
          - {from: COMPUTED, action: "reconcile sign-off", to: RECONCILED, trigger: PAYROLL_OFFICER, guard: "recon SIGNED_OFF; disbursed+held+failed=net", side_effects: ""}
          - {from: RECONCILED, action: "approve (P01)", to: APPROVED, trigger: CHECKER, guard: "checker != creator", side_effects: "", p01_pattern: SEQUENTIAL}
          - {from: APPROVED, action: "lock", to: LOCKED, trigger: SYSTEM, guard: "", side_effects: "payslips frozen"}
          - {from: LOCKED, action: "publish & disburse (X.3)", to: DISBURSED, trigger: DISBURSER, guard: "bank ack / positive-pay confirmed", side_effects: ""}
          - {from: DISBURSED, action: "remit & post", to: CLOSED, trigger: SYSTEM, guard: "remittances MATCHED; GL ACKNOWLEDGED", side_effects: ""}
          - {from: LOCKED, action: "reopen (justified, versioned, P01)", to: REOPENED, trigger: APPROVER, guard: "pre-transmission only; no in-flight run", side_effects: "", p01_pattern: SEQUENTIAL}
          - {from: REOPENED, action: "re-run (successor)", to: COMPUTING, trigger: APPROVER, guard: "Approver authority", side_effects: "originals SUPERSEDED"}

