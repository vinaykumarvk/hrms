# -----------------------------------------------------------------------------
# 3. PII TIERS  — PII Protection Ceiling model (RBAC §1, §6, §7; Foundation §6.3)
#    The ceiling overrides EVERYTHING upward: no Org/Module/any-role lifts it.
#    Only fixed platform-level exceptions (Office Admin national-ID/DOB) apply.
#    Field-access legend: V=Visible · M=Masked · H=Hidden · E=Editable · AR=Approval-Required.
# -----------------------------------------------------------------------------
pii_tiers:
  - tier: TIER-1
    label: "Government / statutory identity & financial credentials"
    examples: [PAN, Aadhaar, "Passport Number", "Driving Licence", "Bank account number", "Biometric data"]
    view_unmasked:
      - "Employee — own only (national IDs shown masked; biometric never displayed to any role)"
      - "HR Admin — E·AR (identity edits route through P01 approval workflow)"
      - "Office Admin — national-ID view/upload + bank-account entry (masked to last 4); fixed platform grant, not configurable"
    masked_or_hidden_from: "All other roles (managers, HOD, UAG Head, HRBP, Finance Admin, recruiters). Biometric: no UI display for any role."
    ceiling: hard
  - tier: TIER-2
    label: "Compensation, financial & sensitive-personal data"
    examples: ["Salary / CTC", Payslips, "Compensation bands", "Date of Birth", "Medical / health data", "Cost centre"]
    view_unmasked:
      - "Employee — own"
      - "HR Admin — full (E on CTC/employment fields)"
      - "Finance Admin — view for payroll/budgeting context (no edit)"
      - "Office Admin — DOB view only (fixed grant)"
      - "Recruitment Admin — compensation bands for offer benchmarking only"
    masked_or_hidden_from: "All manager tiers, HOD/UAG Head (compensation off by default, per-user Org-Admin grantable), HRBP, peers."
    ceiling: hard
  - tier: TIER-3
    label: "Confidential adjudicated / quasi-judicial records"
    examples:
      - "Performance ratings — draft (reviewer only) / published / calibration"
      - "Confidential separation & exit-interview fields"
      - "Vigilance notes, sealed-cover contents, preliminary-inquiry reports (G09)"
      - "Sealed/TOP_SECRET documents (G13)"
      - "Confidential-source / whistle-blower identity (G09 is_confidential_source)"
    view_unmasked:
      - "Draft ratings — reviewer only; no entitlement exposes them pre-publish"
      - "Vigilance/sealed content — Vigilance Officer + DA only; charged officer sees only formally-served artefacts (and relied-upon evidence)"
      - "APAR confidential body — APAR Custodian, tier authorities within chain"
    masked_or_hidden_from: "All roles outside the case/chain; confidential-source identity hard-hidden from all except Vigilance Officer and DA."
    ceiling: hard
  - tier: TIER-0
    label: "Non-PII directory / org-chart fields"
    examples: [Name, "Profile photo", Designation, Department, "Official email", "Official phone", "Office location", "Reporting Manager"]
    view_unmasked: ["All active employees (peer directory / org chart)"]
    masked_or_hidden_from: "Separated/absconded/pre-joining employees excluded. Recruiter directory limited to name/designation/department/official-email."
    ceiling: none

# -----------------------------------------------------------------------------
# 5. RESOLUTION ORDER  (Platform §P02 — encoded exactly as the pipeline)
# -----------------------------------------------------------------------------
resolution_order:
  service: "Authorization.check({ subject(roles,scope), action, resource_ref, fields[] }) -> { allowed, scope_filter, field_mask[] }"
  pipeline:
    - step: 1
      stage: deny_by_default
      rule: "No grant => 403 FORBIDDEN. Never reveals existence of out-of-scope records (returns as NOT_FOUND/FORBIDDEN)."
    - step: 2
      stage: role_grant
      rule: "Resolve the union of the subject's held role grants for (action, resource)."
    - step: 3
      stage: multi_role_intersection
      rule: "Where the subject holds multiple roles, the MOST RESTRICTIVE permission wins (intersection, never elevation)."
    - step: 4
      stage: individual_entitlement
      rule: "Apply time-bound, mandatory-expiry, auto-revoked, Org-Admin-approved individual entitlements (widen within ceiling only)."
    - step: 5
      stage: capability_flag
      rule: "Apply opt-in capability flags granted on the role assignment (bounded capability extension)."
    - step: 6
      stage: pii_protection_ceiling
      rule: "PII ceiling overrides EVERYTHING upward — no role/entitlement/flag lifts it. Fixed platform exceptions only (Office Admin national-ID/DOB)."
    - step: 7
      stage: data_scope_filter
      rule: "Apply row-level scope filter across the five dimensions (reporting chain · department/org_unit · UAG · contribution level · entity). Enforced at the data/persistence layer; a query without resolvable tenant scope is rejected, not defaulted to all."
    - step: 8
      stage: field_mask_on_serialization
      rule: "Apply field mask (V/M/H per RBAC §7) on serialization so an over-broad query cannot leak; E·AR fields route edits through P01, never direct write."

