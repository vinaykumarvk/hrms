openapi: 3.1.0
info:
  title: Government HRMS — G05 Transfer, Relieving & Joining Workflow API
  version: 3.1.0
  description: >
    OpenAPI contract for module G05 (Transfer, Relieving and Joining Workflow) of the
    Government HRMS, a public-sector configuration of the PrimeSoft HRMS platform.
    Endpoints run on platform engines (P01 workflow, P02 authz, P05 audit, X.1/X.2/X.3
    infrastructure) and are grounded in the G05 BRD v3.1 entity model and the
    consolidated error taxonomy (ERR-G05-*).

    Conventions (adopted verbatim from PLATFORM_FOUNDATION.md §4):
      - All endpoints under /api/v1.
      - Bearer JWT (bearerAuth) carrying resolved roles + tenant/entity scope; P02
        Authorization.check per request.
      - Every request carries/echoes X-Correlation-Id (response header on all responses).
      - Workflow-initiating / external-signal POSTs accept an Idempotency-Key header;
        a repeat within 24h returns the original result.
      - Cursor pagination only: ?limit= (default 25, max 100) + cursor=; response next_cursor.
      - Canonical error envelope: { error: { code, message, field, details } }; 4xx/5xx
        map onto the 8 platform HTTP codes; ERR-G05-* ids carried in error.details.errorId.
  contact:
    name: Government HRMS — API Architecture
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Transfer Requests
  - name: Eligibility & Policy
  - name: Drives & Counselling
  - name: Orders
  - name: Proof of Service
  - name: Clearance
  - name: Charge Handover
  - name: Relieving
  - name: Transit & Joining
  - name: Deputation
  - name: SR Posting
  - name: Amendments
  - name: Representations & Holds
  - name: Custody & Continuity
  - name: Quarters & Estate
  - name: Analytics

paths:
  /transfers/requests:
    post:
      tags: [Transfer Requests]
      summary: Raise a transfer request (any transfer type)
      operationId: createTransferRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRequestCreate' }
      responses:
        '201':
          description: Transfer request created (DRAFT).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
    get:
      tags: [Transfer Requests]
      summary: List transfer requests (scoped)
      operationId: listTransferRequests
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/TransferType' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page of transfer requests.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/TransferRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /transfers/requests/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    patch:
      tags: [Transfer Requests]
      summary: Update a draft transfer request
      operationId: updateTransferRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRequestUpdate' }
      responses:
        '200':
          description: Updated transfer request.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }

  /transfers/requests/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [Transfer Requests]
      summary: Submit a transfer request (starts P01 instance; runs eligibility)
      operationId: submitTransferRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Submitted; eligibility evaluated; workflow started.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /transfers/eligibility/evaluate:
    post:
      tags: [Eligibility & Policy]
      summary: Evaluate transfer eligibility & policy (tenure/ban/protected/strength)
      operationId: evaluateEligibility
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EligibilityEvaluateRequest' }
      responses:
        '200':
          description: Eligibility result.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EligibilityResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }

  /transfers/requests/{id}/override:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [Eligibility & Policy]
      summary: Authority override of a policy block (recorded justification)
      operationId: overrideEligibility
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OverrideRequest' }
      responses:
        '200':
          description: Override recorded.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }

  /transfers/policy-rules:
    get:
      tags: [Eligibility & Policy]
      summary: List configured transfer policy rules
      operationId: listPolicyRules
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of policy rules.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/TransferPolicyRule' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /transfers/drives:
    post:
      tags: [Drives & Counselling]
      summary: Create a bulk transfer drive
      operationId: createDrive
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferDriveCreate' }
      responses:
        '201':
          description: Drive created.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferDrive' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }

  /transfers/drives/{id}/vacancies:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [Drives & Counselling]
      summary: Publish vacant positions for a drive (strength read-through)
      operationId: publishDriveVacancies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vacancies]
              properties:
                vacancies:
                  type: array
                  items: { $ref: '#/components/schemas/VacancyPositionCreate' }
      responses:
        '201':
          description: Vacancies published.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/VacancyPosition' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }
    get:
      tags: [Drives & Counselling]
      summary: List published vacancies for a drive
      operationId: listDriveVacancies
      parameters:
        - name: published
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of vacancies.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/VacancyPosition' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /transfers/drives/{id}/preferences:
    parameters:
      - $ref: '#/components/parameters/PathId'
    put:
      tags: [Drives & Counselling]
      summary: Submit/replace an employee's ranked preferences for a drive
      operationId: putDrivePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeId, preferences]
              properties:
                employeeId: { type: string, format: uuid }
                preferences:
                  type: array
                  items: { $ref: '#/components/schemas/TransferPreferenceInput' }
      responses:
        '200':
          description: Preferences saved.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TransferPreference' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }

  /transfers/drives/{id}/allot:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [Drives & Counselling]
      summary: Run batch allotment for a drive
      operationId: allotDrive
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                allotmentMethod: { $ref: '#/components/schemas/AllotmentMethod' }
      responses:
        '200':
          description: Allotment computed.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllotmentResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /transfers/drives/{id}/screen:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [Drives & Counselling]
      summary: Screen drive candidates for eligibility
      operationId: screenDrive
      responses:
        '200':
          description: Screening result.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriveScreenResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /transfers/drives/{id}/generate-orders:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [Drives & Counselling]
      summary: Generate bulk transfer orders for an allotted drive (JOB-G05-DRIVE)
      operationId: generateDriveOrders
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Bulk order generation accepted (batch; partial-failure quarantine).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchJobAccepted' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /transfers/drives/{id}/dashboard:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      tags: [Drives & Counselling]
      summary: Drive progress dashboard
      operationId: getDriveDashboard
      responses:
        '200':
          description: Drive dashboard metrics.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriveDashboard' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /transfers/drives/{id}/counselling-sessions:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [Drives & Counselling]
      summary: Create an interactive counselling session for a drive
      operationId: createCounsellingSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CounsellingSessionCreate' }
      responses:
        '201':
          description: Session scheduled.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CounsellingSession' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }

  /counselling-sessions/{id}/advance-turn:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [Drives & Counselling]
      summary: Advance the counselling turn to the next candidate
      operationId: advanceCounsellingTurn
      responses:
        '200':
          description: Turn advanced.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CounsellingSession' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /counselling-sessions/{id}/record-choice:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [Drives & Counselling]
      summary: Record an observed counselling choice (immutable, turn-checked)
      operationId: recordCounsellingChoice
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CounsellingChoiceInput' }
      responses:
        '201':
          description: Choice recorded (append-only).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CounsellingChoice' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /counselling-sessions/{id}/choices:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      tags: [Drives & Counselling]
      summary: List the immutable choice log for a session
      operationId: listCounsellingChoices
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of choices.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CounsellingChoice' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /transfers/orders:
    post:
      tags: [Orders]
      summary: Create a transfer order (gapless numbering; P01 approval)
      operationId: createTransferOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferOrderCreate' }
      responses:
        '201':
          description: Transfer order created (DRAFT/PENDING_APPROVAL).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferOrder' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /transfers/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      tags: [Orders]
      summary: Get a transfer order
      operationId: getTransferOrder
      responses:
        '200':
          description: Transfer order.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferOrder' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /transfers/orders/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [Orders]
      summary: Approve/sanction a transfer order (Transfer Authority; P01)
      operationId: approveTransferOrder
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecision' }
      responses:
        '200':
          description: Order approved.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferOrder' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }

  /transfers/orders/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [Orders]
      summary: Publish an approved order (commit gapless number; generate PDF; outbox)
      operationId: publishTransferOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Order published; SR TRANSFER queued to outbox.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferOrder' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /transfers/orders/{id}/amend:
    parameters:
      - $ref: '#/components/parameters/PathId'
