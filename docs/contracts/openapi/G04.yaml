openapi: 3.1.0
info:
  title: G04 — Leave to Digital Service Register (SR) Integration API
  version: "3.1.0"
  description: >-
    Government HRMS module **G04** — the reliable, idempotent, reconciled bridge that
    maps approved/cancelled/amended leave events (from **G03**) into the append-only
    statutory **Digital Service Register** ledger (owned by **G12**, on the P05 audit
    substrate) with **exactly-once effect**.


    This document specifies the G04 **management surface** under `/api/v1/lsr`
    (outbox/relay observability, SR posting-log queries, reconciliation runs/findings,
    dead-letter queue triage + replay, integration config, historical digitisation
    batches, port-conformance runs, source-ledger integrity, and the pre-pension
    completeness certificate). It **also references** the single canonical G12 SR
    write port — `POST /api/v1/sr/ingest` (+ `/api/v1/sr/ingest/reversal`) — which is
    **owned by G12** and reached by the G04 relay as an X.3 outbound integration; G04
    never writes the SR ledger by any other path.


    Conventions (PLATFORM_FOUNDATION.md §4): all endpoints under `/api/v1`; bearer JWT
    auth resolved per request by P02 `Authorization.check`; unsafe POSTs accept an
    `Idempotency-Key` header (24h replay -> `CONFLICT`); cursor pagination only
    (`limit` default 25 / max 100, `cursor` -> `next_cursor`); `X-Correlation-Id`
    echoed on every response; canonical error envelope `{ error: { code, message,
    field, details } }` over the 8-code platform status table.
  contact:
    name: API Architecture / Platform Foundation
  license:
    name: Government HRMS Internal
  x-ph07-employee-wave:
    implementedRoutes:
      - GET /api/v1/leave-sr/outbox
      - POST /api/v1/leave-sr/outbox/{id}:relay
      - POST /api/v1/leave-sr/outbox/{id}:replay
      - POST /api/v1/leave-sr/outbox/{id}:discard
      - GET /api/v1/leave-sr/reconciliation
    srWriter: G04
    dlqStates: [DEAD_LETTERED, DISCARDED]
servers:
  - url: /api/v1
    description: Platform API v1 base path

security:
  - bearerAuth: []

tags:
  - name: Capture & Outbox
    description: Transactional outbox / relay observability (FR-01, FR-03)
  - name: Event Mapping
    description: Versioned leave->SR mapping catalog (FR-02)
  - name: SR Posting
    description: Posting-log queries and the G12 canonical SR write port (FR-03, FR-16)
  - name: Dead-letter Queue
    description: DLQ triage, replay, discard (FR-04, FR-05)
  - name: Reconciliation
    description: State-aware reconciliation runs and findings (FR-06, FR-07)
  - name: Corrections
    description: Correction/reversal chain resolution (FR-08)
  - name: Qualifying Service & Annotations
    description: Qualifying-impact + statutory annotations (FR-09, FR-10)
  - name: Historical Digitisation
    description: Legacy leave batches and provisional records (FR-11)
  - name: Replay & Backfill
    description: Deterministic replay/backfill tooling (FR-12)
  - name: Monitoring
    description: Dashboard KPIs, metrics, alerts (FR-13)
  - name: Audit & Evidence
    description: Chain reconstruction + evidence pack export (FR-14)
  - name: Port Conformance
    description: G12 SR write-port conformance runs (FR-16)
  - name: Capture Integrity
    description: Source-ledger <-> outbox integrity reconciliation (FR-17)
  - name: Pre-pension Certificate
    description: Signed pre-pension completeness certificate (FR-18)
  - name: Configuration
    description: Retry/SLA/lease/relay-pause configuration

paths:

  # ---------------------------------------------------------------------------
  # FR-01 / FR-03 — Capture & Outbox observability
  # ---------------------------------------------------------------------------
  /lsr/outbox:
    get:
      tags: [Capture & Outbox]
      operationId: listOutboxEvents
      summary: List transactional-outbox leave events (IntegOps observability)
      description: >-
        Lists captured leave domain events with their relay/posting status. Supports
        the stranded-in-flight probe used by the reaper operating model
        (`?status=IN_FLIGHT&leaseExpired=true`).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - name: status
          in: query
          description: Filter by outbox status.
          schema: { $ref: '#/components/schemas/OutboxStatus' }
        - name: leaseExpired
          in: query
          description: When true with status=IN_FLIGHT, returns stranded rows past their lease.
          schema: { type: boolean }
        - name: leaveSpellLineageId
          in: query
          schema: { type: string, format: uuid }
        - name: employeeId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Page of outbox events.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OutboxEvent' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # FR-02 — Event mapping catalog
  # ---------------------------------------------------------------------------
  /lsr/mappings:
    get:
      tags: [Event Mapping]
      operationId: listMappings
      summary: List event-mapping versions (cursor, effective-date filter)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - name: leaveTypeCode
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/MappingStatus' }
        - name: effectiveOn
          in: query
          description: Return the mapping version effective on this date.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Page of mappings.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/EventMapping' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
    post:
      tags: [Event Mapping]
      operationId: createMappingDraft
      summary: Create a draft mapping version (Sys Admin)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventMappingWrite' }
      responses:
        '201':
          description: Draft mapping created.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventMapping' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /lsr/mappings/{mappingId}:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    put:
      tags: [Event Mapping]
      operationId: updateMappingDraft
      summary: Edit a draft mapping version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventMappingWrite' }
      responses:
        '200':
          description: Draft mapping updated.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventMapping' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /lsr/mappings/{mappingId}/publish:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    post:
      tags: [Event Mapping]
      operationId: publishMapping
      summary: Submit a mapping version for P01 maker-checker publish
      description: >-
        Starts a P01 approval instance; on approval the version becomes PUBLISHED.
        Overlapping effective ranges are rejected with `ERR-G04-MAPPING-OVERLAP`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Publish workflow started.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowStarted' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # FR-03 / FR-16 — Posting log + G12 canonical SR write port (referenced)
  # ---------------------------------------------------------------------------
  /lsr/postings:
    get:
      tags: [SR Posting]
      operationId: listPostingLog
      summary: Query the SR posting log (every posting attempt & outcome)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - name: leaveSpellLineageId
          in: query
          schema: { type: string, format: uuid }
        - name: outcome
          in: query
          schema: { $ref: '#/components/schemas/PostingOutcome' }
        - name: srEventId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Page of posting-log rows.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PostingLogEntry' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/ingest:
    post:
      tags: [SR Posting]
      operationId: srIngest
      summary: "[G12-OWNED] Canonical idempotent SR ledger write port"
      description: >-
        **Owned by G12**, documented here because it is the only ledger write path
        the G04 relay calls (as an X.3 outbound integration; credentials from P04).
        G04 sends `sourceModule="G04"` with the canonical dedup tuple
        `(sourceModule, sourceReferenceId, sourceEventVersion)`, the mandatory
        semantic `factKey` (missing -> `SR_FACT_KEY_REQUIRED`), explicit
        `tenantId`/`entityId`, `leaveSpellLineageId` (business correlation key), and
        one of the published G04 event codes (EL_AVAILED / HPL_AVAILED /
        COMMUTED_LEAVE / STUDY_LEAVE / MATERNITY_LEAVE / LWP_SPELL / EOL_SPELL).
        The `Idempotency-Key` header carries the mapping-version-independent
        `dedupe_key`; a repeat within the retention window returns the original
        `srEventId` as a `DUPLICATE_NOOP`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SrIngestRequest' }
      responses:
        '201':
          description: SR entry created.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SrIngestResult' }
        '200':
          description: >-
            Idempotent duplicate — original `srEventId` returned as a no-op
            (`ERR-G04-IDEMPOTENT-DUPLICATE`).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SrIngestDuplicate' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >-
            State conflict — `ERR-G04-SR-CONFLICT`, or correction ordering guard
            `ERR-G04-BLOCKED-AWAITING-ORIGINAL`.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412':
          description: >-
            Precondition not met — `ERR-G04-PORT-NOT-CONFORMANT` (live-posting gate
            closed), `ERR-G04-RELAY-PAUSED`, or `ERR-G04-SR-UNAVAILABLE` (retryable).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >-
            Validation failure — `SR_FACT_KEY_REQUIRED`, `ERR-G04-LINEAGE-MISSING`,
            or `ERR-G04-MAPPING-NOT-FOUND`.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/ingest/reversal:
    post:
      tags: [SR Posting]
      operationId: srIngestReversal
      summary: "[G12-OWNED] SR reversal envelope (supersede-not-delete)"
      description: >-
        **Owned by G12.** Posts the G12 reversal envelope for a cancelled/amended
        leave: `isReversal=true` + `reversesSourceReferenceId` (the original spell's
        `sourceReferenceId`) and the published `*_CANCELLED` partner event code
        (e.g. `EL_AVAILED_CANCELLED`). G12 auto-spawns the corrigendum/supersession;
        the original entry remains immutable. Flows through the same outbox + dedup
        (X.3 outbound) path as forward posts.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SrIngestReversalRequest' }
      responses:
        '201':
          description: Reversal entry created.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SrIngestResult' }
        '200':
          description: Idempotent duplicate reversal — original returned as no-op.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SrIngestDuplicate' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >-
            `ERR-G04-BLOCKED-AWAITING-ORIGINAL` (original not yet POSTED) or
            `ERR-G04-ORPHAN-CORRECTION` (no locatable original).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # FR-04 / FR-05 — Dead-letter queue
  # ---------------------------------------------------------------------------
  /lsr/dlq:
    get:
      tags: [Dead-letter Queue]
      operationId: listDeadLetters
      summary: List dead-lettered (quarantined) events
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/DlqState' }
        - name: failureClass
          in: query
          schema: { $ref: '#/components/schemas/DlqFailureClass' }
        - name: assignedTo
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Page of DLQ items.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DeadLetter' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /lsr/dlq/{dlqId}/assign:
    parameters:
      - $ref: '#/components/parameters/DlqId'
    post:
      tags: [Dead-letter Queue]
      operationId: assignDeadLetter
      summary: Assign / annotate a DLQ item for triage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignedTo]
              properties:
                assignedTo: { type: string, format: uuid }
                note: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: DLQ item assigned.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeadLetter' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /lsr/dlq/{dlqId}/replay:
    parameters:
      - $ref: '#/components/parameters/DlqId'
    post:
      tags: [Dead-letter Queue]
      operationId: replayDeadLetter
      summary: Replay a DLQ item (starts a P01 maker-checker instance)
      description: >-
        Re-queues the quarantined event for posting after the underlying cause is
        fixed. Blocked with `ERR-G04-DLQ-REPLAY-BLOCKED` if the mapping is still
        missing or the signature is unfixed.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 2000 }
      responses:
        '202':
          description: Replay workflow started.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowStarted' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`ERR-G04-DLQ-REPLAY-BLOCKED` — replay blocked (mapping/signature unfixed).'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /lsr/dlq/{dlqId}/discard:
    parameters:
      - $ref: '#/components/parameters/DlqId'
    post:
      tags: [Dead-letter Queue]
      operationId: discardDeadLetter
      summary: Discard a DLQ item (starts a P01 maker-checker instance)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 2000 }
      responses:
        '202':
          description: Discard workflow started.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowStarted' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # Configuration + manual relay pause/resume
  # ---------------------------------------------------------------------------
  /lsr/config:
    put:
      tags: [Configuration]
      operationId: updateIntegrationConfig
      summary: Update retry/SLA/lease/rate-limit config (Sys Admin, effective-dated)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegrationConfigWrite' }
      responses:
        '200':
          description: Configuration updated (staged by effective date).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationConfig' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /lsr/relay/pause:
    post:
      tags: [Configuration]
      operationId: pauseRelay
      summary: Manually pause the posting relay
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Relay paused.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelayState' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /lsr/relay/resume:
    post:
      tags: [Configuration]
      operationId: resumeRelay
      summary: Resume a paused posting relay
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Relay resumed.
