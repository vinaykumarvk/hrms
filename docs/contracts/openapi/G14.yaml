        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FairnessAssessmentRequest' }
      responses:
        <<: *writeErrors
        "200":
          description: Fairness assessment recorded on the model card.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PredictionModel' }

