openapi: 3.1.0

# =============================================================================
# Government HRMS — Module G14 Dashboard & Analytics — OpenAPI 3.1 contract
# -----------------------------------------------------------------------------
# Grounded in:
#   - docs/brd/v3/G14-dashboard-and-analytics.md  (Section 8 + FR API tables,
#     entity field tables E01–E24)
#   - docs/contracts/error-taxonomy.yaml          (standard 8-code table +
#     shared ERR-* + module ERR-G14-*)
#   - docs/brd/PLATFORM_FOUNDATION.md §4           (API conventions, envelope)
#
# Platform conventions embedded (Foundation §4):
#   - Base path /api/v1 ; all analytics endpoints under /analytics (M16 surface).
#   - Bearer JWT (bearerAuth) global; every data-bearing endpoint is P02
#     (Authorization.check) enforced + FR-17 suppression applied server-side.
#   - X-Correlation-Id echoed on EVERY response (written to every audit/log line).
#   - Idempotency-Key required on unsafe / workflow-initiating POSTs (24h replay).
#   - Cursor pagination only: ?limit= (default 25, max 100) + cursor= ; next_cursor.
#   - Canonical error envelope { error: { code, message, field, details } }.
#   - 403/404 never reveal existence of out-of-scope records (P02 scope safety).
#   - No 400 / 423 / 502 / 503 on the wire; upstream/mart failure maps to 412
#     (retryable) or 500 + ERR-LOADFAIL (non-retryable) per error-taxonomy X.3.
# =============================================================================

info:
  title: Government HRMS — G14 Dashboard & Analytics API
  version: 3.0.0
  x-ph10-release-analytics: read-only-mart-release-readiness
  description: >
    Cross-module intelligence layer of the government HRMS, delivered as an
    extension of PrimeSoft M16 Reports & Analytics on the `analytics.*`
    entitlement. Covers role-based dashboards & widgets, governed versioned KPI
    definitions with bitemporal snapshots and effective-dated targets, the
    analytics data-mart layer (ETL on X.1), permission-scoped access policies
    (declaring P02 dimensions — enforcement is P02, not a parallel engine),
    saved reports / schedules / multi-format export, self-service report
    builder, drill-down & P02-gated drill-through, alerting, data-freshness &
    reconciliation, deterministic retirement forecasting, fairness-governed
    probabilistic prediction, governed NL query (P03-aligned) and hardened
    embedded BI (X.3), establishment/position reference, DPDP rectification /
    erasure propagation, source data contracts, access-anomaly detection, and
    metric-level complementary suppression. All reads inherit the P02 scope
    filter + PII field mask and are audited into P05.
  contact:
    name: API Architecture / Platform Foundation

servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: Dashboards
  - name: Widgets & Drill
  - name: KPIs
  - name: KPI Targets
  - name: Snapshots & Reproducibility
  - name: Data Marts
  - name: Scope Policies
  - name: Workforce Analytics
  - name: Operational Analytics
  - name: Compliance Analytics
  - name: Report Builder
  - name: Report Distribution
  - name: Alerts
  - name: Data Health
  - name: Prediction Models
  - name: Predictions
  - name: Benchmarking
  - name: NL Query
  - name: Embedded BI
  - name: Mobile & Briefings
  - name: Suppression Policies
  - name: Establishment
  - name: DPDP Data-Subject Changes
  - name: Source Data Contracts
  - name: Access Anomalies
  - name: Access Audit

# -----------------------------------------------------------------------------
# Reusable response bundles (YAML anchors resolve at parse; DRY across ops).
# X-Correlation-Id header is attached to every 2xx via *corrHeaders.
# -----------------------------------------------------------------------------
x-corr-headers: &corrHeaders
  X-Correlation-Id:
    $ref: '#/components/headers/CorrelationId'

x-read-errors: &readErrors
  "401": { $ref: '#/components/responses/Unauthenticated' }
  "403": { $ref: '#/components/responses/Forbidden' }
  "404": { $ref: '#/components/responses/NotFound' }
  "422": { $ref: '#/components/responses/ValidationFailed' }
  "429": { $ref: '#/components/responses/RateLimited' }
  "500": { $ref: '#/components/responses/Internal' }

x-write-errors: &writeErrors
  "401": { $ref: '#/components/responses/Unauthenticated' }
  "403": { $ref: '#/components/responses/Forbidden' }
  "404": { $ref: '#/components/responses/NotFound' }
  "409": { $ref: '#/components/responses/Conflict' }
  "412": { $ref: '#/components/responses/PreconditionFailed' }
  "422": { $ref: '#/components/responses/ValidationFailed' }
  "429": { $ref: '#/components/responses/RateLimited' }
  "500": { $ref: '#/components/responses/Internal' }

paths:

  # ==========================================================================
  # FR-G14-01 — Role-Based Dashboard Framework & Layout
  # ==========================================================================
  /analytics/dashboards:
    post:
      tags: [Dashboards]
      summary: Create a dashboard
      operationId: createDashboard
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DashboardCreate' }
      responses:
        <<: *writeErrors
        "201":
          description: Dashboard created (DRAFT).
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
    get:
      tags: [Dashboards]
      summary: List dashboards visible to the caller (P02-scoped)
      operationId: listDashboards
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - name: target_role
          in: query
          schema: { $ref: '#/components/schemas/TargetRole' }
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/DashboardCategory' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DashboardStatus' }
      responses:
        <<: *readErrors
        "200":
          description: Page of dashboards.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardPage' }

  /analytics/dashboards/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      tags: [Dashboards]
      summary: Get a dashboard (definition + widgets)
      operationId: getDashboard
      responses:
        <<: *readErrors
        "200":
          description: Dashboard definition.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }

  /analytics/dashboards/{id}/widgets:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [Widgets & Drill]
      summary: Add a widget to a dashboard
      operationId: addDashboardWidget
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WidgetCreate' }
      responses:
        <<: *writeErrors
        "201":
          description: >
            Widget added. 409 ERR-G14-WIDGET-BINDING if bound to a
            retired/missing KPI or report.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardWidget' }

  /analytics/dashboards/{id}:publish:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [Dashboards]
      summary: Publish a dashboard (P01 maker-checker; SoD via P02)
      operationId: publishDashboard
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishRequest' }
      responses:
        <<: *writeErrors
        "200":
          description: >
            Published (or routed to P01 checker). 403 ERR-G14-PUBLISH-CHECKER
            if the maker attempts a gated self-publication.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }

  /analytics/dashboards/{id}/render:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      tags: [Dashboards]
      summary: Render a dashboard with P02-scoped, suppressed, freshness-stamped data
      description: >
        Returns each widget's result set already passed through
        Authorization.check (P02 scope + field mask) and FR-17 suppression, with
        a data_as_of watermark and staleness state. `viewport=mobile` serves the
        responsive mobile render (FR-16); RESTRICTED tiles honour the offline
        policy.
      operationId: renderDashboard
      parameters:
        - name: viewport
          in: query
          schema: { type: string, enum: [desktop, mobile], default: desktop }
        - name: period
          in: query
          schema: { type: string }
        - name: scope
          in: query
          schema: { type: string }
        - name: asOfKnowledge
          in: query
          description: Bitemporal knowledge-time instant (FR-23) for reproducible render.
          schema: { type: string, format: date-time }
      responses:
        <<: *readErrors
        "200":
          description: >
            Rendered dashboard. May carry suppression/partial-data notices
            (ERR-G14-SMALL-CELL / ERR-G14-COMP-SUPPRESS notice surfaces).
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardRender' }

  /analytics/saved-views:
    post:
      tags: [Dashboards]
      summary: Save a personal filter/layout view
      operationId: createSavedView
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedViewCreate' }
      responses:
        <<: *writeErrors
        "201":
          description: Saved view created.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedView' }

  # ==========================================================================
  # FR-G14-02 — KPI Definition & Calculation Engine
  # ==========================================================================
  /analytics/kpis:
    post:
      tags: [KPIs]
      summary: Create a KPI definition version
      operationId: createKpi
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KpiDefinitionCreate' }
      responses:
        <<: *writeErrors
        "201":
          description: >
            KPI version created (DRAFT). 422 ERR-G14-KPI-EXPR if the aggregation
            DSL fails validation.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KpiDefinition' }
    get:
      tags: [KPIs]
      summary: List KPI definitions
      operationId: listKpis
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: domain
          in: query
          schema: { $ref: '#/components/schemas/KpiDomain' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/KpiStatus' }
      responses:
        <<: *readErrors
        "200":
          description: Page of KPI definitions.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KpiDefinitionPage' }

  /analytics/kpis/{id}:activate:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [KPIs]
      summary: Activate a KPI version (P01 checker)
      operationId: activateKpi
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        <<: *writeErrors
        "200":
          description: >
            Activated. 409 ERR-G14-KPI-VER-OVERLAP if another ACTIVE version
            already exists for the kpi_code; 403 ERR-G14-PUBLISH-CHECKER on
            maker self-approval.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KpiDefinition' }

  /analytics/kpis/{id}/targets:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [KPI Targets]
      summary: Set an effective-dated KPI target / alert threshold (VAL-EFFECTIVE)
      operationId: setKpiTarget
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KpiTargetCreate' }
      responses:
        <<: *writeErrors
        "201":
          description: >
            Effective-dated target recorded (staged by the effective-date job).
            422 (ERR-PAST-DATED) if effective_from precedes the current
            effective date.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KpiTarget' }

  /analytics/kpis/{code}/value:
    parameters:
      - $ref: '#/components/parameters/PathCode'
    get:
      tags: [KPIs]
      summary: Compute/resolve a KPI value (P02-scoped, bitemporal-capable)
      description: >
        Resolves the governed KPI value for a scope/period, stamped with
        kpi_version + definition_hash and a data_as_of watermark. `asOfKnowledge`
        reproduces the value as it was known at a past instant (FR-23).
      operationId: getKpiValue
      parameters:
        - name: scope
          in: query
          schema: { type: string }
        - name: period
          in: query
          schema: { type: string }
        - name: asOfKnowledge
          in: query
          schema: { type: string, format: date-time }
      responses:
        <<: *readErrors
        "200":
          description: >
            KPI value. May be a suppression notice (ERR-G14-SMALL-CELL). 404
            ERR-G14-ASOF-NA if the knowledge instant predates the first snapshot.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KpiValue' }

  /analytics/kpis/{code}/trend:
    parameters:
      - $ref: '#/components/parameters/PathCode'
    get:
      tags: [KPIs]
      summary: KPI snapshot trend (cursor-paginated, version markers)
      operationId: getKpiTrend
      parameters:
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
        - name: scope
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        <<: *readErrors
        "200":
          description: >
            Trend series. 409 ERR-G14-XVER-AGG if aggregation crosses a
            definition version without acknowledgement.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KpiSnapshotPage' }

  # ==========================================================================
  # FR-G14-23 — Bitemporal snapshot / as-of-knowledge reproducibility
  # ==========================================================================
  /analytics/kpis/{code}/history:
    parameters:
      - $ref: '#/components/parameters/PathCode'
    get:
      tags: [Snapshots & Reproducibility]
      summary: Knowledge-version lineage of a KPI snapshot (bitemporal)
      operationId: getKpiHistory
      parameters:
        - name: scope
          in: query
          schema: { type: string }
        - name: period
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        <<: *readErrors
        "200":
          description: >
            Ordered knowledge-versions (valid_time / knowledge_time / superseded).
            404 ERR-G14-ASOF-NA if before the first snapshot version.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KpiSnapshotPage' }

  # ==========================================================================
  # FR-G14-03 — Analytics Data Layer (marts + ETL on X.1)
  # ==========================================================================
  /analytics/marts:
    post:
      tags: [Data Marts]
      summary: Register a data mart (+ X.1 refresh job)
      operationId: registerMart
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatamartCreate' }
      responses:
        <<: *writeErrors
        "201":
          description: Mart registered.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsDatamart' }
    get:
      tags: [Data Marts]
      summary: List registered marts
      operationId: listMarts
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        <<: *readErrors
        "200":
          description: Page of marts.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatamartPage' }

  /analytics/marts/{id}:refresh:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [Data Marts]
      summary: Trigger a mart refresh (manual / backfill)
      operationId: refreshMart
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MartRefreshRequest' }
      responses:
        <<: *writeErrors
        "202":
          description: >
            Refresh enqueued on X.1. 409 ERR-G14-MART-BUSY on a concurrent
            refresh lock; 500 ERR-G14-MART-REFRESH (ERR-LOADFAIL) on ETL error
            with last-good retained.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatamartRefreshLog' }

  /analytics/marts/{id}/health:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      tags: [Data Marts]
      summary: Mart freshness / health
      operationId: getMartHealth
      responses:
        <<: *readErrors
        "200":
          description: Freshness watermark + health status.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MartHealth' }

  /analytics/marts/{id}/refresh-log:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      tags: [Data Marts]
      summary: Mart refresh run history (cursor-paginated)
      operationId: listMartRefreshLog
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        <<: *readErrors
        "200":
          description: Page of refresh runs.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatamartRefreshLogPage' }

  # ==========================================================================
  # FR-G14-04 — Analytics Scope Policies (declare P02 dimensions; enforce = P02)
  # ==========================================================================
  /analytics/scope-policies:
    post:
      tags: [Scope Policies]
      summary: Create/update a scope policy (DRAFT, maker)
      description: >
        Declares which P02 scope dimensions and field-sensitivity flags apply per
        mart/role. This entity does NOT enforce anything — enforcement is entirely
        by Authorization.check (P02) at the data layer. Change is maker-checked
        via P01 with SoD by P02.
      operationId: createScopePolicy
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScopePolicyCreate' }
      responses:
        <<: *writeErrors
        "201":
          description: Draft scope policy created.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsScopePolicy' }
    get:
      tags: [Scope Policies]
      summary: List scope policies
      operationId: listScopePolicies
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        <<: *readErrors
        "200":
          description: Page of scope policies.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopePolicyPage' }

  /analytics/scope-policies/{id}:preview-as-role:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [Scope Policies]
      summary: Compute the P02 exposure diff for a role
      operationId: previewScopePolicyAsRole
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string }
      responses:
        <<: *writeErrors
        "200":
          description: Before/after exposure diff (P02-computed).
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeExposureDiff' }

  /analytics/scope-policies/{id}:approve:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [Scope Policies]
      summary: Approve a scope policy (P01 checker ≠ maker)
      operationId: approveScopePolicy
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        <<: *writeErrors
        "200":
          description: >
            Policy activated. 403 ERR-G14-SCOPE-CHECKER if the maker attempts
            self-approval (SoD).
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsScopePolicy' }

  /analytics/scope-policies/resolve:
    get:
      tags: [Scope Policies]
      summary: Resolve my effective P02 scope (debug/self)
      operationId: resolveMyScope
      responses:
        <<: *readErrors
        "200":
          description: Effective scope filter + field mask for the caller.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolvedScope' }

  # ==========================================================================
  # FR-G14-05 — Workforce Analytics
  # ==========================================================================
  /analytics/workforce/headcount:
    get:
      tags: [Workforce Analytics]
      summary: Headcount by scope/dimension
      operationId: getHeadcount
      parameters:
        - $ref: '#/components/parameters/ScopeQ'
        - $ref: '#/components/parameters/DimensionQ'
        - $ref: '#/components/parameters/PeriodQ'
      responses:
        <<: *readErrors
        "200":
          description: Headcount result (P02-scoped, suppressed, freshness-stamped).
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsResult' }

  /analytics/workforce/attrition:
    get:
      tags: [Workforce Analytics]
      summary: Attrition metrics
      operationId: getAttrition
      parameters:
        - $ref: '#/components/parameters/ScopeQ'
        - $ref: '#/components/parameters/DimensionQ'
        - $ref: '#/components/parameters/PeriodQ'
      responses:
        <<: *readErrors
        "200":
          description: Attrition result.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsResult' }

  /analytics/workforce/vacancy:
    get:
      tags: [Workforce Analytics]
      summary: Sanctioned (establishment) vs filled
      operationId: getVacancy
      parameters:
        - $ref: '#/components/parameters/ScopeQ'
        - $ref: '#/components/parameters/PeriodQ'
      responses:
        <<: *readErrors
        "200":
          description: >
            Vacancy result. 422 ERR-G14-ESTAB-MISSING (notice surface) when the
            sanctioned-strength/position reference is absent.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsResult' }

  /analytics/workforce/retirement-profile:
    get:
      tags: [Workforce Analytics]
      summary: Retirement horizon profile
      operationId: getRetirementProfile
      parameters:
        - $ref: '#/components/parameters/ScopeQ'
        - $ref: '#/components/parameters/DimensionQ'
      responses:
        <<: *readErrors
        "200":
          description: Retirement horizon result.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsResult' }

  /analytics/workforce/span-of-control:
    get:
      tags: [Workforce Analytics]
      summary: Reports per manager (span of control)
      operationId: getSpanOfControl
      parameters:
        - $ref: '#/components/parameters/ScopeQ'
      responses:
        <<: *readErrors
        "200":
          description: Span-of-control result.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsResult' }

  # ==========================================================================
  # FR-G14-06 — Operational Analytics
  # ==========================================================================
  /analytics/operational/leave:
    get:
      tags: [Operational Analytics]
      summary: Leave / absenteeism analytics
      operationId: getLeaveAnalytics
      parameters:
        - $ref: '#/components/parameters/ScopeQ'
        - $ref: '#/components/parameters/DimensionQ'
        - $ref: '#/components/parameters/PeriodQ'
      responses:
        <<: *readErrors
        "200":
          description: Leave analytics result.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsResult' }

  /analytics/operational/payroll-cost:
    get:
      tags: [Operational Analytics]
      summary: Payroll cost & overtime (locked snapshots only)
      operationId: getPayrollCost
