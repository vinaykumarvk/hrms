      properties:
        documentId: { type: [string, "null"], format: uuid }
        folderId: { type: [string, "null"], format: uuid }

    DlpFinding:
      type: object
      properties:
        dlpFindingId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
