openapi: 3.1.0
info:
  title: Government HRMS — G11 Retirement & Pension Management
  version: 3.0.0
  description: >
    OpenAPI contract for government HRMS module G11 (Retirement & Pension Management),
    grounded in docs/brd/v3/G11-retirement-and-pension.md (Section 6 FR API tables + Section 8),
    docs/contracts/error-taxonomy.yaml (ERR-G11-* under the platform 8-code table) and
    PLATFORM_FOUNDATION.md §4.


    Platform conventions embedded verbatim: bearer JWT (P02 Authorization.check); cursor pagination
    only (?limit= default 25 / max 100 + cursor= -> next_cursor); Idempotency-Key on every
    transaction-creating POST (24h replay); X-Correlation-Id echoed on every response and written to
    every P05 audit line; canonical {error:{code,message,field,details}} envelope; money as NUMERIC
    strings; effective-dated mutations accept effective_from (staged via JOB-G11-EFFDATE). All external
    calls (treasury/PDA, DigiLocker, penny-drop, death-registry, Jeevan Pramaan, CRA) run over X.3.
    Separation/superannuation/retirement/death-in-service/family-pension-sanctioned life events are
    posted by G11 (the SR writer) to the canonical write-port POST /api/v1/sr/ingest (§8.7).
  contact:
    name: G11 Pension Engine — API Architecture
servers:
  - url: /api/v1

security:
  - bearerAuth: []

# YAML anchor reused (via merge key) by every operation so the platform error envelope
# (422/401/403/404/409/412/429/500, annotated with ERR-G11-* reasons) is attached uniformly.
x-common-error-responses: &commonErrors
  '401': { $ref: '#/components/responses/Unauthenticated' }
  '403': { $ref: '#/components/responses/Forbidden' }
  '404': { $ref: '#/components/responses/NotFound' }
  '409': { $ref: '#/components/responses/Conflict' }
  '412': { $ref: '#/components/responses/PreconditionFailed' }
  '422': { $ref: '#/components/responses/ValidationFailed' }
  '429': { $ref: '#/components/responses/RateLimited' }
  '500': { $ref: '#/components/responses/Internal' }

tags:
  - name: Forecasts
    description: Retirement forecasting & due-for-retirement lists (FR-G11-01)
  - name: Cases
    description: Separation case management, all separation types (FR-G11-02/03)
  - name: QualifyingService
    description: Qualifying-service computation, spells, prior service (FR-G11-04)
  - name: Pension
    description: Pension calculation — OPS / NPS / UPS / service gratuity (FR-G11-05)
  - name: Commutation
    description: Commutation of pension (FR-G11-06)
  - name: Gratuity
    description: Retirement / death / service gratuity (FR-G11-07)
  - name: FamilyPension
    description: Path-specific family & enhanced family pension (FR-G11-08)
  - name: Settlement
    description: Terminal benefits & final settlement incl. tax/TDS (FR-G11-09)
  - name: GPF
    description: GPF final withdrawal (FR-G11-10)
  - name: PPO
    description: PPO generation & digital PPO (FR-G11-11)
  - name: Pensioners
    description: Pensioner master & lifecycle (FR-G11-12)
  - name: Revisions
    description: DA & pay-commission revision (FR-G11-13)
  - name: Disbursements
    description: Treasury / bank / PDA disbursement & pre-credit verification (FR-G11-14)
  - name: SelfService
    description: Retirement self-service portal & estimators (FR-G11-15)
  - name: Grievances
    description: Pensioner grievance management (FR-G11-16)
  - name: Analytics
    description: Forecasting & pension-liability analytics (FR-G11-17)
  - name: ServiceVerification
    description: e-SR completeness & discrepancy resolution gate (FR-G11-18)
  - name: RuleTables
    description: Effective-dated pension rule-table management (FR-G11-19)
  - name: DeathDetection
    description: Proactive death detection & overpayment recovery (FR-G11-20)
  - name: PDA
    description: PDA registry & disbursement model (FR-G11-21)
  - name: Provisional
    description: Provisional pension, Rule 9 pending proceedings (FR-G11-22)
  - name: AuditObjections
    description: AG / internal-audit objection management (FR-G11-23)
  - name: DigitalDelivery
    description: DigiLocker / DBT delivery & linkage (FR-G11-24)
  - name: ServiceRegister
    description: G11 as the SR writer for separation life events (§8.7)

paths:

  # --------------------------------------------------------------------------
  # FR-G11-01 Retirement Forecasting
  # --------------------------------------------------------------------------
  /pension/forecasts:
    get:
      tags: [Forecasts]
      summary: List due-for-retirement projections (cursor; horizon/org_unit/cadre filters)
      operationId: listForecasts
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - { name: horizon_months, in: query, schema: { type: integer, minimum: 1, maximum: 120 } }
        - { name: org_unit_id, in: query, schema: { type: string, format: uuid } }
        - { name: cadre, in: query, schema: { type: string } }
      responses:
        <<: *commonErrors
        '200':
          description: Page of forecast rows
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForecastList' }

  /pension/forecasts:refresh:
    post:
      tags: [Forecasts]
      summary: Recompute forecasts (delegates to JOB-G11-FORECAST on X.1)
      operationId: refreshForecasts
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                org_unit_id: { type: [string, "null"], format: uuid }
                horizon_months: { type: [integer, "null"] }
      responses:
        <<: *commonErrors
        '202':
          description: Refresh job accepted
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }

  /pension/forecasts/{employeeId}:
    get:
      tags: [Forecasts]
      summary: One employee's superannuation projection
      operationId: getEmployeeForecast
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        <<: *commonErrors
        '200':
          description: Forecast projection
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Forecast' }

  # --------------------------------------------------------------------------
  # FR-G11-02 Separation Case Management
  # --------------------------------------------------------------------------
  /pension/cases:
    post:
      tags: [Cases]
      summary: Create a separation case (workflow-initiating; Idempotency-Key required)
      operationId: createCase
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCaseRequest' }
      responses:
        <<: *commonErrors
        '201':
          description: Case created (P01 instance started). 409 ERR-G11-DUP-CASE on duplicate.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeparationCase' }

  /pension/cases/{id}:
    get:
      tags: [Cases]
      summary: Case detail & status
      operationId: getCase
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        <<: *commonErrors
        '200':
          description: Case detail
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeparationCase' }
    patch:
      tags: [Cases]
      summary: Update type-specific inputs / PDA binding / scheme override
      operationId: updateCase
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCaseRequest' }
      responses:
        <<: *commonErrors
        '200':
          description: Updated case. 409 ERR-G11-SCHEME-MISMATCH / ERR-G11-CASE-LOCKED-OPTIONS.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeparationCase' }

  /pension/cases/{id}:advance:
    post:
      tags: [Cases]
      summary: Transition case state (P01 advance)
      operationId: advanceCase
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowActionRequest' }
      responses:
        <<: *commonErrors
        '200':
          description: Advanced. 409 ERR-G11-VERIFICATION-INCOMPLETE if FR-18 gate not met.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeparationCase' }

  /pension/cases/{id}:sanction:
    post:
      tags: [Cases]
      summary: Sanction case (P01 approve; checker, SoD-enforced)
      operationId: sanctionCase
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SanctionRequest' }
      responses:
        <<: *commonErrors
        '200':
          description: Sanctioned. 403 on maker==checker SoD violation.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeparationCase' }

  # --------------------------------------------------------------------------
  # FR-G11-03 Pre-Retirement Processing
  # --------------------------------------------------------------------------
  /pension/cases/{id}/sr-verification:request:
    post:
      tags: [Cases]
      summary: Request G12 gap-free service verification
      operationId: requestSrVerification
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        <<: *commonErrors
        '202':
          description: Verification requested (X.3 to G12). 412 ERR-PRECOND if G12 unavailable.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceVerification' }

  /pension/cases/{id}/sr-verification:certify:
    post:
      tags: [Cases]
      summary: SR Custodian certifies service verification
      operationId: certifySrVerification
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        <<: *commonErrors
        '200':
          description: Certified. 409 ERR-G11-DISCREPANCY-OPEN if ledger not closed.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceVerification' }

  /pension/cases/{id}/no-dues:
    get:
      tags: [Cases]
      summary: No-dues checklist
      operationId: getNoDues
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        <<: *commonErrors
        '200':
          description: No-dues checklist
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoDues' }
    patch:
      tags: [Cases]
      summary: Update no-dues checklist items
      operationId: updateNoDues
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoDues' }
      responses:
        <<: *commonErrors
        '200':
          description: Updated no-dues checklist
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoDues' }

  /pension/cases/{id}/anticipatory-pension:
    post:
      tags: [Cases]
      summary: Authorise anticipatory pension
      operationId: authoriseAnticipatoryPension
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { $ref: '#/components/schemas/Money' }
                effective_from: { type: string, format: date }
                reason: { type: string }
      responses:
        <<: *commonErrors
        '201':
          description: Anticipatory pension authorised
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeparationCase' }

  # --------------------------------------------------------------------------
  # FR-G11-04 Qualifying Service
  # --------------------------------------------------------------------------
  /pension/cases/{id}/qualifying-service:compute:
    post:
      tags: [QualifyingService]
      summary: Compute qualifying service (net of spells + prior service)
      operationId: computeQualifyingService
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        <<: *commonErrors
        '200':
          description: Computed QSR. 409 ERR-G11-SERVICE-GAP / ERR-G11-VERIFICATION-INCOMPLETE.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualifyingServiceRecord' }

  /pension/cases/{id}/qualifying-service:
    get:
      tags: [QualifyingService]
      summary: QSR with spells and prior service
      operationId: getQualifyingService
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        <<: *commonErrors
        '200':
          description: QSR detail
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualifyingServiceRecord' }

  /pension/cases/{id}/qualifying-service/spells:
    post:
      tags: [QualifyingService]
      summary: Add or condone a non-qualifying spell
      operationId: addQualifyingServiceSpell
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NonQualifyingSpell' }
      responses:
        <<: *commonErrors
        '201':
          description: Spell recorded/condoned
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NonQualifyingSpell' }

  /pension/cases/{id}/prior-service:
    post:
      tags: [QualifyingService]
      summary: Add/verify counted prior/military service
      operationId: addPriorService
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriorServiceRecord' }
      responses:
        <<: *commonErrors
        '201':
          description: Prior-service record added
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriorServiceRecord' }

  /pension/cases/{id}/qualifying-service:lock:
    post:
      tags: [QualifyingService]
      summary: Lock QSR after verification
      operationId: lockQualifyingService
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        <<: *commonErrors
        '200':
          description: QSR locked. 409 ERR-G11-SPELL-NOT-ATTESTED if spells unattested.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualifyingServiceRecord' }

  # --------------------------------------------------------------------------
  # FR-G11-05 Pension Calculation
  # --------------------------------------------------------------------------
  /pension/cases/{id}/pension:compute:
    post:
      tags: [Pension]
      summary: Compute pension / route service gratuity / UPS / NPS-default
      operationId: computePension
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                emoluments_method: { $ref: '#/components/schemas/EmolumentsMethod' }
                reason: { type: string }
      responses:
        <<: *commonErrors
        '200':
          description: >
            Pension computed. 422 ERR-G11-EMOLUMENTS / ERR-G11-RULE-NOT-EFFECTIVE;
            409 ERR-G11-VERIFICATION-INCOMPLETE (input-provenance gate).
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PensionCalculation' }

  /pension/cases/{id}/pension:
    get:
      tags: [Pension]
      summary: Pension calculation + trace + benefit_outcome
      operationId: getPension
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        <<: *commonErrors
        '200':
          description: Pension calculation
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PensionCalculation' }

  # --------------------------------------------------------------------------
  # FR-G11-06 Commutation
  # --------------------------------------------------------------------------
  /pension/cases/{id}/commutation:
    post:
      tags: [Commutation]
      summary: Submit / compute commutation
      operationId: computeCommutation
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommutationRequest' }
      responses:
        <<: *commonErrors
        '200':
          description: >
            Commutation computed. 422 ERR-G11-COMMUTATION-LIMIT / ERR-G11-FACTOR-NOT-FOUND.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Commutation' }
    get:
      tags: [Commutation]
      summary: Commutation detail (incl. reduction/restoration timing)
      operationId: getCommutation
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        <<: *commonErrors
        '200':
          description: Commutation detail
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Commutation' }

  # --------------------------------------------------------------------------
  # FR-G11-07 Gratuity
  # --------------------------------------------------------------------------
  /pension/cases/{id}/gratuity:compute:
    post:
      tags: [Gratuity]
      summary: Compute gratuity (retirement / death / service)
      operationId: computeGratuity
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gratuity_type]
              properties:
                gratuity_type: { $ref: '#/components/schemas/GratuityType' }
                nominee_split:
                  type: [array, "null"]
                  items: { $ref: '#/components/schemas/NomineeShare' }
      responses:
        <<: *commonErrors
        '200':
          description: Gratuity computed (ceiling auto-stepped on DA milestone). 422 ERR-G11-NOMINEE-SPLIT.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gratuity' }

  /pension/cases/{id}/gratuity:
    get:
      tags: [Gratuity]
      summary: Gratuity detail
      operationId: getGratuity
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        <<: *commonErrors
        '200':
          description: Gratuity detail
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gratuity' }

  # --------------------------------------------------------------------------
  # FR-G11-08 Family Pension
  # --------------------------------------------------------------------------
  /pension/cases/{id}/family-pension:compute:
    post:
      tags: [FamilyPension]
      summary: Compute family pension (path-specific window)
      operationId: computeFamilyPension
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enhanced_basis]
              properties:
                enhanced_basis: { $ref: '#/components/schemas/EnhancedBasis' }
                current_family_member_id: { type: [string, "null"], format: uuid }
      responses:
        <<: *commonErrors
        '200':
          description: Family pension computed. 409 ERR-G11-FP-NOT-NOMINEE is NOT used (E26 register).
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyPension' }

  /pension/family-pension/{id}:
    get:
      tags: [FamilyPension]
      summary: Family pension detail
      operationId: getFamilyPension
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        <<: *commonErrors
        '200':
          description: Family pension detail
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyPension' }

  /pension/family-pension/{id}:transfer:
    post:
      tags: [FamilyPension]
      summary: Transfer to the next eligible family member
      operationId: transferFamilyPension
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_family_member_id, reason]
              properties:
                to_family_member_id: { type: string, format: uuid }
                reason: { type: string }
      responses:
        <<: *commonErrors
        '200':
          description: Transferred to next eligible member
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyPension' }

  # --------------------------------------------------------------------------
  # FR-G11-09 Terminal Settlement
  # --------------------------------------------------------------------------
  /pension/cases/{id}/settlement:compute:
    post:
      tags: [Settlement]
      summary: Assemble terminal settlement (incl. tax/TDS & 89(1) relief)
      operationId: computeSettlement
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        <<: *commonErrors
        '200':
          description: Settlement computed. 422 ERR-G11-TAX-RULE; 409 ERR-G11-RECOVERY-PROTECTION.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TerminalSettlement' }

  /pension/cases/{id}/settlement:
    get:
      tags: [Settlement]
      summary: Settlement detail (gross / taxable / TDS / net)
      operationId: getSettlement
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        <<: *commonErrors
        '200':
          description: Settlement detail
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
