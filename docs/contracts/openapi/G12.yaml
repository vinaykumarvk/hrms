openapi: 3.1.0
info:
  title: G12 — Digital Employee Service Register (Digital SR) API
  version: 3.1.0
  description: >
    OpenAPI 3.1 contract for government-HRMS module **G12 — Digital Employee Service
    Register**, the net-new statutory system-of-record that owns the append-only,
    hash-chained SR ledger (`service_register_events`) and its sub-ledgers.


    G12 OWNS the canonical SR ingestion contract: `POST /api/v1/sr/ingest` is the
    single, frozen write-port — the ONLY ledger write path. The canonical writer
    set (G01, G04, G05, G06, G08, G09, G10, G11 — see FR-01.B; G03 is NOT a writer)
    posts events through it; G11 (separation) also writes and G11/G14 consume the
    register. All other write attempts (direct table INSERT, alternate URLs) are
    prohibited by contract.


    Conventions (PLATFORM_FOUNDATION §4, Foundation FS §1): all endpoints under
    `/api/v1`; global `bearerAuth`; every response carries `X-Correlation-Id`;
    unsafe POSTs carry `Idempotency-Key` (24h replay → original result; enables
    exactly-once SR posting); cursor pagination (`limit` default 25 / max 100 +
    `cursor` → `next_cursor`); canonical error envelope
    `{ error: { code, message, field, details } }`. Domain error codes are the
    `SR_*` machine codes aliased to `ERR-G12-*` and mapped onto the platform 8
    standard HTTP statuses (422/401/403/404/409/412/429/500). See
    docs/contracts/error-taxonomy.yaml (G12).
  contact:
    name: G12 Digital Service Register — API Architecture / Platform Foundation
servers:
  - url: /api/v1
    description: Government HRMS platform, versioned base path

security:
  - bearerAuth: []

tags:
  - name: EventTypes
    description: FR-01 — Governed, versioned SR event taxonomy (`sr_event_type`).
  - name: Ingestion
    description: FR-02 — The canonical SR write-port (idempotent, semantic-dedup, reversible).
  - name: Timeline
    description: FR-09 — SR timeline per employee and single-event read.
  - name: Integrity
    description: FR-04 — Content-chain + status-chain + mandatory external anchor verification.
  - name: Corrections
    description: FR-05 — Corrigendum / supersession (never delete) with maker-checker + second custodian.
  - name: Annotations
    description: FR-06 — Annotation, dispute, and appeal-hook entries.
  - name: Attestation
    description: FR-07 — Custodian attestation with qualified signature + RFC 3161 timestamp.
  - name: Verification
    description: FR-08 — Periodic employee verification (bulk / assisted / nominee-heir).
  - name: Extracts
    description: FR-10 / FR-18 — Certified true copy, purpose-driven redaction, dual custodian, §65B certificate.
  - name: ExtractVerification
    description: FR-11 — Offline / QR verification of certified extracts.
  - name: AccessLog
    description: FR-12 — Custody, access control, and access log.
  - name: Subscriptions
    description: FR-13 — Event subscriptions (single authenticated pull-feed at launch).
  - name: Legacy
    description: FR-14 — Bulk legacy digitisation with confidence-flagged lane.
  - name: Retention
    description: FR-15 — Retention, legal hold, cross-tenant continuity, DR anchor reconciliation.
  - name: Forensics
    description: FR-16 — Audit / forensics view & SR analytics.
  - name: Gaps
    description: FR-17 — Completeness assurance & gap register.
  - name: LTV
    description: FR-19 — Long-term validation (LTV) & evidence-record renewal.
  - name: BulkCorrigendum
    description: FR-20 — Bulk (cadre-wide / pay-commission) corrigendum workflow.
  - name: Appeals
    description: FR-21 — Grievance & appeal escalation.

paths:

  # ============================== FR-01 EVENT TYPES ==========================
  /sr/event-types:
    post:
      tags: [EventTypes]
      summary: Create a DRAFT SR event type (taxonomy)
      operationId: createEventType
      description: Create a DRAFT `sr_event_type` version (Sys Admin `sr.taxonomy.draft`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventTypeCreate' }
      responses:
        '201':
          description: DRAFT event type created.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
    get:
      tags: [EventTypes]
      summary: List / resolve SR event types
      operationId: listEventTypes
      description: Paginated list of event types; resolves the effective version for a date.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, PUBLISHED, RETIRED]
        - name: as_of
          in: query
          description: Resolve the version effective on this date.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Page of event types.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/EventType' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/event-types/{code}/publish:
    post:
      tags: [EventTypes]
      summary: Publish an event type version (checker)
      operationId: publishEventType
      description: Custodian (`sr.taxonomy.publish`) publishes a DRAFT after effective-range, cadence, and correlation validation.
      parameters:
        - $ref: '#/components/parameters/EventTypeCode'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Published.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventType' }
        '409':
          description: Overlapping effective ranges (`SR_TYPE_OVERLAP`).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  # ============================== FR-02 INGESTION (WRITE-PORT) ===============
  /sr/ingest:
    post:
      tags: [Ingestion]
      summary: Canonical SR write-port — post a service event (exactly-once)
      operationId: ingestEvent
      description: >
        THE single, frozen, canonical ledger write path. Accepts the dedup tuple
        `(source_module, source_reference_id, source_event_version)` for syntactic
        dedup and `fact_key` for semantic (per-fact) dedup of qualifying-service
        events. Requires the `sr.ingest.write` scope and (statically) `Idempotency-Key`
        for exactly-once posting. Delegates to the FR-03 append engine which assigns
        the gap-free `sequence_no`, chains `entry_hash`, and obtains an RFC 3161
        timestamp token. Manual custodian ingestion uses `source_module=G12_MANUAL`
        (maker-checker).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestRequest' }
            examples:
              promotion:
                summary: Promotion with semantic fact key (G06)
                value:
                  source_module: G06
                  source_reference_id: ord-9912
                  source_event_version: 1
                  event_type_code: PROMOTION
                  employee_id: 8f3a-aa
                  event_date: '2019-06-01'
                  fact_key: 'EMP:8f3a-aa|CAT:PROMOTION|EFF:2019-06-01|POST:HEADMASTER'
                  order_no: PROM/2019/9912
                  order_date: '2019-05-20'
                  sanctioning_authority: Director of Education
                  payload:
                    from_designation: Asst. Teacher
                    to_designation: Headmaster
                    pay_scale: Level-9
                  document_ids: [doc-aa11]
                  qualifying_service_impact: QUALIFYING
      responses:
        '201':
          description: >
            Accepted — exactly one new ledger entry created (`validation_result=ACCEPTED`).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestResponse' }
        '200':
          description: >
            Idempotent / semantic no-op. Returns the original `sr_event_id` with
            `validation_result` = `DUPLICATE_NOOP` (syntactic idempotency replay) or
            `SEMANTIC_DUPLICATE_NOOP` (same real-world fact posted by another module).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestResponse' }
        '403':
          description: >
            `SR_SOURCE_NOT_ALLOWED` (403) — the `source_module` is not in the event
            type's `allowed_source_modules` allowlist; or missing `sr.ingest.write`.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                sourceNotAllowed:
                  value:
                    error:
                      code: SR_SOURCE_NOT_ALLOWED
                      message: You don't have permission to perform this action.
                      field: source_module
                      details: { reason: SOURCE_NOT_ALLOWED }
        '422':
          description: >
            Validation failure. `SR_FACT_KEY_REQUIRED` (qualifying-service event missing
            `fact_key`), `SR_PAYLOAD_INVALID` (payload fails the type JSON Schema), or
            `SR_FUTURE_DATE` (`event_date` beyond future tolerance).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                factKeyRequired:
                  value:
                    error:
                      code: SR_FACT_KEY_REQUIRED
                      message: A semantic fact_key is required for this qualifying-service event.
                      field: fact_key
                      details: { reason: FACT_KEY_REQUIRED }
        '404':
          description: >
            `SR_TYPE_NOT_FOUND` (no published event type effective for `event_date`)
            or `SR_EMPLOYEE_NOT_FOUND` (`employee_id` not in G01).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >
            `SR_DUPLICATE_EVENT` / `SR_SEMANTIC_DUPLICATE` (surfaced as no-ops on 200)
            or `SR_SEMANTIC_CONFLICT` — same `fact_key` with disagreeing facts; no entry
            created, a reconciliation task is opened and the custodian notified.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                semanticConflict:
                  value:
                    error:
                      code: SR_SEMANTIC_CONFLICT
                      message: Same fact_key with disagreeing facts; flagged for reconciliation.
                      field: fact_key
                      details: { reason: SEMANTIC_CONFLICT, conflicting_event_id: sr-0042 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/ingest/reversal:
    post:
      tags: [Ingestion]
      summary: Post a reversal / cancellation event (quashed order)
      operationId: ingestReversal
      description: >
        Reversal envelope (`is_reversal=true`, `reverses_source_reference_id`). A
        reversal referencing an existing source reference auto-spawns the
        `WF-G12-CORRIGENDUM` supersession workflow (FR-05) and returns the correction id.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReversalRequest' }
            examples:
              quash:
                summary: Major penalty quashed by tribunal (G09)
                value:
                  source_module: G09
                  reverses_source_reference_id: case-557
                  source_reference_id: case-557-quash
                  event_type_code: MAJOR_PENALTY_REVERSAL
                  employee_id: 8f3a-aa
                  event_date: '2026-05-10'
                  order_no: OA/4471/2026
                  sanctioning_authority: State Administrative Tribunal
      responses:
        '201':
          description: Reversal recorded; corrigendum workflow spawned.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReversalResponse' }
        '404':
          description: >
            `SR_REVERSAL_TARGET_NOT_FOUND` — reversal references an unknown
            `source_reference_id`.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/ingest/{ingestion_request_id}:
    get:
      tags: [Ingestion]
      summary: Get an ingestion request record
      operationId: getIngestionRequest
      parameters:
        - name: ingestion_request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Ingestion request record.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  # ============================== FR-09 TIMELINE ============================
  /sr/employees/{id}/timeline:
    get:
      tags: [Timeline]
      summary: SR timeline for an employee (chronological, filterable)
      operationId: getEmployeeTimeline
      description: >
        Paginated, chronological ledger view for one employee. Non-self access
        requires a stated `purpose` (else `SR_PURPOSE_REQUIRED`, 422). P02 applies
        field masking and data-scope; out-of-scope subjects return 404.
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: purpose
          in: query
          description: Stated purpose (required for non-self access).
          schema: { type: string }
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/EventCategory' }
        - name: from_date
          in: query
          schema: { type: string, format: date }
        - name: to_date
          in: query
          schema: { type: string, format: date }
        - name: sort
          in: query
          schema: { type: string, example: 'event_date:asc' }
      responses:
        '200':
          description: Page of ledger entries.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SrEvent' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '422':
          description: '`SR_PURPOSE_REQUIRED` — non-self access without a stated purpose.'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/events/{id}:
    get:
      tags: [Timeline]
      summary: Get a single SR ledger entry by id
      operationId: getEvent
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Ledger entry.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SrEvent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  # ============================== FR-04 INTEGRITY / ANCHORS ==================
  /sr/integrity/verify:
    post:
      tags: [Integrity]
      summary: Verify content + status hash chains
      operationId: verifyIntegrity
      description: >
        Recompute and verify the content chain and the status sub-ledger chain for
        an employee (or scope). Read-only. `sr.integrity.verify` (custodian/auditor).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegrityVerifyRequest' }
      responses:
        '200':
          description: PASS with verified counts, or FAIL with first divergence.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrityRun' }
        '422':
          description: >
            Non-suppressible FAIL. `SR_INTEGRITY_FAILED` (content chain),
            `SR_STATUS_CHAIN_FAILED` (status sub-ledger).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/integrity/verify-anchor:
    post:
      tags: [Integrity]
      summary: Verify chain heads against the external anchor
      operationId: verifyAnchor
      description: >
        Compare live chain heads to the latest `sr_anchors` Merkle root and verify
        the anchor's RFC 3161 timestamp. A head-vs-anchor mismatch (insider rewrite
        or stale restore) is a non-suppressible FAIL.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegrityVerifyRequest' }
      responses:
        '200':
          description: Anchor comparison PASS.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrityRun' }
        '422':
          description: '`SR_ANCHOR_MISMATCH` — chain head does not match the anchor (insider/stale-restore).'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                anchorMismatch:
                  value:
                    error:
                      code: SR_ANCHOR_MISMATCH
                      message: Chain head for employee does not match the latest anchor.
                      field: employee_id
                      details:
                        cause: ANCHOR_MISMATCH
                        anchor_id: an-02
                        expected_head: 9f10-ee
                        stored_head: 77aa-12
        '412':
          description: '`SR_ANCHOR_MISSING` — no current anchor within cadence.'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/integrity/runs:
    get:
      tags: [Integrity]
      summary: List integrity verification runs
      operationId: listIntegrityRuns
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: outcome
          in: query
          schema: { type: string, enum: [PASS, FAIL, PENDING] }
      responses:
        '200':
          description: Page of integrity runs.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/IntegrityRun' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/anchors:
    get:
      tags: [Integrity]
      summary: List external Merkle-root anchors (auditor)
      operationId: listAnchors
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of anchors.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Anchor' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  # ============================== FR-05 CORRECTIONS =========================
  /sr/events/{id}/corrigendum:
    post:
      tags: [Corrections]
      summary: Initiate a corrigendum (maker)
      operationId: createCorrigendum
      description: >
        Never edits/deletes the original. Creates a corrigendum that supersedes it
        (SUPERSESSION transition in the status sub-ledger). Maker-checker; routine
        corrigenda require a distinct second custodian co-sign (SoD). `sr.correction.create`.
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrigendumRequest' }
      responses:
        '201':
          description: Corrigendum created (pending checker/co-sign).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Correction' }
        '409':
          description: '`SR_ENTRY_SUPERSEDED` — target already superseded (redirects to latest ACTIVE successor).'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/corrections/{id}/approve:
    post:
      tags: [Corrections]
      summary: Approve a correction (checker)
      operationId: approveCorrection
      description: Custodian approval (`sr.correction.approve`); maker cannot self-approve.
      parameters:
        - $ref: '#/components/parameters/CorrectionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: Approved (or forwarded to co-sign).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Correction' }
        '403':
          description: 'FORBIDDEN — separation-of-duties (maker == checker).'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412':
          description: '`SR_SECOND_CUSTODIAN_REQUIRED` — routine corrigendum lacks a distinct co-signer.'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/corrections/{id}/cosign:
    post:
      tags: [Corrections]
      summary: Second-custodian co-sign of a routine corrigendum
      operationId: cosignCorrection
      description: Distinct second custodian co-sign (`sr.correction.cosign`); enforces maker ≠ checker ≠ second custodian.
      parameters:
        - $ref: '#/components/parameters/CorrectionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: Co-signed; corrigendum appended and original SUPERSEDED.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Correction' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412':
          description: '`SR_SECOND_CUSTODIAN_REQUIRED` — co-signer not distinct.'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  # ============================== FR-06 ANNOTATIONS / DISPUTES ==============
  /sr/events/{id}/dispute:
    post:
      tags: [Annotations]
      summary: Raise a dispute on an entry (employee / heir)
      operationId: disputeEvent
      description: Employee/heir objects to an ACTIVE entry; `attestation_status` → DISPUTED. `sr.dispute.create`.
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DisputeRequest' }
      responses:
        '201':
          description: Dispute raised.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Correction' }
        '409':
          description: '`SR_ENTRY_SUPERSEDED` — cannot dispute a superseded entry.'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/events/{id}/annotate:
    post:
      tags: [Annotations]
      summary: Add a custodian annotation to an entry
      operationId: annotateEvent
      description: Attaches a statutory/contextual note without changing the fact (`entry_status` → ANNOTATED). `sr.annotate`.
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnotateRequest' }
      responses:
        '201':
          description: Annotation added.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Correction' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/disputes/{id}/resolve:
    post:
      tags: [Annotations]
      summary: Resolve a dispute (uphold or corrigendum)
      operationId: resolveDispute
      description: Custodian records UPHELD or CORRIGENDUM_ISSUED and notifies the disputant. `sr.dispute.resolve`.
      parameters:
        - $ref: '#/components/parameters/DisputeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DisputeResolveRequest' }
      responses:
        '200':
          description: Dispute resolved.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Correction' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/disputes/{id}/appeal:
    post:
      tags: [Annotations, Appeals]
      summary: Escalate an upheld dispute to appeal (FR-21)
      operationId: appealDispute
      description: >
        Available only after a custodian UPHELD (else `SR_APPEAL_NOT_ELIGIBLE`).
        Opens a `WF-G12-APPEAL` case for the Appellate Authority.
      parameters:
        - $ref: '#/components/parameters/DisputeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppealRequest' }
      responses:
        '201':
          description: Appeal raised.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appeal' }
        '409':
          description: '`SR_APPEAL_NOT_ELIGIBLE` — appeal raised without a prior custodian uphold.'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  # ============================== FR-07 ATTESTATION =========================
  /sr/events/{id}/attest:
    post:
      tags: [Attestation]
      summary: Custodian attest an entry (qualified signature)
      operationId: attestEvent
      description: >
        Records a qualified PKI signature + RFC 3161 timestamp and an ATTESTED status
        transition. Server-signing is rejected for statutory attestation. `sr.attest`.
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttestRequest' }
      responses:
        '201':
          description: Attested.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attestation' }
        '409':
          description: '`SR_ENTRY_DISPUTED` — attest blocked by an open dispute.'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >
            `SR_SIGNATURE_NOT_QUALIFIED` (server-signed rejected) or
            `ERR-G12-SIGNATURE-INVALID` (qualified signature fails validation).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/attestations/batch:
    post:
      tags: [Attestation]
      summary: Batch-attest multiple entries
      operationId: batchAttest
      description: Processes each entry to a discrete `sr_attestations` row with a qualified signature.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchAttestRequest' }
      responses:
        '200':
          description: Batch outcome with per-entry results.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchAttestResult' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  # ============================== FR-08 VERIFICATION ========================
  /sr/verification-cycles:
    get:
      tags: [Verification]
      summary: List / get verification cycles
      operationId: listVerificationCycles
      parameters:
        - name: employee_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of verification cycles.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/VerificationCycle' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/verification-cycles/{id}/bulk-confirm:
    post:
      tags: [Verification]
      summary: Bulk-confirm routine entries with exceptions
      operationId: bulkConfirmCycle
      parameters:
        - $ref: '#/components/parameters/CycleId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkConfirmRequest' }
      responses:
        '200':
          description: Bulk confirmation recorded.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationCycle' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/verification-cycles/{id}/confirm:
    post:
      tags: [Verification]
      summary: Confirm a verification cycle (self)
      operationId: confirmCycle
      parameters:
        - $ref: '#/components/parameters/CycleId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmRequest' }
      responses:
        '200':
          description: Confirmation recorded.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationCycle' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/verification-cycles/{id}/assisted-confirm:
    post:
      tags: [Verification]
      summary: Assisted confirmation (operator on behalf, with consent)
      operationId: assistedConfirmCycle
      parameters:
        - $ref: '#/components/parameters/CycleId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistedConfirmRequest' }
      responses:
        '200':
          description: Assisted confirmation recorded.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationCycle' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/verification-cycles/{id}/heir-confirm:
    post:
      tags: [Verification]
      summary: Nominee / legal-heir confirmation (DEATH_IN_SERVICE)
      operationId: heirConfirmCycle
      parameters:
        - $ref: '#/components/parameters/CycleId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HeirConfirmRequest' }
      responses:
        '200':
          description: Heir confirmation recorded.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationCycle' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/verification-cycles/{id}/finalise:
    post:
      tags: [Verification]
      summary: Finalise a verification cycle (custodian)
      operationId: finaliseCycle
      description: Custodian finalises the cycle. A CRITICAL unresolved gap blocks pre-retirement finalisation (`SR_GAP_UNRESOLVED`).
      parameters:
        - $ref: '#/components/parameters/CycleId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Cycle finalised.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationCycle' }
        '412':
          description: '`SR_GAP_UNRESOLVED` — CRITICAL completeness gap blocks finalisation.'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  # ============================== FR-10 EXTRACTS + FR-18 §65B ===============
  /sr/employees/{id}/extracts:
    post:
      tags: [Extracts]
      summary: Generate a certified true copy (purpose-driven redaction)
      operationId: createExtract
      description: >
        Issues a certified extract with qualified signing and purpose-driven redaction.
        FULL_SR extracts require a distinct second-custodian co-sign
        (`SR_SECOND_CUSTODIAN_REQUIRED`). A live dispute/appeal renders on the extract.
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExtractRequest' }
      responses:
        '201':
          description: Extract created (may await co-sign for FULL_SR).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Extract' }
        '412':
          description: >
            `SR_SECOND_CUSTODIAN_REQUIRED` (FULL_SR needs a co-signer) or
            `SR_REDACTION_REQUIRED` (requested scope exceeds redaction entitlement).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/extracts/{id}/cosign:
    post:
      tags: [Extracts]
      summary: Second-custodian co-sign a FULL_SR extract
      operationId: cosignExtract
      parameters:
        - $ref: '#/components/parameters/ExtractId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Extract co-signed and issued.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Extract' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/extracts/{id}/revoke:
    post:
      tags: [Extracts]
      summary: Revoke a certified extract
      operationId: revokeExtract
      parameters:
        - $ref: '#/components/parameters/ExtractId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Extract revoked; revocation feed updated.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Extract' }
        '409':
          description: '`SR_EXTRACT_REVOKED` — already revoked.'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/extracts/{id}:
    get:
      tags: [Extracts]
      summary: Get a certified extract
      operationId: getExtract
      parameters:
        - $ref: '#/components/parameters/ExtractId'
      responses:
        '200':
          description: Extract.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Extract' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/extracts/{id}/authenticity-certificate:
    post:
      tags: [Extracts]
      summary: Generate a §65B / BSA certificate-of-authenticity (FR-18)
      operationId: generateAuthenticityCertificate
      description: >
        Machine-generated electronic-record authenticity certificate citing the
        content digest, anchor reference, signer, and chain-of-custody.
      parameters:
        - $ref: '#/components/parameters/ExtractId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Certificate generated.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticityCertificate' }
        '412':
          description: '`SR_ANCHOR_MISSING` — no current anchor to cite.'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/authenticity-certificates/{id}:
    get:
      tags: [Extracts]
      summary: Get a §65B authenticity certificate
      operationId: getAuthenticityCertificate
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Certificate.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticityCertificate' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  # ============================== FR-11 OFFLINE / QR VERIFY =================
  /sr/verify/{qr_verification_token}:
    get:
      tags: [ExtractVerification]
      summary: Public online verification of a certified extract
      operationId: verifyExtractPublic
      description: >
        Lightweight public verification (online convenience). The offline bundle in
        the PDF is self-contained and verifiable against the published CA chain and
        embedded anchor reference without calling this endpoint.
      security: []
      parameters:
        - name: qr_verification_token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Verification status.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicVerification' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/revocation-feed:
    get:
      tags: [ExtractVerification]
