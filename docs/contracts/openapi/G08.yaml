openapi: 3.1.0
info:
  title: Government HRMS G08 — Performance Appraisal Management
  version: 3.0.0
  description: 'OpenAPI 3.1 contract for module G08 (Performance Appraisal Management), a public-sector statutory-APAR extension
    of the PrimeSoft M09 Performance model. Covers appraisal cycles, goal/KRA plans + check-ins, self-appraisal, the multi-tier
    APAR workflow (Reporting -> Reviewing -> Accepting, run on P01), ratings, calibration, representation, disclosure/custody
    ledger, 360/MSF, PIP, probation confirmation, sealed cover and digital signature. Conventions per PLATFORM_FOUNDATION.md
    §4: cursor pagination, Idempotency-Key on state-changing POSTs, X-Correlation-Id response header, canonical error envelope
    with the 8-code standard table; ERR-G08-* annotated on responses. APAR_FINAL_GRADE / PROBATION_CONFIRMED post to the canonical
    G12 write-port POST /sr/ingest (event_category APPRAISAL, no fact_key).'
servers:
- url: /api/v1
security:
- bearerAuth: []
tags:
- name: Cycles
  description: FR-G08-01 appraisal cycle configuration (extends M09 review/goal cycles)
- name: Templates
  description: FR-G08-01 APAR templates as W.2 form definitions
- name: RatingScales
  description: FR-G08-07 rating scales & weightage-policy grade roll-up
- name: Goals
  description: FR-G08-02 goal/KRA/OKR plans, check-ins, snapshot-on-lock
- name: SelfAppraisal
  description: FR-G08-03 self-appraisal (M09 self review)
- name: AssessmentReporting
  description: FR-G08-04 Reporting-tier (RO) multi-RO part-period assessment
- name: AssessmentReviewing
  description: FR-G08-05 Reviewing-tier (RvO) assessment + COI recusal
- name: AssessmentAccepting
  description: FR-G08-06 Accepting-tier (AA) certification
- name: Disclosure
  description: FR-G08-08 mandatory full disclosure & disclosure log
- name: Representations
  description: FR-G08-08 representation against adverse remarks + escalation ladder
- name: Calibration
  description: FR-G08-09 calibration recommendations/sessions (ratified, absolute grading)
- name: Feedback
  description: FR-G08-10 continuous feedback & check-ins
- name: Feedback360
  description: FR-G08-11 360/MSF nominations & responses
- name: Competencies
  description: FR-G08-12 competency assessment + G07 training nomination
- name: PIP
  description: FR-G08-13 Performance Improvement Plans + milestones
- name: Finalisation
  description: FR-G08-14 finalise + post final grade to G12 SR
- name: Forms
  description: FR-G08-15 APAR form read (P02 field-masked) & PDF
- name: Custody
  description: FR-G08-15 custody, tamper-evidence, heir access, retention, dual-control
- name: Analytics
  description: FR-G08-16 distribution/skew/completion/gap/bias-disparity
- name: SealedCover
  description: FR-G08-17 Sealed Cover Procedure (G09-driven)
- name: ReportPeriods
  description: FR-G08-18 multi-RO part-period reports + No-Report Certificate
- name: Escalation
  description: FR-G08-19 SLA auto-escalation / authoring-right transfer
- name: Signatures
  description: FR-G08-20 DSC/eSign non-repudiation
- name: Probation
  description: FR-G08-21 probation confirmation appraisal
- name: Errata
  description: FR-G08-22 controlled cycle errata correction
- name: ServiceRegister
  description: 'Reference: canonical G12 SR write-port (POST /sr/ingest)'
paths:
  /g08/cycles:
    post:
      tags:
      - Cycles
      operationId: createCycle
      summary: Create an appraisal cycle
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppraisalCycleCreate'
      responses:
        '201':
          description: Created
          headers:
            X-Correlation-Id: &id001
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppraisalCycle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
      - Cycles
      operationId: listCycles
      summary: List appraisal cycles
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/sort'
      - name: type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CycleType'
        description: Filter by cycle type (e.g. PROBATION)
      - name: status
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          headers:
            X-Correlation-Id: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppraisalCyclePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /g08/cycles/{cycleId}:
    put:
