openapi: 3.1.0
info:
  title: P01 Workflow Facade API
  version: 0.1.0
  description: >
    PH-00B contract for the HRMS/P01 workflow facade. The surface is HRMS-shaped
    and is backed in PH-00B by a thin PUDA adapter at pinned commit
    cadf39739e6f27c17d44767ca61d1a362034ac64. PUDA queue keys, LAC actions,
    and raw service-version semantics are adapter internals.
  contact:
    name: HRMS Platform Architecture
  license:
    name: Proprietary - Government HRMS Programme

servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: Workflow Instances
    description: Start, advance, decide, cancel, and inspect workflow instances.
  - name: Workflow Tasks
    description: Task inbox, send-back, query, and delegation operations.
  - name: Workflow Waits
    description: Wait/timer/reference satisfaction hooks.
  - name: Workflow References
    description: Department reference fan-out operations.

paths:
  /workflow/instances:
    post:
      tags: [Workflow Instances]
      operationId: startWorkflowInstance
      summary: Start a workflow instance.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartInstanceRequest"
      responses:
        "201":
          description: Workflow instance started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartInstanceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /workflow/instances/{instance_id}/advance:
    post:
      tags: [Workflow Instances]
      operationId: advanceWorkflowInstance
      summary: Advance an instance by transition id.
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowTransitionRequest"
      responses:
        "200":
          $ref: "#/components/responses/WorkflowActionOk"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /workflow/instances/{instance_id}/approve:
    post:
      tags: [Workflow Instances]
      operationId: approveWorkflowInstance
      summary: Approve the current stage.
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowTransitionRequest"
      responses:
        "200":
          $ref: "#/components/responses/WorkflowActionOk"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /workflow/instances/{instance_id}/reject:
    post:
      tags: [Workflow Instances]
      operationId: rejectWorkflowInstance
      summary: Reject the current stage.
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowTransitionRequest"
      responses:
        "200":
          $ref: "#/components/responses/WorkflowActionOk"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /workflow/instances/{instance_id}/cancel:
    post:
      tags: [Workflow Instances]
      operationId: cancelWorkflowInstance
      summary: Cancel or recall an in-flight instance.
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowTransitionRequest"
      responses:
        "200":
          $ref: "#/components/responses/WorkflowActionOk"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /workflow/instances/{instance_id}/query:
    post:
      tags: [Workflow Tasks]
      operationId: queryWorkflowTask
      summary: Raise a query or correction request on a workflow task.
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskActionRequest"
      responses:
        "200":
          $ref: "#/components/responses/WorkflowActionOk"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /workflow/instances/{instance_id}/send-back:
    post:
      tags: [Workflow Tasks]
      operationId: sendBackWorkflowTask
      summary: Send a task or instance back to a previous stage.
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskActionRequest"
      responses:
        "200":
          $ref: "#/components/responses/WorkflowActionOk"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /workflow/instances/{instance_id}/delegate:
    post:
      tags: [Workflow Tasks]
      operationId: delegateWorkflowTask
      summary: Delegate or reassign a workflow task.
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DelegateRequest"
      responses:
        "200":
          description: Task delegated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegateResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /workflow/instances/{instance_id}:
    get:
      tags: [Workflow Instances]
      operationId: getWorkflowInstance
      summary: Return normalized instance status.
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Workflow instance status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstance"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /workflow/tasks:
    get:
      tags: [Workflow Tasks]
      operationId: listWorkflowTasks
      summary: Return workflow tasks visible to the actor.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: status
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Task list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /workflow/waits/{wait_id}/satisfy:
    post:
      tags: [Workflow Waits]
      operationId: satisfyWorkflowWait
      summary: Resume a waiting workflow branch or instance.
      parameters:
        - $ref: "#/components/parameters/WaitId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitSatisfyRequest"
      responses:
        "200":
          $ref: "#/components/responses/WorkflowActionOk"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /workflow/references:
    post:
      tags: [Workflow References]
      operationId: createWorkflowReference
      summary: Create department references from a workflow task.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceRequest"
      responses:
        "201":
          description: References created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
      description: Required for state-changing calls.
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
      description: Echoed in response and logs.
    InstanceId:
      name: instance_id
      in: path
      required: true
      schema:
        type: string
    WaitId:
      name: wait_id
      in: path
      required: true
      schema:
        type: string

  responses:
    WorkflowActionOk:
      description: Workflow action accepted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WorkflowActionResponse"
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Actor is not authorized for the action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Instance or task not found within caller scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Duplicate, stale state, or version conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unprocessable:
      description: Guard, payload, form, or transition validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    Actor:
      type: object
      required: [user_id, actor_type, tenant_id]
      properties:
        user_id:
          type: string
        actor_type:
          type: string
          enum: [CITIZEN, OFFICER, ADMIN, SYSTEM]
        tenant_id:
          type: string
        entity_id:
          type: string
        roles:
          type: array
          items:
            type: string

    SubjectRef:
      type: object
      required: [type]
      properties:
        type:
          type: string
        id:
          type: string
        arn:
          type: string

    StartInstanceRequest:
      type: object
      required: [workflow_code, subject_ref, initiator]
      properties:
        workflow_code:
          type: string
        subject_ref:
          $ref: "#/components/schemas/SubjectRef"
        context:
          type: object
          additionalProperties: true
        initiator:
          $ref: "#/components/schemas/Actor"
        authority_id:
          type: string
          description: Adapter-only PUDA authority id until PH-01 tenant mapping is implemented.
        applicant_user_id:
          type: string
        submission_channel:
          type: string
        assisted_by_user_id:
          type: string

    StartInstanceResponse:
      type: object
      required: [instance_id]
      properties:
        instance_id:
          type: string
        first_stage:
          type: string
        assignees:
          type: array
          items:
            $ref: "#/components/schemas/ResolvedAssignee"
        definition_version:
          type: string

    WorkflowTransitionRequest:
      type: object
      required: [transition_id, actor]
      properties:
        transition_id:
          type: string
        actor:
          $ref: "#/components/schemas/Actor"
        current_task_id:
          type: string
        remarks:
          type: string
        payload:
          type: object
          additionalProperties: true

    TaskActionRequest:
      type: object
      required: [task_id, action_id, actor]
      properties:
        task_id:
          type: string
        action_id:
          type: string
        actor:
          $ref: "#/components/schemas/Actor"
        remarks:
          type: string
        query_message:
          type: string
        unlocked_fields:
          type: array
          items:
            type: string
        unlocked_documents:
          type: array
          items:
            type: string
        payload:
          type: object
          additionalProperties: true

    DelegateRequest:
      type: object
      required: [task_id, target_user_id, actor, reason]
      properties:
        task_id:
          type: string
        target_user_id:
          type: string
        actor:
          $ref: "#/components/schemas/Actor"
        reason:
          type: string

    DelegateResponse:
      type: object
      required: [task_id]
      properties:
        task_id:
          type: string

    WaitSatisfyRequest:
      type: object
      required: [actor]
      properties:
        actor:
          $ref: "#/components/schemas/Actor"
        event_key:
          type: string
        remarks:
          type: string
        payload:
          type: object
          additionalProperties: true

    ReferenceRequest:
      type: object
      required: [source_task_id, actor, target_org_unit_ids, remarks]
      properties:
        source_task_id:
          type: string
        actor:
          $ref: "#/components/schemas/Actor"
        target_org_unit_ids:
          type: array
          minItems: 1
          items:
            type: string
        remarks:
          type: string

    ReferenceResponse:
      type: object
      required: [reference_count]
      properties:
        reference_count:
          type: integer
          minimum: 0

    WorkflowActionResponse:
      type: object
      required: [instance_id]
      properties:
        instance_id:
          type: string
        new_state_id:
          type: string
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowTask"

    WorkflowInstance:
      type: object
      required: [instance_id, state_id, status]
      properties:
        instance_id:
          type: string
        workflow_code:
          type: string
        subject_ref:
          $ref: "#/components/schemas/SubjectRef"
        state_id:
          type: string
        status:
          type: string
          enum: [DRAFT, IN_PROGRESS, WAITING, COMPLETED, REJECTED, CANCELLED]
        definition_version:
          type: string
        current_tasks:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowTask"

    WorkflowTask:
      type: object
      required: [task_id, instance_id, status]
      properties:
        task_id:
          type: string
        instance_id:
          type: string
        stage_id:
          type: string
        status:
          type: string
        assigned_user_id:
          type: string
        assigned_role:
          type: string
        due_at:
          type: string
          format: date-time
        actions:
          type: array
          items:
            type: string

    TaskListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowTask"
        next_cursor:
          type: string

    ResolvedAssignee:
      type: object
      required: [resolver_type]
      properties:
        resolver_type:
          type: string
          enum: [NAMED_ROLE, REPORTING_CHAIN, STATUTORY_AUTHORITY, NAMED_INDIVIDUAL, COST_CENTRE_HEAD, QUEUE]
        user_id:
          type: string
        role:
          type: string
        org_unit_id:
          type: string
        evidence_ref:
          type: string

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - ERR-WF-INVALID-CODE
                - ERR-WF-FORBIDDEN
                - ERR-WF-DUPLICATE
                - ERR-WF-CONFLICT
                - ERR-WF-VALIDATION
                - ERR-WF-NOT-FOUND
                - ERR-SYSTEM
            message:
              type: string
            field:
              type: string
            details:
              type: object
              additionalProperties: true
