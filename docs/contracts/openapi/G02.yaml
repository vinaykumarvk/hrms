openapi: 3.1.0
info:
  title: Government HRMS — G02 Personal Details Modification Workflow API
  version: 3.0.0
  description: >
    OpenAPI 3.1 contract for module G02-EPDM (Personal Details Modification
    Workflow), the governed change-control configuration in front of the G01/M01
    employee master. All approval routing runs on the PrimeSoft P01 WorkflowEngine
    (change-request as subject_ref); all authorization on P02 Authorization.check;
    all audit on P05. G02 is NOT a Digital-SR writer: on commit of a STATUTORY
    change, G01 (the master/identity owner, source_module=G01) posts the SR event
    to G12 and G02 only reads/reconciles the posting status. Conventions are the
    platform Foundation §1 set: /api/v1 base, bearer JWT, Idempotency-Key on
    state-changing POSTs (24h replay), X-Correlation-Id response header, cursor
    pagination (limit default 25 / max 100, next_cursor), canonical error envelope.
  contact:
    name: Government HRMS — API Architecture / Platform Foundation
  x-ph07-employee-wave:
    implementedRoutes:
      - POST /api/v1/personal-details/change-requests
      - POST /api/v1/personal-details/change-requests/{id}:approve
      - POST /api/v1/personal-details/change-requests/{id}:commit
      - POST /api/v1/personal-details/change-requests/{id}:reverse
    srOwner: G01
    workflow: WF-G02-PERSONAL-DETAILS
servers:
  - url: /api/v1
    description: Platform API v1 (all endpoints; P02-enforced)
security:
  - bearerAuth: []
tags:
  - name: change-requests
    description: Change-request authoring, submission and lifecycle (FR-G02-001/006)
  - name: routing
    description: Sensitivity-based P01 route preview (FR-G02-002)
  - name: documents
    description: Supporting-document & authority-portal verification (FR-G02-003)
  - name: approvals
    description: Maker-checker P01 decisions and queue (FR-G02-004)
  - name: diff
    description: Field-level before/after diff (FR-G02-005)
  - name: sla
    description: SLA tracking timeline (FR-G02-007)
  - name: effective-dating
    description: Correction/update, effective-date rules, DOB hard-block (FR-G02-008)
  - name: bulk-corrections
    description: HR-initiated bulk corrections (FR-G02-009)
  - name: commit
    description: Effective-dated commit status to G01/M01 (FR-G02-010)
  - name: service-register
    description: G01->G12 SR posting-status tracking (read/reconcile only) (FR-G02-011)
  - name: admin-config
    description: Approval-flow, sensitivity, e-sign-policy & regex config (FR-G02-012)
  - name: delegations
    description: Delegation of approval authority via P01 delegate (FR-G02-013)
  - name: templates
    description: Change-request templates bound to W.2 forms (FR-G02-014)
  - name: esignatures
    description: Strong e-signature on high-sensitivity approvals (FR-G02-015)
  - name: history-reports
    description: Provenance, field history, tamper-evident audit & reports (FR-G02-016)
  - name: notices
    description: Data-subject notification & confirmation/objection window (FR-G02-017)
  - name: status-gate
    description: Employment-status gating & elevated paths (FR-G02-018)
  - name: fraud
    description: Fraud, velocity & anomaly signals and review (FR-G02-019)
  - name: reversals
    description: Emergency break-glass reversal, dual authority (FR-G02-020)
  - name: objections
    description: Data-subject grievance & objection (FR-G02-021)
  - name: retro-events
    description: Downstream retro-impact reconciliation G10/G11/G06 (FR-G02-022)
  - name: step-up
    description: Requester step-up authentication for sensitive self-service (FR-G02-023)
  - name: employees
    description: Read-only employee-scoped helpers (editable fields, status gate)

paths:
  # -------------------------------------------------------------------------
  # FR-G02-001 / 006 / 014 — Change request authoring & lifecycle
  # -------------------------------------------------------------------------
  /change-requests:
    post:
      tags: [change-requests]
      summary: Create a draft change request (optionally from a template)
      description: >
        FR-G02-001 / FR-G02-014. Creates a DRAFT change request with per-field
        before/after items (composite name supported via parent/child items,
        explicit clear-intent). Governed fields only; non-governed field -> 403.
        Use fromTemplate to seed from a W.2 template (P02-filtered).
      operationId: createChangeRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: fromTemplate
          in: query
          required: false
          description: Template id to seed the draft from (FR-G02-014).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChangeRequest'
      responses:
        '201':
          description: Draft created (or PENDING_DOCS after seeding). X-Correlation-Id in header.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /change-requests/{id}:
    parameters:
      - $ref: '#/components/parameters/ChangeRequestId'
    get:
      tags: [change-requests]
      summary: Get a change request with full diff for review
      description: FR-G02-004. Returns the request header, items and P02-masked diff.
      operationId: getChangeRequest
      responses:
        '200':
          description: Change request detail.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    patch:
      tags: [change-requests]
      summary: Edit draft items
      description: FR-G02-001. Edits items of a DRAFT/RETURNED request (before submit).
      operationId: editChangeRequestDraft
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditChangeRequest'
      responses:
        '200':
          description: Draft updated.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
  /change-requests/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/ChangeRequestId'
    post:
      tags: [change-requests]
      summary: Validate and submit a change request (P01 startInstance)
      description: >
        FR-G02-001 / FR-G02-002. Validates, applies status gate (FR-018) and
        step-up gate (FR-023), snapshots master + hash, derives sensitivity, runs
        fraud eval (FR-019), and starts the P01 workflow instance. May return 412
        for missing step-up (ERR-G02-STEPUP) / hard-block (ERR-G02-HARDBLOCK) /
        risk-block (ERR-G02-RISKBLOCK), 403 for status gate (ERR-G02-STATUSGATE),
        or 409 for duplicate workflow start (ERR-DUP-INSTANCE).
      operationId: submitChangeRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Submitted; workflow instance started.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /change-requests/{id}/withdraw:
    parameters:
      - $ref: '#/components/parameters/ChangeRequestId'
    post:
      tags: [change-requests]
      summary: Withdraw (recall) a non-terminal request (P01 cancel)
      description: FR-G02-006. Requester cancels a non-terminal request; stops SLA timers.
      operationId: withdrawChangeRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentBody'
      responses:
        '200':
          description: Request withdrawn.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
  /change-requests/{id}/resubmit:
    parameters:
      - $ref: '#/components/parameters/ChangeRequestId'
    post:
      tags: [change-requests]
      summary: Resubmit after correction (P01 re-trigger)
      description: FR-G02-006. Re-validates and re-derives route for a RETURNED request.
      operationId: resubmitChangeRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Resubmitted; affected stages re-triggered.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'

  # -------------------------------------------------------------------------
  # FR-G02-002 — Route preview
  # -------------------------------------------------------------------------
  /change-requests/{id}/route-preview:
    parameters:
      - $ref: '#/components/parameters/ChangeRequestId'
    post:
      tags: [routing]
      summary: Preview the computed P01 route (no persist)
      description: >
        FR-G02-002. Computes the ordered P01 stage chain (roles, order, SLA,
        parallel groups, fraud/elevated injection) for the request without
        persisting. Missing matrix with no fallback -> 500.
      operationId: previewRoute
      responses:
        '200':
          description: Computed route preview.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  changeRequestId:
                    type: string
                  highestSensitivity:
                    $ref: '#/components/schemas/SensitivityClass'
                  riskBand:
                    $ref: '#/components/schemas/RiskBand'
                  routePreview:
                    type: array
                    items:
                      $ref: '#/components/schemas/RouteStage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  # -------------------------------------------------------------------------
  # FR-G02-003 — Documents & authority-portal verification
  # -------------------------------------------------------------------------
  /change-requests/{id}/documents:
    parameters:
      - $ref: '#/components/parameters/ChangeRequestId'
    get:
      tags: [documents]
      summary: List supporting documents with status (cursor)
      operationId: listChangeRequestDocuments
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paged list of linked documents.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChangeRequestDocument'
                  limit:
                    type: integer
                  next_cursor:
                    type: [string, 'null']
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [documents]
      summary: Link an uploaded G13 document to the request/item
      description: FR-G02-003. Creates a change_request_documents link; mirrors G13 scan status.
      operationId: linkChangeRequestDocument
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkDocument'
      responses:
        '201':
          description: Document linked (scan_status PENDING).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestDocument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
  /change-requests/{id}/documents/{docId}/verify:
    parameters:
      - $ref: '#/components/parameters/ChangeRequestId'
      - $ref: '#/components/parameters/DocId'
    patch:
      tags: [documents]
      summary: Verify or reject a supporting document
      description: FR-G02-003. HR/authority marks a document VERIFIED/REJECTED with reason (P05-captured).
      operationId: verifyChangeRequestDocument
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentVerifyBody'
      responses:
        '200':
          description: Verification status updated.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestDocument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
  /change-requests/{id}/documents/{docId}/authority-verify:
    parameters:
      - $ref: '#/components/parameters/ChangeRequestId'
      - $ref: '#/components/parameters/DocId'
    post:
      tags: [documents]
      summary: Trigger/record authority-portal verification (X.3)
      description: >
        FR-G02-003. Runs UIDAI/PAN/caste-portal verification via X.3 and records
        authority_portal_ref + authority_verification_status. Portal unavailable ->
        412 (ERR-G02-AUTHPORTAL at approval time if not VERIFIED).
      operationId: authorityVerifyDocument
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorityVerifyBody'
      responses:
        '200':
          description: Authority-portal verification result recorded.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestDocument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'

  # -------------------------------------------------------------------------
  # FR-G02-004 / 015 — Approvals & e-signature
  # -------------------------------------------------------------------------
  /approvals/queue:
    get:
      tags: [approvals]
      summary: My pending P01 approval actions (cursor)
      description: FR-G02-004. Returns P01 actions assigned to the caller's role/scope or valid delegation.
      operationId: listApprovalQueue
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            example: sla_due_at:asc
      responses:
        '200':
          description: Paged approval queue.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApprovalQueueItem'
                  limit:
                    type: integer
                  next_cursor:
                    type: [string, 'null']
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /change-requests/{id}/approvals/{nodeId}/decide:
    parameters:
      - $ref: '#/components/parameters/ChangeRequestId'
      - $ref: '#/components/parameters/NodeId'
    post:
      tags: [approvals]
      summary: Decide a P01 stage (approve / reject / sendBack)
      description: >
        FR-G02-004. Idempotent P01 decision. SoD enforced by P02 (maker/target
        cannot approve; delegate must hold required_role -> else 403 ERR-G02-SOD).
        STATUTORY/FINANCIAL-HIGH stages require valid strong e-signature (412
        ERR-G02-ESIGN / 422 ERR-G02-ESIGN-METHOD). Reject/sendBack require a comment.
      operationId: decideApproval
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecision'
      responses:
        '200':
          description: Decision recorded; route recomputed.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestApproval'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
  /change-requests/{id}/approvals/{nodeId}/esign:
    parameters:
      - $ref: '#/components/parameters/ChangeRequestId'
      - $ref: '#/components/parameters/NodeId'
    post:
      tags: [esignatures]
      summary: Capture a strong e-signature for a sensitive stage (X.3)
      description: >
        FR-G02-015. Captures a cryptographically attributable e-signature bound to
        the exact P01 decision payload hash. FINANCIAL/STATUTORY require PKI/DSC or
        Aadhaar e-Sign; weak method -> 422 ERR-G02-ESIGN-METHOD. Provider down -> 412.
      operationId: captureEsignature
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EsignCapture'
      responses:
        '201':
          description: E-signature captured and hash-chained.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Esignature'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
  /change-requests/{id}/esignatures:
    parameters:
      - $ref: '#/components/parameters/ChangeRequestId'
    get:
      tags: [esignatures]
      summary: List captured e-signatures for a request (cursor)
      operationId: listEsignatures
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paged e-signature list.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Esignature'
                  limit:
                    type: integer
                  next_cursor:
                    type: [string, 'null']
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  # -------------------------------------------------------------------------
  # FR-G02-005 — Diff
  # -------------------------------------------------------------------------
  /change-requests/{id}/diff:
    parameters:
      - $ref: '#/components/parameters/ChangeRequestId'
    get:
      tags: [diff]
      summary: P02-aware before/after diff payload
      description: FR-G02-005. Returns per-item diff with field_mask applied on serialization (P02).
      operationId: getChangeRequestDiff
      responses:
        '200':
          description: Field-level diff.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  changeRequestId:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DiffItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  # -------------------------------------------------------------------------
  # FR-G02-007 — SLA
  # -------------------------------------------------------------------------
  /change-requests/{id}/sla:
    parameters:
      - $ref: '#/components/parameters/ChangeRequestId'
    get:
      tags: [sla]
      summary: SLA timeline for a request
      description: FR-G02-007. Milestones, reminders, breaches and escalations (P01 SLA runtime mirror).
      operationId: getChangeRequestSla
      responses:
        '200':
          description: SLA timeline.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  changeRequestId:
                    type: string
                  slaDueAt:
                    type: [string, 'null']
                    format: date-time
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/SlaEvent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  # -------------------------------------------------------------------------
  # FR-G02-008 — Effective-date rules & DOB hard-block
  # -------------------------------------------------------------------------
  /change-requests/effective-date-rules:
    get:
      tags: [effective-dating]
      summary: Allowed effective-date range for a field & change type
