  # ---------------------------------------------------------------------------
  /correction-events:
    post:
      tags: [Corrections]
      operationId: createCorrectionEvent
      summary: Create a correction event (maker; P01).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
