      responses:
        '200':
          description: Masked, alias-resolved employee.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Employee' } } }
        '401': { $ref: '#/components/responses/Unauthenticated401' }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '404': { $ref: '#/components/responses/NotFound404' }
        '500': { $ref: '#/components/responses/Internal500' }

  /employees/{id}:commit:
    patch:
      tags: [employees]
      summary: Commit an approved G02 edit (effective-dated write) (FR-EPM-001, §8.4)
      description: Applies an approved G02 change; performs the effective-dated write and posts the resulting SR event. Requires If-Match / row_version.
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - { name: If-Match, in: header, required: false, description: etag derived from row_version (optimistic lock)., schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                changes: { type: object, additionalProperties: true }
                effective_from: { type: [string, "null"], format: date }
                row_version: { type: integer }
      responses:
        '200':
          description: Committed employee.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Employee' } } }
        '401': { $ref: '#/components/responses/Unauthenticated401' }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '404': { $ref: '#/components/responses/NotFound404' }
        '409': { $ref: '#/components/responses/Conflict409' }
        '412': { $ref: '#/components/responses/PreconditionFailed412' }
        '422': { $ref: '#/components/responses/Validation422' }
        '500': { $ref: '#/components/responses/Internal500' }

  /employees:batch:
    post:
      tags: [consumption]
      summary: Batch-fetch employees by ids (alias-resolved) (FR-EPM-019)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: string, format: uuid }, maxItems: 100 }
      responses:
        '200':
          description: Masked, alias-resolved employees.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Employee' } }
        '401': { $ref: '#/components/responses/Unauthenticated401' }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '422': { $ref: '#/components/responses/Validation422' }
        '500': { $ref: '#/components/responses/Internal500' }

  /employees/changes:
