# =============================================================================
# Government HRMS — Consolidated Machine-Readable Error Taxonomy
# =============================================================================
# Status:  Authoritative contract. Single registry of every error code the
#          14-module government HRMS may return on the wire.
# Grounds: PLATFORM_FOUNDATION.md §4 (canonical envelope, 8 standard HTTP codes,
#          shared ERR-* messages) + module error catalogs in docs/brd/v3/G01..G14.
# Rule:    A new code MUST be registered here BEFORE it is emitted. Every code
#          maps to exactly ONE of the 8 platform HTTP statuses. No non-platform
#          codes (no 400 / VALIDATION_ERROR, no 503 — 503 collapses to 412 or
#          500 per X.3 retry mapping).
# =============================================================================

version: "1.0"
owner: "API Architecture / Platform Foundation"
source_of_truth:
  platform: "docs/brd/PLATFORM_FOUNDATION.md §4"
  modules: "docs/brd/v3/G01..G14 (module error-code catalogs)"

# -----------------------------------------------------------------------------
# 1. CANONICAL ERROR ENVELOPE
# -----------------------------------------------------------------------------
envelope:
  description: >
    2xx responses return the resource payload. Every 4xx/5xx response returns
    this envelope and nothing else. The correlation id is carried in the
    X-Correlation-Id RESPONSE HEADER, never as a body field.
  shape:
    error:
      code: "string  # one of standard_codes.code (wire status code) OR a module/domain code carried in this field"
      message: "string  # human-readable; resolved from a MSG-*/ERR-* message id, never inlined ad-hoc"
      field: "string|null  # offending field for validation errors"
      details: "object|null  # structured discriminators, e.g. { reason: <REASON>, ... }"
  example:
    error:
      code: "VALIDATION_FAILED"
      message: "The selected date is outside the allowed window."
      field: "effective_from"
      details:
        reason: "PAST_DATED"
  headers:
    request:
      X-Correlation-Id: "optional inbound; assigned if absent"
      Authorization: "Bearer <JWT> carrying resolved roles + tenant/entity scope"
      Idempotency-Key: "required on unsafe/workflow-initiating POSTs; 24h replay window"
    response:
      X-Correlation-Id: "echoed on every response; written to every audit + log line for the request"
  conventions:
    correlation_id: "X-Correlation-Id echoed and audited (Foundation §1)"
    scope_safety: "403/404 never leak existence of out-of-scope records (P02)"
    pagination_bound: "list endpoints: ?limit= (default 25, max 100) + cursor; response next_cursor"

# -----------------------------------------------------------------------------
# 2. STANDARD CODES — the 8 platform HTTP status codes (Foundation §4.2)
#    Every code in this taxonomy resolves to exactly one of these wire statuses.
# -----------------------------------------------------------------------------
standard_codes:
  - code: VALIDATION_FAILED
    http: 422
    meaning: "Input failed a VAL-* rule or catalog validation."
    user_message_template: "{field} is invalid: {reason}. Correct it and try again."
    typical_triggers:
      - "field format / checksum / range failure"
      - "missing required field or reason"
      - "schema / weightage / date-consistency violation"

  - code: UNAUTHENTICATED
    http: 401
    meaning: "No, invalid, expired, or revoked session/token."
    user_message_template: "Your session is not valid. Sign in again to continue."
    typical_triggers:
      - "absent/expired Bearer token"
      - "revoked or out-of-scope embed token"

  - code: FORBIDDEN
    http: 403
    meaning: "Authenticated but not permitted. Never leaks existence of out-of-scope records."
    user_message_template: "You don't have permission to perform this action."
    typical_triggers:
      - "role/scope/field-mask denial (P02)"
      - "separation-of-duties (maker == checker, self-approval)"
      - "PII ceiling / clearance / classification block"

  - code: NOT_FOUND
    http: 404
    meaning: "Resource absent or out of the caller's scope."
    user_message_template: "We couldn't find what you were looking for."
    typical_triggers:
      - "unknown id"
      - "record outside caller scope (indistinguishable from absent, by design)"
      - "disposed/superseded resource"

  - code: CONFLICT
    http: 409
    meaning: "Idempotency replay, duplicate workflow start, or state/uniqueness conflict."
    user_message_template: "This can't be completed because it conflicts with the current state."
    typical_triggers:
      - "duplicate workflow start (ERR-DUP-INSTANCE)"
      - "optimistic-lock / stale-version mismatch"
      - "immutable-record edit, overlap, quota/cap breach"

  - code: PRECONDITION_FAILED
    http: 412
    meaning: "A required precondition is not met (includes upstream-unavailable retryable path; replaces v2 503 UPSTREAM)."
    user_message_template: "This can't be done because a required condition isn't met: {reason}."
    typical_triggers:
      - "required prior stage / attestation / signature not present"
      - "upstream module (G08/G09/G10/G12) temporarily unavailable — retryable"
      - "active stay/hold precondition"

  - code: RATE_LIMITED
    http: 429
    meaning: "Rate limit or brute-force lockout exceeded."
    user_message_template: "Too many attempts. Wait and try again."
    typical_triggers:
      - "break-glass / share-password lockout"
      - "break-glass volume cap"

  - code: INTERNAL
    http: 500
    meaning: "Unexpected server error, or non-retryable upstream/service failure (503 collapses here)."
    user_message_template: "We couldn't load this right now. The correlation id is shown for support."
    typical_triggers:
      - "unhandled server error"
      - "KMS/PKI/eSign/storage unavailable (non-retryable, X.3-mapped)"
      - "ledger reconciliation / audit-chain internal failure"

# -----------------------------------------------------------------------------
# 3. SHARED CODES — platform ERR-*/MSG-SYS-* message ids (Foundation §4.3)
#    These are user-facing message ids reused by every module. Each renders
#    under one of the 8 wire statuses above.
# -----------------------------------------------------------------------------
shared_codes:
  - id: ERR-FORBIDDEN
    http: 403
    severity: error
    message: "You don't have permission to perform this action."
    recovery: "Contact your admin if you believe this is wrong."
  - id: ERR-LOADFAIL
    http: 500
    severity: error
    message: "We couldn't load this right now."
    recovery: "Retry; if it persists, the correlation id is shown for support."
  - id: ERR-PRECOND
    http: 412
    severity: error
    message: "This can't be done because a required condition isn't met: {reason}."
    recovery: "Resolve {reason} and try again."
  - id: ERR-DUP-INSTANCE
    http: 409
    severity: warning
    message: "A request for this already exists and is in progress."
    recovery: "Open the existing request instead of creating a new one."
  - id: ERR-PAST-DATED
    http: 422
    severity: warning
    message: "The selected date is outside the allowed window."
    recovery: "Choose a date within the permitted range."
  - id: ERR-REASON-REQ
    http: 422
    severity: warning
    message: "A reason is required to continue."
    recovery: "Enter a reason."
  - id: ERR-REVOKE-FORBIDDEN
    http: 403
    severity: error
    message: "This item can't be revoked."
    recovery: "Per policy; contact your approver/admin."
  - id: MSG-SYS-JOBFAIL
    http: 500
    severity: error
    message: "Scheduled job {job_id} failed for tenant {tenant} at {time}."
    recovery: "Auto-retried {n}x; manual re-run from the jobs console (JOB-FAIL / X.1)."

# -----------------------------------------------------------------------------
# 4. MODULE CODES (G01–G14)
#    Each entry: code -> http (one of the 8) -> message_id (user-facing id, or
#    the code itself when self-referencing, or '-' when the meaning is the copy)
#    -> one-line meaning.
# -----------------------------------------------------------------------------
module_codes:

  # --- G01 Employee Profile Management -------------------------------------
  # ERR-G01-* are message ids surfaced under standard wire codes, keyed off a
  # details.reason discriminator.
  G01:
    module_name: "Employee Profile Management"
    codes:
      - { code: ERR-G01-IDFMT,     http: VALIDATION_FAILED,   message_id: ERR-G01-IDFMT,     meaning: "Statutory-ID checksum/format failure (reason INVALID_ID)." }
      - { code: ERR-G01-RANGE,     http: VALIDATION_FAILED,   message_id: ERR-G01-RANGE,     meaning: "Batch/as-of bounds violation (BATCH_TOO_LARGE/OUT_OF_RANGE)." }
      - { code: ERR-G01-GOVLOCK,   http: FORBIDDEN,           message_id: ERR-G01-GOVLOCK,   meaning: "Raw update of a governed field (DOB/category/name) outside FR-022." }
      - { code: ERR-G01-CONSENT,   http: FORBIDDEN,           message_id: ERR-G01-CONSENT,   meaning: "Biometric/processing without a valid consent_records entry." }
      - { code: ERR-G01-INVARIANT, http: CONFLICT,            message_id: ERR-G01-INVARIANT, meaning: "Sole-primary removal / nominee shares != 100." }
      - { code: ERR-G01-STATE,     http: CONFLICT,            message_id: ERR-G01-STATE,     meaning: "Sanctioned-strength/position/lifecycle state conflict." }
      - { code: ERR-G01-MERGE,     http: CONFLICT,            message_id: ERR-G01-MERGE,     meaning: "Conflicting merge state / rollback past undo window." }
      - { code: ERR-G01-STALE,     http: CONFLICT,            message_id: ERR-G01-STALE,     meaning: "Optimistic-lock row_version mismatch." }
      - { code: ERR-G01-HOLD,      http: CONFLICT,            message_id: ERR-G01-HOLD,      meaning: "Purge/erasure blocked by an active legal hold (FR-021)." }
      # FR-EPM-015/017/018 failure-handling wire codes (BRD v3 G01 LLD "Failure Handling" rows):
      - { code: SOD_VIOLATION,        http: FORBIDDEN, message_id: "-", meaning: "Maker == checker on a 4-eyes merge or separation approval (FR-EPM-015/018)." }
      - { code: MERGE_CONFLICT,       http: CONFLICT,  message_id: "-", meaning: "Merge of conflicting ACTIVE statutory states without explicit override (FR-EPM-015)." }
      - { code: UNDO_EXPIRED,         http: CONFLICT,  message_id: "-", meaning: "Merge/batch undo attempted after the configurable reversal window (FR-EPM-015/017)." }
      - { code: INVALID_STATE,        http: CONFLICT,  message_id: "-", meaning: "Invalid §10.1 status transition; also promote-active with remaining STRICT gaps (FR-EPM-017/018)." }
      - { code: LEGAL_HOLD_ACTIVE,    http: CONFLICT,  message_id: "-", meaning: "Archive blocked by an ACTIVE employee legal hold (FR-EPM-018/021)." }
      - { code: BLOCKING_OBLIGATIONS, http: CONFLICT,  message_id: "-", meaning: "Separation with open blocking obligations and no override (FR-EPM-018)." }
      - { code: ERR-G01-HEIR,      http: PRECONDITION_FAILED, message_id: ERR-G01-HEIR,      meaning: "DECEASED handoff attempted without an heir." }
      - { code: ERR-G01-CAP,       http: RATE_LIMITED,        message_id: ERR-G01-CAP,       meaning: "Break-glass volume cap reached (FR-013)." }

  # --- G02 Personal Details Modification Workflow --------------------------
  G02:
    module_name: "Personal Details Modification Workflow"
    codes:
      - { code: ERR-G02-STALE,        http: CONFLICT,            message_id: ERR-G02-STALE,        meaning: "Stale value / optimistic-lock mismatch on a workflow request." }
      - { code: ERR-G02-STEPUP,       http: PRECONDITION_FAILED, message_id: ERR-G02-STEPUP,       meaning: "HIGH/STATUTORY change without a valid unexpired step-up event." }
      - { code: ERR-G02-STATUSGATE,   http: FORBIDDEN,           message_id: ERR-G02-STATUSGATE,   meaning: "Action blocked by an employee/request status gate (P02)." }
      - { code: ERR-G02-HARDBLOCK,    http: PRECONDITION_FAILED, message_id: ERR-G02-HARDBLOCK,    meaning: "DOB alteration barred within 5 yrs of superannuation." }
      - { code: ERR-G02-ESIGN,        http: PRECONDITION_FAILED, message_id: ERR-G02-ESIGN,        meaning: "Required e-signature not supplied." }
      - { code: ERR-G02-ESIGN-METHOD, http: VALIDATION_FAILED,   message_id: ERR-G02-ESIGN-METHOD, meaning: "Weak/disallowed e-sign method (FINANCIAL/STATUTORY reject OTP)." }
      - { code: ERR-G02-AUTHPORTAL,   http: PRECONDITION_FAILED, message_id: ERR-G02-AUTHPORTAL,   meaning: "Authority-portal verification not VERIFIED at approval." }
      - { code: ERR-G02-RISKBLOCK,    http: PRECONDITION_FAILED, message_id: ERR-G02-RISKBLOCK,    meaning: "Risk/fraud hold (e.g. duplicate bank account) blocks submission." }
      - { code: ERR-G02-DUALAUTH,     http: PRECONDITION_FAILED, message_id: ERR-G02-DUALAUTH,     meaning: "Dual-authorisation precondition unmet." }
      - { code: ERR-G02-SOD,          http: FORBIDDEN,           message_id: ERR-G02-SOD,          meaning: "Separation-of-duties violation (maker == checker)." }

  # --- G03 Attendance & Leave Management -----------------------------------
  # ERR-G03-* are the authored message ids. G03 additionally carries bare domain
  # reasons in error.code (ROSTER_OVERLAP, GEOFENCE_VIOLATION, PERIOD_LOCKED,
  # etc.) each mapped to a standard wire status per §2 and shared_codes.
  G03:
    module_name: "Attendance & Leave Management"
    codes:
      - { code: ERR-G03-INSUFF-BAL,    http: CONFLICT,          message_id: ERR-G03-INSUFF-BAL,    meaning: "Insufficient leave balance (reason INSUFFICIENT_BALANCE)." }
      - { code: ERR-G03-COMMUTED-HPL,  http: VALIDATION_FAILED, message_id: ERR-G03-COMMUTED-HPL,  meaning: "Commuted leave requires HPL (COMMUTED_REQUIRES_HPL)." }
      - { code: ERR-G03-CONSENT,       http: FORBIDDEN,         message_id: ERR-G03-CONSENT,       meaning: "Consent required for the action (CONSENT_REQUIRED)." }
      - { code: ERR-G03-BLACKOUT,      http: CONFLICT,          message_id: ERR-G03-BLACKOUT,      meaning: "Leave falls in a blackout period (BLACKOUT_PERIOD)." }
      - { code: ERR-G03-LTC-EXHAUSTED, http: CONFLICT,          message_id: ERR-G03-LTC-EXHAUSTED, meaning: "LTC block exhausted (LTC_BLOCK_EXHAUSTED)." }

  # --- G04 Leave-SR Integration --------------------------------------------
  G04:
    module_name: "Leave-SR Integration"
    codes:
      - { code: ERR-G04-MAPPING-NOT-FOUND,       http: VALIDATION_FAILED,   message_id: ERR-G04-MAPPING-NOT-FOUND,       meaning: "No published POST_SR mapping for an SR-affecting (leave_type, event_type)." }
      - { code: ERR-G04-MAPPING-OVERLAP,         http: CONFLICT,            message_id: ERR-G04-MAPPING-OVERLAP,         meaning: "Overlapping mapping effective ranges at publish." }
      - { code: ERR-G04-SR-CONFLICT,             http: CONFLICT,            message_id: ERR-G04-SR-CONFLICT,             meaning: "G12 rejected due to conflicting SR state." }
      - { code: ERR-G04-ORPHAN-CORRECTION,       http: VALIDATION_FAILED,   message_id: ERR-G04-ORPHAN-CORRECTION,       meaning: "Correction has no locatable original entry." }
      - { code: ERR-G04-IDEMPOTENT-DUPLICATE,    http: CONFLICT,            message_id: ERR-G04-IDEMPOTENT-DUPLICATE,    meaning: "Idempotent replay; original sr_event_id returned (no-op)." }
      - { code: ERR-G04-DLQ-REPLAY-BLOCKED,      http: CONFLICT,            message_id: ERR-G04-DLQ-REPLAY-BLOCKED,      meaning: "Replay blocked (mapping still missing / signature unfixed)." }
      - { code: ERR-G04-BATCH-VALIDATION-FAILED, http: VALIDATION_FAILED,   message_id: ERR-G04-BATCH-VALIDATION-FAILED, meaning: "Historical batch has rejected records blocking post." }
      - { code: ERR-G04-RELAY-PAUSED,            http: PRECONDITION_FAILED, message_id: ERR-G04-RELAY-PAUSED,            meaning: "Posting paused by manual relay-pause override." }
      - { code: ERR-G04-SR-UNAVAILABLE,          http: PRECONDITION_FAILED, message_id: ERR-G04-SR-UNAVAILABLE,          meaning: "G12 SR port unreachable (X.3-mapped, retryable; 500 if non-retryable; never public 503)." }
      - { code: ERR-G04-SCOPE-TOO-LARGE,         http: VALIDATION_FAILED,   message_id: ERR-G04-SCOPE-TOO-LARGE,         meaning: "Replay/backfill/recon scope exceeds bound." }
      - { code: ERR-G04-LINEAGE-MISSING,         http: VALIDATION_FAILED,   message_id: ERR-G04-LINEAGE-MISSING,         meaning: "Captured event lacks leave_spell_lineage_id." }
      - { code: ERR-G04-SIGNATURE-INVALID,       http: FORBIDDEN,           message_id: ERR-G04-SIGNATURE-INVALID,       meaning: "Capture payload HMAC verification failed." }
      - { code: ERR-G04-BLOCKED-AWAITING-ORIGINAL, http: CONFLICT,          message_id: ERR-G04-BLOCKED-AWAITING-ORIGINAL, meaning: "Correction not posting-eligible until original POSTED." }
      - { code: ERR-G04-PORT-NOT-CONFORMANT,     http: PRECONDITION_FAILED, message_id: ERR-G04-PORT-NOT-CONFORMANT,     meaning: "Live posting gate closed: no passing G12 conformance run." }
      - { code: ERR-G04-PROVISIONAL-ENTRY,       http: CONFLICT,            message_id: ERR-G04-PROVISIONAL-ENTRY,       meaning: "Operation blocked by an unadjudicated provisional migrated entry." }
      - { code: ERR-G04-CERTIFICATE-FAILED,      http: VALIDATION_FAILED,   message_id: ERR-G04-CERTIFICATE-FAILED,      meaning: "Pre-pension certificate FAIL (blocking items remain)." }

  # --- G05 Transfer / Relieving / Joining Workflow -------------------------
  G05:
    module_name: "Transfer / Relieving / Joining Workflow"
    codes:
      - { code: ERR-G05-ACTIVE-TRANSFER,      http: CONFLICT,            message_id: ERR-G05-ACTIVE-TRANSFER,      meaning: "Employee already has an active substantive transfer order." }
      - { code: ERR-G05-ELIGIBILITY-BLOCKED,  http: VALIDATION_FAILED,   message_id: ERR-G05-ELIGIBILITY-BLOCKED,  meaning: "Hard-block eligibility policy failure at submit." }
      - { code: ERR-G05-BAN-WINDOW,           http: VALIDATION_FAILED,   message_id: ERR-G05-BAN-WINDOW,           meaning: "Transfer falls inside a ban period." }
      - { code: ERR-G05-CLEARANCE-INCOMPLETE, http: PRECONDITION_FAILED, message_id: ERR-G05-CLEARANCE-INCOMPLETE, meaning: "Relieving attempted before clearance / deemed relief." }
      - { code: ERR-G05-HANDOVER-DISPUTED,    http: CONFLICT,            message_id: ERR-G05-HANDOVER-DISPUTED,    meaning: "Charge handover not accepted / under protest." }
      - { code: ERR-G05-NOT-IN-TRANSIT,       http: CONFLICT,            message_id: ERR-G05-NOT-IN-TRANSIT,       meaning: "Joining attempted before relief (order not IN_TRANSIT)." }
      - { code: ERR-G05-DEPUTATION-CAP,       http: VALIDATION_FAILED,   message_id: ERR-G05-DEPUTATION-CAP,       meaning: "Deputation extension beyond max tenure." }
      - { code: ERR-G05-VACANCY-FULL,         http: CONFLICT,            message_id: ERR-G05-VACANCY-FULL,         meaning: "Allotment/join to a filled vacancy (incl. join-time re-check)." }
      - { code: ERR-G05-DUAL-POSTING,         http: CONFLICT,            message_id: ERR-G05-DUAL-POSTING,         meaning: "Dual / zero in-transit custody." }
      - { code: ERR-G05-STAY-HOLD,            http: CONFLICT,            message_id: ERR-G05-STAY-HOLD,            meaning: "Forward transition blocked by an active stay/hold." }
      - { code: ERR-G05-MUTUAL-PAIR,          http: CONFLICT,            message_id: ERR-G05-MUTUAL-PAIR,          meaning: "Asymmetric mutual-transfer completion." }
      - { code: ERR-G05-NOT-SERVED,           http: CONFLICT,            message_id: ERR-G05-NOT-SERVED,           meaning: "Relieving before proof-of-service." }
      - { code: ERR-G05-NUMBER-LOCKED,        http: CONFLICT,            message_id: ERR-G05-NUMBER-LOCKED,        meaning: "Gapless order-number reservation contention (retry)." }
      - { code: ERR-G05-COUNSEL-TURN,         http: CONFLICT,            message_id: ERR-G05-COUNSEL-TURN,         meaning: "Counselling choice attempted out of turn." }
      - { code: ERR-G05-FORCED-PRECOND,       http: CONFLICT,            message_id: ERR-G05-FORCED-PRECOND,       meaning: "Forced action before SLA/escalation exhausted." }
      - { code: ERR-G05-RELIEVE-DATE,         http: VALIDATION_FAILED,   message_id: ERR-G05-RELIEVE-DATE,         meaning: "Relieving/joining date inconsistency (VAL-G05-TRANSFER-ORDER)." }
      - { code: ERR-G05-QUARTER-OVERSTAY,     http: VALIDATION_FAILED,   message_id: ERR-G05-QUARTER-OVERSTAY,     meaning: "Accommodation retained beyond permitted limit." }

  # --- G06 Promotion / Posting / Progression -------------------------------
  # G06 uses BARE domain codes carried in error.code (no ERR-G06-* alias);
  # user copy resolves via shared ERR-* ids. Almost all are 409 CONFLICT.
  G06:
    module_name: "Promotion / Posting / Progression"
    code_style: "bare-domain-code-in-error.code"
    codes:
      - { code: SENIORITY_RANK_CONFLICT,      http: CONFLICT,            message_id: "-", meaning: "Duplicate/gap rank on seniority-list publish." }
      - { code: OBJECTION_WINDOW_CLOSED,      http: CONFLICT,            message_id: "-", meaning: "Objection filed outside the window." }
      - { code: OBJECTIONS_PENDING,           http: CONFLICT,            message_id: "-", meaning: "Finalise blocked by open objections." }
      - { code: SENIORITY_LIST_NOT_FINAL,     http: CONFLICT,            message_id: "-", meaning: "Case needs a finalised seniority list." }
      - { code: NO_ELIGIBLE_CANDIDATES,       http: CONFLICT,            message_id: "-", meaning: "Eligibility field empty." }
      - { code: QUORUM_NOT_MET,               http: CONFLICT,            message_id: "-", meaning: "DPC quorum failure." }
      - { code: PANEL_CONFLICT_OF_INTEREST,   http: CONFLICT,            message_id: "-", meaning: "Candidate cannot be a panel member (P02 SoD)." }
      - { code: VACANCY_EXCEEDED,             http: CONFLICT,            message_id: "-", meaning: "Select count exceeds vacancies." }
      - { code: ROSTER_POINT_OCCUPIED,        http: CONFLICT,            message_id: "-", meaning: "Roster double-fill attempt." }
      - { code: ROSTER_CATEGORY_MISMATCH,     http: CONFLICT,            message_id: "-", meaning: "Wrong category fill on roster point." }
      - { code: SEALED_COVER_NOT_REVIEWABLE,  http: CONFLICT,            message_id: "-", meaning: "G09 case not concluded; sealed cover not reviewable." }
      - { code: PROBATION_NOT_COMPLETE,       http: CONFLICT,            message_id: "-", meaning: "Declare probation before period elapsed." }
      - { code: PROBATION_EXTENSION_LIMIT,    http: CONFLICT,            message_id: "-", meaning: "Probation extension over cap." }
      - { code: OFFICIATING_OVERLAP,          http: CONFLICT,            message_id: "-", meaning: "Conflicting officiating arrangement." }
      - { code: NO_REGULAR_SELECTION,         http: CONFLICT,            message_id: "-", meaning: "Regularise without a regular selection." }
      - { code: MACP_CAP_REACHED,             http: CONFLICT,            message_id: "-", meaning: "3 financial up-gradations exhausted." }
      - { code: POST_NOT_AVAILABLE,           http: CONFLICT,            message_id: "-", meaning: "Destination post unavailable." }
      - { code: SR_POSTING_FAILED,            http: PRECONDITION_FAILED, message_id: "-", meaning: "SR write to G12 failed, held for retry (was 503)." }
      - { code: VACANCY_NOT_RECONCILED,       http: CONFLICT,            message_id: "-", meaning: "Case vacancy != sanctioned promotion-quota vacancies." }
      - { code: STRENGTH_INCONSISTENT,        http: CONFLICT,            message_id: "-", meaning: "filled_count > sanctioned_strength." }
      - { code: QUOTA_SPLIT_INVALID,          http: CONFLICT,            message_id: "-", meaning: "DR + promotion + LDCE quota > 100." }
      - { code: APAR_NOT_USABLE,              http: CONFLICT,            message_id: "-", meaning: "Uncommunicated adverse APAR relied upon (Dev Dutt)." }
      - { code: EWS_CERT_EXPIRED,             http: CONFLICT,            message_id: "-", meaning: "EWS/creamy-layer certificate not current on crucial date." }
      - { code: EXAM_NOT_PASSED,              http: CONFLICT,            message_id: "-", meaning: "LDCE/departmental exam gate failed." }
