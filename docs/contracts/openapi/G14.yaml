  # FR-G14-15 — NL Query & Embedded BI
  # ==========================================================================
  /analytics/nlq:
    post:
      tags: [NL Query]
      summary: Natural-language query (confidence-gated, P03 guardrails)
      description: >
        Governed NL-to-query: PII stripped server-side before any model call,
        semantic mapping + P02 scope rewrite are built, informational-only.
        Refuses below the confidence threshold rather than guessing.
      operationId: nlQuery
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NlQueryRequest' }
      responses:
        <<: *writeErrors
        "200":
          description: >
            Resolved answer or governed refusal. 422 ERR-G14-NLQ-CONF (below
            confidence), 422 ERR-G14-NLQ-CLARIFY (ambiguous — clarification
            offered), 404 ERR-G14-METRIC-NA (references an unmodelled metric).
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NlQueryResult' }

  /analytics/embed-tokens:
    post:
      tags: [Embedded BI]
      summary: Issue a scoped embed token (maker)
      operationId: issueEmbedToken
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmbedTokenCreate' }
      responses:
        <<: *writeErrors
        "201":
          description: Embed token issued (PENDING_APPROVAL; secret never returned/stored plaintext).
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbedToken' }

  /analytics/embed-tokens/{id}:approve:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [Embedded BI]
      summary: Approve an embed token (P01 checker ≠ issuer)
      operationId: approveEmbedToken
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        <<: *writeErrors
        "200":
          description: >
            Token activated. 403 ERR-G14-PUBLISH-CHECKER / SoD if the issuer
            attempts self-approval.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbedToken' }

  /analytics/embed-tokens/{id}:revoke:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [Embedded BI]
      summary: Revoke an embed token
      operationId: revokeEmbedToken
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        <<: *writeErrors
        "200":
          description: Token revoked.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbedToken' }

  /analytics/embed/session:
    post:
      tags: [Embedded BI]
      summary: Exchange a short-lived code for a render session
      description: >
        The embed token travels in the request body/header, never in a URL. A
        missing/expired/out-of-scope token yields 401 ERR-G14-EMBED-INVALID; a
        revoked token yields 401 ERR-G14-EMBED-REVOKED.
      operationId: createEmbedSession
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        <<: *writeErrors
        "200":
          description: Render session established.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbedSession' }

  # ==========================================================================
  # FR-G14-16 — Mobile & Executive Briefings
  # ==========================================================================
  /analytics/briefings/schedules:
    post:
      tags: [Mobile & Briefings]
      summary: Schedule an executive briefing pack (X.1)
      operationId: createBriefingSchedule
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BriefingScheduleCreate' }
      responses:
        <<: *writeErrors
        "201":
          description: Briefing schedule created.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSchedule' }

  /analytics/briefings/{executionId}:
    parameters:
      - name: executionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Mobile & Briefings]
      summary: Executive briefing artefact
      operationId: getBriefing
      responses:
        <<: *readErrors
        "200":
          description: Briefing execution status + artefact reference.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportExecution' }

  # ==========================================================================
  # FR-G14-17 — Suppression Policies
  # ==========================================================================
  /analytics/suppression-policies:
    post:
      tags: [Suppression Policies]
      summary: Create / update a suppression policy (k-anonymity + complementary)
      operationId: createSuppressionPolicy
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuppressionPolicyCreate' }
      responses:
        <<: *writeErrors
        "201":
          description: Suppression policy saved.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuppressionPolicy' }
    get:
      tags: [Suppression Policies]
      summary: List suppression policies
      operationId: listSuppressionPolicies
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        <<: *readErrors
        "200":
          description: Page of suppression policies.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuppressionPolicyPage' }

  # ==========================================================================
  # FR-G14-19 — Establishment / Position Reference
  # ==========================================================================
  /analytics/establishment/positions:
    post:
      tags: [Establishment]
      summary: Create / maintain a sanctioned position (Establishment Officer)
      operationId: createPosition
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EstablishmentPositionCreate' }
      responses:
        <<: *writeErrors
        "201":
          description: Position created / updated.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstablishmentPosition' }
    get:
      tags: [Establishment]
      summary: List sanctioned positions (P02-scoped)
      operationId: listPositions
      parameters:
        - $ref: '#/components/parameters/ScopeQ'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        <<: *readErrors
        "200":
          description: Page of positions.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstablishmentPositionPage' }

  /analytics/establishment/vacancy-base:
    get:
      tags: [Establishment]
      summary: Sanctioned-strength denominator for a scope/period
      operationId: getVacancyBase
      parameters:
        - $ref: '#/components/parameters/ScopeQ'
        - $ref: '#/components/parameters/PeriodQ'
      responses:
        <<: *readErrors
        "200":
          description: >
            Sanctioned-strength denominator. 422 ERR-G14-ESTAB-MISSING (notice
            surface) if the reference is absent.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VacancyBase' }

  # ==========================================================================
  # FR-G14-20 — DPDP Rectification / Erasure Propagation
  # ==========================================================================
  /analytics/data-subject-changes:
    post:
      tags: [DPDP Data-Subject Changes]
      summary: Register a rectification / erasure / restriction (DPO / G01)
      operationId: createDataSubjectChange
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataSubjectChangeCreate' }
      responses:
        <<: *writeErrors
        "202":
          description: >
            Change accepted; propagation across the analytics estate started.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSubjectChange' }

  /analytics/data-subject-changes/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      tags: [DPDP Data-Subject Changes]
      summary: Propagation status of a data-subject change
      operationId: getDataSubjectChange
      responses:
        <<: *readErrors
        "200":
          description: >
            Propagation status across marts/snapshots/predictions/exports.
            ERR-G14-ERASURE-PENDING while still propagating (notice surface).
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSubjectChange' }

  /analytics/data-subject-changes/{id}:retention-override:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [DPDP Data-Subject Changes]
      summary: Record a statutory retention override legal basis (DPO)
      operationId: retentionOverride
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legal_basis]
              properties:
                legal_basis: { type: string }
      responses:
        <<: *writeErrors
        "200":
          description: >
            Legal basis recorded. 409 ERR-G14-RETENTION-BLOCK when statutory
            retention overrides the erasure (notice surface).
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSubjectChange' }

  # ==========================================================================
  # FR-G14-21 — Source Data Contracts
  # ==========================================================================
  /analytics/source-contracts:
    post:
      tags: [Source Data Contracts]
      summary: Register / version a source data contract
      operationId: createSourceContract
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceContractCreate' }
      responses:
        <<: *writeErrors
        "201":
          description: Contract registered.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceDataContract' }
    get:
      tags: [Source Data Contracts]
      summary: List contracts / status
      operationId: listSourceContracts
      parameters:
        - name: module
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        <<: *readErrors
        "200":
          description: Page of contracts.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceContractPage' }

  /analytics/source-contracts/{id}:test:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [Source Data Contracts]
      summary: Run a contract test (CI verification)
      operationId: testSourceContract
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        <<: *writeErrors
        "200":
          description: >
            Contract test result. 409 ERR-G14-CONTRACT if the source schema
            breached the data contract.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractTestResult' }

  # ==========================================================================
  # FR-G14-22 — Access-Anomaly Detection
  # ==========================================================================
  /analytics/anomalies:
    get:
      tags: [Access Anomalies]
      summary: List detected access anomalies (P02-scoped)
      operationId: listAnomalies
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, INVESTIGATING, DISMISSED, CONFIRMED] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        <<: *readErrors
        "200":
          description: Page of anomalies.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessAnomalyPage' }

  /analytics/anomalies/{id}:review:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [Access Anomalies]
      summary: Review an anomaly (INVESTIGATING / DISMISSED / CONFIRMED)
      operationId: reviewAnomaly
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [INVESTIGATING, DISMISSED, CONFIRMED] }
                note: { type: [string, "null"] }
      responses:
        <<: *writeErrors
        "200":
          description: Anomaly review recorded.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessAnomaly' }

  /analytics/anomaly-rules:
    post:
      tags: [Access Anomalies]
      summary: Configure anomaly thresholds / baselines
      operationId: createAnomalyRule
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnomalyRuleCreate' }
      responses:
        <<: *writeErrors
        "201":
          description: Anomaly rule configured.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnomalyRule' }

# =============================================================================
# COMPONENTS
# =============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Bearer JWT carrying resolved roles + tenant/entity scope (Platform §0.2).
        Every data-bearing endpoint calls Authorization.check (P02); endpoints
        never re-implement permission logic.

  headers:
    CorrelationId:
      description: >
        Correlation id echoed on every response and written to every audit and
        log line for the request (Foundation §1). Assigned if absent inbound.
      schema: { type: string }

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PathCode:
      name: code
      in: path
      required: true
      description: Business key (e.g. kpi_code).
      schema: { type: string }
    Limit:
      name: limit
      in: query
      description: Page size (cursor pagination). Default 25, max 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      description: Opaque forward cursor from a prior response's next_cursor.
      schema: { type: string }
    Sort:
      name: sort
      in: query
      description: "Sort spec, e.g. field:asc | field:desc."
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Idempotency key for unsafe / workflow-initiating POSTs; a repeat within
        24h returns the original result (Foundation §4).
      schema: { type: string }
    ScopeQ:
      name: scope
      in: query
      description: Org-unit / cadre / manager scope id (resolved against P02).
      schema: { type: string }
    DimensionQ:
      name: dimension
      in: query
      description: Group-by dimension (must be in the KPI's dimensions_allowed).
      schema: { type: string }
    PeriodQ:
      name: period
      in: query
      description: "Period key (e.g. 2026-06, FY2026_27) or grain."
      schema: { type: string }

  responses:
    Unauthenticated:
      description: 401 UNAUTHENTICATED — no/invalid/expired/revoked session or embed token (ERR-G14-EMBED-INVALID / ERR-G14-EMBED-REVOKED).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: >
        403 FORBIDDEN — role/scope/field-mask, PII-ceiling or SoD denial (P02);
        never reveals existence of out-of-scope records. Module surfaces:
        ERR-G14-SCOPE-CHECKER, ERR-G14-PUBLISH-CHECKER, ERR-G14-SMALL-CELL,
        ERR-G14-COMP-SUPPRESS, ERR-G14-CHANNEL, ERR-G14-PRED-GATED.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: >
        404 NOT_FOUND — absent or out-of-scope resource (indistinguishable by
        design). Module surfaces: ERR-G14-METRIC-NA, ERR-G14-ASOF-NA.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: >
        409 CONFLICT — idempotency replay, state/uniqueness conflict. Module
        surfaces: ERR-G14-WIDGET-BINDING, ERR-G14-KPI-VER-OVERLAP,
        ERR-G14-XVER-AGG, ERR-G14-MART-BUSY, ERR-G14-CONTRACT,
        ERR-G14-ERASURE-PENDING, ERR-G14-RETENTION-BLOCK.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionFailed:
      description: >
        412 PRECONDITION_FAILED — required precondition unmet, incl. retryable
        upstream/mart unavailability. Module surfaces: ERR-G14-MART-UNAVAIL,
        ERR-G14-PAYROLL-LOCK, ERR-PRECOND.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: >
        422 VALIDATION_FAILED — input failed a VAL-* rule. Module surfaces:
        ERR-G14-KPI-EXPR, ERR-G14-EXPORT-LIMIT, ERR-G14-NLQ-CLARIFY,
        ERR-G14-NLQ-CONF, ERR-G14-METHODOLOGY, ERR-G14-FAIRNESS,
        ERR-G14-ESTAB-MISSING, ERR-PAST-DATED, ERR-REASON-REQ.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: 429 RATE_LIMITED — rate limit exceeded.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Internal:
      description: >
        500 INTERNAL — unexpected server error, or non-retryable upstream/mart
        failure (503 collapses here). Module surface: ERR-G14-MART-REFRESH
        (ERR-LOADFAIL).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    # ---- Canonical error envelope (Foundation §1) ------------------------
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: A standard wire code or a module/domain code (e.g. ERR-G14-*).
            message: { type: string }
            field: { type: [string, "null"] }
            details:
              type: [object, "null"]
              additionalProperties: true
              description: "Structured discriminators, e.g. { reason: <REASON> }."

    # ---- Pagination envelope --------------------------------------------
    PageMeta:
      type: object
      properties:
        next_cursor: { type: [string, "null"] }

    # ---- Shared enums ----------------------------------------------------
    TargetRole:
      type: string
      enum: [EMPLOYEE, MANAGER, HR_ADMIN, DEPT_HEAD, EXECUTIVE, AUDITOR, ANALYTICS_ADMIN]
    DashboardCategory:
      type: string
      enum: [PERSONAL, WORKFORCE, OPERATIONAL, COMPLIANCE, EXECUTIVE, CUSTOM]
    DashboardStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]
    WidgetType:
      type: string
      enum: [KPI_TILE, LINE, BAR, PIE, DONUT, TABLE, HEATMAP, GAUGE, FUNNEL, MAP, TEXT]
    RefreshHint:
      type: string
      enum: [LIVE, MART, CACHED]
    KpiDomain:
      type: string
      enum: [WORKFORCE, LEAVE, ATTENDANCE, PAYROLL, TRAINING, APPRAISAL, DISCIPLINARY, TRANSFER, PROMOTION, PENSION, COMPLIANCE, SR]
    KpiUnit:
      type: string
      # HOURS added v3.2 (field reconciliation) — dept-attendance "Avg work hrs"
      # tile (ATT_AVG_WORK_HRS = avg(worked_minutes)/60.0). See BRD §5.5 / §5.5a.
      enum: [COUNT, PERCENT, RATIO, CURRENCY, DAYS, SCORE, HOURS]
    KpiGrain:
      type: string
      enum: [EMPLOYEE, ORG_UNIT, CADRE, PERIOD, ENTERPRISE]
    KpiStatus:
      type: string
      enum: [DRAFT, ACTIVE, RETIRED]
    Sensitivity:
      type: string
      enum: [PUBLIC, INTERNAL, RESTRICTED]
    Severity:
      type: string
      enum: [INFO, WARNING, CRITICAL]
    ScopeType:
      type: string
      enum: [ENTERPRISE, ORG_UNIT, CADRE, MANAGER]
    ExportFormat:
      type: string
      enum: [PDF, XLSX, CSV]
    ScopeDimension:
      type: string
      enum: [reporting_chain, org_unit, UAG, contribution_level, entity]
    RiskBand:
      type: string
      enum: [LOW, MEDIUM, HIGH, NO_PREDICTION]
    HealthStatus:
      type: string
      enum: [HEALTHY, STALE, DEGRADED, FAILED]
    AccessAction:
      type: string
      enum: [VIEW_DASHBOARD, RUN_REPORT, EXPORT, DRILLTHROUGH, NL_QUERY, API_QUERY, VIEW_INDIVIDUAL_PREDICTION]

    # ---- Freshness / suppression envelope shared by analytics reads ------
    FreshnessMeta:
      type: object
      properties:
        data_as_of: { type: [string, "null"], format: date-time }
        staleness_state:
          type: string
          enum: [FRESH, STALE, DEGRADED, PARTIAL]
        staleness_message:
          type: [string, "null"]
          description: Role-adaptive language describing freshness (FR-12).
        is_partial: { type: boolean, default: false }
    SuppressionNotice:
      type: object
      properties:
        code:
          type: [string, "null"]
          description: ERR-G14-SMALL-CELL or ERR-G14-COMP-SUPPRESS when a cell/complement is suppressed.
        suppressed_cells: { type: integer, default: 0 }
        min_cell_size_k: { type: [integer, "null"] }
        message: { type: [string, "null"] }

    AnalyticsResult:
      description: >
        Generic P02-scoped, suppressed, freshness-stamped analytics result set
        for the read/aggregate endpoints.
      type: object
      properties:
        kpi_code: { type: [string, "null"] }
        scope: { type: [string, "null"] }
        period: { type: [string, "null"] }
        dimensions:
          type: array
          items: { type: string }
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        freshness: { $ref: '#/components/schemas/FreshnessMeta' }
        suppression: { $ref: '#/components/schemas/SuppressionNotice' }

    # ---- Dashboards (E01) ------------------------------------------------
    Dashboard:
      type: object
      properties:
        dashboard_id: { type: string, format: uuid }
        dashboard_code: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        target_role: { $ref: '#/components/schemas/TargetRole' }
        category: { $ref: '#/components/schemas/DashboardCategory' }
        layout_json: { type: object, additionalProperties: true }
        default_filters_json: { type: [object, "null"], additionalProperties: true }
        is_system: { type: boolean }
        status: { $ref: '#/components/schemas/DashboardStatus' }
        published_by: { type: [string, "null"], format: uuid }
        published_at: { type: [string, "null"], format: date-time }
        widgets:
          type: array
          items: { $ref: '#/components/schemas/DashboardWidget' }
    DashboardCreate:
      type: object
      required: [dashboard_code, name, target_role, category, layout_json]
      properties:
        dashboard_code: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        target_role: { $ref: '#/components/schemas/TargetRole' }
        category: { $ref: '#/components/schemas/DashboardCategory' }
        layout_json: { type: object, additionalProperties: true }
        default_filters_json: { type: [object, "null"], additionalProperties: true }
    DashboardPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Dashboard' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    DashboardRender:
      type: object
      properties:
        dashboard_id: { type: string, format: uuid }
        viewport: { type: string, enum: [desktop, mobile] }
        widgets:
          type: array
          items:
            type: object
            properties:
              widget_id: { type: string, format: uuid }
              result: { $ref: '#/components/schemas/AnalyticsResult' }
        freshness: { $ref: '#/components/schemas/FreshnessMeta' }

