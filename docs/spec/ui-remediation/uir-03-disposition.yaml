phase: UIR-03
status: complete_no_new_service_required
decision: >
  Existing API services already receive authenticated actor and tenant/entity scope.
  The approved workspace contract makes workspace a presentation filter only and
  explicitly forbids widening server scope. Password reset and server evidence
  export are quarantined. Session expiry remains a client session concern in UIR-06.
