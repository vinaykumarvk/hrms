        proceedings_ref: { type: string }
        dcrg_withheld: { type: boolean, default: true }
    AuditObjectionRequest:
      type: object
      required: [case_id, objection_text, source]
      properties:
        case_id: { type: string, format: uuid }
        ppo_id: { type: [string, "null"], format: uuid }
        source: { type: string, enum: [AG, INTERNAL_AUDIT] }
        objection_text: { type: string }
        calc_trace_ref: { type: [string, "null"] }
    RuleRowRequest:
      type: object
      required: [effective_from, payload]
      properties:
        effective_from: { type: string, format: date }
        effective_to: { type: [string, "null"], format: date }
        payload:
          type: object
          description: Table-specific rule fields (rate, factor, ceiling, age, threshold, rounding).
          additionalProperties: true
    LifeCertificateRequest:
      type: object
      required: [method]
      properties:
        method: { type: string, enum: [JEEVAN_PRAMAAN, PHYSICAL, VIDEO_KYC, BANK_CERTIFIED] }
        certificate_ref: { type: [string, "null"] }
        submitted_on: { type: [string, "null"], format: date }
    PensionerUpdate:
      type: object
      properties:
        bank_account:
          type: [object, "null"]
