          description: >
            Sign-off recorded. 409 ERR-G11-DISCREPANCY-OPEN / ERR-G11-SPELL-NOT-ATTESTED if the
            three-point PARALLEL_ALL_OF gate is not fully satisfied.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceVerification' }

  # --------------------------------------------------------------------------
  # FR-G11-19 Rule Tables
  # --------------------------------------------------------------------------
  /pension/rules/{table}:
    get:
      tags: [RuleTables]
      summary: List rule-table rows (filter by effective date)
      operationId: listRuleRows
      parameters:
        - $ref: '#/components/parameters/RuleTable'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: effective_on, in: query, schema: { type: string, format: date } }
      responses:
        <<: *commonErrors
        '200':
          description: Page of rule rows
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleRowList' }
    post:
      tags: [RuleTables]
      summary: Create a DRAFT rule row (effective-dated, staged)
      operationId: createRuleRow
      parameters:
        - $ref: '#/components/parameters/RuleTable'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleRowRequest' }
      responses:
        <<: *commonErrors
        '201':
          description: DRAFT rule row created (staged via JOB-G11-EFFDATE)
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleRow' }

  /pension/rules/{table}/{rowId}:approve:
    post:
      tags: [RuleTables]
      summary: Approve a rule row (SoD) → APPROVED / EFFECTIVE
      operationId: approveRuleRow
      parameters:
        - $ref: '#/components/parameters/RuleTable'
        - { name: rowId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SanctionRequest' }
      responses:
        <<: *commonErrors
        '200':
          description: Rule row approved. 403 on maker==checker SoD.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleRow' }

  /pension/rules/{table}/resolve:
    get:
      tags: [RuleTables]
      summary: Resolve the EFFECTIVE row for a date
      operationId: resolveRuleRow
      parameters:
        - $ref: '#/components/parameters/RuleTable'
        - { name: asOf, in: query, required: true, schema: { type: string, format: date } }
      responses:
        <<: *commonErrors
        '200':
          description: Effective row for the date. 404 if none effective.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleRow' }

  # --------------------------------------------------------------------------
  # FR-G11-20 Death Detection & Overpayment
  # --------------------------------------------------------------------------
  /pension/death-detection:run:
    post:
      tags: [DeathDetection]
      summary: Run death-registry / DBT reconciliation (JOB-G11-DEATHRECON over X.3)
      operationId: runDeathDetection
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                as_of: { type: [string, "null"], format: date }
      responses:
        <<: *commonErrors
        '202':
          description: Reconciliation job accepted
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }

  /pension/death-detection/flags:
    get:
      tags: [DeathDetection]
      summary: Probable-death / anomaly flags
      operationId: listDeathFlags
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: source, in: query, schema: { $ref: '#/components/schemas/DeathDetectedSource' } }
      responses:
        <<: *commonErrors
        '200':
          description: Page of death/anomaly flags
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeathFlagList' }

  /pension/overpayments:
    post:
      tags: [DeathDetection]
      summary: Open an overpayment recovery row
      operationId: createOverpayment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OverpaymentRequest' }
      responses:
        <<: *commonErrors
        '201':
          description: Overpayment recovery opened
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overpayment' }

  /pension/overpayments/{id}:recover:
    post:
      tags: [DeathDetection]
      summary: Record a recovery (mode, amount)
      operationId: recoverOverpayment
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, amount]
              properties:
                mode: { type: string, enum: [FROM_ESTATE, FROM_ARREARS, VOLUNTARY, WRITE_OFF] }
                amount: { $ref: '#/components/schemas/Money' }
                reason: { type: string }
      responses:
        <<: *commonErrors
        '200':
          description: Recovery recorded. 409 ERR-G11-RECOVERY-PROTECTION where protected.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overpayment' }

  /pension/reports/drawn-after-death:
    get:
      tags: [DeathDetection]
      summary: Drawn-after-death exception report
      operationId: getDrawnAfterDeathReport
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        <<: *commonErrors
        '200':
          description: Exception report (ERR-G11-DRAWN-AFTER-DEATH cases)
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeathFlagList' }

  # --------------------------------------------------------------------------
  # FR-G11-21 PDA Registry
  # --------------------------------------------------------------------------
  /pension/pdas:
    get:
      tags: [PDA]
      summary: List PDAs + disbursement models
      operationId: listPdas
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        <<: *commonErrors
        '200':
          description: Page of PDAs
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PdaList' }
    post:
      tags: [PDA]
      summary: Register / maintain a PDA
      operationId: createPda
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PdaRequest' }
      responses:
        <<: *commonErrors
        '201':
          description: PDA registered
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pda' }

  /pension/pdas/{id}:certify:
    post:
      tags: [PDA]
      summary: Mark PDA sandbox-certified (X.3 tie-out passed)
      operationId: certifyPda
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        <<: *commonErrors
        '200':
          description: PDA certified
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pda' }

  /pension/pdas/{id}:activate:
    post:
      tags: [PDA]
      summary: Go-live (requires certification)
      operationId: activatePda
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        <<: *commonErrors
        '200':
          description: PDA activated. 409 ERR-G11-PDA-NOT-CERTIFIED if not certified.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pda' }

  # --------------------------------------------------------------------------
  # FR-G11-22 Provisional Pension
  # --------------------------------------------------------------------------
  /pension/cases/{id}/provisional-pension:
    post:
      tags: [Provisional]
      summary: Create provisional pension (Rule 9) + withhold DCRG
      operationId: createProvisionalPension
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProvisionalPensionRequest' }
      responses:
        <<: *commonErrors
        '201':
          description: Provisional pension created; DCRG fully withheld
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisionalPension' }
    get:
      tags: [Provisional]
      summary: Provisional pension detail
      operationId: getProvisionalPension
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        <<: *commonErrors
        '200':
          description: Provisional pension detail
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisionalPension' }

  /pension/cases/{id}/provisional-pension:conclude:
    post:
      tags: [Provisional]
      summary: Conclude on G09 decision → regularise / recover
      operationId: concludeProvisionalPension
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [CONCLUDED_REGULARISED, CONCLUDED_RECOVERY] }
                proceedings_concluded_on: { type: string, format: date }
                reason: { type: string }
      responses:
        <<: *commonErrors
        '200':
          description: Concluded. 409 ERR-G11-PROVISIONAL-PENDING if proceedings still open.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisionalPension' }

  # --------------------------------------------------------------------------
  # FR-G11-23 Audit Objections
  # --------------------------------------------------------------------------
  /pension/audit-objections:
    post:
      tags: [AuditObjections]
      summary: Raise an audit objection (AG / internal audit)
      operationId: createAuditObjection
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditObjectionRequest' }
      responses:
        <<: *commonErrors
        '201':
          description: Objection raised
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditObjection' }

  /pension/audit-objections/{id}:
    get:
      tags: [AuditObjections]
      summary: Objection detail
      operationId: getAuditObjection
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        <<: *commonErrors
        '200':
          description: Objection detail
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditObjection' }

  /pension/audit-objections/{id}:respond:
    post:
      tags: [AuditObjections]
      summary: Record a response to an objection
      operationId: respondAuditObjection
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response_text]
              properties:
                response_text: { type: string }
                document_ref: { type: [string, "null"] }
      responses:
        <<: *commonErrors
        '200':
          description: Response recorded
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditObjection' }

  /pension/audit-objections/{id}:close:
    post:
      tags: [AuditObjections]
      summary: Close objection with outcome
      operationId: closeAuditObjection
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [ACCEPTED, DROPPED, CLOSED] }
                reason: { type: string }
      responses:
        <<: *commonErrors
        '200':
          description: Objection closed
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditObjection' }

  # --------------------------------------------------------------------------
  # FR-G11-24 Digital Delivery
  # --------------------------------------------------------------------------
  /pension/ppos/{id}:deliver-digilocker:
    post:
      tags: [DigitalDelivery]
      summary: Push e-PPO to DigiLocker (X.3)
      operationId: deliverPpoToDigilocker
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        <<: *commonErrors
        '202':
          description: Delivery accepted (X.3). 412 ERR-PRECOND if DigiLocker unavailable.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryStatus' }

  /pension/revisions/{id}:deliver-digilocker:
    post:
      tags: [DigitalDelivery]
      summary: Push a revision order to DigiLocker (X.3)
      operationId: deliverRevisionToDigilocker
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        <<: *commonErrors
        '202':
          description: Delivery accepted (X.3)
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryStatus' }

  /pension/ppos/{id}/delivery-status:
    get:
      tags: [DigitalDelivery]
      summary: e-PPO delivery status
      operationId: getPpoDeliveryStatus
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        <<: *commonErrors
        '200':
          description: Delivery status
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryStatus' }

  /pension/pensioners/{id}:link-aadhaar-pran:
    post:
      tags: [DigitalDelivery]
      summary: Link Aadhaar / PRAN to the pensioner (UIDAI/CRA over X.3)
      operationId: linkAadhaarPran
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                aadhaar: { type: [string, "null"], description: Tier-1 PII; masked on serialization by P02 }
                pran: { type: [string, "null"] }
      responses:
        <<: *commonErrors
        '200':
          description: Linkage recorded (values masked by P02)
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pensioner' }

  # --------------------------------------------------------------------------
  # §8.7 SR Writer — canonical write-port (G11 as SR writer)
  # --------------------------------------------------------------------------
  /sr/ingest:
    post:
      tags: [ServiceRegister]
      summary: >
        Post a separation/superannuation life event to the canonical G12 SR write-port
        (dedup tuple + fact_key; source_module="G11")
      operationId: srIngest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SrIngestRequest' }
      responses:
        <<: *commonErrors
        '201':
          description: >
            SR event appended (all-or-nothing with the closure/sanction commit; P05 captures the
            mutation). 409 on dedup-tuple replay returning the original sr_event_id;
            422 SR_FACT_KEY_REQUIRED if a qualifying-service-bearing event omits fact_key.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SrIngestResult' }

  /sr/ingest/reversal:
    post:
      tags: [ServiceRegister]
      summary: Post a supersede-only reversal/correction (is_reversal=true) to the SR write-port
      operationId: srIngestReversal
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SrReversalRequest' }
      responses:
        <<: *commonErrors
        '201':
          description: Reversal appended; G12 auto-spawns the corrigendum
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SrIngestResult' }

# ============================================================================
# COMPONENTS
# ============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Bearer JWT carrying resolved roles + tenant/entity scope; permissions resolved per request
        by P02 (Authorization.check). MFA enforced for high-privilege statutory roles.

  headers:
    CorrelationId:
      description: Echoed request/response correlation id, written to every P05 audit and log line.
      schema: { type: string }

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RuleTable:
      name: table
      in: path
      required: true
      description: Effective-dated rule table (E30–E36)
      schema:
        type: string
        enum:
          - da-relief-rates
          - commutation-factors
          - family-pension-rates
          - gratuity-ceilings
          - retirement-age-rules
          - pension-limit-rules
          - rounding-rules
    Limit:
      name: limit
      in: query
      required: false
      description: Page size (cursor pagination). Default 25, max 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque forward cursor (from a prior response next_cursor).
      schema: { type: string }
    Sort:
      name: sort
      in: query
      required: false
      description: 'Sort spec, e.g. field:asc|desc'
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required on transaction-creating POSTs; a repeat within 24h returns the original result.
      schema: { type: string }

  responses:
    Unauthenticated:
      description: 401 UNAUTHENTICATED — no/invalid/expired session.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 403 FORBIDDEN — role/scope/SoD/PII-ceiling denial (P02); never leaks out-of-scope existence.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 404 NOT_FOUND — resource absent or out of the caller's scope.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: >
        409 CONFLICT — idempotency replay / duplicate workflow start, or a G11 domain state conflict:
        ERR-G11-DUP-CASE, ERR-G11-SERVICE-GAP, ERR-G11-VERIFICATION-INCOMPLETE, ERR-G11-DISCREPANCY-OPEN,
        ERR-G11-SPELL-NOT-ATTESTED, ERR-G11-FP-NOT-NOMINEE, ERR-G11-RECOVERY-PROTECTION,
        ERR-G11-SCHEME-MISMATCH, ERR-G11-CASE-NOT-SANCTIONED, ERR-G11-DUP-PPO, ERR-G11-CASE-LOCKED-OPTIONS,
        ERR-G11-REVISION-IMMUTABLE, ERR-G11-LC-SUSPENDED, ERR-G11-PROVISIONAL-PENDING,
        ERR-G11-PDA-NOT-CERTIFIED, ERR-G11-AUDIT-OBJECTION-OPEN, ERR-G11-DRAWN-AFTER-DEATH.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionFailed:
      description: >
        412 PRECONDITION_FAILED — a required precondition unmet (ERR-PRECOND), or an upstream
        (G03/G10/G12/PDA/DigiLocker/registry) temporarily unavailable after X.3 retry (retryable).
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: >
        422 VALIDATION_FAILED — VAL-* / domain input failure: CASE_INPUT_INCOMPLETE, ERR-G11-EMOLUMENTS,
        ERR-G11-RULE-NOT-EFFECTIVE, ERR-G11-COMMUTATION-LIMIT, ERR-G11-FACTOR-NOT-FOUND,
        ERR-G11-NOMINEE-SPLIT, ERR-G11-TAX-RULE, ERR-G11-INVALID-ACCOUNT, ERR-G11-ACCOUNT-VERIFY.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: 429 RATE_LIMITED — rate limit / lockout exceeded.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Internal:
      description: 500 INTERNAL — unexpected server error or non-retryable upstream failure (ERR-LOADFAIL).
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    # ---- Envelope & primitives ---------------------------------------------
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: One of the 8 platform wire codes, or a registered domain/ERR-G11-* code.
              enum:
                - VALIDATION_FAILED
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - PRECONDITION_FAILED
                - RATE_LIMITED
                - INTERNAL
            message: { type: string }
            field: { type: [string, "null"] }
            details:
              type: [object, "null"]
              description: 'Structured discriminators, e.g. { reason: ERR-G11-COMMUTATION-LIMIT }.'
              additionalProperties: true
      additionalProperties: false

    Money:
      type: string
      description: NUMERIC money as a decimal string (2 dp, INR).
      pattern: '^-?\d+\.\d{2}$'
      examples: ['56000.00']

    Rate:
      type: string
      description: NUMERIC(9,4) rate/factor as a decimal string.
      pattern: '^-?\d+(\.\d{1,4})?$'

    PageMeta:
      type: object
      properties:
        next_cursor:
          type: [string, "null"]
          description: Forward cursor for the next page; null when exhausted.

    AuditFields:
      type: object
      properties:
        tenant_id: { type: string, format: uuid }
        entity_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_by: { type: [string, "null"], format: uuid }
        updated_by: { type: [string, "null"], format: uuid }
        is_deleted: { type: boolean }

    # ---- Enums -------------------------------------------------------------
    SeparationType:
      type: string
      enum: [SUPERANNUATION, VOLUNTARY_RETIREMENT, COMPULSORY_RETIREMENT, INVALIDATION, DEATH_IN_SERVICE, RESIGNATION]
    PensionScheme:
      type: string
      enum: [OPS, NPS, UPS]
    BenefitOutcome:
      type: string
      enum: [FULL_PENSION, SERVICE_GRATUITY_ONLY, NPS_DEFAULT_FAMILY, NPS_DEFAULT_INVALID, UPS_ASSURED, NPS_INDICATIVE]
    EmolumentsMethod:
      type: string
      enum: [LAST_DRAWN, AVG_10_MONTH, BENEFICIAL_OF_BOTH, AVG_12_MONTH]
    GratuityType:
      type: string
      enum: [RETIREMENT_GRATUITY, DEATH_GRATUITY, SERVICE_GRATUITY]
    PpoType:
      type: string
      enum: [SERVICE_PENSION, FAMILY_PENSION, ANTICIPATORY, PROVISIONAL, REVISED]
    EnhancedBasis:
      type: string
      enum: [IN_SERVICE, AFTER_RETIREMENT]
    PdaDisbursementModel:
      type: string
      enum: [M11_COMPUTES_FULL, PDA_APPLIES_RELIEF]
    DeathDetectedSource:
      type: string
      enum: [REPORTED, DEATH_REGISTRY, DBT_ANOMALY, LC_FAILURE]
    PriorServiceType:
      type: string
      enum: [MILITARY, PRIOR_CENTRAL, PRIOR_STATE, PRIOR_TEMPORARY, AUTONOMOUS_BODY]
    Relationship:
      type: string
      enum: [SPOUSE, SON, DAUGHTER, FATHER, MOTHER, DISABLED_CHILD, WIDOWED_DAUGHTER, DEPENDENT_SIBLING, OTHER]
    CaseStatus:
      type: string
      enum: [DRAFT, INITIATED, SR_VERIFICATION, NO_DUES, CALCULATION, PENDING_SANCTION, SANCTIONED, PPO_ISSUED, SETTLED, CLOSED, ON_HOLD, REJECTED]
    NoDuesStatus:
      type: string
      enum: [NOT_STARTED, IN_PROGRESS, CLEARED, BLOCKED]
    AccountVerifyResult:
      type: string
      enum: [PENDING, MATCH, NAME_MISMATCH, ACCOUNT_INVALID, FAILED]
    RuleRowStatus:
      type: string
      enum: [DRAFT, APPROVED, EFFECTIVE, SUPERSEDED]

    # ---- Requests ----------------------------------------------------------
    ReasonRequest:
      type: object
      properties:
        reason: { type: [string, "null"] }
    WorkflowActionRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [advance, sendBack, cancel] }
        target_status: { type: [string, "null"] }
        reason: { type: [string, "null"] }
    SanctionRequest:
      type: object
      properties:
        decision: { type: string, enum: [approve, reject], default: approve }
        reason: { type: [string, "null"] }
    CreateCaseRequest:
      type: object
      required: [employee_id, separation_type, retirement_date]
      properties:
        employee_id: { type: string, format: uuid }
        separation_type: { $ref: '#/components/schemas/SeparationType' }
