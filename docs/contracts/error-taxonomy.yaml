# -----------------------------------------------------------------------------
# 5. GOVERNANCE RULES
# -----------------------------------------------------------------------------
rules:
  registration:
    - "A new error code MUST be registered in this file BEFORE any service emits it."
    - "New module codes follow ERR-G##-* (or an explicit registered bare/domain code, e.g. G06 SENIORITY_*, G12 SR_*)."
    - "New shared/system copy follows ERR-<area> / MSG-SYS-* and is added to shared_codes."
  mapping:
    - "Every code maps to EXACTLY ONE of the 8 standard_codes HTTP statuses."
    - "The wire error.code is either a standard_code OR a module/domain code carried in error.code; the message id resolves user copy."
    - "No invented non-platform HTTP codes: no 400, no 423, no 502, no 503."
    - "No non-platform code names: no VALIDATION_ERROR, AUTH_REQUIRED, INTERNAL_ERROR, UPSTREAM_UNAVAILABLE."
  status_503_policy:
    - "503 / UPSTREAM / service-unavailable is forbidden on the wire."
    - "Retryable upstream failure -> PRECONDITION_FAILED (412) (X.3 retry path, e.g. ERR-G04-SR-UNAVAILABLE, ERR-G10-SIGNING-DOWN, SR_POSTING_FAILED)."
    - "Non-retryable service/KMS/PKI failure -> INTERNAL (500) with ERR-LOADFAIL (e.g. ERR-G13-*_SERVICE_UNAVAILABLE, ERR-G14-MART-REFRESH)."
  collision_policy:
    - "Cross-module code collisions are resolved by namespacing: ERR-G09-SIGNATURE-INVALID, ERR-G12-SIGNATURE-INVALID, ERR-G13-SIGNATURE_INVALID are distinct codes."
  scope_safety:
    - "403 FORBIDDEN and 404 NOT_FOUND must never reveal the existence of out-of-scope records (P02)."
  notice_surfaces:
    - "Codes tagged (notice_surface) additionally have a 200 partial-data/notice in-app presentation; the wire status listed here is the canonical error mapping when returned as an error."
