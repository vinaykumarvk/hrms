# Hard resolver cases consumed by PH-02D (authority-resolution test suite). Additive and revertible:
# each row is a self-contained fixture with inputs, the expected resolver output, and the resolver_type
# from docs/spec/hrms-authority-model.yaml that governs it. No test-only bypasses.
hard_resolver_cases:
  vacant_manager:
    resolver_type: REPORTING_CHAIN            # primary
    fallback_resolver: ORG_UNIT_HEAD          # applied because direct manager is VACANT
    use_case: G03 leave approval when the direct reporting-manager position is unfilled.
    inputs:
      tenant_id: 11111111-1111-1111-1111-111111111111
      entity_id: 22222222-2222-2222-2222-222222222201
      subject_employee_id: 99999999-9999-9999-9999-999999999903
      subject_position_id: POS-REV-AS-06
      reports_to_position_id: POS-REV-DC-01
      hierarchy_state:
        # POS-REV-DC-01 is VACANT: no active employee_job_assignment holds it as of as_of.
        direct_reporting_manager_id: null
        direct_manager_position_vacant: true
        org_unit_head_source: g01_authority_assignments   # G03_LEAVE_HEAD_ASSESSMENT
      as_of: 2026-07-15
    expected:
      resolved_assignee: 99999999-9999-9999-9999-999999999901   # org-unit head via fallback
      resolver_type: REPORTING_CHAIN
      fallback_applied: true
      fallback_path: [g01_authority_assignments, org_units.head_employee_id, parent_org_unit]
      fail_closed: false
      note: >
        REPORTING_CHAIN primary source is null (manager position vacant); resolution deterministically
        falls back to ORG_UNIT_HEAD per docs/spec/hrms-authority-model.yaml fallback_order. It must never
        guess a peer or skip to an arbitrary employee — the org-unit head is chosen, not inferred.
  cross_entity_authority:
    resolver_type: STATUTORY_AUTHORITY
    use_case: >
      G05 transfer sanction where the competent authority sits in a DIFFERENT ENTITY from the subject,
      permitted only by the Org-Admin widened-scope rule and never across tenants.
    inputs:
      tenant_id: 11111111-1111-1111-1111-111111111111
      subject_entity_id: 22222222-2222-2222-2222-222222222201
      authority_entity_id: 22222222-2222-2222-2222-222222222202   # different entity, same tenant
      subject_employee_id: 99999999-9999-9999-9999-999999999902
      authority_code: G05_TRANSFER_REVENUE
      authority_type: TRANSFER_AUTHORITY
      scope_type: ORG_UNIT
      org_admin_widened_scope: true          # entity-202 authority is scoped to cover entity-201 org unit
      as_of: 2026-07-15
      decoy_rows:
        # A same-role holder in a DIFFERENT TENANT must never be selected (tenant isolation).
        - tenant_id: 11111111-1111-1111-1111-111111111199
          authority_code: G05_TRANSFER_REVENUE
          expected_selectable: false
    expected:
      resolved_assignee: 99999999-9999-9999-9999-999999999904   # authority holder in entity-202
      resolver_type: STATUTORY_AUTHORITY
      cross_entity: true
      cross_tenant: false
      fail_closed: false
      note: >
        Cross-entity resolution is allowed ONLY because the Org-Admin widened the authority scope within
        the same tenant. Selection respects tenant/entity scoping: the different-tenant decoy row is
        rejected. No candidate is ever resolved across tenant_id boundaries.

data_quality_assertions:
  - Current reporting-chain fixture has one non-null reporting_manager_id.
  - G05 transfer authority has exactly one active priority-10 row for the fixture org unit.
  - Active delegation windows have from_employee_id != to_employee_id.
  - Committee quorum is positive and active required members meet or exceed quorum.
  - No fixture bypasses tenant_id/entity_id scoping.
  - Vacant-manager case has no active assignment on the direct reporting-manager position, and fallback
    resolves the org-unit head deterministically (fallback_applied=true) rather than a guessed peer.
  - Cross-entity-authority case resolves only within a single tenant under Org-Admin widened scope, and a
    same-role authority row in a different tenant is never selectable.

out_of_scope:
  - Full production employee master load.
  - Full authority import from government service books.
  - Historical migration of PUDA workflow cases.
