read_this_first:
  purpose: >
    This plan freezes the build sequence and the first architectural move: reuse
    the PUDA workflow investment without creating a permanent copy-paste fork.
  glossary:
    P01: Workflow runtime and process-definition platform.
    P02: Authorization, role, field-scope, and row-scope enforcement.
    P05: Tamper-evident audit evidence for mutations and security events.
    W1: Versioned workflow configuration and publish governance.
    G01: Employee master and position/person identity source.
    G03: Leave and attendance.
    G05: Transfer, relieving, and joining.
    G12: Digital service register ledger.
    G13: Document vault and attachment metadata.
    SR: Service Register, the authoritative employee service-history ledger.
    SoD: Segregation of duties, including no-self-approval.
    RLS: PostgreSQL row-level security.
    PUDA_adapter: Layer that preserves existing PUDA semantics while using the extracted runtime.
    HRMS_adapter: Layer that connects the extracted runtime to HRMS employees, hierarchy, SR, documents, audit, and notifications.
  platform_assumption_resolution: >
    Existing HRMS artefacts define P01 as the target platform contract. They do
    not prove that a production-ready reusable P01 implementation already exists.
    PUDA is the implementation seed. PH-00 and PH-01 are therefore mandatory:
    they convert PUDA behavior into a reusable platform boundary and reconcile
    the HRMS P01 contract/schema before broad module build begins.

architecture_decisions:
  - id: ADR-HRMS-001
    decision: Extract PUDA workflow runtime into a reusable workflow platform.
    rationale: >
      PUDA already has a working workflow runtime, queues, waits, fork/join,
      references, config publishing, simulation, and admin UI. Copying would
      create a fork; a separate network service now would add distributed
      transactions before the boundary is stable.
  - id: ADR-HRMS-002
    decision: Embed the extracted workflow platform in the HRMS modulith for release 1.
    rationale: >
      HRMS has tight ACID coupling between workflow decisions, employee master,
      SR ledger, documents, audit, and statutory module writes.
  - id: ADR-HRMS-003
    decision: Add a generic Authority Resolution Service before HRMS feature build.
    rationale: >
      HRMS workflow value is mostly hierarchy and authority resolution:
      reporting chain, position authority, org-unit heads, committees, acting
      charge, delegation, and SoD.
  - id: ADR-HRMS-004
    decision: Use G03 leave and G05 transfer as workflow-platform exit slices.
    rationale: >
      G03 proves simple reporting-chain approval; G05 proves hierarchy,
      parallel clearances, deemed outcomes, document output, and SR side effects.

workflow_platform_governance:
  ownership_model: >
    Shared platform capability owned by the HRMS platform team for release 1,
    with PUDA treated as the first consuming adapter and HRMS as the second.
  repository_policy: >
    Start extraction behind a thin strangler boundary inside the PUDA repo. Create
    /Users/n15318/workflow-platform only after PUDA golden tests pass through the
    boundary and the package split has an approved contract.
  release_policy:
    versioning: Semantic versioning for public runtime APIs, storage schema, config schema, and adapter SPI.
    compatibility: Adapter compatibility tests must pass for PUDA and HRMS before any platform release is accepted.
    security_patching: Critical workflow/security fixes patch the platform first, then adapters; no private downstream patches.
    contribution_rule: Domain-specific logic must enter adapters or modules, never workflow-core.
    provenance_rule: Every extracted file records source path, commit, license/provenance note, and domain-code disposition.
  reusable_conformance_suite:
    - workflow start, action, reject, send-back, cancel, delegate, and query
    - wait states, fork/join, references, SLA timers, and version pinning
    - config validation, review, publish, simulation, and evidence export
    - adapter SPI tests for actors, resolvers, documents, audit, notification, and side effects

migration_and_coexistence_stream:
  principle: >
    Migration is not a release-end activity. Historical employee records,
    documents, SR entries, pending approvals, authority assignments, and audit
    trails must be profiled early, staged safely, reconciled, and legally
    certified before cutover.
  starts_in: PH-00
  required_for_cutover: PH-10
  work_items:
    - inventory current HRMS, PUDA, and legacy workflow states where available
    - define employee/person/document/SR identity matching and deduplication rules
    - define pending approval import policy: migrate, close, restart, or keep external
    - define authority assignment history import with as-of validity and rule provenance
    - build reconciliation reports for employee master, service history, documents, and workflow cases
    - preserve original audit evidence and record certification evidence for transformed records
    - run dry migrations against anonymized and production-like datasets before UAT

delivery_controls:
  critical_path: [PH-00, PH-01, PH-02, PH-03, PH-04, PH-05, PH-06]
  gating_model:
    default: agentic_gate
    agentic_gate: >
      A phase auto-advances when its executable exit criteria pass outside the model, structural evidence is
      recorded in the manifest, and no critical-decision trigger fires.
    human_gate_only_when:
      - Architecture strategy changes beyond the approved modulith/workflow-platform plan.
      - A phase requires copying, extracting, distributing, or productizing code whose legal/provenance/IP status cannot be verified.
      - Destructive or irreversible data/schema/migration operations are required.
      - Security, auth, RBAC, RLS, PII, or audit policy would be weakened or materially changed.
      - Production, UAT, go-live, cutover, or rollback approval is required.
      - The phase has prose-only evidence and no executable oracle.
      - A RED gate requires explicit risk acceptance after repair attempts.
  rule: >
    Do not start broad module implementation until gate_3_vertical_slice_exit
    passes. G03 and G05 are the proof that the workflow platform, hierarchy,
    audit, documents, notifications, and SR ledger work together.
  initial_team:
    - role: platform architect
      focus: workflow boundary, governance, contract freeze, review gates
    - role: senior backend engineer
      focus: PUDA runtime extraction and workflow-core tests
    - role: senior backend engineer
      focus: workflow-postgres, HRMS adapter, P01 API
    - role: database engineer
      focus: P01 schema amendments, RLS, migration staging, SR conformance
    - role: QA automation engineer
      focus: golden tests, conformance suite, G03/G05 e2e evidence
    - role: frontend engineer
      focus: inbox/task UI first; advanced workflow config UI only after backend proof
  fixture_packs:
    puda_golden_workflows: simple workflow, wait workflow, fork/join workflow, reference workflow
    hrms_authority_hierarchy: tenant, entity, org units, positions, employee assignments, delegations, acting charge
    g03_leave_slice: employee, manager, leave type, balance ledger, delegation, SR outbox
    g05_transfer_slice: authority matrix, transfer order, clearances, relieving, joining, document, SR event
    sr_conformance: idempotency, semantic deduplication, reversal, corrigendum, audit evidence
    migration_coexistence: historical employee, service-history, document, pending-case, and audit samples
  ci_command_contracts:
    note: These are planned command contracts; exact package-manager syntax is finalized when the repo scaffold is created.
    commands:
      - workflow-core unit tests
      - workflow-postgres integration tests against PostgreSQL with RLS enabled
      - P01 OpenAPI contract validation
      - HRMS API unit, integration, and security tests
      - HRMS web unit, accessibility, and e2e tests
      - schema load with ON_ERROR_STOP and migration rollback rehearsal
      - SR conformance suite for every writer

