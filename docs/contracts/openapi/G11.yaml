        pension_scheme: { $ref: '#/components/schemas/PensionScheme' }
        ups_opted_in: { type: boolean, default: false }
        proceedings_pending: { type: boolean, default: false }
        proceedings_ref: { type: [string, "null"] }
        reason_ref: { type: [string, "null"] }
        notice_date: { type: [string, "null"], format: date }
        org_unit_id: { type: string, format: uuid }
        initiated_by_role: { type: string, enum: [SELF, HR, SYSTEM_FORECAST, DISCIPLINARY_G09] }
    UpdateCaseRequest:
      type: object
      properties:
        pension_scheme: { $ref: '#/components/schemas/PensionScheme' }
