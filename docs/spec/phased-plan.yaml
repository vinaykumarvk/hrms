    implementation_steps:
      - Add workflow-platform dependency as workspace/path dependency.
      - Implement HRMS workflow adapter repositories and transaction boundary.
      - Implement AuthorityResolver.resolve with REPORTING_CHAIN, POSITION_AUTHORITY, ORG_UNIT_HEAD, NAMED_ROLE, NAMED_USER, WORK_QUEUE, COMMITTEE, and DELEGATION_OR_ACTING_CHARGE.
      - Implement G12 sr_ingest with idempotency, semantic dedup, provenance, source-driven reversal, and append-only persistence.
      - Implement G13 document metadata and storage adapter with legal hold and retention hooks.
      - Implement G01 service APIs for read-only master lookup and governed changes.
      - Implement read-only migration staging loaders and reconciliation reports for employee identity, SR history, documents, and legacy workflow cases.
      - Persist authority-resolution evidence with each workflow assignment and action.
    generated_tests:
      unit:
        - authority resolver precedence
        - SR semantic-dedup
        - document legal-hold blocks disposal
        - P02 field masking serialization
      integration:
        - workflow start -> task -> approve -> action/audit row
