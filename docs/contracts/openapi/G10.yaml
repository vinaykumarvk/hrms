# Generated for G10 Payroll & Benefits (Phase-2). Source: docs/brd/v3/G10-payroll-and-benefits.md
openapi: 3.1.0
info:
  title: G10 — Payroll and Benefits Management API
  version: 3.1.0
  x-ph09-compensation-wave: deterministic-payroll-rule-snapshot
  description: '**Phase-2** government-HRMS module **G10 — Payroll and Benefits Management**, a platform-native
    extension of the PrimeSoft HRMS platform (M06/M07/M14 roadmap). Grounded in docs/brd/v3/G10-payroll-and-benefits.md
    (Section 6 FR API tables + Section 8), docs/contracts/error-taxonomy.yaml (ERR-G10-*) and docs/brd/PLATFORM_FOUNDATION.md
    §4.


    Cross-cutting concerns run on platform engines: approvals/locking on P01, authorization/SoD on P02,
    audit on P05, jobs on X.1, notifications on X.2, integrations on X.3. Every endpoint is enforced by
    P02 `Authorization.check` with strict SoD (Payroll Officer ≠ Approver ≠ Disburser). Money fields are
    NUMERIC fixed-point (modelled as strings to preserve precision). The G10→G12 SR posting endpoints
    (`/sr/ingest*`, FR-G10-23) are **deferred build / Phase-2** — contracted, not yet implemented.'
  contact:
    name: API Architecture / Platform Foundation
servers:
- url: /api/v1
  description: All endpoints are served under the /api/v1 base path.
security:
- bearerAuth: []
tags:
- name: Pay Components & Rules
- name: Rate Tables & Pay Matrix
- name: Salary Structures
- name: Payroll Runs
- name: Time & Leave Inputs
- name: Deductions
- name: Tax Declarations
- name: Loans & Advances
- name: Recoveries
- name: Arrears
- name: Supplementary & Off-Cycle
- name: Benefits
- name: Payslips
- name: Bank Disbursement
- name: Reconciliation
- name: Approval & Locking
- name: Statutory Outputs
- name: Analytics
- name: Remittance & GL
- name: Full-and-Final Settlement
- name: Perquisites
- name: Run Input Snapshots
- name: Service Register Posting
