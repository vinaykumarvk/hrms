    get:
      tags: [letter-generation]
      summary: Get a letter-generation request
      operationId: getLetterGenerationRequest
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: The letter request.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LetterGenerationRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /letter-generation-requests/{id}:resolve-merge:
    post:
      tags: [letter-generation]
      summary: Resolve merge fields for a letter request
      description: >
        Resolves every `{{token}}` against `merge_field_catalog` sources. Unresolved tokens leave the
        request at `VALIDATION_ERROR` with `validation_error` populated and fail 422
        `ERR-G13-METADATA_INVALID`. RECON v3.2. FR-G13-010.
      operationId: resolveLetterMergeFields
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Merge resolution result (all tokens resolved).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MergeResolutionResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /letter-generation-requests/{id}:generate:
    post:
      tags: [letter-generation]
      summary: Generate the letter document
      description: >
        Renders the letter through `DocumentGen` after every merge token resolves; produces a
        `documents` row (`generated_document_id`). Unresolved tokens ⇒ 422 `ERR-G13-METADATA_INVALID`
        (request → `VALIDATION_ERROR`). RECON v3.2. FR-G13-010.
      operationId: generateLetter
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LetterGenerateRequest' }
      responses:
        '200':
          description: Letter generated (document produced; may await signature).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LetterGenerationRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '500': { $ref: '#/components/responses/InternalError' }

  /letter-generation-requests/{id}:sign:
    post:
      tags: [letter-generation]
      summary: Sign a generated letter
      description: >
        Routes the generated letter to the `DocumentGen` sign-off flow (creates/advances a
        `signature_requests` envelope). Method must be in the type's allowed list ⇒ else 422
        `ERR-G13-SIGNATURE_METHOD_NOT_ALLOWED`; tamper ⇒ 422 `ERR-G13-SIGNATURE_INVALID`; missing LTV ⇒
        422 `ERR-G13-SIGNATURE_LTV_REQUIRED`; PKI/eSign down ⇒ 500 `ERR-G13-SIGNING_SERVICE_UNAVAILABLE`.
        RECON v3.2. FR-G13-010.
      operationId: signLetter
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LetterSignRequest' }
      responses:
        '200':
          description: Signature applied/advanced (request may become ISSUED on the last signer).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LetterGenerationRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

