meta:
  plan_id: HRMS-DEV-PLAN-v1
  title: Government HRMS Development, Testing, and Implementation Plan
  status: final_after_adversarial_evaluation
  generated_on: "2026-07-01"
  classification: standard
  objective: >
    Build the Government HRMS as a modular monolith on a reusable workflow
    platform extracted from the PUDA workflow engine, then implement the 14 HRMS
    modules in dependency order using the existing BRDs, data model, contracts,
    and PUDA workflow assets.
  primary_decision:
    - Do not copy PUDA workflow code into HRMS.
    - Extract a reusable workflow platform from PUDA.
    - Prove a thin PUDA strangler boundary and golden behavior before creating
      the shared workflow-platform package.
    - Embed that platform in HRMS for the first release.
    - Keep a later network-deployed workflow service as an option only after the
      platform API, schema, and adapter boundaries are stable.
  adversarial_evaluation:
    report: doc/evaluations/hrms-development-plan-council-report-20260701.md
    incorporated_recommendations:
      - split PH-00 into proof-oriented extraction increments
      - add workflow platform ownership, semver, compatibility, and security policy
      - make immutable authority-resolution evidence a platform requirement
      - start legacy migration/coexistence planning before release hardening
      - clarify that PH-02 is contract/schema/fixture preparation, not full G01 implementation
      - defer advanced workflow configuration UI until after backend proof slices
  source_artifacts:
    hrms:
      - docs/architecture.md
      - docs/phased-plan.md
      - docs/brd/PLATFORM_FOUNDATION.md
      - docs/brd/MODULE_RECONCILIATION.md
      - docs/contracts/dependency-register.yaml
      - docs/contracts/state-machines.yaml
      - docs/contracts/auth-matrix.yaml
      - docs/contracts/openapi/G01.yaml
      - docs/contracts/openapi/G02.yaml
      - docs/contracts/openapi/G03.yaml
      - docs/contracts/openapi/G04.yaml
      - docs/contracts/openapi/G05.yaml
      - docs/contracts/openapi/G06.yaml
      - docs/contracts/openapi/G07.yaml
      - docs/contracts/openapi/G08.yaml
      - docs/contracts/openapi/G09.yaml
      - docs/contracts/openapi/G10.yaml
      - docs/contracts/openapi/G11.yaml
      - docs/contracts/openapi/G12.yaml
      - docs/contracts/openapi/G13.yaml
      - docs/contracts/openapi/G14.yaml
      - docs/data-model/00-platform-core.sql
      - docs/data-model/01-G01-employee-profile.sql
      - docs/data-model/12-G12-digital-service-register.sql
      - docs/data-model/13-G13-document-management.sql
