              schema: { $ref: '#/components/schemas/LegalHold' }
        '409':
          description: '`SR_LEGAL_HOLD_ACTIVE` — conflicting hold/tiering state.'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
