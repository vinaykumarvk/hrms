          items: { $ref: '#/components/schemas/MartHealth' }
    ReconciliationExplainer:
      type: object
      properties:
        kpi_code: { type: string }
        scope: { type: [string, "null"] }
        period: { type: [string, "null"] }
        data_as_of: { type: [string, "null"], format: date-time }
        watermark: { type: [string, "null"] }
        source_value: { type: [number, "null"] }
        mart_value: { type: [number, "null"] }
        variance: { type: [number, "null"] }
        within_tolerance: { type: [boolean, "null"] }
        narrative: { type: [string, "null"], description: Role-adaptive explanation of any difference. }

    # ---- Prediction models & results (E14/E15) --------------------------
    PredictionModel:
      type: object
      properties:
        model_id: { type: string, format: uuid }
        model_code: { type: string }
        model_type: { type: string, enum: [RULE_BASED, STATISTICAL, ML] }
        determinism: { type: string, enum: [DETERMINISTIC, PROBABILISTIC] }
        version: { type: string }
        features_json: { type: object, additionalProperties: true }
        protected_features_excluded:
          type: array
          items: { type: string }
        methodology: { type: string }
        model_card_ref: { type: [string, "null"], format: uuid }
        adverse_impact_result: { type: [object, "null"], additionalProperties: true }
        fairness_status: { type: string, enum: [NOT_ASSESSED, PASSED, FAILED, WAIVED_WITH_REASON] }
        intended_use: { type: string }
        prohibited_use: { type: string }
        source_mart_ids:
          type: array
          items: { type: string, format: uuid }
        confidence_basis: { type: [string, "null"] }
        status: { $ref: '#/components/schemas/KpiStatus' }
        approved_by: { type: [string, "null"], format: uuid }
    PredictionModelCreate:
      type: object
      required: [model_code, model_type, determinism, version, features_json, methodology, intended_use, prohibited_use, source_mart_ids]
      properties:
        model_code: { type: string }
        model_type: { type: string, enum: [RULE_BASED, STATISTICAL, ML] }
        determinism: { type: string, enum: [DETERMINISTIC, PROBABILISTIC] }
        version: { type: string }
        features_json: { type: object, additionalProperties: true }
        protected_features_excluded:
          type: array
          items: { type: string }
        methodology: { type: string }
        model_card_ref: { type: [string, "null"], format: uuid }
        intended_use: { type: string }
        prohibited_use: { type: string }
        source_mart_ids:
          type: array
          items: { type: string, format: uuid }
        confidence_basis: { type: [string, "null"] }
    PredictionModelPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PredictionModel' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    FairnessAssessmentRequest:
      type: object
      properties:
        test_config_json: { type: [object, "null"], additionalProperties: true }
        waiver_reason: { type: [string, "null"] }
    IndividualPredictionRequest:
      type: object
      required: [model_id, subject_id, purpose_text]
      properties:
        model_id: { type: string, format: uuid }
        subject_id: { type: string }
        purpose_text:
          type: string
          description: Documented purpose (friction-gate; captured to the access log).
    PredictionResult:
      type: object
      properties:
        result_id: { type: string, format: uuid }
        model_id: { type: string, format: uuid }
        subject_type: { type: string, enum: [EMPLOYEE, ORG_UNIT, CADRE] }
        subject_id: { type: string }
        score: { type: number }
        risk_band: { $ref: '#/components/schemas/RiskBand' }
        top_factors_json: { type: [object, "null"], additionalProperties: true }
        confidence: { type: [number, "null"] }
        is_individual_gated: { type: boolean }
        period_key: { type: string }
        data_as_of: { type: string, format: date-time }
        prohibited_use_notice: { type: [string, "null"] }

    # ---- NL query (E20) --------------------------------------------------
    NlQueryRequest:
      type: object
      required: [question_text]
      properties:
        question_text: { type: string }
        scope: { type: [string, "null"] }
    NlQueryResult:
      type: object
      properties:
        nlq_id: { type: string, format: uuid }
        resolved_kpi_id: { type: [string, "null"], format: uuid }
        resolved_filters_json: { type: [object, "null"], additionalProperties: true }
        confidence: { type: number }
        outcome:
          type: string
          enum: [ANSWERED, CLARIFICATION_REQUESTED, REFUSED_LOW_CONFIDENCE, REFUSED_OUT_OF_SCOPE, REFUSED_UNMODELLED]
        clarification_prompt: { type: [string, "null"] }
        result: { $ref: '#/components/schemas/AnalyticsResult' }

    # ---- Embed tokens (E18) ---------------------------------------------
    EmbedToken:
      type: object
      properties:
        token_id: { type: string, format: uuid }
        widget_ids:
          type: array
          items: { type: string, format: uuid }
        subject_user_id: { type: [string, "null"], format: uuid }
        subject_role: { type: [string, "null"] }
        allowed_frame_ancestors:
          type: array
          items: { type: string }
        issued_by: { type: string, format: uuid }
        approved_by: { type: [string, "null"], format: uuid }
        expires_at: { type: string, format: date-time }
        rotated_from: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [PENDING_APPROVAL, ACTIVE, EXPIRED, REVOKED, ROTATED] }
        revoked_by: { type: [string, "null"], format: uuid }
        revoked_at: { type: [string, "null"], format: date-time }
    EmbedTokenCreate:
      type: object
      required: [widget_ids, allowed_frame_ancestors, expires_at]
      properties:
        widget_ids:
          type: array
          items: { type: string, format: uuid }
        subject_user_id: { type: [string, "null"], format: uuid }
        subject_role: { type: [string, "null"] }
        allowed_frame_ancestors:
          type: array
          items: { type: string }
        expires_at: { type: string, format: date-time }
    EmbedSession:
      type: object
      properties:
        session_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        widget_ids:
          type: array
          items: { type: string, format: uuid }

    # ---- Briefings (FR-16) ----------------------------------------------
    BriefingScheduleCreate:
      type: object
      required: [cron_expr, timezone, format, recipients_json]
      properties:
        cron_expr: { type: string }
        timezone: { type: string }
        format: { $ref: '#/components/schemas/ExportFormat' }
        recipients_json: { type: object, additionalProperties: true }
        dashboard_id: { type: [string, "null"], format: uuid }

    # ---- Suppression policy (E24) ---------------------------------------
    SuppressionPolicy:
      type: object
      properties:
        policy_id: { type: string, format: uuid }
        name: { type: string }
        applies_to: { type: string, enum: [TILE, CHART, DRILLTHROUGH, EXPORT, ALL] }
        min_cell_size_k: { type: integer }
        complementary: { type: boolean }
        band_instead_of_hide: { type: boolean }
        domains:
          type: [array, "null"]
          items: { type: string }
        is_active: { type: boolean }
    SuppressionPolicyCreate:
      type: object
      required: [name, applies_to, min_cell_size_k, complementary, band_instead_of_hide]
      properties:
        name: { type: string }
        applies_to: { type: string, enum: [TILE, CHART, DRILLTHROUGH, EXPORT, ALL] }
        min_cell_size_k: { type: integer, default: 5 }
        complementary: { type: boolean }
        band_instead_of_hide: { type: boolean }
        domains:
          type: [array, "null"]
          items: { type: string }
    SuppressionPolicyPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SuppressionPolicy' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    # ---- Establishment position (E21) -----------------------------------
    EstablishmentPosition:
      type: object
      properties:
        position_id: { type: string, format: uuid }
        position_code: { type: string }
        org_unit_id: { type: string, format: uuid }
        cadre: { type: string }
        designation_id: { type: string, format: uuid }
        sanctioned_strength: { type: integer }
        reservation_category: { type: [string, "null"] }
        roster_point: { type: [integer, "null"] }
        filled_by_employee_id: { type: [string, "null"], format: uuid }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, "null"], format: date }
        status: { type: string, enum: [SANCTIONED, FROZEN, ABOLISHED] }
        maintained_by: { type: string, format: uuid }
    EstablishmentPositionCreate:
      type: object
      required: [position_code, org_unit_id, cadre, designation_id, sanctioned_strength, effective_from]
      properties:
        position_code: { type: string }
        org_unit_id: { type: string, format: uuid }
        cadre: { type: string }
        designation_id: { type: string, format: uuid }
        sanctioned_strength: { type: integer, minimum: 0 }
        reservation_category: { type: [string, "null"] }
        roster_point: { type: [integer, "null"] }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, "null"], format: date }
    EstablishmentPositionPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EstablishmentPosition' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    VacancyBase:
      type: object
      properties:
        scope: { type: [string, "null"] }
        period: { type: [string, "null"] }
        sanctioned_strength: { type: integer }
        filled_count: { type: integer }
        vacant_count: { type: integer }
        by_reservation_category:
          type: array
          items:
            type: object
            additionalProperties: true

    # ---- DPDP data-subject change (E22) ---------------------------------
    DataSubjectChange:
      type: object
      properties:
        change_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        change_type: { type: string, enum: [RECTIFICATION, ERASURE, RESTRICTION] }
        source_event_ref: { type: string }
        requested_by: { type: string, format: uuid }
        legal_basis: { type: [string, "null"] }
        affected_marts:
          type: [array, "null"]
          items: { type: string }
        affected_snapshots: { type: [integer, "null"] }
        affected_predictions: { type: [integer, "null"] }
        affected_exports: { type: [integer, "null"] }
        status: { type: string, enum: [RECEIVED, PROPAGATING, COMPLETED, BLOCKED_RETENTION, FAILED] }
        completed_at: { type: [string, "null"], format: date-time }
    DataSubjectChangeCreate:
      type: object
      required: [employee_id, change_type, source_event_ref]
      properties:
        employee_id: { type: string, format: uuid }
        change_type: { type: string, enum: [RECTIFICATION, ERASURE, RESTRICTION] }
        source_event_ref: { type: string }

    # ---- Source data contract (E19) -------------------------------------
    SourceDataContract:
      type: object
      properties:
        contract_id: { type: string, format: uuid }
        source_module: { type: string }
        source_view: { type: string }
        version: { type: string }
        schema_json: { type: object, additionalProperties: true }
        cdc_mechanism: { type: string, enum: [DEBEZIUM_CDC, BATCH, ON_DEMAND] }
        breaking_change_policy: { type: string }
        status: { type: string, enum: [DRAFT, ACTIVE, DEPRECATED, BREACHED] }
        last_contract_test_at: { type: [string, "null"], format: date-time }
        co_signed_by: { type: [string, "null"], format: uuid }
    SourceContractCreate:
      type: object
      required: [source_module, source_view, version, schema_json, cdc_mechanism, breaking_change_policy]
      properties:
        source_module: { type: string }
        source_view: { type: string }
        version: { type: string }
        schema_json: { type: object, additionalProperties: true }
        cdc_mechanism: { type: string, enum: [DEBEZIUM_CDC, BATCH, ON_DEMAND] }
        breaking_change_policy: { type: string }
    SourceContractPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SourceDataContract' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    ContractTestResult:
      type: object
      properties:
        contract_id: { type: string, format: uuid }
        passed: { type: boolean }
        violations:
          type: array
          items:
            type: object
            additionalProperties: true
        tested_at: { type: string, format: date-time }

    # ---- Access anomaly (E23) -------------------------------------------
    AccessAnomaly:
      type: object
      properties:
        anomaly_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        anomaly_type:
          type: string
          enum: [OFF_HOURS_BULK_EXPORT, SCOPE_EDGE_PROBING, UNUSUAL_DRILLTHROUGH_VOLUME, REPEATED_DENIED, MASS_NL_QUERY]
        evidence_json: { type: object, additionalProperties: true }
        severity: { $ref: '#/components/schemas/Severity' }
        detected_at: { type: string, format: date-time }
        status: { type: string, enum: [OPEN, INVESTIGATING, DISMISSED, CONFIRMED] }
        reviewed_by: { type: [string, "null"], format: uuid }
    AccessAnomalyPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AccessAnomaly' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    AnomalyRule:
      type: object
      properties:
        rule_id: { type: string, format: uuid }
        anomaly_type:
          type: string
          enum: [OFF_HOURS_BULK_EXPORT, SCOPE_EDGE_PROBING, UNUSUAL_DRILLTHROUGH_VOLUME, REPEATED_DENIED, MASS_NL_QUERY]
        threshold_json: { type: object, additionalProperties: true }
        severity: { $ref: '#/components/schemas/Severity' }
        is_active: { type: boolean }
    AnomalyRuleCreate:
      type: object
      required: [anomaly_type, threshold_json, severity]
      properties:
        anomaly_type:
          type: string
          enum: [OFF_HOURS_BULK_EXPORT, SCOPE_EDGE_PROBING, UNUSUAL_DRILLTHROUGH_VOLUME, REPEATED_DENIED, MASS_NL_QUERY]
        threshold_json: { type: object, additionalProperties: true }
        severity: { $ref: '#/components/schemas/Severity' }
