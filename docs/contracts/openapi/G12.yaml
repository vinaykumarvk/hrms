    post:
      tags: [Legacy]
      summary: Set the confidence flag on a legacy record
      operationId: setLegacyConfidence
      description: VERIFIED / RECONSTRUCTED / LEGACY_UNVERIFIABLE with a mandatory evidence note.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetConfidenceRequest' }
      responses:
        '200':
          description: Confidence set.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/legacy/batches/{id}/promote:
    post:
      tags: [Legacy]
      summary: Promote a legacy batch to the ledger (checker + co-sign)
      operationId: promoteLegacyBatch
      description: Custodian promotes matched records to the ledger; confidence-flagged records require co-sign.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Batch promoted (records appended via FR-03).
