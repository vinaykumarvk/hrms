- name: inquiry-report
  description: Inquiry report & findings (FR-008)
- name: disagreement-memo
  description: Disagreement memo & DA consideration (FR-009)
- name: show-cause
  description: Show-cause notice on proposed penalty (FR-010)
- name: orders
  description: Penalty order & exoneration (FR-011)
- name: sr-posting
  description: SR posting & downstream effects (FR-013)
- name: appeals
  description: Appeal / revision / review (FR-012)
- name: documents
  description: Evidence vault (FR-014)
- name: vigilance
  description: Integrity register & vigilance clearance (FR-015)
- name: analytics
