# HRMS build pipeline manifest — consumed by run.sh (the external driver).
# Per the council verdict (doc/evaluations/autonomous-master-goal-loop-council-report-20260701.md):
#   - the driver automates SEQUENCING; exit_criteria is verified OUTSIDE the model; gates are hard stops.
#   - one fresh session per phase; resumable; hard-stop on red.
#   - default is now agentic gate (`gate:auto`) when a real external check exists.
#   - use `gate:human` only for critical decisions listed in `gate_policy.human_required_when`.
#
# Fields per phase:
#   id            : stable id (also the state/approval key)
#   name          : human label
#   prompt        : the /goal prompt file fed to a fresh agent session
#   exit_criteria : a shell command that returns 0 (GREEN) / non-zero (RED), run by the driver, NOT the agent.
#                   If a phase's success cannot be expressed as a command yet, leave it as the `false` placeholder
#                   and set gate: human — the driver will always park for human verification.
#   gate          : auto  -> advance automatically when exit_criteria is GREEN
#                   human -> after GREEN, PARK and wait for approvals/<id>.approved before advancing
#   depends_on    : ids that must be `done` first

version: 1
defaults:
  phase_timeout_seconds: 3600        # per-phase wall-clock cap (blast-radius limiter)
  branch_required: true              # driver refuses to --execute on main
  default_gate: auto                  # agentic gate: GREEN external oracle auto-advances

gate_policy:
  model: agentic_by_default
  agentic_gate_means:
    - The phase has a real exit_criteria command.
    - The command runs outside the model and exits GREEN.
    - The phase manifest records structural evidence.
    - No critical-decision trigger fires.
  human_required_when:
    - Architecture strategy changes: monorepo/modulith/service extraction/rebuild decisions beyond the approved plan.
    - A phase requires copying, extracting, distributing, or productizing code whose legal/provenance/IP status is unclear.
    - Destructive or irreversible database/data migration operations are required.
    - Security/auth/RBAC/data-isolation policy is weakened or materially changed.
    - Production/UAT/go-live/cutover or rollback approval is required.
    - A phase cannot express success as executable checks and only has prose evidence.
    - A formal gate remains RED after repair and needs an explicit risk acceptance.

phases:
  - id: PH-00A
    name: Inventory, provenance, and golden tests
    prompt: docs/spec/pipeline/prompts/PH-00A.md
    exit_criteria: bash docs/spec/pipeline/checks/ph-00a.sh
    gate: auto                       # already human-approved once; future reruns use agentic gate
    depends_on: []

  - id: PH-00B
    name: Thin PUDA strangler boundary
    prompt: docs/spec/pipeline/prompts/PH-00B.md
    exit_criteria: bash docs/spec/pipeline/checks/ph-00b.sh
    gate: auto                       # already human-approved once; future reruns use agentic gate
    depends_on: [PH-00A]

  - id: PH-00C
    name: Minimum workflow-core extraction
    prompt: docs/spec/pipeline/prompts/PH-00C.md
    exit_criteria: bash docs/spec/pipeline/checks/ph-00c.sh
    gate: auto
    depends_on: [PH-00B]

  - id: PH-00D
    name: Persistence, config, and adapter SPI
    prompt: docs/spec/pipeline/prompts/PH-00D.md
    exit_criteria: bash docs/spec/pipeline/checks/ph-00d.sh
    gate: auto
    depends_on: [PH-00C]

  - id: PH-00E
    name: PUDA and HRMS conformance proof (PH-00 gate)
    prompt: docs/spec/pipeline/prompts/PH-00E.md
    exit_criteria: bash docs/spec/pipeline/checks/ph-00e.sh
    gate: auto
    depends_on: [PH-00D]

  - id: PH-01
    name: P01 contract and schema freeze
    prompt: docs/spec/pipeline/prompts/PH-01.md
    exit_criteria: bash docs/spec/pipeline/checks/ph-01.sh
    gate: auto
    depends_on: [PH-00E]

  # PH-02 expanded into sub-phases (plan-to-pipeline). The monolithic PH-02.md/ph-02.sh remain on disk,
  # superseded by PH-02A..D. depends_on chains A->B->C->D; PH-03 now depends on PH-02D.
  - id: PH-02A
    name: PH-02 · Authority resolver model & contract
    prompt: docs/spec/pipeline/prompts/PH-02A.md
    exit_criteria: bash docs/spec/pipeline/checks/ph-02a.sh
    gate: auto
    depends_on: [PH-01]

  - id: PH-02B
    name: PH-02 · Schema & auth-matrix substrate
    prompt: docs/spec/pipeline/prompts/PH-02B.md
    exit_criteria: bash docs/spec/pipeline/checks/ph-02b.sh
    gate: auto
    depends_on: [PH-02A]

  - id: PH-02C
    name: PH-02 · Seed data & authority fixtures
    prompt: docs/spec/pipeline/prompts/PH-02C.md
    exit_criteria: bash docs/spec/pipeline/checks/ph-02c.sh
    gate: auto
    depends_on: [PH-02B]

  - id: PH-02D
    name: PH-02 · Authority-resolution tests & review packet
    prompt: docs/spec/pipeline/prompts/PH-02D.md
    exit_criteria: bash docs/spec/pipeline/checks/ph-02d.sh
    gate: human    # Phase-2 ends at a human review gate: after GREEN, park for approvals/PH-02D.approved before PH-03
    depends_on: [PH-02C]

  - id: PH-03
    name: Core platform services and systems of record
    prompt: docs/spec/pipeline/prompts/PH-03.md
    exit_criteria: bash docs/spec/pipeline/checks/ph-03.sh
    gate: auto
    depends_on: [PH-02D]
