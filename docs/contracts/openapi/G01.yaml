openapi: 3.1.0
info:
  title: Government HRMS — G01 Employee Profile Management API
  version: 3.1.0
  description: >-
    OpenAPI contract for module G01 (Employee Profile Management), the employee
    master / single-source-of-truth for the government HRMS. Grounded in
    docs/brd/v3/G01-employee-profile-management.md §6 (FR API-reference tables)
    and §8, PLATFORM_FOUNDATION.md §4 (API conventions), and the shared error
    taxonomy (docs/contracts/error-taxonomy.yaml). 2xx returns the resource
    payload; every 4xx/5xx returns the canonical Error envelope. The correlation
    id is carried in the X-Correlation-Id response header (never a body field).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: employees, description: Employee profile CRUD (FR-EPM-001) }
  - { name: profile-view, description: 360° consolidated view & break-glass (FR-EPM-002/013) }
  - { name: contacts, description: Contacts (FR-EPM-003) }
  - { name: addresses, description: Addresses (FR-EPM-003) }
  - { name: dependents, description: Dependents / heirs (FR-EPM-004) }
  - { name: nominees, description: Nominees (FR-EPM-004) }
  - { name: emergency-contacts, description: Emergency contacts (FR-EPM-005) }
  - { name: education, description: Education (FR-EPM-006) }
  - { name: experience, description: Experience (FR-EPM-006) }
  - { name: identity, description: Identity documents & Aadhaar vault (FR-EPM-007) }
  - { name: bank, description: Bank accounts (FR-EPM-008) }
  - { name: photos, description: Photos & biometric reference (FR-EPM-009) }
  - { name: positions, description: Positions & vacancies (FR-EPM-010) }
  - { name: assignments, description: Job assignments & org chart (FR-EPM-010) }
  - { name: history, description: Point-in-time & attribute history (FR-EPM-011) }
  - { name: custom-fields, description: Profile sections & custom fields (Phase 2) }
  - { name: field-access, description: Field-access policies & break-glass (FR-EPM-013) }
  - { name: completeness, description: Profile completeness (FR-EPM-014) }
  - { name: dedup, description: Deduplication & alias merge (FR-EPM-015) }
  - { name: self-service, description: Employee self-service (FR-EPM-016) }
  - { name: imports, description: Bulk import / migration (FR-EPM-017) }
  - { name: lifecycle, description: Separation / reactivation / archive (FR-EPM-018) }
  - { name: consumption, description: Master consumption API & change feed (FR-EPM-019) }
  - { name: privacy, description: Consent, DPDP rights, breaches (FR-EPM-020) }
  - { name: retention, description: Retention, legal holds, erasure (FR-EPM-021) }
  - { name: governed-changes, description: Governed-field change requests (FR-EPM-022) }
  - { name: certificates, description: Statutory certificates (FR-EPM-023) }
  - { name: succession, description: Death, heirs, family-pension handoff (FR-EPM-024) }
  - { name: search, description: Phonetic / transliteration search (FR-EPM-025) }
  - { name: sr-posting, description: SR-ledger posting façade (reference only, §8.6) }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Bearer JWT carrying the session's resolved roles and tenant/entity
        scope (PLATFORM_FOUNDATION §3.1). Endpoints never re-implement
        permission logic; they call P02 Authorization.check.

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size (cursor pagination). Default 25, max 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a prior response's next_cursor.
      schema: { type: string }
    Sort:
      name: sort
      in: query
      required: false
      description: "Sort spec, e.g. field:asc | field:desc."
      schema: { type: string }
    EmployeeId:
      name: id
      in: path
      required: true
      description: Employee id (alias-resolved to survivor by the platform).
      schema: { type: string, format: uuid }
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Idempotency key for state-changing / workflow-initiating POSTs; a repeat
        within 24h returns the original result (PLATFORM_FOUNDATION §4).
      schema: { type: string }

  headers:
    XCorrelationId:
      description: >-
        Correlation id echoed on every response and written to every audit and
        log line for the request (PLATFORM_FOUNDATION §4).
      schema: { type: string }

  schemas:
    Error:
      type: object
      description: Canonical error envelope (error-taxonomy.yaml §1). Correlation id is in the X-Correlation-Id response header, not the body.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: One of the 8 platform wire codes.
              enum: [VALIDATION_FAILED, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, PRECONDITION_FAILED, RATE_LIMITED, INTERNAL]
            message: { type: string }
            field:
              type: [string, "null"]
              description: Offending field for validation errors.
            details:
              type: [object, "null"]
              description: Structured discriminators (e.g. { reason, rule }).
              properties:
                reason:
                  type: string
                  description: >-
                    G01 semantic reason (§8.2.1), e.g. INVALID_ID, REASON_REQUIRED,
                    BATCH_TOO_LARGE, OUT_OF_RANGE, SOD_VIOLATION, IMMUTABLE_VERIFIED,
                    GOVERNED_FIELD_LOCKED, CONSENT_REQUIRED, DUPLICATE_CANDIDATE,
                    PRIMARY_REQUIRED, SHARE_SUM_INVALID, OVER_STRENGTH,
                    POSITION_INACTIVE, INVALID_STATE, MERGE_CONFLICT, UNDO_EXPIRED,
                    STALE_VERSION, LEGAL_HOLD_ACTIVE, HEIR_REQUIRED,
                    BLOCKING_OBLIGATIONS, BREAK_GLASS_CAP, KMS_UNAVAILABLE.
                rule:
                  type: string
                  description: VAL-* rule id that failed, where applicable.
              additionalProperties: true
        requestId:
          type: [string, "null"]
          description: Deprecated; use the X-Correlation-Id response header.

    Cursor:
      type: object
      properties:
        next_cursor: { type: [string, "null"] }

    Consent:
      type: object
      properties:
        notice_key: { type: string }
        version: { type: string }
        action: { type: string, enum: [GRANTED, WITHDRAWN, RENEWED] }

    EmployeeCreate:
      type: object
      required: [first_name, dob, gender, date_of_joining, employment_type, designation_id, org_unit_id]
      properties:
        salutation: { type: string }
        first_name: { type: string }
        last_name: { type: [string, "null"] }
        has_single_legal_name: { type: boolean, default: false }
        dob: { type: string, format: date }
        gender: { type: string, enum: [MALE, FEMALE, TRANSGENDER, OTHER] }
        date_of_joining: { type: string, format: date }
        employment_type: { type: string, enum: [PERMANENT, TEMPORARY, CONTRACT, DEPUTATION] }
        designation_id: { type: string }
        org_unit_id: { type: string, format: uuid }
        cadre: { type: string }
        category: { type: string }
        appointing_authority_ref: { type: [string, "null"] }
        pan: { type: [string, "null"], description: Validated by VAL-PAN. }
        aadhaar: { type: [string, "null"], description: Masked/tokenised into the Aadhaar Reference-Key vault; raw never stored inline. }
        effective_from: { type: [string, "null"], format: date }
        consent: { $ref: '#/components/schemas/Consent' }

    Employee:
      type: object
      properties:
        employee_id: { type: string, format: uuid }
        service_no: { type: string }
        display_name: { type: string }
        first_name: { type: string }
        last_name: { type: [string, "null"] }
        dob: { type: [string, "null"], format: date }
        gender: { type: [string, "null"] }
        date_of_joining: { type: [string, "null"], format: date }
        employment_type: { type: [string, "null"] }
        designation: { type: [string, "null"] }
        org_unit: { type: [string, "null"] }
        category: { type: [string, "null"], description: "May be [HIDDEN] per PII ceiling." }
        pan: { type: [string, "null"], description: Masked per caller field-mask. }
        aadhaar_masked: { type: [string, "null"] }
        aadhaar_ref_key: { type: [string, "null"] }
        employment_status: { type: string, enum: [ACTIVE, SEPARATED, DECEASED, REACTIVATED] }
        record_state: { type: string, enum: [PROVISIONAL, ACTIVE, ARCHIVED] }
        current_assignment_id: { type: [string, "null"] }
        profile_completeness_pct: { type: [number, "null"] }
        data_quality_flag: { type: [string, "null"], enum: [OK, NEEDS_ATTENTION, null] }
        sr_event_id: { type: [string, "null"] }
        row_version: { type: integer }

    EmployeeSummary:
      type: object
      properties:
        employee_id: { type: string, format: uuid }
        service_no: { type: string }
        display_name: { type: string }
        designation: { type: [string, "null"] }
        org_unit: { type: [string, "null"] }
        employment_status: { type: string }
        record_state: { type: string }

    EmployeeList:
      allOf:
        - $ref: '#/components/schemas/Cursor'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/EmployeeSummary' }

    DedupPrecheckRequest:
      type: object
      properties:
        first_name: { type: string }
        last_name: { type: [string, "null"] }
        dob: { type: [string, "null"], format: date }
        pan: { type: [string, "null"] }
        aadhaar: { type: [string, "null"] }

    DedupCandidate:
      type: object
      properties:
        candidate_id: { type: string, format: uuid }
        left_employee_id: { type: [string, "null"], format: uuid }
        right_employee_id: { type: [string, "null"], format: uuid }
        score: { type: number }
        matched_attributes: { type: array, items: { type: string } }
        status: { type: string, enum: [OPEN, MERGED, DISMISSED] }

    Profile360:
      type: object
      properties:
        employee: { $ref: '#/components/schemas/Employee' }
        sections:
          type: object
          additionalProperties: true
        _meta:
          type: object
          properties:
            masked_fields: { type: array, items: { type: string } }
            hidden_fields: { type: array, items: { type: string } }
            etag: { type: string }
            projection_synced_at: { type: string, format: date-time }

    BreakGlassRequest:
      type: object
      required: [field_path, reason]
      properties:
        field_path: { type: string }
        reason: { type: string, description: Mandatory (VAL-COMMENT); absent → REASON_REQUIRED. }
        four_eyes_approver_id: { type: [string, "null"] }

    BreakGlassReveal:
      type: object
      properties:
        field_path: { type: string }
        value: { type: string }
        reveal_id: { type: string }
        window_remaining: { type: integer }
        audit_enqueued: { type: boolean }

    Contact:
      type: object
      properties:
        contact_id: { type: string, format: uuid }
        type: { type: string, enum: [OFFICIAL_EMAIL, PERSONAL_EMAIL, MOBILE, LANDLINE] }
        value: { type: string }
        is_primary: { type: boolean }
        verification: { type: string, enum: [UNVERIFIED, PENDING, VERIFIED] }
        row_version: { type: integer }

    Address:
      type: object
      properties:
        address_id: { type: string, format: uuid }
        type: { type: string, enum: [PERMANENT, PRESENT, OTHER] }
        line1: { type: string }
        line2: { type: [string, "null"] }
        city: { type: string }
        state: { type: string }
        pincode: { type: string, description: Validated by VAL-PINCODE. }
        valid_from: { type: [string, "null"], format: date }
        valid_to: { type: [string, "null"], format: date }
        is_current: { type: boolean }
        row_version: { type: integer }

    Dependent:
      type: object
      properties:
        dependent_id: { type: string, format: uuid }
        name: { type: string }
        relationship: { type: string }
        dob: { type: [string, "null"], format: date }
        is_heir: { type: boolean }
        row_version: { type: integer }

    Nominee:
      type: object
      properties:
        nominee_id: { type: string, format: uuid }
        name: { type: string }
        benefit_type: { type: string }
        share_pct: { type: number, description: Nominee shares must sum to 100 (VAL-NOMINEE). }
        guardian: { type: [string, "null"] }
        is_family_pension_recipient: { type: boolean }
        row_version: { type: integer }

    EmergencyContact:
      type: object
      properties:
        emergency_contact_id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        priority: { type: integer }
        row_version: { type: integer }

    Education:
      type: object
      properties:
        education_id: { type: string, format: uuid }
        level: { type: string }
        institution: { type: [string, "null"] }
        is_highest: { type: boolean }
        is_verified: { type: boolean }
        document_id: { type: [string, "null"] }
        row_version: { type: integer }

    Experience:
      type: object
      properties:
        experience_id: { type: string, format: uuid }
        employer: { type: string }
        from_date: { type: string, format: date }
        to_date: { type: [string, "null"], format: date }
        is_government_service: { type: boolean }
        row_version: { type: integer }

    IdentityDocument:
      type: object
      properties:
        identity_doc_id: { type: string, format: uuid }
        type: { type: string, enum: [PAN, AADHAAR, PASSPORT, VOTER_ID, DRIVING_LICENCE] }
        number_masked: { type: string, description: Only masked values are ever returned; raw *_token columns never surface. }
        is_verified: { type: boolean }
        valid_to: { type: [string, "null"], format: date }
        document_id: { type: [string, "null"] }
        row_version: { type: integer }

    BankAccount:
      type: object
      properties:
        bank_account_id: { type: string, format: uuid }
        bank_name: { type: string }
        ifsc: { type: string, description: Validated by VAL-IFSC. }
        account_number_masked: { type: string }
        is_primary_salary: { type: boolean }
        is_verified: { type: boolean }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        row_version: { type: integer }

    Photo:
      type: object
      properties:
        photo_id: { type: string, format: uuid }
        document_id: { type: string }
        processing_purpose: { type: string, enum: [PROFILE, BIOMETRIC_ATTENDANCE] }
        status: { type: string, enum: [PENDING, APPROVED] }
        is_primary: { type: boolean }

    BiometricRefRequest:
      type: object
      required: [biometric_template_ref, consent_id]
      properties:
        biometric_template_ref: { type: string, description: Opaque reference only; consent-gated (CONSENT_REQUIRED if absent). }
        consent_id: { type: string }

    Position:
      type: object
      properties:
        position_id: { type: string, format: uuid }
        position_code: { type: string }
        designation_id: { type: string }
        org_unit_id: { type: string, format: uuid }
        sanctioned_strength: { type: integer }
        filled_count: { type: integer }
        is_active: { type: boolean }
        effective_from: { type: [string, "null"], format: date }
        row_version: { type: integer }

    Assignment:
      type: object
      required: [position_id, effective_from]
      properties:
        assignment_id: { type: string, format: uuid }
        position_id: { type: string, format: uuid }
        assignment_type: { type: string, enum: [SUBSTANTIVE, OFFICIATING, ADDITIONAL_CHARGE, DEPUTATION] }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, "null"], format: date }
        row_version: { type: integer }

    Certificate:
      type: object
      properties:
        certificate_id: { type: string, format: uuid }
        type: { type: string }
        status: { type: string, enum: [VALID, EXPIRED, PENDING] }
        valid_from: { type: [string, "null"], format: date }
        valid_to: { type: [string, "null"], format: date }
        is_verified: { type: boolean }
        row_version: { type: integer }

    Completeness:
      type: object
      properties:
        employee_id: { type: string, format: uuid }
        score_pct: { type: number }
        data_quality_flag: { type: string, enum: [OK, NEEDS_ATTENTION] }
        checklist:
          type: array
          items:
            type: object
            properties:
              item: { type: string }
              complete: { type: boolean }

    MergeRequest:
      type: object
      required: [survivor_id, loser_id, four_eyes_approver_id]
      properties:
        survivor_id: { type: string, format: uuid }
        loser_id: { type: string, format: uuid }
        field_picks:
          type: object
          additionalProperties: { type: string, enum: [survivor, loser] }
        four_eyes_approver_id: { type: string }

    MergeResult:
      type: object
      properties:
        alias_id: { type: string }
        survivor_id: { type: string, format: uuid }
        loser_id: { type: string, format: uuid }
        mergeable_back_until: { type: string, format: date-time }
        sr_event_id: { type: string }
        note: { type: string }

    ChangeFeed:
      type: object
      properties:
        changes:
          type: array
          items:
            type: object
            properties:
              event_id: { type: integer, format: int64 }
              employee_id: { type: [string, "null"], format: uuid }
              survivor_id: { type: [string, "null"], format: uuid }
              loser_id: { type: [string, "null"], format: uuid }
              type: { type: string, description: "e.g. PLACEMENT_CHANGED, RECORDS_MERGED, GOVERNED_FIELD_CHANGED" }
              tombstone: { type: [boolean, "null"] }
              at: { type: string, format: date-time }
        next_cursor: { type: [integer, "null"], format: int64 }
        replay_window_days: { type: integer }

    ImportBatch:
      type: object
      properties:
        batch_id: { type: string, format: uuid }
        profile: { type: string, enum: [STRICT, MIGRATION] }
        status: { type: string, enum: [UPLOADED, VALIDATING, VALIDATED, COMMITTING, COMMITTED, FAILED, ROLLED_BACK] }
        total_rows: { type: integer }
        valid_rows: { type: integer }
        provisional_rows: { type: integer }
        error_rows: { type: integer }

    ImportReport:
      type: object
      properties:
        batch_id: { type: string, format: uuid }
        rows:
          type: array
          items:
            type: object
            properties:
              row_number: { type: integer }
              validation_status: { type: string, enum: [VALID, PROVISIONAL, ERROR, COMMITTED, SKIPPED] }
              reasons: { type: array, items: { type: string } }
              resolved_employee_id: { type: [string, "null"], format: uuid }

    ConsentRequest:
      type: object
      required: [notice_key, action]
      properties:
        notice_key: { type: string }
        version: { type: string }
        action: { type: string, enum: [GRANTED, WITHDRAWN, RENEWED] }

    ConsentRecord:
      type: object
      properties:
        consent_id: { type: string, format: uuid }
        notice_key: { type: string }
        version: { type: string }
        action: { type: string }
        captured_at: { type: string, format: date-time }

    GovernedChangeRequest:
      type: object
      required: [field_path, new_value, reason]
      properties:
        field_path: { type: string, enum: [name, dob, gender, category] }
        new_value: { type: string }
        reason: { type: string }
        supporting_document_id: { type: [string, "null"] }

    GovernedChange:
      type: object
      properties:
        change_id: { type: string, format: uuid }
        field_path: { type: string }
        old_value: { type: [string, "null"] }
        new_value: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, APPLIED] }
        sr_event_id: { type: [string, "null"] }

    LegalHold:
      type: object
      properties:
        hold_id: { type: string, format: uuid }
        hold_type: { type: string }
        reason: { type: string }
        status: { type: string, enum: [ACTIVE, RELEASED] }
        placed_at: { type: string, format: date-time }

    ErasureDecision:
      type: object
      properties:
        decision: { type: string, enum: [ALLOWED, REFUSED] }
        precedence: { type: [string, "null"] }
        reasons:
          type: array
          items:
            type: object
            additionalProperties: true
        request_id_ref: { type: [string, "null"] }

    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
        four_eyes_approver_id: { type: [string, "null"] }

    SeparationRequest:
      type: object
      required: [separation_type, effective_date, reason]
      properties:
        separation_type: { type: string, enum: [RESIGNATION, RETIREMENT, TERMINATION, DEATH] }
        effective_date: { type: string, format: date }
        reason: { type: string }

    DeathRecordRequest:
      type: object
      required: [date_of_death]
      properties:
        date_of_death: { type: string, format: date }
        heir_confirmation: { type: [boolean, "null"] }
        source_document_id: { type: [string, "null"] }

    HeirConfirmRequest:
      type: object
      required: [heirs]
      properties:
        heirs:
          type: array
          items:
            type: object
            properties:
              dependent_id: { type: string, format: uuid }
              succession_rank: { type: integer }

    ChangeRequest:
      type: object
      required: [field_path, requested_value]
      properties:
        field_path: { type: string }
        requested_value: { type: string }
        reason: { type: [string, "null"] }

    RightsRequest:
      type: object
      required: [right_type]
      properties:
        right_type: { type: string, enum: [ACCESS, CORRECTION, ERASURE, PORTABILITY, GRIEVANCE, WITHDRAW_CONSENT] }
        details: { type: [string, "null"] }

    Acknowledgement:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
        sr_event_id: { type: [string, "null"] }

    SrPostFacadeRequest:
      type: object
      description: >-
        Internal façade payload (§8.6). The drainer maps the outbox event to the
        verbatim G12 event_type and RELAYS to POST /api/v1/sr/ingest — it never
        calls /sr/events and never writes the ledger directly. Reference only.
      required: [source_module, source_reference_id, source_event_version, event_type]
      properties:
        source_module: { type: string, enum: [G01] }
        source_reference_id: { type: string }
        source_event_version: { type: integer }
        event_type:
          type: string
          enum: [APPOINTMENT, NAME_CHANGE, DOB_CHANGE, GENDER_CHANGE, CATEGORY_CHANGE, DECEASED, QUALIFICATION_ADDED, DEPARTMENTAL_EXAM_PASSED]
        fact_key: { type: [string, "null"] }
        payload: { type: object, additionalProperties: true }

  responses:
    Validation422:
      description: VALIDATION_FAILED — input failed a VAL-* rule (e.g. ERR-G01-IDFMT / INVALID_ID, ERR-G01-RANGE / BATCH_TOO_LARGE, ERR-REASON-REQ).
      headers: { X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthenticated401:
      description: UNAUTHENTICATED — no/invalid/expired session.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden403:
      description: FORBIDDEN — authenticated but not permitted (ERR-FORBIDDEN / SOD_VIOLATION, ERR-G01-GOVLOCK / GOVERNED_FIELD_LOCKED, ERR-G01-CONSENT / CONSENT_REQUIRED). Never leaks existence of out-of-scope records.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound404:
      description: NOT_FOUND — resource absent or out of the caller's scope.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict409:
      description: CONFLICT — idempotency replay, invariant/state conflict (ERR-G01-STALE / STALE_VERSION, ERR-G01-INVARIANT / SHARE_SUM_INVALID, ERR-G01-STATE / OVER_STRENGTH, ERR-G01-MERGE / MERGE_CONFLICT, ERR-G01-HOLD / LEGAL_HOLD_ACTIVE).
      headers: { X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    PreconditionFailed412:
      description: PRECONDITION_FAILED — a required precondition is unmet (ERR-PRECOND / HEIR_REQUIRED, BLOCKING_OBLIGATIONS; ERR-G01-HEIR).
      headers: { X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited429:
      description: RATE_LIMITED — rate limit or break-glass volume cap reached (ERR-G01-CAP / BREAK_GLASS_CAP).
      headers: { X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Internal500:
      description: INTERNAL — unexpected server error or non-retryable upstream failure (ERR-LOADFAIL / KMS_UNAVAILABLE; G12/G13/KMS map here, no 503).
      headers: { X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

paths:
  /employees:
    post:
      tags: [employees]
      summary: Create employee profile on hire (FR-EPM-001)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - name: draft
          in: query
          required: false
          description: When true, persists a draft instead of an active profile.
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmployeeCreate' } } }
      responses:
        '201':
          description: Created (or draft). Emits APPOINTMENT SR event and computes advisory completeness.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Employee' } } }
        '401': { $ref: '#/components/responses/Unauthenticated401' }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '409': { $ref: '#/components/responses/Conflict409' }
        '422': { $ref: '#/components/responses/Validation422' }
        '500': { $ref: '#/components/responses/Internal500' }
    get:
      tags: [consumption]
      summary: Search / list employees (cursor; masked; alias-resolved) (FR-EPM-019/025)
      parameters:
        - { name: org_unit, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: updated_since, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: q_phonetic, in: query, required: false, description: Phonetic/transliteration filter (FR-019/025)., schema: { type: string } }
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Masked, alias-resolved page of employees.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/EmployeeList' } } }
        '401': { $ref: '#/components/responses/Unauthenticated401' }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '422': { $ref: '#/components/responses/Validation422' }
        '500': { $ref: '#/components/responses/Internal500' }

  /employees/dedup-precheck:
    post:
      tags: [employees]
      summary: Pre-submit duplicate check, phonetic-aware (FR-EPM-001)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DedupPrecheckRequest' } } }
      responses:
        '200':
          description: Candidate matches (HIGH match may block create with DUPLICATE_CANDIDATE at commit).
          headers: { X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates: { type: array, items: { $ref: '#/components/schemas/DedupCandidate' } }
        '401': { $ref: '#/components/responses/Unauthenticated401' }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '422': { $ref: '#/components/responses/Validation422' }
        '500': { $ref: '#/components/responses/Internal500' }

  /employees/service-no/preview:
    get:
      tags: [employees]
      summary: Preview next service number (FR-EPM-001)
      responses:
        '200':
          description: Next service_no preview.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' } }
          content:
            application/json:
              schema:
                type: object
                properties: { service_no: { type: string } }
