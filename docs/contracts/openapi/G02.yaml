      operationId: stepUpVerify
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpVerifyBody'
      responses:
        '200':
          description: Step-up verified.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpEvent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Platform session bearer JWT carrying resolved roles + tenant/entity scope.
        Every endpoint calls P02 Authorization.check; endpoints never re-implement
        permission logic. Step-up tokens are honored for sensitive initiation.

  headers:
    XCorrelationId:
      description: Correlation id echoed on every response and written to every P05 audit/log line.
      schema:
        type: string

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Required on unsafe/workflow-initiating POSTs; a repeat within 24h returns
        the original result. Duplicate workflow start -> 409 ERR-DUP-INSTANCE.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size (default 25, max 100).
      schema:
        type: integer
        default: 25
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a prior response's next_cursor.
      schema:
        type: string
    ChangeRequestId:
      name: id
      in: path
      required: true
      description: Change request id (P01 subject_ref).
      schema:
        type: string
    EmployeeId:
      name: id
      in: path
      required: true
      description: Target employee id (G01/M01).
      schema:
        type: string
    DocId:
      name: docId
      in: path
      required: true
      schema:
        type: string
    NodeId:
      name: nodeId
      in: path
      required: true
      description: P01 approval node / workflow_action id.
      schema:
        type: string
    ItemId:
      name: itemId
      in: path
      required: true
      description: change_request_item id.
      schema:
        type: string
    SignalId:
      name: signalId
      in: path
      required: true
      schema:
        type: string
    BulkBatchId:
      name: id
      in: path
      required: true
      schema:
        type: string
    MatrixId:
      name: id
      in: path
      required: true
      schema:
        type: string
    DelegationId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ObjectionId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ReversalId:
      name: reversalId
      in: path
      required: true
      schema:
        type: string
    RetroEventId:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    ValidationFailed:
      description: >
        422 VALIDATION_FAILED — a cited VAL-* failed (format/effective-date/required/
        null-without-clear) or a weak/disallowed e-sign method (ERR-G02-ESIGN-METHOD).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            weakEsign:
              value:
                error:
                  code: VALIDATION_FAILED
                  message: STATUTORY sanction requires PKI/DSC or Aadhaar e-Sign; OTP is not permitted.
                  field: esignatureId
                  details:
                    id: ERR-G02-ESIGN-METHOD
                    rule: VAL-G02-ESIGN-METHOD
    Unauthenticated:
      description: 401 UNAUTHENTICATED — missing, invalid, expired or revoked session/token.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: >
        403 FORBIDDEN — ownership/scope/permission/SoD/status-gate violation (P02).
        Never leaks existence of out-of-scope records. May carry ERR-G02-SOD or
        ERR-G02-STATUSGATE.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            statusGate:
              value:
                error:
                  code: FORBIDDEN
                  message: This record is RETIRED; bank changes require HR with Appointing-Authority sanction.
                  field: employmentStatus
                  details:
                    id: ERR-G02-STATUSGATE
    NotFound:
      description: 404 NOT_FOUND — resource absent or out of the caller's scope.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: >
        409 CONFLICT — idempotency replay, duplicate workflow start (ERR-DUP-INSTANCE),
        stale value (ERR-G02-STALE), illegal transition, or double-decision.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            duplicateStart:
              value:
                error:
                  code: CONFLICT
                  message: A request for this already exists and is in progress.
                  field: fieldKey
                  details:
                    id: ERR-DUP-INSTANCE
            staleValue:
              value:
                error:
                  code: CONFLICT
                  message: The master value changed since this request was raised.
                  field: old_value_hash
                  details:
                    id: ERR-G02-STALE
    PreconditionFailed:
      description: >
        412 PRECONDITION_FAILED — a required precondition is unmet: missing/unverified
        document or authority-portal verification (ERR-G02-AUTHPORTAL), missing e-sign
        (ERR-G02-ESIGN), missing/expired step-up (ERR-G02-STEPUP), DOB hard-block
        (ERR-G02-HARDBLOCK), risk/fraud block (ERR-G02-RISKBLOCK), dual-auth unmet
        (ERR-G02-DUALAUTH), or a retryable upstream (X.3-mapped, ERR-PRECOND).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            stepUp:
              value:
                error:
                  code: PRECONDITION_FAILED
                  message: Confirm it's you (step-up authentication) to submit a STATUTORY change.
                  field: stepUpEventId
                  details:
                    id: ERR-G02-STEPUP
            hardBlock:
              value:
                error:
                  code: PRECONDITION_FAILED
                  message: DOB alteration is barred within 5 years of superannuation; a separate legal process is required.
                  field: dob
                  details:
                    id: ERR-G02-HARDBLOCK
                    rule: VAL-G02-HARDBLOCK
            riskBlock:
              value:
                error:
                  code: PRECONDITION_FAILED
                  message: This bank account is already used by other employees; held for fraud review.
                  field: bank_account_no
                  details:
                    id: ERR-G02-RISKBLOCK
    RateLimited:
      description: 429 RATE_LIMITED — rate limit or brute-force lockout exceeded.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Internal:
      description: >
        500 INTERNAL — unexpected server error, invalid-config fallback, or
        non-retryable upstream failure (503 collapses here via X.3 -> ERR-LOADFAIL).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # --- Canonical error envelope (Foundation §1 / error-taxonomy) ---------
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: One of the 8 platform wire codes, or a module code carried here.
              enum:
                - VALIDATION_FAILED
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - PRECONDITION_FAILED
                - RATE_LIMITED
                - INTERNAL
            message:
              type: string
              description: Human-readable message resolved from a MSG-*/ERR-* id.
            field:
              type: [string, 'null']
              description: Offending field for validation errors.
            details:
              type: [object, 'null']
              description: >
                Structured discriminators, e.g. { id: ERR-G02-STEPUP, rule: VAL-*,
                reason: ... }.
              additionalProperties: true

    # --- Enums -------------------------------------------------------------
    SensitivityClass:
      type: string
      enum: [LOW, MEDIUM, HIGH, STATUTORY, FINANCIAL, IDENTITY]
    RiskBand:
      type: [string, 'null']
      enum: [LOW, MEDIUM, HIGH, BLOCKED, null]
    ChangeType:
      type: string
      enum: [UPDATE, CORRECTION, REVERSAL]
    RequestOrigin:
      type: string
      enum: [SELF_SERVICE, HR_ON_BEHALF, BULK, REVERSAL]
    ChangeRequestStatus:
      type: string
      enum:
        - DRAFT
        - SUBMITTED
        - PENDING_DOCS
        - IN_REVIEW
        - NOTICE_HOLD
        - OBJECTED
        - RETURNED
        - APPROVED
        - COMMITTED
        - COMMIT_FAILED
        - REJECTED
        - WITHDRAWN
        - REVERSED
    ItemStatus:
      type: string
      enum: [PENDING, APPROVED, COMMITTED, REVERSED, FAILED]
    SrPostingStatus:
      type: string
      enum: [NOT_APPLICABLE, PENDING, POSTED, FAILED]
    RetroStatus:
      type: string
      enum: [NOT_APPLICABLE, PENDING, SENT, ACKED, FAILED, DEAD_LETTER]
    EsignMethod:
      type: string
      enum: [PKI_DSC, AADHAAR_ESIGN, OTP]
    WorkflowPattern:
      type: string
      enum: [SEQUENTIAL, PARALLEL_ALL_OF, PARALLEL_ANY_OF, CONDITIONAL, DYNAMIC_APPROVER]

    # --- Change request (E1) + items (E2) ----------------------------------
    ChangeRequestItemInput:
      type: object
      required: [fieldKey, m01FieldKey]
      properties:
        fieldKey:
          type: string
        m01FieldKey:
          type: string
          description: Canonical G01/M01 path, e.g. employees.first_name.
        parentItemId:
          type: [string, 'null']
          description: For composite name sub-items (first/middle/last).
        newValue:
          type: [string, 'null']
          description: Null only permitted with clearIntent=true (VAL-G02-CLEARINTENT).
        clearIntent:
          type: boolean
          default: false
    CreateChangeRequest:
      type: object
      required: [targetEmployeeId, items]
      properties:
        targetEmployeeId:
          type: string
        changeType:
          $ref: '#/components/schemas/ChangeType'
        requestOrigin:
          $ref: '#/components/schemas/RequestOrigin'
        effectiveFrom:
          type: [string, 'null']
          format: date
        reason:
          type: [string, 'null']
          maxLength: 1000
        stepUpEventId:
          type: [string, 'null']
        templateId:
          type: [string, 'null']
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ChangeRequestItemInput'
    EditChangeRequest:
      type: object
      properties:
        changeType:
          $ref: '#/components/schemas/ChangeType'
        effectiveFrom:
          type: [string, 'null']
          format: date
        reason:
          type: [string, 'null']
          maxLength: 1000
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChangeRequestItemInput'
    ChangeRequestItem:
      type: object
      properties:
        changeRequestItemId:
          type: string
        fieldKey:
          type: string
        m01FieldKey:
          type: string
        parentItemId:
          type: [string, 'null']
        oldValue:
          type: [string, 'null']
          description: Masked per P02 field-mask on serialization.
        newValue:
          type: [string, 'null']
        clearIntent:
          type: boolean
        sensitivity:
          $ref: '#/components/schemas/SensitivityClass'
        itemStatus:
          $ref: '#/components/schemas/ItemStatus'
        srPostingStatus:
          $ref: '#/components/schemas/SrPostingStatus'
        retroStatus:
          $ref: '#/components/schemas/RetroStatus'
    ChangeRequest:
      type: object
      properties:
        changeRequestId:
          type: string
        crNumber:
          type: string
          example: CR-2026-000124
        targetEmployeeId:
          type: string
        requestedBy:
          type: string
        requestOrigin:
          $ref: '#/components/schemas/RequestOrigin'
        changeType:
          $ref: '#/components/schemas/ChangeType'
        highestSensitivity:
          $ref: '#/components/schemas/SensitivityClass'
        status:
          $ref: '#/components/schemas/ChangeRequestStatus'
        employmentStatusAtSubmit:
          type: [string, 'null']
        riskScore:
          type: [integer, 'null']
        riskBand:
          $ref: '#/components/schemas/RiskBand'
        effectiveDate:
          type: [string, 'null']
          format: date
        reason:
          type: [string, 'null']
        workflowInstanceId:
          type: [string, 'null']
        stepUpEventId:
          type: [string, 'null']
        templateId:
          type: [string, 'null']
        bulkBatchId:
          type: [string, 'null']
        slaDueAt:
          type: [string, 'null']
          format: date-time
        submittedAt:
          type: [string, 'null']
          format: date-time
        decidedAt:
          type: [string, 'null']
          format: date-time
        committedAt:
          type: [string, 'null']
          format: date-time
        routePreview:
          type: array
          items:
            $ref: '#/components/schemas/RouteStage'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChangeRequestItem'

    # --- Routing (E6/E7 + P01) ---------------------------------------------
    RouteStage:
      type: object
      properties:
        levelNo:
          type: integer
        nodeType:
          type: string
          example: SANCTION
        requiredRole:
          type: string
          example: APPOINTING_AUTHORITY
        pattern:
          $ref: '#/components/schemas/WorkflowPattern'
        slaHours:
          type: integer
        escalationRole:
          type: [string, 'null']
        requiresEsignature:
          type: boolean
          default: false
        allowedEsignMethods:
          type: array
          items:
            $ref: '#/components/schemas/EsignMethod'

    # --- Documents (E3) ----------------------------------------------------
    LinkDocument:
      type: object
      required: [documentId, docType]
      properties:
        documentId:
          type: string
          description: G13/M11 document reference.
        changeRequestItemId:
          type: [string, 'null']
        docType:
          type: string
    DocumentVerifyBody:
      type: object
      required: [verificationStatus]
      properties:
        verificationStatus:
          type: string
          enum: [VERIFIED, REJECTED]
        reason:
          type: [string, 'null']
    AuthorityVerifyBody:
      type: object
      required: [portalType]
      properties:
        portalType:
          type: string
          enum: [UIDAI, PAN, CASTE]
        attestation:
          type: boolean
          default: false
    ChangeRequestDocument:
      type: object
      properties:
        changeRequestDocumentId:
          type: string
        changeRequestId:
          type: string
        changeRequestItemId:
          type: [string, 'null']
        documentId:
          type: string
        docType:
          type: string
        scanStatus:
          type: string
          enum: [PENDING, CLEAN, INFECTED]
        verificationStatus:
          type: string
          enum: [PENDING, VERIFIED, REJECTED]
        authorityPortalRef:
          type: [string, 'null']
        authorityVerificationStatus:
          type: [string, 'null']
          enum: [PENDING, VERIFIED, FAILED, null]

    # --- Approvals (E4) ----------------------------------------------------
    ApprovalDecision:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVED, REJECTED, SENT_BACK]
        comment:
          type: [string, 'null']
          description: Mandatory on REJECTED and SENT_BACK (ERR-REASON-REQ).
        esignatureId:
          type: [string, 'null']
          description: Required strong e-sign on STATUTORY/FINANCIAL-HIGH stages.
    ApprovalQueueItem:
      type: object
      properties:
        changeRequestId:
          type: string
        crNumber:
          type: string
        nodeId:
          type: string
        levelNo:
          type: integer
        requiredRole:
          type: string
        highestSensitivity:
          $ref: '#/components/schemas/SensitivityClass'
        riskBand:
          $ref: '#/components/schemas/RiskBand'
        slaDueAt:
          type: [string, 'null']
          format: date-time
        actingAsDelegateFor:
          type: [string, 'null']
    ChangeRequestApproval:
      type: object
      properties:
        approvalId:
          type: string
        changeRequestId:
          type: string
        workflowActionId:
          type: string
        levelNo:
          type: integer
        requiredRole:
          type: string
        assignedTo:
          type: [string, 'null']
        delegatedFrom:
          type: [string, 'null']
        decision:
          type: [string, 'null']
          enum: [APPROVED, REJECTED, SENT_BACK, null]
        decisionComment:
          type: [string, 'null']
        esignatureId:
          type: [string, 'null']
        decidedAt:
          type: [string, 'null']
          format: date-time
        requestStatus:
          $ref: '#/components/schemas/ChangeRequestStatus'

    # --- E-signature (E10) -------------------------------------------------
    EsignCapture:
      type: object
      required: [signMethod, decision]
      properties:
        signMethod:
          $ref: '#/components/schemas/EsignMethod'
        decision:
          type: string
          enum: [APPROVED]
        providerPayload:
          type: [object, 'null']
          additionalProperties: true
    Esignature:
      type: object
      properties:
        esignatureId:
          type: string
        changeRequestId:
          type: string
        approvalNodeId:
          type: string
        signMethod:
          $ref: '#/components/schemas/EsignMethod'
        signedPayloadHash:
          type: string
          description: SHA-256 of the canonical decision payload.
        chainHash:
          type: string
          description: Hash-chain link (E10, aligned to OPEN-PLAT-03).
        signer:
          type: string
        signedAt:
          type: string
          format: date-time
        method_metadata:
          type: [object, 'null']
          additionalProperties: true

    # --- Diff (FR-005) -----------------------------------------------------
    DiffItem:
      type: object
      properties:
        fieldKey:
          type: string
        m01FieldKey:
          type: string
        oldValue:
          type: [string, 'null']
          description: Masked per PII ceiling (P02 serialization mask).
        newValue:
          type: [string, 'null']
        cleared:
          type: boolean
        changeType:
          $ref: '#/components/schemas/ChangeType'
        effectiveFrom:
          type: [string, 'null']
          format: date
        masked:
          type: boolean

    # --- SLA (E11) ---------------------------------------------------------
    SlaEvent:
      type: object
      properties:
        eventType:
          type: string
          enum: [SLA_SET, REMINDER, BREACHED, ESCALATED, REASSIGNED, PAUSED, RESUMED]
        levelNo:
          type: [integer, 'null']
        at:
          type: string
          format: date-time
        detail:
          type: [string, 'null']

    # --- Effective-dating (FR-008) -----------------------------------------
    EffectiveDateRules:
      type: object
      properties:
        fieldKey:
          type: string
        changeType:
          $ref: '#/components/schemas/ChangeType'
        minDate:
          type: [string, 'null']
          format: date
        maxDate:
          type: [string, 'null']
          format: date
        rule:
          type: string
          example: VAL-EFFECTIVE
    HardBlockResult:
      type: object
      properties:
        fieldKey:
          type: string
        employeeId:
          type: string
        blocked:
          type: boolean
        ruleRef:
          type: [string, 'null']
          example: DOB_PRE_RETIREMENT_BAR
        legalProcessPathAvailable:
          type: boolean

    # --- Bulk (E12) --------------------------------------------------------
    CreateBulkBatch:
      type: object
      required: [documentId]
      properties:
        documentId:
          type: string
          description: G13 reference to the uploaded CSV/XLSX (VAL-FILE).
        defaultChangeType:
          $ref: '#/components/schemas/ChangeType'
        description:
          type: [string, 'null']
    BulkCorrectionBatch:
      type: object
      properties:
        bulkBatchId:
          type: string
        status:
          type: string
          enum: [UPLOADED, VALIDATED, PENDING_APPROVAL, APPROVED, COMMITTED, PARTIAL_FAILED]
        total:
          type: [integer, 'null']
        valid:
          type: [integer, 'null']
        invalid:
          type: [integer, 'null']
        highestSensitivity:
          $ref: '#/components/schemas/SensitivityClass'
        workflowInstanceId:
          type: [string, 'null']
        reportRef:
          type: [string, 'null']
    BulkCorrectionReport:
      type: object
      properties:
        bulkBatchId:
          type: string
        total:
          type: integer
        valid:
          type: integer
        invalid:
          type: integer
        rows:
          type: array
          items:
            type: object
            properties:
              rowNo:
                type: integer
              employeeId:
                type: string
              fieldKey:
                type: string
              outcome:
                type: string
                enum: [VALID, INVALID, COMMITTED, FAILED]
              reason:
                type: [string, 'null']

    # --- Commit (FR-010) ---------------------------------------------------
    CommitStatus:
      type: object
      properties:
        changeRequestId:
          type: string
        status:
          $ref: '#/components/schemas/ChangeRequestStatus'
        committedAt:
          type: [string, 'null']
          format: date-time
        financialHold:
          type: boolean
          description: True while first credit is held for the objection window.
        items:
          type: array
          items:
            type: object
            properties:
              changeRequestItemId:
                type: string
              itemStatus:
                $ref: '#/components/schemas/ItemStatus'
              srPostingStatus:
                $ref: '#/components/schemas/SrPostingStatus'
              retroStatus:
                $ref: '#/components/schemas/RetroStatus'

    # --- SR status (FR-011) ------------------------------------------------
    SrItemStatus:
      type: object
      properties:
        changeRequestItemId:
          type: string
        crNumber:
          type: string
        fieldKey:
          type: string
        srEventType:
          type: [string, 'null']
        srPostingStatus:
          $ref: '#/components/schemas/SrPostingStatus'
        srReference:
          type: [string, 'null']
        sourceModule:
          type: string
          const: G01
          description: SR events are posted by G01 (master/identity owner), never G02.
        attempts:
          type: [integer, 'null']

    # --- Config (E5/E6/E7) -------------------------------------------------
    FieldSensitivityEntry:
      type: object
      required: [fieldKey, sensitivity]
      properties:
        fieldKey:
          type: string
        m01FieldKey:
          type: [string, 'null']
        sensitivity:
          $ref: '#/components/schemas/SensitivityClass'
        piiTierId:
          type: [string, 'null']
          format: uuid
          description: >
            DPDPA PII-tier classification (FK -> platform `pii_tiers`, tier codes
            TIER_1/TIER_2/TIER_3/NON_PII; `ON DELETE RESTRICT`, index `ix_fsc_pii_tier`).
            Distinct from and orthogonal to `sensitivity`: it does NOT drive P01
            approval-route resolution (that stays derived from `sensitivity` /
            `fieldGroup` / `fieldKey`). It is a data-governance / display axis — the
            `sensitive-changes` review screen groups requests by PII tier (recon v3.2).
        version:
          type: [integer, 'null']
        isAuthBearing:
          type: boolean
          default: false
        selfServiceEditable:
          type: boolean
          default: true
        autoApplyOnLow:
          type: boolean
          default: false
        requiresDocument:
          type: boolean
          default: false
        requiresAuthorityPortalVerification:
          type: boolean
          default: false
        postToSr:
          type: boolean
          default: false
        requiredDocTypes:
          type: array
          items:
            type: string
        allowedEsignMethods:
          type: array
          items:
            $ref: '#/components/schemas/EsignMethod'
        hardBlockRuleRef:
          type: [string, 'null']
        evidencePath:
          type: [string, 'null']
        validationRef:
          type: [string, 'null']
          description: Cited VAL-* id.
        validationRegex:
          type: [string, 'null']
          description: ReDoS-bounded (VAL-G02-REGEXSAFE).
        retroTargets:
          type: array
          items:
            type: string
            enum: [G10, G11, G06]
    ApprovalMatrixConfig:
      type: object
      required: [name, workflowCode, rules]
      properties:
        approvalMatrixConfigId:
          type: [string, 'null']
        name:
          type: string
        scope:
          type: string
          enum: [GLOBAL, ENTITY, ORG_UNIT]
        scopeRef:
          type: [string, 'null']
        workflowCode:
          type: string
          description: Bound P01 workflow_code.
        status:
          type: string
          enum: [DRAFT, ACTIVE, RETIRED]
        version:
          type: [integer, 'null']
        effectiveFrom:
          type: [string, 'null']
          format: date
        rules:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalMatrixRule'
    ApprovalMatrixRule:
      type: object
      required: [levelNo, requiredRole]
      properties:
        levelNo:
          type: integer
        sensitivity:
          $ref: '#/components/schemas/SensitivityClass'
        employmentStatusScope:
          type: [string, 'null']
        requiredRole:
          type: string
        pattern:
          $ref: '#/components/schemas/WorkflowPattern'
        slaHours:
          type: integer
        escalationRole:
          type: [string, 'null']
        requiresEsignature:
          type: boolean
          default: false
    RegexTestRequest:
      type: object
      required: [regex]
      properties:
        regex:
          type: string
        samples:
          type: array
          items:
            type: string
    RegexTestResult:
      type: object
      properties:
        safe:
          type: boolean
        rule:
          type: string
          example: VAL-G02-REGEXSAFE
        results:
          type: array
          items:
            type: object
            properties:
              sample:
                type: string
              matched:
                type: boolean

    # --- Delegation (E8) ---------------------------------------------------
    CreateDelegation:
      type: object
      required: [delegateUserId, validFrom, validTo]
      properties:
        delegateUserId:
          type: string
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
        scopeRef:
          type: [string, 'null']
        nodeTypes:
          type: array
          items:
            type: string
    Delegation:
      type: object
      properties:
        delegationId:
          type: string
        delegatorUserId:
          type: string
        delegateUserId:
          type: string
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
        scopeRef:
          type: [string, 'null']
        nodeTypes:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [ACTIVE, REVOKED, EXPIRED]
        delegateHoldsRoleVerified:
          type: boolean

    # --- Template (E9) -----------------------------------------------------
    ChangeRequestTemplate:
      type: object
      required: [name, fieldKeys]
      properties:
        templateId:
          type: [string, 'null']
        name:
          type: string
        scope:
          type: string
          enum: [GLOBAL, ENTITY, ORG_UNIT]
        scopeRef:
          type: [string, 'null']
        changeType:
          $ref: '#/components/schemas/ChangeType'
        fieldKeys:
          type: array
          items:
            type: string
        requiredDocTypes:
          type: array
          items:
            type: string
        instructions:
          type: [string, 'null']
        w2FormRef:
          type: [string, 'null']
        active:
          type: boolean
          default: true

    # --- History (FR-016) --------------------------------------------------
    FieldHistoryEntry:
      type: object
      properties:
        fieldKey:
          type: string
        m01FieldKey:
          type: string
        oldValue:
          type: [string, 'null']
        newValue:
          type: [string, 'null']
        changeType:
          $ref: '#/components/schemas/ChangeType'
        effectiveFrom:
          type: [string, 'null']
          format: date
        recordedAt:
          type: string
          format: date-time
        crNumber:
          type: string
        authority:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
              action:
                type: string
              esign:
                type: [string, 'null']
        documents:
          type: array
          items:
            type: string
        srStatus:
          $ref: '#/components/schemas/SrPostingStatus'
        retroStatus:
          type: [object, 'null']
          additionalProperties:
            $ref: '#/components/schemas/RetroStatus'
        auditChainVerified:
          type: boolean
        auditSource:
          type: string
          example: P05
    EditableField:
      type: object
      properties:
        fieldKey:
          type: string
        m01FieldKey:
          type: string
        label:
          type: string
        currentValue:
          type: [string, 'null']
          description: Masked per P02 PII ceiling.
        sensitivity:
          $ref: '#/components/schemas/SensitivityClass'
        selfServiceEditable:
          type: boolean
        requiresStepUp:
          type: boolean
    StatusGateResult:
      type: object
      properties:
        employeeId:
          type: string
        fieldKey:
          type: [string, 'null']
        employmentStatus:
          type: string
        decision:
          type: string
          enum: [ALLOW, BLOCK, ELEVATE]
        requiredPath:
          type: [string, 'null']
    ChainVerifyRequest:
      type: object
      properties:
        dateFrom:
          type: [string, 'null']
          format: date
        dateTo:
          type: [string, 'null']
          format: date
        scopeRef:
          type: [string, 'null']
    ChainVerifyResult:
      type: object
      properties:
        verified:
          type: boolean
        breaks:
          type: array
          items:
            type: object
            properties:
              partition:
                type: string
              detail:
                type: string
        verifiedAt:
          type: string
          format: date-time

    # --- Data-subject notice (E15) -----------------------------------------
    DataSubjectNotice:
      type: object
      properties:
        noticeId:
          type: string
        changeRequestId:
          type: string
        channel:
          type: string
          enum: [SMS, EMAIL, POSTAL, IN_APP]
        sentAt:
          type: [string, 'null']
          format: date-time
        objectionWindowEndsAt:
          type: [string, 'null']
          format: date-time
        outcome:
          type: [string, 'null']
          enum: [PENDING, CONFIRMED, OBJECTED, WINDOW_ELAPSED, null]
        deliveryStatus:
          type: string
          enum: [PENDING, DELIVERED, FAILED]
        oldValueAlertSent:
          type: boolean

    # --- Objection (E16) ---------------------------------------------------
    CreateObjection:
      type: object
      required: [changeRequestId, objectionType, reason]
      properties:
        changeRequestId:
          type: string
        changeRequestItemId:
          type: [string, 'null']
        objectionType:
          type: string
          enum: [IN_FLIGHT, COMMITTED]
        reason:
          type: string
        onBehalfAuthorization:
          type: [string, 'null']
          description: Representative authorization reference, if not the data subject.
    ResolveObjection:
      type: object
      required: [resolution, comment]
      properties:
        resolution:
          type: string
          enum: [UPHELD, DISMISSED]
        comment:
          type: string
    Objection:
      type: object
      properties:
        objectionId:
          type: string
        changeRequestId:
          type: string
        objectionType:
          type: string
          enum: [IN_FLIGHT, COMMITTED]
        effect:
          type: string
          enum: [PAUSE, REVERSAL_REQUESTED]
        status:
          type: string
          enum: [OPEN, UPHELD, DISMISSED]
        grievanceOfficer:
          type: [string, 'null']
        resolutionComment:
          type: [string, 'null']

    # --- Reversal (E17) ----------------------------------------------------
    InitiateReversal:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
        revertToValue:
          type: [string, 'null']
    Reversal:
      type: object
      properties:
        reversalId:
          type: string
        changeRequestId:
          type: string
        changeRequestItemId:
          type: string
        auth1:
          type: [string, 'null']
        auth2:
          type: [string, 'null']
        originalMaker:
          type: string
        revertToValue:
          type: [string, 'null']
        status:
          type: string
          enum: [RAISED, AUTH1_DONE, EXECUTED, FAILED]
        reversingSrStatus:
          $ref: '#/components/schemas/SrPostingStatus'
        reversingRetroStatus:
          $ref: '#/components/schemas/RetroStatus'

    # --- Risk (E13) --------------------------------------------------------
    RiskReviewBody:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [CLEARED, CONFIRMED_FRAUD, ESCALATED]
        comment:
          type: [string, 'null']
    RiskSignal:
      type: object
      properties:
        signalId:
          type: string
        changeRequestId:
          type: string
        signalType:
          type: string
          example: DUPLICATE_BANK_ACCOUNT
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        score:
          type: integer
        reviewOutcome:
          type: [string, 'null']
          enum: [CLEARED, CONFIRMED_FRAUD, ESCALATED, null]
        linkedEmployees:
          type: array
          items:
            type: string
        evidence:
          type: [object, 'null']
          additionalProperties: true

    # --- Retro (E14) -------------------------------------------------------
    RetroAckBody:
      type: object
      required: [ackReference]
      properties:
        ackReference:
          type: string
        targetModule:
          type: string
          enum: [G10, G11, G06]
    RetroImpactEvent:
      type: object
      properties:
        retroEventId:
          type: string
        changeRequestItemId:
          type: string
        itemId:
          type: [string, 'null']
        targetModule:
          type: string
          enum: [G10, G11, G06]
        status:
          $ref: '#/components/schemas/RetroStatus'
        ackReference:
          type: [string, 'null']
        attempts:
          type: integer
        effectiveDate:
          type: [string, 'null']
          format: date

    # --- Step-up (E19) -----------------------------------------------------
    StepUpChallenge:
      type: object
      properties:
        challengeId:
          type: string
        changeRequestId:
          type: string
        method:
          type: string
          enum: [TOTP, SMS_OTP, PUSH, WEBAUTHN]
        expiresAt:
          type: string
          format: date-time
    StepUpVerifyBody:
      type: object
      required: [challengeId]
      properties:
        challengeId:
          type: string
        code:
          type: [string, 'null']
        assertion:
          type: [object, 'null']
          additionalProperties: true
    StepUpEvent:
      type: object
      properties:
        stepUpEventId:
          type: string
        changeRequestId:
          type: string
        method:
          type: string
          enum: [TOTP, SMS_OTP, PUSH, WEBAUTHN]
        result:
          type: string
          enum: [SUCCESS, FAILED]
        authAssuranceLevel:
          type: string
          example: AAL2
        expiresAt:
          type: string
          format: date-time

    # --- Shared bodies -----------------------------------------------------
    CommentBody:
      type: object
      properties:
        comment:
          type: [string, 'null']
