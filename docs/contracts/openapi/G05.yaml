    # ---- SR ingest contracts (G12-frozen envelope) ----
    SrIngestEnvelope:
      type: object
      required: [source_module, source_reference_id, source_event_version, event_type, fact_key, tenant_id]
      properties:
        source_module:
          type: string
          const: G05
          description: Explicit source module (never inferred).
        source_reference_id:
          type: string
          description: Originating G05 aggregate/checkpoint reference (dedup tuple member).
        source_event_version:
          type: integer
          description: Event version (dedup tuple member).
        event_type: { $ref: '#/components/schemas/SrEventType' }
        fact_key:
          type: string
          description: Qualifying-service correlation key (required; missing → SR_FACT_KEY_REQUIRED).
        tenant_id: { type: string, format: uuid }
        entity_id: { type: [string, 'null'], format: uuid }
        body:
          type: object
          description: SR event body.
          properties:
            order_no: { type: string }
            source_org_unit_id: { type: string, format: uuid }
            dest_org_unit_id: { type: string, format: uuid }
            effective_date: { type: string, format: date }
            service_continuity_asserted:
              type: boolean
              description: Required true for RELIEVING/JOINING.
          additionalProperties: true

    SrReversalEnvelope:
      type: object
      required: [source_module, source_reference_id, source_event_version, event_type, fact_key, tenant_id, is_reversal, reverses_source_reference_id]
      properties:
        source_module:
          type: string
          const: G05
        source_reference_id: { type: string }
        source_event_version: { type: integer }
        event_type: { $ref: '#/components/schemas/SrReversalEventType' }
        fact_key: { type: string }
        tenant_id: { type: string, format: uuid }
        entity_id: { type: [string, 'null'], format: uuid }
        is_reversal:
          type: boolean
          const: true
        reverses_source_reference_id:
          type: string
          description: The source_reference_id of the event being reversed.
        body:
          type: object
          additionalProperties: true

    SrIngestResult:
      type: object
      properties:
        ledgerEventId: { type: [string, 'null'], format: uuid }
        status:
          type: string
          enum: [INGESTED, DUPLICATE, PENDING]
        deduped: { type: boolean }
        factKey: { type: string }

    SrOutboxRow:
      type: object
      properties:
        outboxId: { type: string, format: uuid }
        aggregateType:
          type: string
          enum: [TRANSFER_ORDER, RELIEVING_ORDER, JOINING_REPORT]
        aggregateId: { type: string, format: uuid }
        targetSystem:
          type: string
          enum: [G12_SR, G10_PAYROLL, G01_MASTER, G09_DISCIPLINARY]
        eventType:
          type: string
          enum:
            - TRANSFER
            - RELIEVING
            - JOINING
            - MUTUAL_TRANSFER
            - TRANSFER_CANCELLED
            - RELIEVING_CANCELLED
            - JOINING_CANCELLED
            - PAY_CONTINUITY
            - ENTITLEMENT
            - LPC_REQUEST
            - POSTING_UPDATE
            - LICENCE_FEE_RECOVERY
            - SENIORITY_FEED
            - DISCIPLINARY_TRIGGER
        idempotencyKey: { type: string }
        status: { $ref: '#/components/schemas/OutboxStatus' }
        attemptCount: { type: integer }
        maxAttempts: { type: integer }
        nextAttemptAt: { type: [string, 'null'], format: date-time }
        lastError: { type: [string, 'null'] }
        deliveredAt: { type: [string, 'null'], format: date-time }
        deadLetteredAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    AnalyticsSummary:
      type: object
      properties:
        medianOrderToRelieveDays: { type: number }
        continuousPayPct: { type: number }
        auditableTransitPct: { type: number }
        policyViolationsWithoutOverride: { type: integer }
        clearanceClosedPct: { type: number }
        srPostedPct: { type: number }
        selfServicePct: { type: number }

    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, description: Mandatory justification (ERR-REASON-REQ if absent). }
