# Generated for G09 — Disciplinary Cases & Punishment. Grounded in docs/brd/v3/G09,
# docs/contracts/error-taxonomy.yaml (ERR-G09-*), and docs/brd/PLATFORM_FOUNDATION.md §4.
openapi: 3.1.0
info:
  title: G09 — Disciplinary Cases and Punishment Management API
  version: 3.0.0
  description: 'Government HRMS module G09 (Disciplinary Cases & Punishment). Statutory due-process engine running on the PrimeSoft platform (workflow P01, RBAC P02, audit P05, notifications X.2). Adopts the platform API conventions verbatim (PLATFORM_FOUNDATION §4): bearer auth, X-Correlation-Id response header, Idempotency-Key on state-changing POSTs (24h replay), cursor pagination (limit default 25/max 100 + cursor → next_cursor), and the canonical error envelope with the 8 platform wire codes plus the ERR-G09-* catalog (error-taxonomy.yaml). Penalty/exoneration/suspension outcomes post to the G12 SR ledger via the single canonical write-port POST /api/v1/sr/ingest (MINOR_PENALTY/MAJOR_PENALTY/CENSURE/SUSPENSION/SUSPENSION_REVOKED + *_REVERSAL), deduplicated on (source_module, source_reference_id, source_event_version) + fact_key. Confidentiality and sealed-cover are enforced by P02 field masking.'
  contact:
    name: API Architecture / Platform Foundation
servers:
- url: /api/v1
  description: All endpoints under the /api/v1 major prefix (Foundation §4).
security:
- bearerAuth: []
tags:
- name: sr-ingest
  description: G12 SR ledger reference-writer port
- name: complaints
  description: Complaint / source-of-misconduct registration & triage (FR-001)
- name: cases
  description: Disciplinary case reads
- name: preliminary-inquiry
  description: Preliminary fact-finding inquiry (FR-002)
- name: suspensions
  description: Suspension, subsistence & review (FR-003)
- name: charge-sheets
