# =============================================================================
# Government HRMS — Consolidated Authorization Matrix
# =============================================================================
# Machine-readable authorization model for the 14-module government HRMS (G01–G14).
#
# Grounding (single sources of truth — this file re-states, never re-invents):
#   - RBAC Design Document v1.7  (docs/platform-grounding/extracts/rbac_design.txt)
#       §2 role taxonomy · §3 scoping dimensions · §4.3 capability-flag registry ·
#       §5 action-level access · §6 sensitive-data / PII ceiling · §7 field access
#   - PLATFORM_FOUNDATION.md §6  (RBAC model to reuse; §6.6 gov roles as ADDITIONS)
#   - Platform Spec P02 — Authorization.check (enforcement; resolution order)
#   - Each v3 BRD's "User Roles & Permissions" + "Alignment with PrimeSoft Platform"
#
# Authoring rule (PLATFORM_FOUNDATION §6, §9.4): the access-control MODEL is owned
# by RBAC v1.7. Government statutory actors are expressed ONLY as ADDITIONS — new
# roles + capability flags — never a parallel scheme. No role here contradicts
# RBAC v1.7; base roles are reproduced verbatim, gov roles are marked additions
# with the introducing module. Enforcement is model-driven via P02 (see notes).
# =============================================================================

meta:
  version: "1.0"
  status: draft
  owns_model: false          # the MODEL is owned by RBAC v1.7; this file consolidates it
  enforcement: "P02 Authorization.check"
  scope_types: [self, team, entity, tenant, cross-tenant]
  action_verbs: [View, Edit, Approve/Reject, Download, Admin]   # RBAC §5
  sod_principle: "maker != checker; no self-approval; multi-role INTERSECTION (most restrictive) — enforced by P01/P02, not re-coded per endpoint"
  authority_resolution_contract:
    source: docs/spec/authority-resolution-contract.yaml
    p01_resolver_types: [WORK_QUEUE, NAMED_ROLE, REPORTING_CHAIN, STATUTORY_AUTHORITY, NAMED_INDIVIDUAL, COST_CENTRE_HEAD, COMMITTEE]
    p02_duty: "P02 supplies role grants, scope filters, PII ceilings, and SoD checks to P01 resolver decisions."
    failure_rule: "Resolver ambiguity, no eligible candidate, and SoD blocks fail closed; no default all-tenant/all-entity approval queue."
  ph02_authority_fixture_contract:
    source: docs/spec/hrms-authority-model.yaml
    seed_plan: docs/spec/hrms-seed-data-plan.yaml
    vertical_slice_actor_coverage:
      G03_leave:
        resolver_types: [REPORTING_CHAIN, ORG_UNIT_HEAD]
        required_roles: [employee, l1_manager, leave_admin, sanctioning_authority]
        fixture_tables: [employee_job_assignments, positions, g01_authority_assignments]
      G05_transfer:
        resolver_types: [STATUTORY_AUTHORITY, WORK_QUEUE]
        required_roles: [hr_admin, transfer_authority, sr_custodian]
        fixture_tables: [g01_authority_assignments, g01_authority_delegations]
      G06_DPC:
        resolver_types: [STATUTORY_AUTHORITY, COMMITTEE]
        required_roles: [g06_dpc_secretary, g06_dpc_member, g06_appointing_authority]
        fixture_tables: [g01_committees, g01_committee_members, g06_promotion_panels, g06_promotion_panel_members]
      G09_inquiry:
        resolver_types: [STATUTORY_AUTHORITY, COMMITTEE]
        required_roles: [disciplinary_authority, inquiry_officer, appellate_authority]
        fixture_tables: [authority_competence, inquiry_appointments]

# -----------------------------------------------------------------------------
# 1. ROLES  — RBAC v1.7 base roles + every gov-added role
# -----------------------------------------------------------------------------
roles:

  # --- Platform roles (RBAC §2.1) ---
  - role_code: platform_super_admin
    name: Platform Super Admin
    description: All-tenant provisioning, master data, migration tooling, cross-tenant analytics.
    scope_type: cross-tenant
    is_platform_base: true
  - role_code: org_admin
    name: Organisation Admin
    description: Single-tenant owner of org structure, RBAC config, SSO, workflow/form/notification config; grants entitlements & capability flags. Cross-entity reach as widened scope filter.
    scope_type: tenant
    is_platform_base: true

  # --- Entity-scoped operational roles (RBAC §2.2) ---
  - role_code: hr_admin
    name: HR Administrator
    description: Full employee-lifecycle access within entity; superset operational role; Module Admin across HR modules.
    scope_type: entity
    is_platform_base: true
  - role_code: finance_admin
    name: Finance Admin
    description: Payroll approval and compensation data within entity; joint M10 admin (config only, not hike approver).
    scope_type: entity
    is_platform_base: true
  - role_code: hrbp
    name: HRBP
    description: HR operations for directly assigned employees (individual or via UAG); five entitlement dimensions apply.
    scope_type: team
    is_platform_base: true
  - role_code: office_admin
    name: Office Admin
    description: Entity-scoped; directory + DOB view + national-ID view/upload + bank-account entry (masked). Fixed platform grants.
    scope_type: entity
    is_platform_base: true
  - role_code: onboarding_admin
    name: Onboarding Admin
    description: Module Admin for M02 (onboarding) only, entity level.
    scope_type: entity
    is_platform_base: true
  - role_code: offboarding_admin
    name: Offboarding Admin
    description: Module Admin for M03 (exits & offboarding) only, entity level.
    scope_type: entity
    is_platform_base: true
  - role_code: leave_admin
    name: Leave Admin
    description: Module Admin for M04 (leave) only; eligible approver at any stage; entity level.
    scope_type: entity
    is_platform_base: true
  - role_code: attendance_admin
    name: Attendance Admin
    description: Module Admin for M05 (attendance) only; eligible approver all request types; entity level.
    scope_type: entity
    is_platform_base: true
  - role_code: payroll_admin
    name: Payroll Admin
    description: Module Admin for M06 (payroll) only; run/structure/disbursement prep; entity level.
    scope_type: entity
    is_platform_base: true
  - role_code: compliance_admin
    name: Compliance Admin
    description: Joint M07 statutory-compliance owner with HR Admin; entity level.
    scope_type: entity
    is_platform_base: true
  - role_code: performance_admin
    name: Performance Admin
    description: Module Admin for M09 (performance); five entitlement dimensions per §8.3; entity level.
    scope_type: entity
    is_platform_base: true
  - role_code: compensation_admin
    name: Compensation Admin
    description: Joint M10 (hikes & compensation) owner with Finance Admin; entity level.
    scope_type: entity
    is_platform_base: true
  - role_code: analytics_admin
    name: Analytics Admin
    description: M16 config rights (report defs, schedules, dashboards); holds analytics.* — does not govern who can access analytics.
    scope_type: entity
    is_platform_base: true
  - role_code: document_admin
    name: Document Admin
    description: Module Admin for M11 (document management) only; policy library, vault settings, sign-off engine; entity level.
    scope_type: entity
    is_platform_base: true
  - role_code: recruiter
    name: Recruiter
    description: Assigned requisitions and their candidates only; no offer-letter generation.
    scope_type: entity
    is_platform_base: true
  - role_code: recruitment_admin
    name: Recruitment Admin
    description: All requisitions within entity; offer-letter generation; five entitlement dimensions per §8.2.
    scope_type: entity
    is_platform_base: true
  - role_code: it_admin
    name: IT Admin
    description: M17 assets & IT service management — asset register, assignment, CMDB, service-desk config; entity level.
    scope_type: entity
    is_platform_base: true
  - role_code: it_asset_manager
    name: IT Asset Manager
    description: Asset lifecycle, assignment & audit within M17; entity level.
    scope_type: entity
    is_platform_base: true
  - role_code: service_desk_admin
    name: Service Desk Admin
    description: Service-desk queue, catalog, KB, SLA config (M17); entity level.
    scope_type: entity
    is_platform_base: true

  # --- Manager hierarchy (RBAC §2.3) ---
  - role_code: l1_manager
    name: Manager (L1)
    description: Direct and indirect reports; approve/reject leave & attendance; edit team attendance. No compensation/PII.
    scope_type: team
    is_platform_base: true
  - role_code: l2_manager
    name: L2 Manager
    description: Reporting subtree — reduced vs L1.
    scope_type: team
    is_platform_base: true
  - role_code: l3_manager
    name: L3 Manager
    description: Reporting subtree — reduced vs L2.
    scope_type: team
    is_platform_base: true
  - role_code: l4_manager
    name: L4 Manager
    description: Reporting subtree — reduced vs L3.
    scope_type: team
    is_platform_base: true
  - role_code: l5_manager
    name: L5 Manager+
    description: Reporting subtree — minimal permissions.
    scope_type: team
    is_platform_base: true
  - role_code: hod
    name: HOD (Head of Department)
    description: Entire assigned department (read); compensation & published-rating visibility off by default; workflow approval off by default (per-workflow per-user grant by Org Admin).
    scope_type: entity
    is_platform_base: true
  - role_code: uag_head
    name: User Assignment Group Head
    description: Same as HOD scoped to assigned UAG; workflow approval authority — hard ceiling, cannot be granted.
    scope_type: team
    is_platform_base: true
  - role_code: skip_level_manager
    name: Skip-level Manager
    description: Full reporting subtree — read only, no approvals; retains published ratings post-calibration.
    scope_type: team
    is_platform_base: true
  - role_code: dotted_line_manager
    name: Dotted Line Manager
    description: Dotted-line reportees only — read only.
    scope_type: team
    is_platform_base: true

  # --- Individual access roles (RBAC §2.4) ---
  - role_code: employee
    name: Employee
    description: Own data only; self-service (profile, leave, attendance, payslip, self-review).
    scope_type: self
    is_platform_base: true
  - role_code: candidate
    name: Candidate / Pre-joining
    description: Recruitment portal (pre-offer) / pre-joining portal (post-offer); no live HRMS access.
    scope_type: self
    is_platform_base: true
  - role_code: contractor
    name: Contractor / Consultant
    description: Own attendance and documents, scoped to engagement period. Status TBD in RBAC v1.7.
    scope_type: self
    is_platform_base: true
  - role_code: ceo
    name: CEO
    description: Final approver for hike/compensation decisions (M10); otherwise standard Employee self-service.
    scope_type: self
    is_platform_base: true

  # === GOVERNMENT ADDITIONS (PLATFORM_FOUNDATION §6.6; per-module BRD §3) ===

  - role_code: dpo
    name: Data Protection Officer
    description: DPDPA governance — data-principal-rights processing, consent/notice ledger oversight, erasure sign-off, breach handling. PII-ceiling-bound. (Granted as governance capability in G03/G14.)
    scope_type: tenant
    is_platform_base: false
    gov_addition: true
    introduced_in: G01
  - role_code: sr_custodian
    name: SR Custodian / Registrar
    description: Statutory Service-Register custodian at the Module-Admin tier — attests entries, approves corrections/annotations, promotes legacy batches, issues certified extracts, owns verification cycle. Mirrors Document Admin pattern; runs on P05 substrate (G12).
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G12
  - role_code: sr_second_custodian
    name: SR Second Custodian
    description: Independent second custodian required for routine corrigenda and FULL_SR extracts (runtime maker!=checker!=second-custodian SoD).
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G12
  - role_code: appointing_authority
    name: Appointing Authority
    description: Senior sanctioning authority; P01 approver for statutory personal-detail changes and dual-authoriser for break-glass. MFA-enforced.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G02
  - role_code: sanctioning_authority
    name: Sanctioning Authority (Dept Head)
    description: Final sanction for special leaves (Maternity, Study, Sabbatical, Commuted, LWP, encashment); P01 approver; no self-approve.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G03
  - role_code: integ_ops
    name: Integration Operator (IntegOps)
    description: Entity-scoped ops role (module-admin pattern) for the G03->G12 leave-SR relay — monitors dashboard, triages DLQ, triggers replay/backfill/reconciliation; cannot author SR entries bypassing maker-checker.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G04
  - role_code: pension_officer
    name: Pension Officer / Dealing Assistant
    description: Entity-scoped module-admin role (analogous to Payroll Admin) — maker for pension/terminal-benefit cases; consumes qualifying-service flags. MFA required.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G04
  - role_code: transfer_authority
    name: Transfer / Appointing Authority (Transfers)
    description: Sanctioning authority for transfer/deputation/repatriation orders, amendments, cancellations, forced-action powers; P01 approver; MFA-enforced.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G05
  - role_code: g06_establishment_officer
    name: Establishment / Seniority Officer
    description: Maker for seniority lists and qualifying-service ledger; cannot self-approve publication.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G06
  - role_code: g06_strength_officer
    name: Establishment-Strength Officer
    description: Independent authority over sanctioned-post strength and vacancy figures (audited P05); separate from case maker.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G06
  - role_code: g06_roster_officer
    name: Reservation / Roster Officer
    description: Independent control on the DPC reservation roster and own-merit migration.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G06
  - role_code: g06_vigilance_clearance
    name: Vigilance Clearance Officer (Promotion)
    description: Reads disciplinary/vigilance status from G09; attests clearance (case-scoped entitlement) for promotion eligibility.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G06
  - role_code: g06_dpc_secretary
    name: DPC Secretary
    description: Convenes the Departmental Promotion Committee (P01 initiator); cannot vote or grade.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G06
  - role_code: g06_dpc_member
    name: DPC / Panel Member
    description: P01 PARALLEL_ALL_OF approver; grades candidates; cannot be in own promotion field.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G06
  - role_code: g06_appointing_authority
    name: Appointing Authority (Promotion)
    description: P01 checker / DYNAMIC_APPROVER for promotion orders; maker!=checker enforced by P02.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G06
  - role_code: g06_reviewing_authority
    name: Reviewing Authority (Promotion)
    description: Review-DPC / supersession-review approver on P01.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G06
  - role_code: g06_legal_officer
    name: Legal / Litigation Officer
    description: Writes only to legal/court-case-linkage entities; cannot adjudicate promotion.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G06
  - role_code: ld_officer
    name: L&D Officer (HR)
    description: Entity-scoped module-admin role (analogous to Performance/Payroll Admin) — catalog, content, sessions, attendance/assessment, certs, campaigns, credential capture.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G07
  - role_code: ld_manager
    name: L&D Manager / Training Head
    description: Approves annual plan & budget; L2 P01 approver for nominations; launches/approves campaigns.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G07
  - role_code: ld_trainer
    name: Trainer / Facilitator
    description: Session-scoped — view assigned rosters, mark attendance, enter scores, close session.
    scope_type: team
    is_platform_base: false
    gov_addition: true
    introduced_in: G07
  - role_code: ld_kiosk_operator
    name: Kiosk / Assisted-Capture Operator
    description: Operates shared kiosk for non-login staff with attributed (never anonymous) audit.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G07
  - role_code: g08_accepting_authority
    name: Accepting Authority (APAR)
    description: Final APAR certifying authority (Appointing-Authority analogue) — settles grade, ratifies calibration, triggers disclosure, signs with DSC.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G08
  - role_code: g08_competent_authority
    name: Competent / Adjudicating Authority (APAR)
    description: Adjudicates representations; senior to Accepting Authority; not in appraisee's chain.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G08
  - role_code: g08_apar_custodian
    name: APAR Custodian
    description: Confidential custody, retention, expunction execution, heir-access grants (aligns with SR Custodian / Document Admin pattern).
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G08
  - role_code: disciplinary_authority
    name: Disciplinary Authority (DA)
    description: Competent sanctioning authority — initiates charges, considers inquiry report, imposes penalty. Competence-verified (DI-13); cannot self-approve; must differ from complainant/witness/IO/PO. MFA-enforced.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G09
  - role_code: inquiry_officer
    name: Inquiry Officer (IO)
    description: Conducts the departmental inquiry impartially; case-scoped read entitlement; distinct from DA/PO/witness.
    scope_type: self
    is_platform_base: false
    gov_addition: true
    introduced_in: G09
  - role_code: presenting_officer
    name: Presenting Officer (PO)
    description: Presents the department's case before the IO; distinct from DA/IO.
    scope_type: self
    is_platform_base: false
    gov_addition: true
    introduced_in: G09
  - role_code: appellate_authority
    name: Appellate / Reviewing Authority
    description: Decides appeals/revisions/reviews; competence-verified; must differ from DA (G09) or upholding custodian (G12). Read + decision, no direct ledger write.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G09
  - role_code: vigilance_officer
    name: Vigilance Officer
    description: Screens complaints, maintains integrity register & vigilance-clearance status; confidential-source visibility (P02 PII ceiling).
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G09
  - role_code: icc_presiding
    name: ICC Presiding Officer (POSH)
    description: Presides over the POSH Internal Committee route (replaces IO for HARASSMENT cases).
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G09
  - role_code: icc_member
    name: ICC Member (POSH)
    description: Internal Committee member; external member mandatory via icc_external_member flag.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G09
  - role_code: payroll_officer
    name: Payroll Officer (Maker)
    description: Entity-scoped module-admin role — configure/run payroll (draft), adjustments, prepare bank file, prepare FnF. Cannot approve, sign, or confirm positive-pay.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G10
  - role_code: payroll_approver
    name: Payroll Approver / Controller (Checker)
    description: Reviews reconciliation, approves & locks runs (P01), authorises off-cycle/supplementary/FnF, certifies remittances/Form-16. Must differ from run creator. MFA-enforced.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G10
  - role_code: payroll_disburser
    name: Payroll Disburser
    description: DSC-signs the bank file and transmits over X.3. Distinct from Officer and Approver (strict 3-way SoD). MFA-enforced.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G10
  - role_code: pension_sanctioning_authority
    name: Pension Sanctioning Authority / Head of Office
    description: Checker for pension cases (P01 approver); sanctions pension/anticipatory pension; SoD-enforced. MFA-enforced.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G11
  - role_code: pension_disbursing_authority
    name: Treasury / Pension Disbursing Authority (PDA)
    description: Bank CPPC / treasury disbursal of PPOs; integration over X.3. Read + disburse; no case authoring.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G11
  - role_code: medical_board
    name: Medical Board
    description: Certifies invalidation for invalid-pension cases; scoped read of case medical context.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G11
  - role_code: records_manager
    name: Records Manager (Custodian)
    description: Checker for document lifecycle — approves disposition, manages WORM, certifies true copies. maker!=checker enforced by P01. Holds Letter Admin flag where it certifies generated copies.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G13
  - role_code: legal_hold_admin
    name: Legal Hold Administrator
    description: Places legal holds; manages e-discovery exports. Separated from the custodian who can destroy.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G13
  - role_code: legal_hold_approver
    name: Legal Hold Approver
    description: Approves high-value placement and all releases (dual control) — release re-enables destruction, needs a second authority.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G13
  - role_code: security_dlp_officer
    name: Security / DLP Officer
    description: Classification-downgrade approval, DLP rules, quarantine release, key policy, clearance grants, anti-brute-force unlocks.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G13
  - role_code: establishment_officer
    name: Establishment Officer (Analytics)
    description: Authors/maintains establishment_position (sanctioned strength / roster points); values feed vacancy & reservation denominators; no dashboard publication authority.
    scope_type: entity
    is_platform_base: false
    gov_addition: true
    introduced_in: G14

# Mapping notes (do NOT create parallel write roles) per PLATFORM_FOUNDATION §6.6:
role_mappings_to_existing:
  Auditor: "Org Admin read access + read-only individual entitlement + P05 query access (RBAC §3.2). No parallel write role."
  "System Administrator": "Org Admin (tenant config) or Platform Super Admin (cross-tenant). No transactional self-approval."
  "Data Engineer (G14)": "Analytics capability flag on an IT/Analytics admin role; no dashboard publication authority."

# -----------------------------------------------------------------------------
# 2. CAPABILITY FLAGS  (RBAC §4.3 base registry + gov additions)
#    A flag is NOT a role — an opt-in capability Org Admin grants on an existing
#    role assignment. Grant/revoke audit-logged to P05. New flags register in
#    RBAC §4.3 via the §14 working-group process.
# -----------------------------------------------------------------------------
capability_flags:

  # --- RBAC v1.7 base flags (§4.3) ---
  - flag_code: bgv_review
    grants: "View Verification Reports tab; view vendor BGV results; record disposition on Discrepancy alerts; view BGV history post-completion."
    grantable_on: [onboarding_admin, hr_admin]
    module: M02
    is_platform_base: true
  - flag_code: letter_admin
    grants: "Author/manage letter templates, merge-field bindings, designate editors, approve/publish/version templates."
    grantable_on: [document_admin, hr_admin]
    module: M11
    is_platform_base: true
  - flag_code: asset_custodian
    grants: "Custodial responsibility for assigned assets; confirm periodic asset audit for held assets."
    grantable_on: [it_admin, it_asset_manager]
    module: M17
    is_platform_base: true
  - flag_code: dept_head_asset_audit_certify
    grants: "Certify the periodic asset-audit attestation for the department's assigned assets."
    grantable_on: [hod, uag_head]
    module: M17
    is_platform_base: true
  - flag_code: hod_report_visibility
    grants: "Per-user HOD grant: compensation & published-rating visibility (off by default)."
    grantable_on: [hod, uag_head]
    module: platform
    is_platform_base: true
    note: "Configured per-user grant, not a binary flag; UAG Head compensation configurable, workflow approval is a hard ceiling."
  - flag_code: hod_workflow_approval
    grants: "Per-user, per-workflow HOD approval authority (off by default). Hard ceiling for UAG Head — never grantable."
    grantable_on: [hod]
    module: platform
    is_platform_base: true

  # --- Government additions ---
  - flag_code: grievance_officer
    grants: "Handle data-principal grievances / privacy grievance queue."
