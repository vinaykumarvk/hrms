    DiscrepancyResolution:
      type: object
      required: [resolution]
      properties:
        resolution: { type: string, enum: [RESOLVED, CONDONED, WAIVED, ESCALATED] }
        condonation_order_ref: { type: [string, "null"] }
        reason: { type: string }
    SrIngestRequest:
      type: object
      required: [source_module, source_reference_id, source_event_version, event_type_code, tenant_id, entity_id, employee_id]
      properties:
        source_module: { type: string, const: G11, description: Explicit, never inferred (§8.7). }
        source_reference_id: { type: string, description: G11 case / sanction id. }
        source_event_version: { type: integer, minimum: 1, description: Increments on supersession. }
        event_type_code:
          type: string
          enum: [SEPARATION, SUPERANNUATION, RETIREMENT, VOLUNTARY_RETIREMENT, RESIGNATION, DEATH_IN_SERVICE, FAMILY_PENSION_SANCTIONED]
        fact_key:
          type: [string, "null"]
          description: >
            Mandatory for qualifying-service-bearing events (SEPARATION, SUPERANNUATION, RETIREMENT,
            VOLUNTARY_RETIREMENT); derived per the event type's fact_correlation_rule.
        tenant_id: { type: string, format: uuid }
        entity_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        event_date: { type: string, format: date }
        payload:
          type: [object, "null"]
          additionalProperties: true
    SrReversalRequest:
      type: object
      required: [source_module, reverses_source_reference_id, event_type_code, tenant_id, entity_id, employee_id]
      properties:
        source_module: { type: string, const: G11 }
        is_reversal: { type: boolean, const: true }
        reverses_source_reference_id: { type: string }
        source_event_version: { type: integer, minimum: 1 }
        event_type_code:
          type: string
          enum: [SEPARATION, SUPERANNUATION, RETIREMENT, VOLUNTARY_RETIREMENT, RESIGNATION, DEATH_IN_SERVICE, FAMILY_PENSION_SANCTIONED]
        tenant_id: { type: string, format: uuid }
        entity_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        reason: { type: string }

