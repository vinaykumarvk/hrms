    # ---- SR ingestion contract (G12) ----
    SrIngestRequest:
      type: object
      required: [event_type, source_module, source_reference_id, source_event_version, fact_key, tenant_id, entity_id]
      properties:
        event_type: { $ref: '#/components/schemas/SrEventType' }
        source_module: { type: string, enum: [G06], description: Set explicitly to G06; never inferred. }
        source_reference_id:
          type: string
          description: G06 business key of the originating row (order_id / arrangement_id / upgradation_id / posting_id / correction_event_id).
        source_event_version: { type: integer, minimum: 1 }
        fact_key:
          type: string
          description: Qualifying-service-bearing correlation key (required; per the event type's fact_correlation_rule; missing -> SR_FACT_KEY_REQUIRED).
        tenant_id: { type: string, format: uuid }
        entity_id: { type: string, format: uuid }
        effective_date: { type: [string, "null"], format: date }
        payload: { type: [object, "null"], additionalProperties: true }
    SrReversalRequest:
      type: object
      required: [is_reversal, reverses_source_reference_id, source_module, source_reference_id, source_event_version, tenant_id, entity_id]
      properties:
        is_reversal: { type: boolean, enum: [true] }
        reverses_source_reference_id: { type: string, description: Original source_reference_id being reversed. }
        event_type: { $ref: '#/components/schemas/SrReversalEventType' }
        source_module: { type: string, enum: [G06] }
        source_reference_id: { type: string }
        source_event_version: { type: integer, minimum: 1 }
        fact_key: { type: [string, "null"] }
        tenant_id: { type: string, format: uuid }
        entity_id: { type: string, format: uuid }
    SrIngestResult:
      type: object
      properties:
        sr_event_id: { type: string }
        deduped: { type: boolean, description: True when an idempotent replay returned the original event. }
        event_type: { type: string }
        source_module: { type: string, example: G06 }
        source_reference_id: { type: string }
        source_event_version: { type: integer }
        fact_key: { type: [string, "null"] }
        tenant_id: { type: string, format: uuid }
        entity_id: { type: string, format: uuid }
