            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /transfers/map/vacancies:
    get:
      tags: [Analytics]
      summary: Geographic vacancy map (Phase-2)
      operationId: getVacancyMap
      parameters:
        - name: cadre
          in: query
          schema: { type: string }
        - name: office
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Geo-tagged vacancies.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/VacancyPosition' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer JWT carrying resolved roles + tenant/entity scope (P02).

  headers:
    XCorrelationId:
      description: Correlation id echoed on every response and written to every audit/log line.
      schema: { type: string }

  parameters:
    PathId:
      name: id
      in: path
      required: true
      description: Resource UUID.
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      required: false
      description: Page size (default 25, max 100).
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque forward cursor.
      schema: { type: string }
    Sort:
      name: sort
      in: query
      required: false
      description: 'Sort spec: field:asc|desc.'
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Replay key for workflow-initiating / external-signal POSTs (24h window).
      schema: { type: string }

  responses:
    ValidationFailed:
      description: VALIDATION_FAILED (422) — input failed a VAL-* / VAL-G05-* rule.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: UNAUTHENTICATED (401) — no/invalid session.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: FORBIDDEN (403) — authenticated but not permitted (no existence leak).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: NOT_FOUND (404) — resource absent or out of scope.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: CONFLICT (409) — idempotency replay, duplicate start, or state conflict.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionFailed:
      description: PRECONDITION_FAILED (412) — a required precondition is not met.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: RATE_LIMITED (429) — rate limit exceeded.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Internal:
      description: INTERNAL (500) — unexpected server error (incl. mapped upstream failure).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      description: Canonical platform error envelope.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_FAILED
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - PRECONDITION_FAILED
                - RATE_LIMITED
                - INTERNAL
              description: One of the 8 platform HTTP codes.
            message:
              type: string
              description: Human-readable, resolved from a MSG-* / ERR-* id.
            field:
              type: [string, 'null']
              description: Offending field for validation errors.
            details:
              type: [object, 'null']
              description: >
                Structured discriminators. For G05 conditions, carries
                { errorId } e.g. ERR-G05-NOT-SERVED, ERR-G05-CLEARANCE-INCOMPLETE,
                ERR-G05-STAY-HOLD, ERR-G05-DUAL-POSTING, ERR-G05-NUMBER-LOCKED, etc.
              additionalProperties: true
              properties:
                errorId:
                  type: string
                  description: Module error id registered in the error taxonomy.
                  enum:
                    - ERR-G05-ACTIVE-TRANSFER
                    - ERR-G05-ELIGIBILITY-BLOCKED
                    - ERR-G05-BAN-WINDOW
                    - ERR-G05-CLEARANCE-INCOMPLETE
                    - ERR-G05-HANDOVER-DISPUTED
                    - ERR-G05-NOT-IN-TRANSIT
                    - ERR-G05-DEPUTATION-CAP
                    - ERR-G05-VACANCY-FULL
                    - ERR-G05-DUAL-POSTING
                    - ERR-G05-STAY-HOLD
                    - ERR-G05-MUTUAL-PAIR
                    - ERR-G05-NOT-SERVED
                    - ERR-G05-NUMBER-LOCKED
                    - ERR-G05-COUNSEL-TURN
                    - ERR-G05-FORCED-PRECOND
                    - ERR-G05-RELIEVE-DATE
                    - ERR-G05-QUARTER-OVERSTAY

    Page:
      type: object
      description: Cursor pagination wrapper.
      properties:
        data:
          type: array
          items: {}
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page; null when exhausted.

    # ---- Enums (from BRD §5.5 / field tables) ----
    TransferType:
      type: string
      enum: [REQUEST, ADMIN, MUTUAL, DEPUTATION, PROMOTION_LINKED]
    RequestOrigin:
      type: string
      enum: [SELF, MANAGER, ADMIN, SYSTEM]
    TransferGround:
      type: string
      enum: [MEDICAL, SPOUSE, COMPASSIONATE, ADMINISTRATIVE, REQUEST, PROMOTION, PUBLIC_INTEREST]
    PriorityCategory:
      type: string
      enum: [PROTECTED_SPOUSE, MEDICAL, SINGLE_PARENT, DIFFERENTLY_ABLED, NEAR_RETIREMENT, NONE]
    OrderClass:
      type: string
      enum: [SUBSTANTIVE, ADDITIONAL_CHARGE, DEPUTATION, REPATRIATION]
    DistanceBand:
      type: string
      enum: [LOCAL, SHORT, MEDIUM, LONG, OUTSTATION]
    AllotmentMethod:
      type: string
      enum: [SENIORITY, MERIT, PREFERENCE, MANUAL, COUNSELLING]
    ClearanceDepartment:
      type: string
      enum: [IT, LIBRARY, ACCOUNTS, STORES, ADVANCES, ESTATE_QUARTERS, HR, OTHER]
    EscalationTier:
      type: string
      enum: [NONE, OFFICER, DEPT_HEAD, AUTHORITY]
    RepatriationStatus:
      type: string
      enum: [ACTIVE, EXTENSION_REQUESTED, EXTENDED, REPATRIATION_DUE, REPATRIATED]
    RetentionStatus:
      type: string
      enum: [OCCUPIED, RETENTION_REQUESTED, RETENTION_APPROVED, VACATION_DUE, VACATED, OVERSTAY]
    OutboxStatus:
      type: string
      enum: [PENDING, IN_FLIGHT, DELIVERED, FAILED, DEAD_LETTERED]
    SrEventType:
      type: string
      description: G12-published SR event codes for G05.
      enum: [TRANSFER, RELIEVING, JOINING, MUTUAL_TRANSFER]
    SrReversalEventType:
      type: string
      enum: [TRANSFER_CANCELLED, RELIEVING_CANCELLED, JOINING_CANCELLED]
    DeliveryChannel:
      type: string
      enum: [IN_APP, EMAIL, SMS, REGISTERED_POST, HAND_DELIVERY, PUBLISHED_NOTICE]

    # ---- Core entities ----
    TransferRequest:
      type: object
      properties:
        transferRequestId: { type: string, format: uuid }
        requestNo: { type: string }
        employeeId: { type: string, format: uuid }
        transferType: { $ref: '#/components/schemas/TransferType' }
        requestOrigin: { $ref: '#/components/schemas/RequestOrigin' }
        sourceOrgUnitId: { type: string, format: uuid }
        requestedDestOrgUnitId: { type: [string, 'null'], format: uuid }
        mutualCounterpartEmployeeId: { type: [string, 'null'], format: uuid }
        ground: { $ref: '#/components/schemas/TransferGround' }
        groundDetails: { type: [string, 'null'] }
        supportingDocumentIds:
          type: array
          items: { type: string, format: uuid }
        sensitiveDocumentIds:
          type: array
          items: { type: string, format: uuid }
        sensitiveGround: { type: boolean }
        linkedPromotionId: { type: [string, 'null'], format: uuid }
        linkedDriveId: { type: [string, 'null'], format: uuid }
        priorityCategory: { $ref: '#/components/schemas/PriorityCategory' }
        status: { type: string }
        eligibilityResult: { type: [object, 'null'], additionalProperties: true }
        workflowInstanceId: { type: [string, 'null'], format: uuid }
        requestedEffectiveDate: { type: [string, 'null'], format: date }

    TransferRequestCreate:
      type: object
      required: [employeeId, transferType, requestOrigin, sourceOrgUnitId]
      properties:
        employeeId: { type: string, format: uuid }
        transferType: { $ref: '#/components/schemas/TransferType' }
        requestOrigin: { $ref: '#/components/schemas/RequestOrigin' }
        sourceOrgUnitId: { type: string, format: uuid }
        requestedDestOrgUnitId: { type: string, format: uuid }
        mutualCounterpartEmployeeId: { type: string, format: uuid }
        ground: { $ref: '#/components/schemas/TransferGround' }
        groundDetails: { type: string, maxLength: 4000 }
        priorityCategory: { $ref: '#/components/schemas/PriorityCategory' }
        supportingDocumentIds:
          type: array
          items: { type: string, format: uuid }
        sensitiveDocumentIds:
          type: array
          items: { type: string, format: uuid }
        requestedEffectiveDate: { type: string, format: date }

    TransferRequestUpdate:
      type: object
      properties:
        requestedDestOrgUnitId: { type: string, format: uuid }
        ground: { $ref: '#/components/schemas/TransferGround' }
        groundDetails: { type: string, maxLength: 4000 }
        priorityCategory: { $ref: '#/components/schemas/PriorityCategory' }
        supportingDocumentIds:
          type: array
          items: { type: string, format: uuid }
        sensitiveDocumentIds:
          type: array
          items: { type: string, format: uuid }
        requestedEffectiveDate: { type: string, format: date }

    TransferOrder:
      type: object
      properties:
        transferOrderId: { type: string, format: uuid }
        orderNo: { type: string, description: Gapless statutory number. }
        orderClass: { $ref: '#/components/schemas/OrderClass' }
        transferRequestId: { type: [string, 'null'], format: uuid }
        employeeId: { type: string, format: uuid }
        transferType: { $ref: '#/components/schemas/TransferType' }
        sourceOrgUnitId: { type: string, format: uuid }
        destOrgUnitId: { type: string, format: uuid }
        sourceDesignationId: { type: string, format: uuid }
        destDesignationId: { type: string, format: uuid }
        orderDate: { type: [string, 'null'], format: date }
        servedOnDate: { type: [string, 'null'], format: date }
        acknowledgedAt: { type: [string, 'null'], format: date-time }
        relieveByDate: { type: [string, 'null'], format: date }
        expectedJoiningDate: { type: [string, 'null'], format: date }
        joiningDistanceBand: { $ref: '#/components/schemas/DistanceBand' }
        joiningTimeDays: { type: [integer, 'null'] }
        joiningTimePayAdmissible: { type: boolean }
        entitlementRef: { type: [string, 'null'] }
        inTransitCustodyOrgUnitId: { type: [string, 'null'], format: uuid }
        isDeputation: { type: boolean }
        mutualPairOrderId: { type: [string, 'null'], format: uuid }
        driveId: { type: [string, 'null'], format: uuid }
        status: { type: string }
        holdActive: { type: boolean }
        orderDocumentId: { type: [string, 'null'], format: uuid }
        approvedBy: { type: [string, 'null'], format: uuid }
        approvedAt: { type: [string, 'null'], format: date-time }
        workflowInstanceId: { type: [string, 'null'], format: uuid }
        revisionNo: { type: integer }
        supersededByOrderId: { type: [string, 'null'], format: uuid }

    TransferOrderCreate:
      type: object
      required: [employeeId, transferType, sourceOrgUnitId, destOrgUnitId, orderClass]
      properties:
        transferRequestId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        transferType: { $ref: '#/components/schemas/TransferType' }
        orderClass: { $ref: '#/components/schemas/OrderClass' }
        sourceOrgUnitId: { type: string, format: uuid }
        destOrgUnitId: { type: string, format: uuid }
        sourceDesignationId: { type: string, format: uuid }
        destDesignationId: { type: string, format: uuid }
        joiningDistanceBand: { $ref: '#/components/schemas/DistanceBand' }
        expectedJoiningDate: { type: string, format: date }
        mutualPairOrderId: { type: string, format: uuid }
        driveId: { type: string, format: uuid }
        effectiveFrom: { type: string, format: date }

    ApprovalDecision:
      type: object
      properties:
        comment: { type: string }

    OrderCorrectionRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, description: Mandatory justification (ERR-REASON-REQ if absent). }
        changes: { type: object, additionalProperties: true }
        effectiveFrom: { type: string, format: date }

    EligibilityEvaluateRequest:
      type: object
      required: [employeeId, sourceOrgUnitId]
      properties:
        employeeId: { type: string, format: uuid }
        transferType: { $ref: '#/components/schemas/TransferType' }
        sourceOrgUnitId: { type: string, format: uuid }
        destOrgUnitId: { type: string, format: uuid }
        ground: { $ref: '#/components/schemas/TransferGround' }
        requestedEffectiveDate: { type: string, format: date }

    EligibilityResult:
      type: object
      properties:
        eligible: { type: boolean }
        enforcement:
          type: string
          enum: [PASS, HARD_BLOCK, SOFT_WARN, REQUIRE_OVERRIDE]
        violations:
          type: array
          items:
            type: object
            properties:
              ruleCode: { type: string }
              ruleType: { type: string }
              message: { type: string }
              errorId: { type: string }

    OverrideRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
        overriddenRuleCodes:
          type: array
          items: { type: string }

    TransferPolicyRule:
      type: object
      properties:
        policyRuleId: { type: string, format: uuid }
        ruleCode: { type: string }
        ruleType:
          type: string
          enum: [MIN_TENURE, MAX_TENURE, BAN_WINDOW, PROTECTED_CATEGORY, SANCTIONED_STRENGTH, COOLING_PERIOD, STATION_RETENTION, JOINING_TIME_PAY]
        scopeCadre: { type: [string, 'null'] }
        scopeOrgUnitId: { type: [string, 'null'], format: uuid }
        paramValue: { type: object, additionalProperties: true }
        enforcement:
          type: string
          enum: [HARD_BLOCK, SOFT_WARN, REQUIRE_OVERRIDE]
        effectiveFrom: { type: [string, 'null'], format: date }
        effectiveTo: { type: [string, 'null'], format: date }
        isActive: { type: boolean }

    TransferDrive:
      type: object
      properties:
        driveId: { type: string, format: uuid }
        driveCode: { type: string }
        title: { type: string }
        cadre: { type: [string, 'null'] }
        driveType:
          type: string
          enum: [ANNUAL, SEASONAL, AD_HOC, COUNSELLING]
        preferenceWindowStart: { type: [string, 'null'], format: date }
        preferenceWindowEnd: { type: [string, 'null'], format: date }
        allotmentMethod: { $ref: '#/components/schemas/AllotmentMethod' }
        status:
          type: string
          enum: [DRAFT, OPEN, COUNSELLING, ALLOTTED, ORDERS_ISSUED, CLOSED, CANCELLED]
        totalPositions: { type: [integer, 'null'] }

    TransferDriveCreate:
      type: object
      required: [driveCode, title, driveType, allotmentMethod]
      properties:
        driveCode: { type: string }
        title: { type: string }
        cadre: { type: string }
        driveType:
          type: string
          enum: [ANNUAL, SEASONAL, AD_HOC, COUNSELLING]
        preferenceWindowStart: { type: string, format: date }
        preferenceWindowEnd: { type: string, format: date }
        allotmentMethod: { $ref: '#/components/schemas/AllotmentMethod' }
        totalPositions: { type: integer }

    VacancyPosition:
      type: object
      properties:
        vacancyPositionId: { type: string, format: uuid }
        orgUnitId: { type: string, format: uuid }
        designationId: { type: string, format: uuid }
        cadre: { type: [string, 'null'] }
        sanctionedStrengthCached: { type: [integer, 'null'] }
        filledCountCached: { type: [integer, 'null'] }
        reservedCount: { type: integer }
        vacantCount: { type: [integer, 'null'], description: Derived at read; not authoritative. }
        strengthAsOf: { type: [string, 'null'], format: date-time }
        strengthSource:
          type: string
          enum: [G06, G01, MANUAL_FALLBACK]
        driveId: { type: [string, 'null'], format: uuid }
        isPublished: { type: boolean }
        geoLat: { type: [number, 'null'] }
        geoLng: { type: [number, 'null'] }

    VacancyPositionCreate:
      type: object
      required: [orgUnitId, designationId]
      properties:
        orgUnitId: { type: string, format: uuid }
        designationId: { type: string, format: uuid }
        cadre: { type: string }
        geoLat: { type: number }
        geoLng: { type: number }

    TransferPreference:
      type: object
      properties:
        preferenceId: { type: string, format: uuid }
        driveId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        preferenceRank: { type: integer, minimum: 1 }
        preferredOrgUnitId: { type: string, format: uuid }
        vacancyPositionId: { type: [string, 'null'], format: uuid }
        allotted: { type: boolean }
        seniorityScore: { type: [number, 'null'] }

    TransferPreferenceInput:
      type: object
      required: [preferenceRank, preferredOrgUnitId]
      properties:
        preferenceRank: { type: integer, minimum: 1 }
        preferredOrgUnitId: { type: string, format: uuid }
        vacancyPositionId: { type: string, format: uuid }

    AllotmentResult:
      type: object
      properties:
        driveId: { type: string, format: uuid }
        allotmentMethod: { $ref: '#/components/schemas/AllotmentMethod' }
        allottedCount: { type: integer }
        unallottedCount: { type: integer }
        reservations:
          type: array
          items: { $ref: '#/components/schemas/VacancyReservation' }

    DriveScreenResult:
      type: object
      properties:
        driveId: { type: string, format: uuid }
        eligibleCount: { type: integer }
        blockedCount: { type: integer }
        details:
          type: array
          items:
            type: object
            additionalProperties: true

    BatchJobAccepted:
      type: object
      properties:
        jobId: { type: string }
        driveId: { type: string, format: uuid }
        status: { type: string, example: ACCEPTED }
        totalQueued: { type: integer }

    DriveDashboard:
      type: object
      properties:
        driveId: { type: string, format: uuid }
        status: { type: string }
        totalPositions: { type: integer }
        allotted: { type: integer }
        ordersIssued: { type: integer }
        relieved: { type: integer }
        joined: { type: integer }
        quarantined: { type: integer }

    VacancyReservation:
      type: object
      properties:
        reservationId: { type: string, format: uuid }
        vacancyPositionId: { type: string, format: uuid }
        transferOrderId: { type: [string, 'null'], format: uuid }
        employeeId: { type: string, format: uuid }
        driveId: { type: [string, 'null'], format: uuid }
        lifecycleState:
          type: string
          enum: [RESERVED, VACATED_ON_RELIEF, FILLED_ON_JOIN, RELEASED, EXPIRED]
        reservedAt: { type: string, format: date-time }
        vacatedAt: { type: [string, 'null'], format: date-time }
        filledAt: { type: [string, 'null'], format: date-time }

    CounsellingSession:
      type: object
      properties:
        sessionId: { type: string, format: uuid }
        sessionCode: { type: string }
        driveId: { type: string, format: uuid }
        scheduledAt: { type: string, format: date-time }
        turnOrderMethod:
          type: string
          enum: [SENIORITY, MERIT]
        currentTurnEmployeeId: { type: [string, 'null'], format: uuid }
        currentTurnStartedAt: { type: [string, 'null'], format: date-time }
        turnTimeoutSeconds: { type: integer }
        status:
          type: string
          enum: [SCHEDULED, IN_PROGRESS, PAUSED, COMPLETED, CANCELLED]
        presidingOfficerId: { type: string, format: uuid }
        totalCandidates: { type: integer }
        completedCandidates: { type: integer }

    CounsellingSessionCreate:
      type: object
      required: [sessionCode, scheduledAt, turnOrderMethod, presidingOfficerId]
      properties:
        sessionCode: { type: string }
        scheduledAt: { type: string, format: date-time }
        turnOrderMethod:
          type: string
          enum: [SENIORITY, MERIT]
        turnTimeoutSeconds: { type: integer, default: 300 }
        presidingOfficerId: { type: string, format: uuid }

    CounsellingChoice:
      type: object
      properties:
        choiceId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        turnPosition: { type: integer }
        vacancyPositionId: { type: [string, 'null'], format: uuid }
        choiceAction:
          type: string
          enum: [CHOSEN, PASSED, DECLINED, AUTO_PASS_TIMEOUT, ABSENT]
        choiceMadeAt: { type: string, format: date-time }
        recordedBy: { type: string, format: uuid }
        remarks: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    CounsellingChoiceInput:
      type: object
      required: [employeeId, turnPosition, choiceAction]
      properties:
        employeeId: { type: string, format: uuid }
        turnPosition: { type: integer }
        vacancyPositionId: { type: string, format: uuid }
        choiceAction:
          type: string
          enum: [CHOSEN, PASSED, DECLINED, AUTO_PASS_TIMEOUT, ABSENT]
        remarks: { type: string }

    ClearanceChecklist:
      type: object
      properties:
        clearanceChecklistId: { type: string, format: uuid }
        checklistNo: { type: string }
        transferOrderId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        sourceOrgUnitId: { type: string, format: uuid }
        workflowInstanceId: { type: [string, 'null'], format: uuid }
        status:
          type: string
          enum: [OPEN, IN_PROGRESS, BLOCKED, CLEARED, CLEARED_WITH_DUES, CLEARED_WITH_DEEMED, CANCELLED]
        totalItems: { type: integer }
        clearedItems: { type: integer }
        deemedItems: { type: integer }
        hasOutstandingDues: { type: boolean }
        duesRecoveryRef: { type: [string, 'null'] }
        items:
          type: array
          items: { $ref: '#/components/schemas/ClearanceItem' }

    ClearanceItem:
      type: object
      properties:
        clearanceItemId: { type: string, format: uuid }
        clearanceChecklistId: { type: string, format: uuid }
        departmentCode: { $ref: '#/components/schemas/ClearanceDepartment' }
        workflowBranchRef: { type: [string, 'null'] }
        assignedOfficerId: { type: [string, 'null'], format: uuid }
        status:
