        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkCorrigendumCreate' }
      responses:
        '201':
          description: Bulk corrigendum batch created (DRAFT).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkCorrigendum' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/bulk-corrigenda/{id}/preview:
    post:
      tags: [BulkCorrigendum]
      summary: Preview a bulk corrigendum (impact + sample)
      operationId: previewBulkCorrigendum
      parameters:
        - $ref: '#/components/parameters/BulkBatchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Impact preview with count and sample.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkCorrigendum' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/bulk-corrigenda/{id}/sample-approve:
    post:
      tags: [BulkCorrigendum]
      summary: Second-custodian sampling approval
      operationId: sampleApproveBulkCorrigendum
      parameters:
        - $ref: '#/components/parameters/BulkBatchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SampleApproveRequest' }
      responses:
        '200':
          description: Sampling approval recorded.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkCorrigendum' }
        '403':
          description: 'FORBIDDEN — sampling approver must differ from the maker (SoD).'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/bulk-corrigenda/{id}/apply:
    post:
      tags: [BulkCorrigendum]
      summary: Apply an approved bulk corrigendum
      operationId: applyBulkCorrigendum
      description: Appends per-entry corrigenda (FR-05) with a full per-entry audit and applied/failed report.
      parameters:
        - $ref: '#/components/parameters/BulkBatchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Applied; per-entry outcome report returned.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkCorrigendum' }
        '412':
          description: '`SR_SECOND_CUSTODIAN_REQUIRED` — sampling approval not completed.'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  # ============================== FR-21 APPEALS =============================
  /sr/appeals:
    get:
      tags: [Appeals]
      summary: List appeals
      operationId: listAppeals
      parameters:
        - name: employee_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AppealStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of appeals.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Appeal' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/appeals/{id}/decide:
    post:
      tags: [Appeals]
      summary: Appellate authority decides an appeal
      operationId: decideAppeal
      description: Records a binding outcome; an OVERTURNED appeal spawns a corrigendum (FR-05).
      parameters:
        - $ref: '#/components/parameters/AppealId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppealDecideRequest' }
      responses:
        '200':
          description: Appeal decided.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appeal' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/appeals/{id}/withdraw:
    post:
      tags: [Appeals]
      summary: Withdraw an appeal (appellant)
      operationId: withdrawAppeal
      parameters:
        - $ref: '#/components/parameters/AppealId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Appeal withdrawn.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appeal' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Platform Bearer JWT carrying resolved roles + tenant/entity scope (Platform §0.2).
        SR ingestion principals hold only the `sr.ingest.write` scope.

  headers:
    XCorrelationId:
      description: Correlation id echoed on every response and written to every audit + log line (Foundation §1).
      schema: { type: string }

  parameters:
    Limit:
      name: limit
      in: query
      description: Page size (cursor pagination). Default 25, max 100.
      required: false
      schema:
        type: integer
        default: 25
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      description: Opaque forward cursor from a previous response's `next_cursor`.
      required: false
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: >
        Deterministic key for unsafe POSTs; a repeat within 24h returns the original
        result (exactly-once SR posting). Required for workflow-initiating POSTs.
      required: false
      schema: { type: string }
    EmployeeId:
      name: id
      in: path
      required: true
      description: Employee id (G01).
      schema: { type: string, format: uuid }
    EventId:
      name: id
      in: path
      required: true
      description: SR ledger entry id (`sr_event_id`).
      schema: { type: string, format: uuid }
    EventTypeCode:
      name: code
      in: path
      required: true
      description: SR event type code.
      schema: { type: string }
    CorrectionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DisputeId:
      name: id
      in: path
      required: true
      description: Dispute id (`sr_corrections` row of type DISPUTE).
      schema: { type: string, format: uuid }
    CycleId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExtractId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    GapId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AppealId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    BulkBatchId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    ValidationFailed:
      description: >
        422 VALIDATION_FAILED — input failed a VAL-*/schema rule. G12 domain codes:
        `SR_PAYLOAD_INVALID`, `SR_FACT_KEY_REQUIRED`, `SR_FUTURE_DATE`,
        `SR_SIGNATURE_NOT_QUALIFIED`, `ERR-G12-SIGNATURE-INVALID`, `SR_INTEGRITY_FAILED`,
        `SR_STATUS_CHAIN_FAILED`, `SR_ANCHOR_MISMATCH`, `SR_PURPOSE_REQUIRED`.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: 401 UNAUTHENTICATED — no/invalid/expired session or token.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: >
        403 FORBIDDEN — authenticated but not permitted (never leaks existence of
        out-of-scope records). G12: `SR_SOURCE_NOT_ALLOWED`, `SR_DELETION_FORBIDDEN`,
        separation-of-duties (maker == checker).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: >
        404 NOT_FOUND — resource absent or out of scope. G12: `SR_TYPE_NOT_FOUND`,
        `SR_EMPLOYEE_NOT_FOUND`, `SR_REVERSAL_TARGET_NOT_FOUND`.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: >
        409 CONFLICT — idempotency replay / state / uniqueness conflict. G12:
        `SR_DUPLICATE_EVENT`, `SR_SEMANTIC_DUPLICATE`, `SR_SEMANTIC_CONFLICT`,
        `SR_ENTRY_IMMUTABLE`, `SR_ENTRY_SUPERSEDED`, `SR_ENTRY_DISPUTED`,
        `SR_EXTRACT_REVOKED`, `SR_APPEAL_NOT_ELIGIBLE`, `SR_TYPE_OVERLAP`,
        `SR_DELIVERY_MODE_DEFERRED`, `SR_LEGACY_UNMATCHED`, `SR_LEGAL_HOLD_ACTIVE`,
        `SR_STALE_RESTORE`.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionFailed:
      description: >
        412 PRECONDITION_FAILED — a required precondition is unmet (incl. X.3-mapped
        retryable upstream). G12: `SR_ATTESTATION_REQUIRED`, `SR_ANCHOR_MISSING`,
        `SR_REDACTION_REQUIRED`, `SR_SECOND_CUSTODIAN_REQUIRED`, `SR_GAP_UNRESOLVED`.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: 429 RATE_LIMITED — rate limit or lockout exceeded.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Internal:
      description: >
        500 INTERNAL — unexpected server error, or non-retryable / X.3-mapped upstream
        failure (`ERR-LOADFAIL`; 503 collapses here — no non-standard 503).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    # ---------- Canonical error envelope ----------
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: >
                A platform standard code (VALIDATION_FAILED/…/INTERNAL) or a G12 domain
                code (`SR_*` / `ERR-G12-*`) carried in this field.
            message: { type: string }
            field:
              type: [string, "null"]
              description: Offending field for validation errors.
            details:
              type: [object, "null"]
              additionalProperties: true
              description: Structured discriminators, e.g. { reason, anchor_id, conflicting_event_id }.

    NextCursor:
      type: [string, "null"]
      description: Opaque forward cursor for the next page; null when no more pages.

    # ---------- Shared enums ----------
    SourceModule:
      type: string
      description: Provenance module. Writer set per FR-01.B; G12_MANUAL/G12_LEGACY for G12-owned lanes.
      enum:
        [G01, G02, G03, G04, G05, G06, G07, G08, G09, G10, G11, G12, G13, G14,
         G12_MANUAL, G12_LEGACY]

    EventCategory:
      type: string
      description: SR event category (18 categories; APPRAISAL added v3.1).
      enum:
        [APPOINTMENT, CONFIRMATION, PROMOTION, TRANSFER, POSTING, PAY, INCREMENT,
         LEAVE, TRAINING, AWARD, PUNISHMENT, SUSPENSION, DEPUTATION, IDENTITY,
         QUALIFICATION, APPRAISAL, SEPARATION, OTHER]

    QualifyingServiceImpact:
      type: string
      enum: [QUALIFYING, NON_QUALIFYING, PARTIAL, NOT_APPLICABLE]

    ConfidenceStatus:
      type: string
      enum: [VERIFIED, RECONSTRUCTED, LEGACY_UNVERIFIABLE]

    EntryStatus:
      type: string
      description: Derived projection from sr_status_events.
      enum: [ACTIVE, SUPERSEDED, ANNOTATED]

    AttestationStatus:
      type: string
      description: Derived projection from sr_status_events.
      enum: [UNATTESTED, ATTESTED, EMPLOYEE_VERIFIED, DISPUTED]

    ChainOrigin:
      type: string
      enum: [GENESIS, CONTINUED]

    SignatureMethod:
      type: string
      description: PKI_QUALIFIED for statutory outputs; SERVER_SIGNED banned for statutory artefacts.
      enum: [PKI_QUALIFIED, OTP_CONFIRMED, SERVER_SIGNED]

    ValidationResult:
      type: string
      enum: [ACCEPTED, REJECTED, DUPLICATE_NOOP, SEMANTIC_DUPLICATE_NOOP, SEMANTIC_CONFLICT]

    GapStatus:
      type: string
      enum: [GAP_FLAGGED, UNDER_REVIEW, EXPLAINED, CLOSED_RECORDED, CLOSED_FALSE_POSITIVE]

    AppealStatus:
      type: string
      enum: [RAISED, UNDER_APPEAL, UPHELD, OVERTURNED, REMANDED, WITHDRAWN]

    AccessAction:
      type: string
      enum: [VIEW_TIMELINE, VIEW_EVENT, PRINT, EXPORT, ISSUE_EXTRACT, VERIFY_INTEGRITY, VERIFY_ANCHOR, GENERATE_65B]

    ExtractScope:
      type: string
      enum: [FULL_SR, DATE_RANGE, EVENT_CATEGORY, SINGLE_EVENT]

    RedactionPolicy:
      type: string
      enum: [NONE, LOAN_EXCLUDE_DISCIPLINARY, PUBLIC_MINIMAL, PENSION_FULL, COURT_FULL]

    # ---------- The full sr_event_type catalog (FR-01.A) ----------
    SrEventTypeCode:
      type: string
      description: >
        Full published `sr_event_type` catalog (FR-01.A, v3.1 authoritative). Writers
        cite these strings exactly. Corrigendum/reversal partner codes (`*_CANCELLED`,
        `*_REVERSAL`) are included where published. Pay/increment codes are contracted
        now and enabled when G10 ships (deferred build).
      enum:
        - APPOINTMENT
        - NAME_CHANGE
        - DOB_CHANGE
        - GENDER_CHANGE
        - CATEGORY_CHANGE
        - DECEASED
        - QUALIFICATION_ADDED
        - DEPARTMENTAL_EXAM_PASSED
        - EL_AVAILED
        - HPL_AVAILED
        - COMMUTED_LEAVE
        - STUDY_LEAVE
        - MATERNITY_LEAVE
        - LWP_SPELL
        - EOL_SPELL
        - TRANSFER
        - RELIEVING
        - JOINING
        - MUTUAL_TRANSFER
        - TRANSFER_CANCELLED
        - RELIEVING_CANCELLED
        - JOINING_CANCELLED
        - PROMOTION
        - OFFICIATING
        - MACP
        - CONFIRMATION
        - POSTING
        - REVERSION
        - PROMOTION_CANCELLED
        - OFFICIATING_CANCELLED
        - APAR_FINAL_GRADE
        - MINOR_PENALTY
        - MAJOR_PENALTY
        - SUSPENSION
        - SUSPENSION_REVOKED
        - CENSURE
        - MINOR_PENALTY_REVERSAL
        - MAJOR_PENALTY_REVERSAL
        - PAY_FIXATION
        - ANNUAL_INCREMENT
        - INCREMENT_WITHHELD
        - PAY_PROTECTION
        - SEPARATION
        - SUPERANNUATION
        - RETIREMENT
        - VOLUNTARY_RETIREMENT
        - RESIGNATION
        - DEATH_IN_SERVICE
        - FAMILY_PENSION_SANCTIONED

    EventTypeCreate:
      type: object
      required: [event_type_code, event_category, allowed_source_modules, payload_schema, effective_from]
      properties:
        event_type_code: { type: string }
        event_category: { $ref: '#/components/schemas/EventCategory' }
        allowed_source_modules:
          type: array
          items: { $ref: '#/components/schemas/SourceModule' }
        is_qualifying_service: { type: boolean, default: false }
        is_identity_event: { type: boolean, default: false }
        default_qualifying_impact: { $ref: '#/components/schemas/QualifyingServiceImpact' }
        fact_correlation_rule:
          type: [object, "null"]
          additionalProperties: true
          description: Deterministic key derivation for fact_key (mandatory for qualifying-service types).
        expected_cadence:
          type: [object, "null"]
          additionalProperties: true
        supports_reversal: { type: boolean, default: false }
        payload_schema:
          type: object
          additionalProperties: true
          description: JSON Schema the event payload is validated against.
        effective_from: { type: string, format: date }
        effective_to: { type: [string, "null"], format: date }

    EventType:
      allOf:
        - $ref: '#/components/schemas/EventTypeCreate'
        - type: object
          properties:
            tenant_id: { type: string, format: uuid }
            status: { type: string, enum: [DRAFT, PUBLISHED, RETIRED] }
            version: { type: integer }
            created_at: { type: string, format: date-time }

    # ---------- Ingestion ----------
    IngestRequest:
      type: object
      required: [source_module, source_reference_id, source_event_version, event_type_code, employee_id, event_date, payload]
      properties:
        source_module: { $ref: '#/components/schemas/SourceModule' }
        source_reference_id:
          type: string
          maxLength: 64
          description: Originating order/transaction id (part of the syntactic dedup tuple).
        source_event_version:
          type: integer
          default: 1
          description: Source event schema/version (part of the syntactic dedup tuple).
        event_type_code: { $ref: '#/components/schemas/SrEventTypeCode' }
        event_category: { $ref: '#/components/schemas/EventCategory' }
        tenant_id: { type: string, format: uuid }
        entity_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        service_no: { type: [string, "null"], maxLength: 32 }
        event_date:
          type: string
          format: date
          description: Legal effective date (no time); back-dating allowed within future tolerance.
        fact_key:
          type: [string, "null"]
          maxLength: 96
          description: >
            Semantic per-fact correlation key. MANDATORY for qualifying-service-bearing
            event types (else 422 SR_FACT_KEY_REQUIRED); enables cross-module semantic dedup.
        order_no: { type: [string, "null"], maxLength: 64 }
        order_date: { type: [string, "null"], format: date }
        sanctioning_authority: { type: [string, "null"], maxLength: 160 }
        payload:
          type: object
          additionalProperties: true
          description: Structured, schema-validated event data (validated against the type's payload_schema).
        qualifying_service_impact: { $ref: '#/components/schemas/QualifyingServiceImpact' }
        document_ids:
          type: array
          items: { type: string, format: uuid }

    IngestResponse:
      type: object
      required: [sr_event_id, validation_result]
      properties:
        sr_event_id: { type: string }
        sequence_no: { type: [integer, "null"], format: int64 }
        entry_hash: { type: [string, "null"] }
        prev_event_hash: { type: [string, "null"] }
        tsa_timestamp_token:
          type: [string, "null"]
          description: RFC 3161 trusted timestamp token over entry_hash.
        attestation_status: { $ref: '#/components/schemas/AttestationStatus' }
        validation_result: { $ref: '#/components/schemas/ValidationResult' }
        ingestion_request_id: { type: [string, "null"], format: uuid }
        details:
          type: [object, "null"]
          additionalProperties: true

    ReversalRequest:
      type: object
      required: [source_module, source_reference_id, reverses_source_reference_id, event_type_code, employee_id, event_date]
      properties:
        source_module: { $ref: '#/components/schemas/SourceModule' }
        source_reference_id: { type: string, maxLength: 64 }
        reverses_source_reference_id:
          type: string
          maxLength: 64
          description: The original source_reference_id being reversed/cancelled.
        is_reversal: { type: boolean, default: true }
        event_type_code: { $ref: '#/components/schemas/SrEventTypeCode' }
        employee_id: { type: string, format: uuid }
        event_date: { type: string, format: date }
        order_no: { type: [string, "null"], maxLength: 64 }
        sanctioning_authority: { type: [string, "null"], maxLength: 160 }
        payload:
          type: [object, "null"]
          additionalProperties: true

    ReversalResponse:
      type: object
      properties:
        ingestion_request_id: { type: string, format: uuid }
        correction_id:
          type: string
          format: uuid
          description: The WF-G12-CORRIGENDUM correction spawned by the reversal.
        reverses_event_id: { type: string, format: uuid }
        validation_result: { $ref: '#/components/schemas/ValidationResult' }

    IngestionRequest:
      type: object
      properties:
        ingestion_request_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        source_module: { $ref: '#/components/schemas/SourceModule' }
        source_reference_id: { type: string }
        source_event_version: { type: integer }
        event_type_code: { $ref: '#/components/schemas/SrEventTypeCode' }
        employee_id: { type: string, format: uuid }
        fact_key: { type: [string, "null"] }
        is_reversal: { type: boolean }
        validation_result: { $ref: '#/components/schemas/ValidationResult' }
        semantic_dedup_result:
          type: [string, "null"]
          enum: [NEW_FACT, SEMANTIC_DUPLICATE, SEMANTIC_CONFLICT, null]
        conflicting_event_id: { type: [string, "null"], format: uuid }
        sr_event_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }

    # ---------- Ledger entry ----------
    SrEvent:
      type: object
      description: A `service_register_events` (E8) ledger entry (append-only, hash-chained).
      properties:
        sr_event_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        entity_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        service_no: { type: string }
        sequence_no: { type: integer, format: int64 }
        event_type_code: { $ref: '#/components/schemas/SrEventTypeCode' }
        event_category: { $ref: '#/components/schemas/EventCategory' }
        event_title: { type: string }
        event_description: { type: [string, "null"] }
        event_date: { type: string, format: date }
        recorded_at: { type: string, format: date-time }
        tsa_timestamp_token: { type: [string, "null"] }
        tsa_authority: { type: [string, "null"] }
        fact_key: { type: [string, "null"] }
        source_module: { $ref: '#/components/schemas/SourceModule' }
        source_reference_id: { type: [string, "null"] }
        source_event_version: { type: integer }
        reverses_event_id: { type: [string, "null"], format: uuid }
        order_no: { type: [string, "null"] }
        order_date: { type: [string, "null"], format: date }
        sanctioning_authority: { type: [string, "null"] }
        payload:
          type: object
          additionalProperties: true
        qualifying_service_impact: { $ref: '#/components/schemas/QualifyingServiceImpact' }
        confidence_status: { $ref: '#/components/schemas/ConfidenceStatus' }
        entry_status: { $ref: '#/components/schemas/EntryStatus' }
        attestation_status: { $ref: '#/components/schemas/AttestationStatus' }
        supersedes_event_id: { type: [string, "null"], format: uuid }
        superseded_by_event_id: { type: [string, "null"], format: uuid }
        chain_origin: { $ref: '#/components/schemas/ChainOrigin' }
        prior_chain_head_hash: { type: [string, "null"] }
        prev_event_hash: { type: string }
        entry_hash: { type: string }
        hash_algorithm: { type: string }
        ledger_version: { type: integer }
        document_ids:
          type: [array, "null"]
          items: { type: string, format: uuid }
        is_legacy: { type: boolean }
        created_at: { type: string, format: date-time }
        created_by: { type: string }

    # ---------- Corrections / annotations / disputes ----------
    CorrigendumRequest:
      type: object
      required: [reason_code, reason, payload]
      properties:
        reason_code: { type: string, maxLength: 48 }
        reason: { type: string }
        payload:
          type: object
          additionalProperties: true
          description: Corrected facts (schema-validated exactly as ingestion).
        document_ids:
          type: array
          items: { type: string, format: uuid }
        is_identity_change:
          type: boolean
          default: false
          description: If true, routes through WF-G12-IDENTITY-CHANGE (dual custodian).

    Correction:
      type: object
      properties:
        correction_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        target_event_id: { type: string, format: uuid }
        correction_type:
          type: string
          enum: [CORRIGENDUM, ANNOTATION, DISPUTE, DISPUTE_RESOLUTION, REVERSAL_CORRIGENDUM, BULK_CORRIGENDUM]
        decision: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        reason_code: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        corrigendum_event_id: { type: [string, "null"], format: uuid }
        workflow_instance_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        created_by: { type: string }

    DecisionRequest:
      type: object
      properties:
        comment: { type: [string, "null"] }

    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }

    DisputeRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
        document_ids:
          type: array
          items: { type: string, format: uuid }

    AnnotateRequest:
      type: object
      required: [note]
      properties:
        note: { type: string }
        document_ids:
          type: array
          items: { type: string, format: uuid }

    DisputeResolveRequest:
      type: object
      required: [outcome]
      properties:
        outcome: { type: string, enum: [UPHELD, CORRIGENDUM_ISSUED] }
        reason: { type: [string, "null"] }
        corrigendum: { $ref: '#/components/schemas/CorrigendumRequest' }

    # ---------- Attestation ----------
    AttestRequest:
      type: object
      required: [signature_method]
      properties:
        signature_method: { $ref: '#/components/schemas/SignatureMethod' }
        signed_digest: { type: [string, "null"] }
        signature_value:
          type: [string, "null"]
          description: Qualified PKI signature bytes (base64); required for PKI_QUALIFIED.
        signing_certificate_serial: { type: [string, "null"] }

    BatchAttestRequest:
      type: object
      required: [event_ids, signature_method]
      properties:
        event_ids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        signature_method: { $ref: '#/components/schemas/SignatureMethod' }

    Attestation:
      type: object
      properties:
        attestation_id: { type: string, format: uuid }
        target_event_id: { type: string, format: uuid }
        attestation_kind:
          type: string
          enum: [CUSTODIAN_ATTEST, EMPLOYEE_VERIFY, EMPLOYEE_DISPUTE, EXTRACT_SIGN, HEIR_VERIFY, ASSISTED_VERIFY]
        signature_method: { $ref: '#/components/schemas/SignatureMethod' }
        signing_certificate_serial: { type: [string, "null"] }
        tsa_timestamp_token: { type: [string, "null"] }
        attested_by: { type: string }
        attested_at: { type: string, format: date-time }

    BatchAttestResult:
      type: object
      properties:
        total: { type: integer }
        attested: { type: integer }
        failed: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              event_id: { type: string, format: uuid }
              outcome: { type: string, enum: [ATTESTED, FAILED] }
              error_code: { type: [string, "null"] }

    # ---------- Verification cycles ----------
    VerificationCycle:
      type: object
      properties:
        cycle_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        cycle_type:
          type: string
          enum: [PERIODIC_5YR, PRE_RETIREMENT, AD_HOC, HEIR_VERIFICATION]
        status:
          type: string
          enum: [OPEN, EMPLOYEE_REVIEW, BULK_REVIEW, DISPUTED, CUSTODIAN_REVIEW, COMPLETED, OVERDUE, ASSISTED, HEIR_PENDING]
        period_from: { type: [string, "null"], format: date }
        period_to: { type: [string, "null"], format: date }
        exception_count: { type: [integer, "null"] }
        created_at: { type: string, format: date-time }

    BulkConfirmRequest:
      type: object
      required: [confirmed_event_ids]
      properties:
        confirmed_event_ids:
          type: array
          items: { type: string, format: uuid }
        exception_event_ids:
          type: array
          items: { type: string, format: uuid }
        signature_method: { $ref: '#/components/schemas/SignatureMethod' }

    ConfirmRequest:
      type: object
      properties:
        signature_method: { $ref: '#/components/schemas/SignatureMethod' }
        comment: { type: [string, "null"] }

    AssistedConfirmRequest:
      type: object
      required: [operator_id, consent_captured]
      properties:
        operator_id: { type: string }
        consent_captured: { type: boolean }
        consent_reference: { type: [string, "null"] }
        signature_method: { $ref: '#/components/schemas/SignatureMethod' }

    HeirConfirmRequest:
      type: object
      required: [heir_identity_ref, relationship]
      properties:
        heir_identity_ref: { type: string }
        relationship: { type: string }
        consent_captured: { type: boolean, default: true }
        signature_method: { $ref: '#/components/schemas/SignatureMethod' }

    # ---------- Extracts / §65B ----------
    ExtractRequest:
      type: object
      required: [scope, purpose]
      properties:
        scope: { $ref: '#/components/schemas/ExtractScope' }
        purpose:
          type: string
          description: Stated purpose (drives redaction; required for non-self access).
        redaction_policy: { $ref: '#/components/schemas/RedactionPolicy' }
        from_date: { type: [string, "null"], format: date }
        to_date: { type: [string, "null"], format: date }
        event_category: { $ref: '#/components/schemas/EventCategory' }
        single_event_id: { type: [string, "null"], format: uuid }

    Extract:
      type: object
      properties:
        extract_id: { type: string, format: uuid }
        extract_no: { type: string }
        employee_id: { type: string, format: uuid }
        scope: { $ref: '#/components/schemas/ExtractScope' }
        redaction_policy: { $ref: '#/components/schemas/RedactionPolicy' }
        redacted_categories:
          type: [array, "null"]
          items: { $ref: '#/components/schemas/EventCategory' }
        status: { type: string, enum: [DRAFT, AWAITING_COSIGN, ISSUED, REVOKED] }
        content_digest: { type: [string, "null"] }
        anchor_id: { type: [string, "null"], format: uuid }
        signature_method: { $ref: '#/components/schemas/SignatureMethod' }
        ltv_status: { type: string, enum: [NONE, LTV_APPLIED, LTV_RENEWED] }
        authenticity_certificate_id: { type: [string, "null"], format: uuid }
        document_id: { type: [string, "null"], format: uuid }
        qr_verification_token: { type: [string, "null"] }
        issued_at: { type: [string, "null"], format: date-time }

    AuthenticityCertificate:
      type: object
      properties:
        certificate_id: { type: string, format: uuid }
        extract_id: { type: string, format: uuid }
        certificate_no: { type: string }
        statute_reference:
          type: string
          example: BSA 2023 s.63 / IT Act s.65B
        content_digest: { type: string }
        anchor_id: { type: string, format: uuid }
        signer_identity: { type: string }
        signing_certificate_serial: { type: string }
        tsa_timestamp_token: { type: string }
        chain_of_custody:
          type: object
          additionalProperties: true
        system_description: { type: string }
        document_id: { type: string, format: uuid }
        issued_at: { type: string, format: date-time }

    # ---------- Offline verification ----------
    PublicVerification:
      type: object
      properties:
        status: { type: string, enum: [VALID, REVOKED, NOT_FOUND] }
        extract_no: { type: string }
        issued_at: { type: [string, "null"], format: date }
        employee_name_masked: { type: [string, "null"] }
        scope: { $ref: '#/components/schemas/ExtractScope' }
        redacted_categories:
          type: [array, "null"]
          items: { $ref: '#/components/schemas/EventCategory' }
        event_count: { type: [integer, "null"] }
        content_digest: { type: [string, "null"] }
        anchor_id: { type: [string, "null"] }
        ca_chain_published_at: { type: [string, "null"] }
        offline_verifiable: { type: boolean }

    RevocationFeed:
      type: object
      properties:
        generated_at: { type: string, format: date-time }
        signature: { type: string }
        revoked_extract_nos:
          type: array
          items: { type: string }

    # ---------- Access log ----------
    AccessLogEntry:
      type: object
      properties:
        access_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        actor: { type: string }
        action: { $ref: '#/components/schemas/AccessAction' }
        purpose: { type: [string, "null"] }
        accessed_at: { type: string, format: date-time }
        correlation_id: { type: string }

    # ---------- Subscriptions / feed ----------
    SubscriptionCreate:
      type: object
      required: [module, categories]
      properties:
        module: { $ref: '#/components/schemas/SourceModule' }
        categories:
          type: array
          items: { $ref: '#/components/schemas/EventCategory' }
        delivery_mode:
          type: string
          enum: [PULL_FEED, WEBHOOK, MESSAGE_BUS]
          default: PULL_FEED
          description: PULL_FEED at launch; WEBHOOK/MESSAGE_BUS deferred (SR_DELIVERY_MODE_DEFERRED).

    Subscription:
      allOf:
        - $ref: '#/components/schemas/SubscriptionCreate'
        - type: object
          properties:
            subscription_id: { type: string, format: uuid }
            status: { type: string, enum: [ACTIVE, PAUSED, RETIRED] }
            last_delivered_seq: { type: [integer, "null"], format: int64 }

    FeedResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              feed_seq: { type: integer, format: int64 }
              sr_event: { $ref: '#/components/schemas/SrEvent' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    # ---------- Legacy digitisation ----------
    LegacyBatchCreate:
      type: object
      required: [batch_name, legacy_source_id]
      properties:
        batch_name: { type: string }
        legacy_source_id: { type: string, maxLength: 80 }
        org_unit_id: { type: [string, "null"], format: uuid }

    LegacyBatch:
      allOf:
        - $ref: '#/components/schemas/LegacyBatchCreate'
        - type: object
          properties:
            batch_id: { type: string, format: uuid }
            status:
              type: string
              enum: [CREATED, SCANNING, DATA_ENTRY, DUAL_VERIFICATION, RECONCILIATION, READY_FOR_PROMOTION, PROMOTED, REJECTED]
            record_count: { type: integer }
            promoted_count: { type: integer }
            failed_count: { type: integer }
            created_at: { type: string, format: date-time }

    LegacyRecordCreate:
      type: object
      required: [employee_ref, event_type_code, event_date, payload]
      properties:
        employee_ref: { type: string }
        event_type_code: { $ref: '#/components/schemas/SrEventTypeCode' }
        event_date: { type: string, format: date }
        payload:
          type: object
          additionalProperties: true
        document_ids:
          type: array
          items: { type: string, format: uuid }

    LegacyRecord:
      type: object
      properties:
        record_id: { type: string, format: uuid }
        batch_id: { type: string, format: uuid }
        employee_id: { type: [string, "null"], format: uuid }
        match_status: { type: string, enum: [UNMATCHED, MATCHED, AMBIGUOUS] }
        verification_status: { type: string, enum: [PENDING, VERIFIED, DISCREPANCY] }
        confidence_status: { $ref: '#/components/schemas/ConfidenceStatus' }
        corroboration_status:
          type: string
          enum: [NOT_REQUIRED, PENDING_EMPLOYEE, CORROBORATED, UNCORROBORATED]
        evidence_quality_note: { type: [string, "null"] }

    LegacyVerifyRequest:
      type: object
      required: [verification_status]
      properties:
        verification_status: { type: string, enum: [VERIFIED, DISCREPANCY] }
        comment: { type: [string, "null"] }

    SetConfidenceRequest:
      type: object
      required: [confidence_status, evidence_quality_note]
      properties:
        confidence_status: { $ref: '#/components/schemas/ConfidenceStatus' }
        evidence_quality_note: { type: string }

    # ---------- Retention / legal hold / DR ----------
    LegalHoldRequest:
      type: object
      required: [action, reason]
      properties:
        action: { type: string, enum: [PLACE, LIFT] }
        reason: { type: string }

    LegalHold:
      type: object
      properties:
        employee_id: { type: string, format: uuid }
        hold_active: { type: boolean }
        reason: { type: [string, "null"] }
        updated_at: { type: string, format: date-time }

    RetentionPolicy:
      type: object
      properties:
        deletion_prohibited: { type: boolean, example: true }
        retention_basis:
          type: string
          example: DPDP Act 2023 s.17 — processing necessary for a legal obligation
        minimum_retention: { type: string, example: PERMANENT }
        archive_after_years: { type: [integer, "null"] }

    DrReconcileRequest:
      type: object
      required: [restore_reference]
      properties:
        restore_reference: { type: string }
        tenant_id: { type: [string, "null"], format: uuid }

    # ---------- Forensics / analytics ----------
    Forensics:
      type: object
      properties:
        employee_id: { type: [string, "null"], format: uuid }
        content_chain_status: { type: string, enum: [PASS, FAIL, PENDING] }
        status_chain_status: { type: string, enum: [PASS, FAIL, PENDING] }
        anchor_status: { type: string, enum: [MATCH, MISMATCH, MISSING] }
        head_content_hash: { type: [string, "null"] }
        head_status_hash: { type: [string, "null"] }
        latest_anchor_id: { type: [string, "null"], format: uuid }
        lineage:
          type: array
          items:
            type: object
            additionalProperties: true
        as_of: { type: [string, "null"], format: date }

    AnalyticsSummary:
      type: object
      properties:
        total_events: { type: integer, format: int64 }
        attestation_coverage_pct: { type: number }
        verification_completion_pct: { type: number }
        gap_closure_rate_pct: { type: number }
        anchor_freshness_hours: { type: number }
        open_appeals: { type: integer }
        ltv_renewal_backlog: { type: integer }

    # ---------- Gaps ----------
    Gap:
      type: object
      properties:
        gap_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        rule_id: { type: string, format: uuid }
        expected_period_from: { type: string, format: date }
        expected_period_to: { type: string, format: date }
        expected_event_category: { $ref: '#/components/schemas/EventCategory' }
        gap_status: { $ref: '#/components/schemas/GapStatus' }
        explanation_code: { type: [string, "null"] }
        resolved_event_id: { type: [string, "null"], format: uuid }
        corroborated_by: { type: [string, "null"] }
        severity: { type: string, enum: [INFO, WARN, CRITICAL] }
        detected_at: { type: string, format: date-time }
        closed_at: { type: [string, "null"], format: date-time }

    GapExplainRequest:
      type: object
      required: [explanation_code]
      properties:
        explanation_code: { type: string, enum: [WITHHELD, NOT_DUE, LEGACY_MISSING, RECORDED_LATE] }
        comment: { type: [string, "null"] }

    GapCloseRequest:
      type: object
      required: [resolution]
      properties:
        resolution: { type: string, enum: [CLOSED_RECORDED, CLOSED_FALSE_POSITIVE] }
        resolved_event_id: { type: [string, "null"], format: uuid }
        comment: { type: [string, "null"] }

    GapCorroborateRequest:
      type: object
      required: [corroborated]
      properties:
        corroborated: { type: boolean }
        comment: { type: [string, "null"] }

    GapSummary:
      type: object
      properties:
        detected: { type: integer }
        resolved: { type: integer }
        open_critical: { type: integer }
        gap_closure_rate_pct: { type: number }

    # ---------- LTV / crypto ----------
    LtvRenewRequest:
      type: object
      required: [subject_type, subject_id, renewal_kind]
      properties:
        subject_type: { type: string, enum: [EXTRACT, ATTESTATION, ANCHOR] }
        subject_id: { type: string, format: uuid }
        renewal_kind: { type: string, enum: [LTV_INITIAL, ARCHIVE_TIMESTAMP, ALGORITHM_MIGRATION, RE_ANCHOR] }
        new_algorithm: { type: [string, "null"] }

    LtvRenewal:
      type: object
      properties:
        renewal_id: { type: string, format: uuid }
        subject_type: { type: string, enum: [EXTRACT, ATTESTATION, ANCHOR] }
        subject_id: { type: string, format: uuid }
        renewal_kind: { type: string, enum: [LTV_INITIAL, ARCHIVE_TIMESTAMP, ALGORITHM_MIGRATION, RE_ANCHOR] }
        prior_algorithm: { type: [string, "null"] }
        new_algorithm: { type: [string, "null"] }
        evidence_record_ref: { type: string }
        tsa_timestamp_token: { type: string }
        new_anchor_id: { type: [string, "null"], format: uuid }
        triggered_by: { type: string, enum: [SCHEDULE, CERT_EXPIRY, ALGO_DEPRECATION, MANUAL] }
        renewed_at: { type: string, format: date-time }

    CryptoMigrateRequest:
      type: object
      required: [new_algorithm]
      properties:
        new_algorithm: { type: string, example: SHA-384 }
        reason: { type: [string, "null"] }

    # ---------- Bulk corrigendum ----------
    BulkCorrigendumCreate:
      type: object
      required: [reason_code, trigger_reference, target_selector]
      properties:
        reason_code:
          type: string
          enum: [PAY_COMMISSION_REVISION, SENIORITY_REFIXATION, COURT_DIRECTION]
        trigger_reference: { type: string }
        target_selector:
          type: object
          additionalProperties: true
          description: Criteria selecting affected entries (cadre, category, date range).
        sample_size: { type: [integer, "null"] }

    BulkCorrigendum:
      type: object
      properties:
        bulk_batch_id: { type: string, format: uuid }
        batch_no: { type: string }
        reason_code: { type: string }
        trigger_reference: { type: string }
        target_count: { type: integer }
        sample_size: { type: integer }
        sample_approved_count: { type: integer }
        status:
          type: string
          enum: [DRAFT, PREVIEW, SAMPLING_APPROVAL, APPROVED, APPLYING, APPLIED, REJECTED]
        applied_count: { type: integer }
        failed_count: { type: integer }
        workflow_instance_id: { type: [string, "null"], format: uuid }
        applied_at: { type: [string, "null"], format: date-time }

    SampleApproveRequest:
      type: object
      required: [approved]
      properties:
        approved: { type: boolean }
        sample_approved_count: { type: [integer, "null"] }
        comment: { type: [string, "null"] }

    # ---------- Appeals ----------
    AppealRequest:
      type: object
      required: [appeal_reason]
      properties:
        appeal_reason: { type: string }
        target_event_id: { type: [string, "null"], format: uuid }
        document_ids:
          type: array
          items: { type: string, format: uuid }

    Appeal:
      type: object
      properties:
        appeal_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        target_event_id: { type: [string, "null"], format: uuid }
        source_dispute_id: { type: [string, "null"], format: uuid }
        appeal_reason: { type: string }
        appellate_authority: { type: [string, "null"] }
        workflow_instance_id: { type: [string, "null"], format: uuid }
        status: { $ref: '#/components/schemas/AppealStatus' }
        decision_text: { type: [string, "null"] }
        resulting_correction_id: { type: [string, "null"], format: uuid }
        decided_by: { type: [string, "null"] }
        decided_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    AppealDecideRequest:
      type: object
      required: [outcome, decision_text]
      properties:
        outcome: { type: string, enum: [UPHELD, OVERTURNED, REMANDED] }
        decision_text: { type: string }

    # ---------- Integrity / anchor ----------
    IntegrityVerifyRequest:
      type: object
      properties:
        employee_id: { type: [string, "null"], format: uuid }
        tenant_id: { type: [string, "null"], format: uuid }
        scope: { type: string, enum: [EMPLOYEE, TENANT, ROLLING], default: EMPLOYEE }

    IntegrityRun:
      type: object
      properties:
        run_id: { type: string, format: uuid }
        scope: { type: string }
        outcome: { type: string, enum: [PASS, FAIL, PENDING] }
        fail_cause:
          type: [string, "null"]
          enum: [CONTENT_CHAIN, STATUS_CHAIN, ANCHOR_MISMATCH, STALE_RESTORE, null]
        first_divergent_sequence_no: { type: [integer, "null"], format: int64 }
