# -----------------------------------------------------------------------------
# 6. NOTES
# -----------------------------------------------------------------------------
notes:
  enforcement: >
    Enforcement is performed by Platform Spec P02 `Authorization.check`. The roles,
    matrix, scoping, field-access and capability flags in this file are the MODEL
    INPUT — model-driven and owned by RBAC Design v1.7 — NOT logic re-coded per
    endpoint. Government module endpoints never re-implement permission checks;
    they call `Authorization.check({subject,action,resource_ref,fields[]}) ->
    {allowed, scope_filter, field_mask[]}` and receive a scope filter + field mask.
  model_ownership: >
    RBAC Design v1.7 is the single source of the access-control model. This file
    reproduces the v1.7 base roles/flags/PII ceiling verbatim and adds government
    statutory actors ONLY as ADDITIONS (new roles + capability flags), per
    PLATFORM_FOUNDATION §6.6. No entry contradicts v1.7. New gov roles/flags are
    registered in RBAC §2.2/§4.3 via the §14 working-group process, each with
    grant authority and P05 audit logging.
  sod: >
    Segregation of duties (maker != checker, signer != creator, no self-approval,
    multi-role INTERSECTION where roles overlap) is enforced by P01/P02, not
    re-coded per module. High-privilege statutory roles (Appointing/Transfer/
    Disciplinary Authority, SR Custodian, Pension Officer, Payroll Approver/
    Disburser, Accepting Authority) require MFA by default.
  pii_ceiling: >
    The PII Protection Ceiling overrides everything upward at step 6 of the
    resolution order — no role, entitlement, or capability flag lifts it. The only
    fixed platform exceptions are the Office Admin national-ID/DOB grants. Biometric
    data has no UI display for any role. Field masks are applied on serialization so
    an over-broad query cannot leak.
  auditing: >
    Every RBAC/entitlement/flag grant-revoke, PII field access (100% coverage),
    SR write, and workspace switch is captured immutably by P05. Reading an audit
    log is itself an audited event.
  workspace_model: >
    The Workspace switcher (Me / My Team / Admin) is derived from held roles +
    a derived has-reportees flag. The Admin workspace is exclusive: while acting
    as Admin the employee self-service surface is not rendered. Each task routes
    to exactly one workspace; switches are audit-logged.
