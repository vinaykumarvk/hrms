      tags: [letter-generation]
      summary: List letter-generation requests (cursor-paginated)
      operationId: listLetterGenerationRequests
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/LetterRequestStatus' } }
        - { name: employeeId, in: query, schema: { type: string, format: uuid } }
        - { name: letterType, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of letter requests.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LetterGenerationRequestPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

