openapi: 3.1.0
info:
  title: G03 — Attendance and Leave Management API
  version: 3.0.0
  description: >
    OpenAPI contract for Government HRMS module **G03 — Attendance and Leave
    Management** (alias GOV-M03; EXTEND/REUSE of PrimeSoft M04 Leave + M05
    Attendance). Grounded in `docs/brd/v3/G03-attendance-and-leave-management.md`
    §5–§8, `docs/contracts/error-taxonomy.yaml`, and `PLATFORM_FOUNDATION.md` §4.


    Platform conventions adopted verbatim: base path `/api/v1` (module routes
    under `/atl/*`); global bearer JWT carrying resolved roles + tenant/entity
    scope (P02 `Authorization.check`); `Idempotency-Key` header on all
    workflow-initiating POSTs (24h replay → original result); cursor pagination
    only (`limit` default 25 / max 100 + `cursor` → `next_cursor`);
    `X-Correlation-Id` echoed on every response and written to every P05 audit
    line; canonical error envelope `{ error: { code, message, field, details } }`
    with the 8-code platform status table.


    G03 is **not** an SR writer: approved leave carries a stable
    `leave_spell_lineage_id` (minted by G03, constant across
    approve→amend→cancel) that is exposed on the signed approved-leave event
    consumed by **G04**, which posts to the **G12-SR** ledger. G03 never calls
    `POST /api/v1/sr/ingest`.
  contact:
    name: API Architecture / Platform Foundation
  license:
    name: Proprietary — Government HRMS Programme
  x-ph06-vertical-slice:
    implementedRoutes:
      - POST /api/v1/atl/leave-applications
      - POST /api/v1/atl/leave-applications/{id}/decision
      - GET /api/v1/atl/leave-sr-outbox
    workflowResolver: REPORTING_CHAIN
    srWriter: G04
  x-ph07-employee-wave:
    implementedRoutes:
      - POST /api/v1/atl/leave-accruals
      - POST /api/v1/atl/attendance-captures
      - POST /api/v1/atl/attendance-captures/{id}:regularise
      - POST /api/v1/atl/overtime
      - GET /api/v1/atl/payroll-signals
    payrollSignalStatus: READY_FOR_G10
    srWriter: G04

servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: Shifts & Rosters
    description: Shift definitions and employee-to-shift roster assignment (FR-01, EXTEND M05).
  - name: Holidays
    description: Holiday calendars, holidays, and restricted-holiday elections (FR-02, EXTEND M05).
  - name: Punches
    description: Biometric/RFID/mobile-geo punch ingestion and capture governance (FR-03, EXTEND M05).
  - name: Attendance
    description: Daily attendance processing, sub-day allocation, and status rollup (FR-04, EXTEND M05).
  - name: Regularisation
    description: Missed-punch and status-correction regularisation (FR-05, P01 flow).
  - name: Overtime
    description: Overtime claim, approval, and payable/comp-off treatment (FR-06).
  - name: Attendance Exceptions
    description: Work-from-home, on-duty and tour records (FR-07/FR-08, P01 flow).
  - name: Comp-off
    description: Compensatory-off balance and redemption (FR-09, EXTEND M04/M05).
  - name: Leave Configuration
    description: Leave-type catalog and accrual-policy configuration (FR-10, EXTEND M04).
  - name: Leave Balances & Ledger
    description: Accrual, immutable balance ledger, adjustments and balances (FR-11).
  - name: Leave Applications
    description: Apply, approve, cancel, withdraw, conflicts and return-to-work (FR-12/13/14/23, P01 flow).
  - name: Team Calendar
    description: Manager team calendar and conflict detection (FR-14, My Team workspace).
  - name: Year Close
    description: Leave-year close, carry-forward, lapse and conversion (FR-15).
  - name: Encashment
    description: In-service, LTC and retirement leave encashment (FR-16).
  - name: Payroll Feed
    description: Attendance & leave → payroll (LWP/OT) feed and locked-period adjustments (FR-17).
  - name: Self-service
    description: Me / My Team self-service summary, approvals inbox and notifications (FR-18).
  - name: Delegations
    description: Approval delegation and out-of-office routing (FR-19, P01 delegate).
  - name: Anomaly Review
    description: Punch anomaly / time-fraud detection and review (FR-20, P01 flow).
  - name: Consent & Retention
    description: DPDP biometric/geo consent, lawful basis, fallback and retention purge (FR-21).
  - name: Entitlements
    description: Career/event entitlement counters for sanction-based leave (FR-22).
  - name: Absence Programs
    description: Balance forecast and mass-leave / shutdown programs (FR-23).
  - name: Attendance Config
    description: >
      v3.2 field-reconciliation config masters — attendance/overtime policies,
      IP-restriction networks, reusable geofences, and leave/attendance reason
      value sets (E32–E37; EXTEND M04/M05).
  - name: Attendance Lock
    description: >
      Monthly attendance lock cycle at org scope and post-approval leave
      revocation / balance-adjustment requests (E38–E40, v3.2).

paths:

  # ---------------------------------------------------------------------------
  # FR-01 Shifts & Rosters
  # ---------------------------------------------------------------------------
  /atl/shifts:
    post:
      tags: [Shifts & Rosters]
      summary: Create a shift definition
      operationId: createShift
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShiftCreate' }
      responses:
        '201':
          description: Shift created.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /atl/rosters:
    post:
      tags: [Shifts & Rosters]
      summary: Assign an employee to a shift over a date range
      operationId: createRoster
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RosterCreate' }
      responses:
        '201':
          description: Roster assignment created.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Roster' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
    get:
      tags: [Shifts & Rosters]
      summary: List rosters for an employee (cursor paginated)
      operationId: listRosters
      parameters:
        - name: employeeId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page of rosters.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Roster' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # FR-02 Holidays & RH elections
  # ---------------------------------------------------------------------------
  /atl/holiday-calendars:
    post:
      tags: [Holidays]
      summary: Create a holiday calendar
      operationId: createHolidayCalendar
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HolidayCalendarCreate' }
      responses:
        '201':
          description: Holiday calendar created.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HolidayCalendar' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /atl/holiday-calendars/{id}/holidays:
    post:
      tags: [Holidays]
      summary: Add a holiday to a calendar
      operationId: addHoliday
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HolidayCreate' }
      responses:
        '201':
          description: Holiday added.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Holiday' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Duplicate holiday date (VAL-G03-HOLIDAY-DUP).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/Internal' }

  /atl/holidays:
    get:
      tags: [Holidays]
      summary: List effective holidays by date and org unit
      operationId: listHolidays
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: orgUnitId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of holidays.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Holiday' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /atl/rh-elections:
    post:
      tags: [Holidays]
      summary: Elect a restricted holiday (RH)
      operationId: electRestrictedHoliday
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RhElectionCreate' }
      responses:
        '201':
          description: RH election recorded.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RhElection' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: RH cap exceeded (RH_CAP_EXCEEDED / VAL-G03-RHCAP).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # FR-03 Punches
  # ---------------------------------------------------------------------------
  /atl/punches/ingest:
    post:
      tags: [Punches]
      summary: Ingest a device batch of punches (idempotent)
      description: >
        Device-batch ingestion. Idempotent by `Idempotency-Key` and per-punch
        `(device_id, source_ref)`. Punches may be ACCEPTED, DUPLICATE, REJECTED
        or FLAGGED_FOR_REVIEW.
      operationId: ingestPunchBatch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PunchBatchIngest' }
      responses:
        '200':
          description: Batch processed; per-punch ingestion outcomes returned.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PunchBatchResult' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Device not authorized / consent required (DEVICE_NOT_AUTHORIZED, CONSENT_REQUIRED).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /atl/punches/mobile:
    post:
      tags: [Punches]
      summary: Submit a mobile geo punch
      description: >
        Self-service mobile geo punch. `201` ACCEPTED, `202` FLAGGED_FOR_REVIEW,
        or `403` CONSENT_REQUIRED / GEOFENCE_VIOLATION per capture governance.
      operationId: mobilePunch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MobilePunchCreate' }
      responses:
        '201':
          description: Punch ACCEPTED.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Punch' }
        '202':
          description: Punch FLAGGED_FOR_REVIEW (anomaly detected).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Punch' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Consent required or geofence violation (CONSENT_REQUIRED, GEOFENCE_VIOLATION).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # FR-04 Daily attendance
  # ---------------------------------------------------------------------------
  /atl/attendance/process:
    post:
      tags: [Attendance]
      summary: Trigger daily attendance processing (sole writer of attendance_daily)
      operationId: processAttendance
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceProcessRequest' }
      responses:
        '202':
          description: Processing run queued (JOB-M05-CLOSE extended).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceProcessingRun' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /atl/attendance/daily:
    get:
      tags: [Attendance]
      summary: List daily attendance rollups for an employee over a range
      operationId: listDailyAttendance
      parameters:
        - name: employeeId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of daily attendance rows with sub-day allocations.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AttendanceDaily' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # FR-05 Regularisation
  # ---------------------------------------------------------------------------
  /atl/regularisations:
    post:
      tags: [Regularisation]
      summary: Raise a missed-punch / status-correction regularisation
      operationId: createRegularisation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegularisationCreate' }
      responses:
        '201':
          description: Regularisation submitted to P01.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Regularisation' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /atl/regularisations/{id}/decision:
    post:
      tags: [Regularisation]
      summary: Approve or reject a regularisation (P01)
      operationId: decideRegularisation
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowDecision' }
      responses:
        '200':
          description: Decision applied.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Regularisation' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # FR-06 Overtime
  # ---------------------------------------------------------------------------
  /atl/overtime:
    post:
      tags: [Overtime]
      summary: Submit an overtime claim
      operationId: createOvertime
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OvertimeCreate' }
      responses:
        '201':
          description: Overtime submitted.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overtime' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /atl/overtime/{id}/decision:
    post:
      tags: [Overtime]
      summary: Approve (PAID / COMP_OFF) or reject an overtime claim (P01)
      operationId: decideOvertime
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OvertimeDecision' }
      responses:
        '200':
          description: Decision applied.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overtime' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # FR-07 / FR-08 Attendance exceptions (WFH / ON_DUTY / TOUR)
  # ---------------------------------------------------------------------------
  /atl/exceptions:
    post:
      tags: [Attendance Exceptions]
      summary: Apply a WFH / On-Duty / Tour exception
      operationId: createException
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceExceptionCreate' }
      responses:
        '201':
          description: Exception submitted to P01.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceException' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /atl/exceptions/{id}/decision:
    post:
      tags: [Attendance Exceptions]
      summary: Approve or reject a WFH / OD / Tour exception (P01)
      operationId: decideException
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowDecision' }
      responses:
        '200':
          description: Decision applied.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceException' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # FR-09 Comp-off
  # ---------------------------------------------------------------------------
  /atl/comp-off/balance:
    get:
      tags: [Comp-off]
      summary: Get comp-off balance for an employee
      operationId: getCompOffBalance
      parameters:
        - name: employeeId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Comp-off balance derived from comp_off_ledger.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompOffBalance' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /atl/comp-off/redeem:
    post:
      tags: [Comp-off]
      summary: Redeem comp-off days
      operationId: redeemCompOff
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompOffRedeem' }
      responses:
        '201':
          description: Comp-off redemption ledger entry created.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompOffLedgerEntry' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Insufficient / expired comp-off (COMP_OFF_INSUFFICIENT, COMP_OFF_EXPIRED).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # FR-10 Leave configuration
  # ---------------------------------------------------------------------------
  /atl/leave-types:
    post:
      tags: [Leave Configuration]
      summary: Create a leave type
      operationId: createLeaveType
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveTypeCreate' }
      responses:
        '201':
          description: Leave type created.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /atl/leave-policies:
    post:
      tags: [Leave Configuration]
      summary: Create a leave accrual policy
      operationId: createLeavePolicy
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveAccrualPolicyCreate' }
      responses:
        '201':
          description: Accrual policy created.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveAccrualPolicy' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Overlapping policy version (POLICY_OVERLAP).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/Internal' }
    get:
      tags: [Leave Configuration]
      summary: List accrual policies for a leave type
      operationId: listLeavePolicies
      parameters:
        - name: leaveTypeId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of accrual policies.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/LeaveAccrualPolicy' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # FR-11 Accrual / ledger / balances
  # ---------------------------------------------------------------------------
  /atl/accrual/run:
    post:
      tags: [Leave Balances & Ledger]
      summary: Trigger the leave accrual job (JOB-M04-ACCRUAL)
      operationId: runAccrual
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccrualRunRequest' }
      responses:
        '202':
          description: Accrual run queued.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRunAck' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Accrual already run for the period (ACCRUAL_ALREADY_RUN).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/Internal' }

  /atl/leave-balances:
    get:
      tags: [Leave Balances & Ledger]
      summary: List leave balances for an employee
      operationId: listLeaveBalances
      parameters:
        - name: employeeId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: leaveTypeId
          in: query
          schema: { type: string, format: uuid }
        - name: leaveYear
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of leave balances (current, reserved and available).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/LeaveBalance' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /atl/leave-ledger:
    get:
      tags: [Leave Balances & Ledger]
      summary: List the immutable leave balance ledger for an employee/type
      operationId: listLeaveLedger
      parameters:
        - name: employeeId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: leaveTypeId
          in: query
          schema: { type: string, format: uuid }
        - name: leaveYear
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of ledger entries (append-only single source of truth).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/LeaveLedgerEntry' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /atl/leave-ledger/adjust:
    post:
      tags: [Leave Balances & Ledger]
      summary: Raise a manual ledger adjustment (maker; P01 maker-checker)
      operationId: adjustLeaveLedger
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveLedgerAdjustCreate' }
      responses:
        '201':
          description: Adjustment raised (pending checker approval via P01).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveLedgerEntry' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # FR-12 / FR-13 / FR-14 / FR-23 Leave applications
  # ---------------------------------------------------------------------------
  /atl/leave-applications:
    post:
      tags: [Leave Applications]
      summary: Apply for leave (creates soft-reserve; P01 flow)
      description: >
        Creates a leave application, a `leave_reservations` soft-hold and a P01
        workflow instance. Response echoes `balancePreview` and the minted
        `leaveSpellLineageId`.
      operationId: applyLeave
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveApplicationCreate' }
      responses:
        '201':
          description: Leave application submitted.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveApplication' }
        '422':
          description: Validation failure (e.g. DAY_UNITS_MISMATCH, COMMUTED_REQUIRES_HPL).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >
            State/precondition conflict (INSUFFICIENT_BALANCE, LEAVE_OVERLAP,
            BLACKOUT_PERIOD, ENTITLEMENT_EXCEEDED, ERR-DUP-INSTANCE).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
    get:
      tags: [Leave Applications]
      summary: List leave applications (cursor paginated)
      operationId: listLeaveApplications
      parameters:
        - name: employeeId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/LeaveApplicationStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page of leave applications.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/LeaveApplication' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /atl/leave-applications/{id}/decision:
    post:
      tags: [Leave Applications]
      summary: Approve / reject / recommend / send-back a leave application (P01, version-checked)
      description: >
        Atomic, version-checked decision. Approve consumes the reservation,
        writes the ledger debit, updates the balance under optimistic lock,
        enqueues recompute and the G04 SR event. Stale `expectedVersion` →
        409 OPTIMISTIC_LOCK_CONFLICT.
      operationId: decideLeaveApplication
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveDecision' }
      responses:
        '200':
          description: Decision applied.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveApplication' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Optimistic-lock or state conflict (OPTIMISTIC_LOCK_CONFLICT).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '500': { $ref: '#/components/responses/Internal' }

  /atl/leave-applications/{id}/withdraw:
    post:
      tags: [Leave Applications]
      summary: Withdraw a submitted leave application (releases reservation)
      operationId: withdrawLeaveApplication
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Application withdrawn.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveApplication' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /atl/leave-applications/{id}/cancel:
    post:
      tags: [Leave Applications]
      summary: Cancel an approved (future) leave application
      description: >
        Cancels approved future-dated leave: emits AVAIL_REVERSAL ledger entry,
        a G04 SR reversal event on the same `leave_spell_lineage_id`, and a
        payroll feed adjustment if the period is locked.
      operationId: cancelLeaveApplication
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Application cancelled; reversal enqueued.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveApplication' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Cannot cancel past leave (CANNOT_CANCEL_PAST).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/Internal' }

  /atl/leave-applications/{id}/return-to-work:
    post:
      tags: [Leave Applications]
      summary: Record return-to-work clearance after long medical leave (FR-23)
      operationId: returnToWork
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnToWorkRequest' }
      responses:
        '200':
          description: Return-to-work recorded.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveApplication' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412':
          description: Return-to-work still pending / fitness cert absent (RETURN_TO_WORK_PENDING).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/Internal' }

  /atl/leave-applications/conflicts:
    get:
      tags: [Team Calendar]
      summary: Detect overlapping-leave conflicts across a team/org unit
      operationId: listLeaveConflicts
      parameters:
        - name: orgUnitId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: range
          in: query
          description: Date range as `from..to` (ISO dates).
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of leave conflicts.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/LeaveConflict' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /atl/team-calendar:
    get:
      tags: [Team Calendar]
      summary: Get a manager's team leave/attendance calendar for a month
      operationId: getTeamCalendar
      parameters:
        - name: managerId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: month
          in: query
          required: true
          description: Month in `YYYY-MM`.
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
      responses:
        '200':
          description: Team calendar view.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamCalendar' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # FR-15 Year close
  # ---------------------------------------------------------------------------
  /atl/year-close/simulate:
    post:
      tags: [Year Close]
      summary: Simulate a leave-year close (dry run, no writes)
      operationId: simulateYearClose
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/YearCloseRequest' }
      responses:
        '200':
          description: Simulation report produced.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/YearCloseRun' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /atl/year-close/commit:
    post:
      tags: [Year Close]
      summary: Commit a leave-year close (carry-forward / lapse / conversion)
      operationId: commitYearClose
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/YearCloseCommit' }
      responses:
        '202':
          description: Year-close commit queued.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/YearCloseRun' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Year already closed or pending leave blocks close (YEAR_ALREADY_CLOSED, PENDING_LEAVE_BLOCKS_CLOSE).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/Internal' }

  /atl/year-close/{runId}:
    get:
      tags: [Year Close]
      summary: Get a leave-year close run
      operationId: getYearCloseRun
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Year-close run.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/YearCloseRun' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # FR-16 Encashment
  # ---------------------------------------------------------------------------
  /atl/encashments:
    post:
      tags: [Encashment]
      summary: Request leave encashment (in-service / LTC / retirement)
      operationId: createEncashment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EncashmentCreate' }
      responses:
        '201':
          description: Encashment requested (P01 flow).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Encashment' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Cap / block exhausted (ENCASHMENT_CAP_EXCEEDED, LTC_BLOCK_EXHAUSTED, NOT_ENCASHABLE).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/Internal' }

  /atl/encashments/{id}/decision:
    post:
      tags: [Encashment]
      summary: Approve or reject an encashment request (P01; HR-Admin authorises)
      operationId: decideEncashment
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowDecision' }
      responses:
        '200':
          description: Decision applied.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
