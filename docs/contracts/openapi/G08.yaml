components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    XCorrelationId:
      description: Correlation id echoed on every response and written to every P05 audit/log line
      schema:
        type: string
  parameters:
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Page size (default 25, max 100)
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque forward cursor
    sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
      description: field:asc|desc
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: Idempotency key for state-changing POSTs; 24h replay window
  responses:
    ValidationFailed:
      description: 422 Validation failed (VAL-* / ERR-G08-WEIGHTAGE, -GRADERANGE, -ADVEVID, -SIGNINVALID, -FORCEDDIST)
      headers:
        X-Correlation-Id: *id001
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_FAILED
              message: '...'
              field: null
              details: null
    Unauthorized:
      description: 401 No/invalid session or step-up required
      headers:
        X-Correlation-Id: *id001
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHENTICATED
              message: '...'
              field: null
              details: null
    Forbidden:
      description: 403 Not permitted (ERR-G08-SELFADJ, -COI, -DUALCTRL; never leaks out-of-scope existence)
      headers:
        X-Correlation-Id: *id001
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: '...'
              field: null
              details: null
    NotFound:
      description: 404 Resource absent or out of scope
      headers:
        X-Correlation-Id: *id001
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: '...'
              field: null
              details: null
    Conflict:
      description: 409 State/idempotency/uniqueness conflict (ERR-G08-STATE, -TIERCONFLICT, -DISCLOSE, -SEALED, -RATIFY, -REPWINDOW,
        -TAMPER, -ERRATA, -ALREADYPOSTED, -CUSTODYORPHAN)
      headers:
        X-Correlation-Id: *id001
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: CONFLICT
              message: '...'
              field: null
              details: null
    PreconditionFailed:
      description: 412 Precondition not met (ERR-G08-CHAIN, -SIGN; upstream retryable)
      headers:
        X-Correlation-Id: *id001
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: PRECONDITION_FAILED
              message: '...'
              field: null
              details: null
    RateLimited:
      description: 429 Rate limit / lockout exceeded
      headers:
        X-Correlation-Id: *id001
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RATE_LIMITED
              message: '...'
              field: null
              details: null
    InternalError:
      description: 500 Unexpected server error (ERR-LOADFAIL; upstream via X.3)
      headers:
        X-Correlation-Id: *id001
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL
              message: '...'
              field: null
              details: null
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: One of the 8 platform wire codes
            message:
              type: string
            field:
              type:
              - string
              - 'null'
            details:
              type:
              - object
              - 'null'
              additionalProperties: true
              description: 'Structured discriminators, e.g. {err_id: ERR-G08-*, reason}'
