components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT bearer carrying resolved roles + tenant/entity scope; permissions resolved per
        request by P02.
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size (cursor pagination).
      schema:
        type: integer
        default: 25
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor from a previous next_cursor.
      schema:
        type: string
    Sort:
      name: sort
      in: query
      required: false
      description: Sort spec, e.g. field:asc|desc.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Mandatory on transaction/payment/run-initiating POSTs; 24h replay returns the original
        result.
      schema:
        type: string
  headers:
    CorrelationId:
      description: Echoed correlation id; written to every P05 audit and log line for the request.
      schema:
        type: string
  responses:
    ValidationFailed:
      description: 'VALIDATION_FAILED (422): input failed a VAL-*/VAL-G10-* rule. ERR-G10-* mapped here:
        RULE-EXPR, DSL-PROPTEST, RATE-NOTFOUND, PT-STATE, TAXSLAB-NOTFOUND, PERQ-REFRATE, BANK-INVALID.'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: 'UNAUTHENTICATED (401): no/invalid/expired session or token.'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'FORBIDDEN (403): authenticated but not permitted; never leaks out-of-scope existence.
        Includes SoD (maker=checker / self-approval) and PII-ceiling denials.'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'NOT_FOUND (404): resource absent or out of the caller’s scope.'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 'CONFLICT (409): idempotency replay, duplicate workflow start, or state/uniqueness
        conflict. ERR-G10-* mapped here: RUN-INFLIGHT, SNAPSHOT-FROZEN, RULE-OVERLAP, RATE-OVERLAP, RATE-LOCKED,
        STRUCT-OVERLAP, STRUCT-LOCKED, RECOVERY-NET, RECOVERY-BARRED, OFFCYCLE-DUP, RECON-TIEOUT, RECON-UNSIGNED,
        RUN-NOTLOCKED, REOPEN-BLOCKED, RESEND-POSPAY, RUN-IMMUTABLE.'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PreconditionFailed:
      description: 'PRECONDITION_FAILED (412): a required precondition not met, incl. X.3-mapped upstream/integration
        unavailability. ERR-G10-* mapped here: SIGNING-DOWN (HSM/DSC unavailable).'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: 'RATE_LIMITED (429): rate limit or lockout exceeded.'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: 'INTERNAL (500): unexpected server error or non-retryable upstream failure (ERR-LOADFAIL
        to user).'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - error
      description: Canonical platform error envelope (PLATFORM_FOUNDATION.md §4.1). The correlation id
        is carried in the X-Correlation-Id response header, not the body.
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: One of the 8 platform wire codes (VALIDATION_FAILED, UNAUTHENTICATED, FORBIDDEN,
                NOT_FOUND, CONFLICT, PRECONDITION_FAILED, RATE_LIMITED, INTERNAL) or a module business
                code (ERR-G10-*).
            message:
              type: string
              description: Human-readable message resolved from a MSG-*/ERR-* id.
            field:
              type:
              - string
              - 'null'
              description: Offending field for validation errors.
            details:
              type:
              - object
              - 'null'
              additionalProperties: true
              description: Structured discriminators, e.g. { reason, ... }.
    PayComponentCategory:
      type: string
      enum:
      - EARNING
      - DEDUCTION
      - PERQUISITE
      - ROUNDING_ADJUSTMENT
    RateType:
      type: string
      enum:
      - DA
      - HRA
      - PT_SLAB
      - TAX_SLAB
    RemittanceScheme:
      type: string
      enum:
      - TDS
      - PT
      - GPF
      - PF
      - NPS
      - PENSION
      - INSURANCE
    RemittanceStatus:
      type: string
      enum:
      - ACCRUED
      - SCHEDULED
      - DEPOSITED
      - MATCHED
      - OVERDUE
      - SHORT_PAID
    RunStatus:
      type: string
      enum:
      - OPEN
      - INPUT_LOCKED
      - QUEUED
      - COMPUTING
      - COMPUTED
      - RECONCILED
      - APPROVED
      - LOCKED
      - DISBURSED
      - CLOSED
      - REOPENED
      - FAILED
      - CANCELLED
    RunMode:
      type: string
      enum:
      - FINAL
      - PARALLEL_WHATIF
    DisbursementStatus:
      type: string
      enum:
      - DRAFT
      - VALIDATED
      - SIGNED
      - TRANSMITTED
      - RECONCILED
      - SUSPECTED_PROCESSED
      - REJECTED
    SrEventType:
      type: string
      enum:
      - PAY_FIXATION
      - ANNUAL_INCREMENT
      - INCREMENT_WITHHELD
      - PAY_PROTECTION
      - SEPARATION
    PayComponent:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
          description: Non-null tenant scope (Platform §0.1).
        entity_id:
          type:
          - string
          - 'null'
          description: Entity scope where entity-scoped.
        code:
          type: string
        name:
          type: string
        category:
          $ref: '#/components/schemas/PayComponentCategory'
        taxable:
          type: boolean
        active_rule_version:
          type:
          - integer
          - 'null'
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - DEPRECATED
    PayComponentCreate:
      type: object
      required:
      - code
      - name
      - category
      properties:
        code:
          type: string
        name:
          type: string
        category:
          $ref: '#/components/schemas/PayComponentCategory'
        taxable:
          type: boolean
          default: false
        entity_id:
          type:
          - string
          - 'null'
    PayRule:
      type: object
      properties:
        id:
          type: string
