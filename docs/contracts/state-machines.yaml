  # ===========================================================================
  # G12 — Digital Service Register (BRD §10) — APPEND-ONLY / SUPERSEDE-NOT-DELETE
  # ===========================================================================
  G12:
    machines:
      - entity: sr_ledger_entry
        description: "SR ledger entry (entry_status x attestation_status), projected from sr_status_events. Append-only, hash-chained; deletion FORBIDDEN, corrections supersede."
        runtime: MODULE_INTERNAL
        append_only: true
        supersede_not_delete: true
        states: [ACTIVE_UNATTESTED, ACTIVE_ATTESTED, ACTIVE_EMPLOYEE_VERIFIED, ACTIVE_DISPUTED, ACTIVE_ANNOTATED, SUPERSEDED]
        initial: [ACTIVE_UNATTESTED]
        terminal: [SUPERSEDED]
        transitions:
          - {from: null, action: "ingest valid event", to: ACTIVE_UNATTESTED, trigger: SYSTEM, guard: "", side_effects: "append + content hash-chain + RFC 3161 stamp (FR-03); status-chain genesis"}
          - {from: ACTIVE_UNATTESTED, action: "custodian attest (qualified)", to: ACTIVE_ATTESTED, trigger: SR_CUSTODIAN, guard: "", side_effects: "attestation row + signed digest + timestamp (FR-07)"}
          - {from: ACTIVE_ATTESTED, action: "employee/heir/assisted verify", to: ACTIVE_EMPLOYEE_VERIFIED, trigger: EMPLOYEE, guard: "", side_effects: "cycle confirmation (FR-08)"}
          - {from: any, action: "employee/heir raises dispute", to: ACTIVE_DISPUTED, trigger: EMPLOYEE, guard: "", side_effects: "dispute record (FR-06); ATTESTATION_STATUS transition"}
          - {from: ACTIVE_DISPUTED, action: "dispute resolved (upheld)", to: ACTIVE_ATTESTED, trigger: SR_CUSTODIAN, guard: "", side_effects: "resolution note; appeal now eligible (FR-21); returns to prior status"}
          - {from: ACTIVE_DISPUTED, action: "dispute/appeal -> corrigendum", to: SUPERSEDED, trigger: SR_CUSTODIAN, guard: "", side_effects: "new ACTIVE corrigendum (FR-05); SUPERSESSION transition"}
          - {from: any, action: "corrigendum / reversal / bulk corrigendum", to: SUPERSEDED, trigger: SR_CUSTODIAN, guard: "", side_effects: "superseded_by_event_id (via status chain); new ACTIVE entry"}
          - {from: any, action: "annotation added", to: ACTIVE_ANNOTATED, trigger: SR_CUSTODIAN, guard: "", side_effects: "annotation record (FR-06); content unchanged"}
          - {from: any, action: "delete attempt", to: null, trigger: any, guard: "REJECTED", side_effects: "SR_DELETION_FORBIDDEN + security alert"}

      - entity: sr_correction
        description: "Corrigendum decision; dual custodian co-sign (v2)."
        runtime: P01
        states: [PENDING, APPROVED, REJECTED]
        initial: [PENDING]
        terminal: [APPROVED, REJECTED]
        transitions:
          - {from: null, action: "maker submits corrigendum", to: PENDING, trigger: MAKER, guard: "reason + evidence (identity => dual sign-off)", side_effects: ""}
          - {from: PENDING, action: "custodian approves + 2nd custodian co-signs", to: APPROVED, trigger: SR_CUSTODIAN, guard: "maker != checker != 2nd custodian", side_effects: "appends corrigendum; supersedes original", p01_pattern: PARALLEL_ALL_OF}
          - {from: PENDING, action: "custodian rejects", to: REJECTED, trigger: SR_CUSTODIAN, guard: "", side_effects: "no ledger change"}

      - entity: verification_cycle
        description: "SR verification cycle (bulk/assisted/heir + gap gate)."
        runtime: MODULE_INTERNAL
        states: [OPEN, HEIR_PENDING, EMPLOYEE_REVIEW, BULK_REVIEW, ASSISTED, DISPUTED, CUSTODIAN_REVIEW, COMPLETED, OVERDUE]
        initial: [OPEN, HEIR_PENDING]
        terminal: [COMPLETED]
        transitions:
          - {from: null, action: "scheduler opens", to: OPEN, trigger: SYSTEM, guard: "period boundary / pre-retirement; DEATH => HEIR_PENDING", side_effects: ""}
          - {from: OPEN, action: "employee starts review", to: EMPLOYEE_REVIEW, trigger: EMPLOYEE, guard: "", side_effects: "exceptions risk-surfaced"}
          - {from: OPEN, action: "HR assists", to: ASSISTED, trigger: HR, guard: "consent captured", side_effects: ""}
          - {from: HEIR_PENDING, action: "heir identity verified", to: EMPLOYEE_REVIEW, trigger: SR_CUSTODIAN, guard: "nominee/heir verified", side_effects: ""}
          - {from: [EMPLOYEE_REVIEW, BULK_REVIEW], action: "dispute raised", to: DISPUTED, trigger: EMPLOYEE, guard: "", side_effects: "routes to FR-06"}
          - {from: DISPUTED, action: "disputes resolved", to: CUSTODIAN_REVIEW, trigger: SR_CUSTODIAN, guard: "", side_effects: ""}
          - {from: [EMPLOYEE_REVIEW, BULK_REVIEW, ASSISTED], action: "confirm (sign)", to: CUSTODIAN_REVIEW, trigger: EMPLOYEE, guard: "exceptions acknowledged", side_effects: ""}
          - {from: CUSTODIAN_REVIEW, action: "custodian finalises (sign)", to: COMPLETED, trigger: SR_CUSTODIAN, guard: "no open disputes; all CRITICAL gaps EXPLAINED/CLOSED (FR-17)", side_effects: ""}
          - {from: [OPEN, EMPLOYEE_REVIEW, DISPUTED], action: "past due_date", to: OVERDUE, trigger: SYSTEM, guard: "", side_effects: "escalation notifications"}

      - entity: appeal
        description: "SR appeal (post-uphold); OVERTURNED spawns corrigendum."
        runtime: P01
        states: [RAISED, UNDER_APPEAL, UPHELD, OVERTURNED, REMANDED, WITHDRAWN]
        initial: [RAISED]
        terminal: [UPHELD, OVERTURNED, WITHDRAWN]
        transitions:
          - {from: null, action: "appellant raises (post-uphold)", to: RAISED, trigger: APPELLANT, guard: "prior custodian UPHELD required", side_effects: ""}
          - {from: RAISED, action: "authority assigned", to: UNDER_APPEAL, trigger: SYSTEM, guard: "independent of upholding custodian", side_effects: "", p01_pattern: SEQUENTIAL}
          - {from: UNDER_APPEAL, action: "authority decides (uphold)", to: UPHELD, trigger: APPEAL_AUTHORITY, guard: "", side_effects: "", p01_pattern: SEQUENTIAL}
          - {from: UNDER_APPEAL, action: "authority decides (overturn)", to: OVERTURNED, trigger: APPEAL_AUTHORITY, guard: "", side_effects: "spawn corrigendum (FR-05)"}
          - {from: UNDER_APPEAL, action: "authority decides (remand)", to: REMANDED, trigger: APPEAL_AUTHORITY, guard: "", side_effects: "directions recorded"}
          - {from: UNDER_APPEAL, action: "appellant withdraws", to: WITHDRAWN, trigger: APPELLANT, guard: "", side_effects: ""}
          - {from: REMANDED, action: "custodian re-decides", to: RAISED, trigger: SR_CUSTODIAN, guard: "re-appealable", side_effects: ""}

      - entity: bulk_corrigendum
        description: "Bulk corrigendum with sampling approval (v2)."
        runtime: P01
        states: [DRAFT, PREVIEW, SAMPLING_APPROVAL, APPROVED, APPLYING, APPLIED, REJECTED]
        initial: [DRAFT]
        terminal: [APPLIED, REJECTED]
        transitions:
          - {from: null, action: "create + selector", to: DRAFT, trigger: MAKER, guard: "", side_effects: ""}
          - {from: DRAFT, action: "preview impact", to: PREVIEW, trigger: MAKER, guard: "", side_effects: "count + sample computed"}
          - {from: PREVIEW, action: "submit for sampling approval", to: SAMPLING_APPROVAL, trigger: MAKER, guard: "sample sized", side_effects: ""}
          - {from: SAMPLING_APPROVAL, action: "2nd custodian approves sample", to: APPROVED, trigger: SR_CUSTODIAN, guard: "maker != approver; threshold met", side_effects: "", p01_pattern: SEQUENTIAL}
          - {from: SAMPLING_APPROVAL, action: "sample fails", to: REJECTED, trigger: SR_CUSTODIAN, guard: "", side_effects: "nothing applied"}
          - {from: APPROVED, action: "apply", to: APPLIED, trigger: SYSTEM, guard: "", side_effects: "per-entry FR-05; failures logged, not aborting"}

      - entity: legacy_digitisation_batch
        description: "Legacy SR digitisation batch (confidence-flagged)."
        runtime: HYBRID
        states: [CREATED, SCANNING, DATA_ENTRY, DUAL_VERIFICATION, RECONCILIATION, READY_FOR_PROMOTION, PROMOTED, REJECTED]
        initial: [CREATED]
        terminal: [PROMOTED, REJECTED]
        transitions:
          - {from: CREATED, action: "scans linked", to: SCANNING, trigger: SYSTEM, guard: "G13 documents attached", side_effects: ""}
          - {from: SCANNING, action: "transcription done", to: DATA_ENTRY, trigger: SYSTEM, guard: "", side_effects: "staged records created"}
          - {from: DATA_ENTRY, action: "records entered + confidence set", to: DUAL_VERIFICATION, trigger: OPERATOR, guard: "", side_effects: ""}
          - {from: DUAL_VERIFICATION, action: "all verified (maker != verifier)", to: RECONCILIATION, trigger: VERIFIER, guard: "maker != verifier", side_effects: ""}
          - {from: RECONCILIATION, action: "facts reconciled", to: READY_FOR_PROMOTION, trigger: SYSTEM, guard: "VERIFIED discrepancy=0; flagged facts have provenance+note; matched to G01", side_effects: "semantic dedup clear"}
          - {from: READY_FOR_PROMOTION, action: "custodian promotes (+ co-sign for flagged)", to: PROMOTED, trigger: SR_CUSTODIAN, guard: "maker-checker", side_effects: "bulk append (FR-03)", p01_pattern: SEQUENTIAL}
          - {from: any, action: "custodian rejects", to: REJECTED, trigger: SR_CUSTODIAN, guard: "reason recorded", side_effects: ""}

  # ===========================================================================
  # G13 — Document Management & Secure Storage (BRD §12)
  # ===========================================================================
  G13:
    machines:
      - entity: document
        description: "Document lifecycle; AV scan gate; legal-hold/disposition on P01."
        runtime: HYBRID
        states: [DRAFT, SCANNING, ACTIVE, QUARANTINED, CHECKED_OUT, ON_LEGAL_HOLD, ORPHANED, DISPOSITION_DUE, DISPOSED, ARCHIVED, DELETED]
        initial: [DRAFT]
        terminal: [DISPOSED, ARCHIVED, DELETED]
        transitions:
          - {from: null, action: "upload accepted", to: DRAFT, trigger: USER, guard: "VAL-FILE passed", side_effects: ""}
          - {from: DRAFT, action: "scan starts", to: SCANNING, trigger: SYSTEM, guard: "", side_effects: "AV queued"}
          - {from: SCANNING, action: "scan CLEAN", to: ACTIVE, trigger: SYSTEM, guard: "", side_effects: "sandboxed OCR/preview (X.1); P05 chained VERSION_ADD"}
          - {from: SCANNING, action: "scan INFECTED", to: QUARANTINED, trigger: SYSTEM, guard: "", side_effects: "isolate + notify Security (X.2)"}
          - {from: QUARANTINED, action: "released (Security)", to: ACTIVE, trigger: SECURITY, guard: "", side_effects: "override-with-reason audited"}
          - {from: ACTIVE, action: "check-out (lockable types)", to: CHECKED_OUT, trigger: USER, guard: "", side_effects: "exclusive lock"}
          - {from: CHECKED_OUT, action: "check-in", to: ACTIVE, trigger: USER, guard: "", side_effects: "new version; lock released"}
          - {from: ACTIVE, action: "new version supersedes", to: ACTIVE, trigger: USER, guard: "", side_effects: "prior version -> SUPERSEDED"}
          - {from: ACTIVE, action: "legal hold placed", to: ON_LEGAL_HOLD, trigger: LH_ADMIN, guard: "", side_effects: "disposition frozen"}
          - {from: ON_LEGAL_HOLD, action: "hold released (P01 dual-control)", to: ACTIVE, trigger: LH_APPROVER, guard: "", side_effects: "recompute due date", p01_pattern: SEQUENTIAL}
          - {from: ACTIVE, action: "last link detached (not WORM/held)", to: ORPHANED, trigger: SYSTEM, guard: "", side_effects: "default orphan class + review queue (R15)"}
          - {from: ORPHANED, action: "re-home / re-link", to: ACTIVE, trigger: USER, guard: "", side_effects: ""}
          - {from: ACTIVE, action: "disposition due", to: DISPOSITION_DUE, trigger: SYSTEM, guard: "no active hold; anchor confirmed (JOB-M11-RETENTION)", side_effects: ""}
          - {from: DISPOSITION_DUE, action: "disposition executed", to: DISPOSED, trigger: SYSTEM, guard: "", side_effects: "certificate + tombstone; crypto-shred if unshared"}
          - {from: ACTIVE, action: "soft delete", to: DELETED, trigger: USER, guard: "not WORM/hold", side_effects: ""}

      - entity: legal_hold
        description: "Legal-hold placement + release SoD on P01 (R10)."
        runtime: P01
        states: [PENDING_APPROVAL, ACTIVE, RELEASE_PROPOSED, RELEASED]
        initial: [PENDING_APPROVAL, ACTIVE]
        terminal: [RELEASED]
        transitions:
          - {from: null, action: "place (standard)", to: ACTIVE, trigger: LH_ADMIN, guard: "", side_effects: "legal_hold_count++; doc -> ON_LEGAL_HOLD"}
          - {from: null, action: "place (high-value)", to: PENDING_APPROVAL, trigger: LH_ADMIN, guard: "proposes (P01)", side_effects: "", p01_pattern: SEQUENTIAL}
          - {from: PENDING_APPROVAL, action: "approve placement", to: ACTIVE, trigger: LH_APPROVER, guard: "approver != placer (P01)", side_effects: "", p01_pattern: SEQUENTIAL}
          - {from: ACTIVE, action: "continuous-eval future match (JOB-G13-HOLDEVAL)", to: ACTIVE, trigger: SYSTEM, guard: "", side_effects: "auto-adds item + custodian notice (X.2)"}
          - {from: ACTIVE, action: "propose release", to: RELEASE_PROPOSED, trigger: LH_ADMIN, guard: "reason", side_effects: "release_proposed_by set"}
          - {from: RELEASE_PROPOSED, action: "approve release", to: RELEASED, trigger: LH_APPROVER, guard: "approver != proposer (P01)", side_effects: "legal_hold_count--; recompute due", p01_pattern: SEQUENTIAL}

      - entity: disposition
        description: "Retention disposition (maker-checker; hold-aware)."
        runtime: P01
        states: [PROPOSED, APPROVED, REJECTED, EXECUTED, BLOCKED_HOLD]
        initial: [PROPOSED]
        terminal: [EXECUTED, REJECTED]
        transitions:
          - {from: null, action: "propose", to: PROPOSED, trigger: LIBRARIAN, guard: "doc DISPOSITION_DUE", side_effects: "", p01_pattern: SEQUENTIAL}
          - {from: PROPOSED, action: "approve", to: APPROVED, trigger: RECORDS_MGR, guard: "maker != checker; no hold; anchor confirmed", side_effects: "", p01_pattern: SEQUENTIAL}
          - {from: PROPOSED, action: "reject", to: REJECTED, trigger: RECORDS_MGR, guard: "with reason", side_effects: ""}
          - {from: APPROVED, action: "execute", to: EXECUTED, trigger: SYSTEM, guard: "no hold; confirmed anchor", side_effects: "JOB-M11-DISPOSAL purge/crypto-shred + certificate + tombstone"}
          - {from: any, action: "hold present", to: BLOCKED_HOLD, trigger: SYSTEM, guard: "hold active", side_effects: "abort execution"}

      - entity: signature_request
        description: "E-signature request on document (DocumentGen / P01)."
        runtime: P01
        states: [DRAFT, SENT, IN_PROGRESS, COMPLETED, DECLINED, EXPIRED, CANCELLED]
        initial: [DRAFT]
        terminal: [COMPLETED, DECLINED, EXPIRED, CANCELLED]
        transitions:
          - {from: DRAFT, action: "send", to: SENT, trigger: ISSUER, guard: "", side_effects: ""}
          - {from: SENT, action: "first sign", to: IN_PROGRESS, trigger: SIGNER, guard: "", side_effects: ""}
          - {from: IN_PROGRESS, action: "all signed (+ timestamp + LTV for statutory)", to: COMPLETED, trigger: SIGNER, guard: "", side_effects: ""}
          - {from: IN_PROGRESS, action: "decline", to: DECLINED, trigger: SIGNER, guard: "", side_effects: ""}
          - {from: [SENT, IN_PROGRESS], action: "expiry", to: EXPIRED, trigger: SYSTEM, guard: "", side_effects: ""}
          - {from: any, action: "cancel", to: CANCELLED, trigger: ISSUER, guard: "", side_effects: ""}

      - entity: clearance
        description: "Document classification/clearance (R3; P01 maker-checker)."
        runtime: P01
        states: [PENDING_APPROVAL, ACTIVE, SUSPENDED, EXPIRED, REVOKED]
        initial: [PENDING_APPROVAL]
        terminal: [EXPIRED, REVOKED]
        transitions:
          - {from: null, action: "propose", to: PENDING_APPROVAL, trigger: SECURITY, guard: "maker", side_effects: "", p01_pattern: SEQUENTIAL}
          - {from: PENDING_APPROVAL, action: "approve", to: ACTIVE, trigger: RECORDS_MGR, guard: "approver != maker; TOP_SECRET needs 2 approvers", side_effects: "", p01_pattern: PARALLEL_ALL_OF}
          - {from: ACTIVE, action: "recert overdue (JOB-G13-CLEARANCE-RECERT)", to: SUSPENDED, trigger: SYSTEM, guard: "", side_effects: "notify Security"}
          - {from: ACTIVE, action: "valid_until passed", to: EXPIRED, trigger: SYSTEM, guard: "", side_effects: "auto -> effective INTERNAL"}
          - {from: [ACTIVE, SUSPENDED], action: "revoke", to: REVOKED, trigger: SECURITY, guard: "with reason", side_effects: ""}

      - entity: dsr
        description: "Data-subject request lifecycle (DPDP erasure/exemption, R8)."
        runtime: MODULE_INTERNAL
        states: [RECEIVED, UNDER_REVIEW, EXEMPTED, PARTIALLY_FULFILLED, FULFILLED, REJECTED]
        initial: [RECEIVED]
        terminal: [EXEMPTED, PARTIALLY_FULFILLED, FULFILLED, REJECTED]
        transitions:
          - {from: null, action: "register", to: RECEIVED, trigger: DPO, guard: "", side_effects: "clock starts"}
          - {from: RECEIVED, action: "DPO review", to: UNDER_REVIEW, trigger: DPO, guard: "", side_effects: ""}
          - {from: UNDER_REVIEW, action: "all in-scope exempt", to: EXEMPTED, trigger: DPO, guard: "statutory/hold/WORM basis recorded", side_effects: ""}
          - {from: UNDER_REVIEW, action: "mixed outcome", to: PARTIALLY_FULFILLED, trigger: DPO, guard: "", side_effects: "some erased (P05 redaction + JOB-M11-DISPOSAL), some exempt"}
          - {from: UNDER_REVIEW, action: "all erasable", to: FULFILLED, trigger: DPO, guard: "", side_effects: "crypto-shred/purge (unshared)"}
          - {from: UNDER_REVIEW, action: "not actionable", to: REJECTED, trigger: DPO, guard: "with reason", side_effects: ""}

  # ===========================================================================
  # G14 — Dashboard & Analytics (BRD §10)
  # ===========================================================================
  G14:
    machines:
      - entity: kpi_definition
        description: "KPI definition lifecycle; activate via P01 checker (SoD)."
        runtime: P01
        states: [DRAFT, ACTIVE, RETIRED]
        initial: [DRAFT]
        terminal: [RETIRED]
        transitions:
          - {from: null, action: "create", to: DRAFT, trigger: ANALYST, guard: "expression validated; definition_hash computed", side_effects: ""}
          - {from: DRAFT, action: "submit+activate (P01 checker)", to: ACTIVE, trigger: CHECKER, guard: "approved_by != created_by (SoD via P02)", side_effects: "prior ACTIVE -> RETIRED", p01_pattern: SEQUENTIAL}
          - {from: ACTIVE, action: "new version activated", to: RETIRED, trigger: SYSTEM, guard: "", side_effects: "superseded; trends mark version change"}
          - {from: [ACTIVE, DRAFT], action: "retire", to: RETIRED, trigger: ANALYST, guard: "not referenced by published surface (or auto-pauses dependents)", side_effects: ""}

      - entity: dashboard
        description: "Dashboard lifecycle; COMPLIANCE/EXEC publish via P01."
        runtime: HYBRID
        states: [DRAFT, PUBLISHED, ARCHIVED]
        initial: [DRAFT]
        terminal: [ARCHIVED]
        transitions:
          - {from: null, action: "create", to: DRAFT, trigger: ANALYST, guard: "bindings validated", side_effects: ""}
          - {from: DRAFT, action: "publish", to: PUBLISHED, trigger: CHECKER, guard: "COMPLIANCE/EXEC require P01 checker; all bindings ACTIVE", side_effects: "", p01_pattern: SEQUENTIAL}
          - {from: PUBLISHED, action: "edit (new draft)", to: DRAFT, trigger: ANALYST, guard: "", side_effects: "versioned edit"}
          - {from: PUBLISHED, action: "archive", to: ARCHIVED, trigger: ANALYST, guard: "", side_effects: "saved_views preserved read-only"}

      - entity: report_execution
        description: "Report execution run (X.1/on-demand)."
        runtime: MODULE_INTERNAL
        states: [QUEUED, RUNNING, COMPLETED, FAILED, EXPIRED, REDACTED]
        initial: [QUEUED]
        terminal: [EXPIRED, REDACTED]
        transitions:
          - {from: null, action: "trigger (X.1/on-demand)", to: QUEUED, trigger: SYSTEM, guard: "recipients/scope validated (P02)", side_effects: ""}
          - {from: QUEUED, action: "start", to: RUNNING, trigger: SYSTEM, guard: "mart available", side_effects: ""}
          - {from: RUNNING, action: "success", to: COMPLETED, trigger: SYSTEM, guard: "", side_effects: "document created (G13); async access_log EXPORT (P05)"}
          - {from: RUNNING, action: "error", to: FAILED, trigger: SYSTEM, guard: "", side_effects: "retry per X.1; alert on final fail"}
          - {from: COMPLETED, action: "retention reached", to: EXPIRED, trigger: SYSTEM, guard: "", side_effects: "artefact purged"}
          - {from: COMPLETED, action: "DPDP erasure (FR-20)", to: REDACTED, trigger: DPO, guard: "", side_effects: "artefact lawful basis revoked"}

      - entity: alert_event
        description: "Analytics alert event (threshold breach with hysteresis)."
        runtime: MODULE_INTERNAL
        states: [OPEN, SUPPRESSED, ACKNOWLEDGED, RESOLVED]
        initial: [OPEN, SUPPRESSED]
        terminal: [RESOLVED]
        transitions:
          - {from: null, action: "breach detected (period-correct threshold)", to: OPEN, trigger: SYSTEM, guard: "not within suppression/hysteresis", side_effects: "notify (X.2)"}
          - {from: null, action: "breach within suppression/hysteresis", to: SUPPRESSED, trigger: SYSTEM, guard: "", side_effects: "de-duplicated; logged"}
          - {from: OPEN, action: "acknowledge", to: ACKNOWLEDGED, trigger: USER, guard: "", side_effects: "acknowledged_by recorded"}
          - {from: [ACKNOWLEDGED, OPEN], action: "value returns within bound", to: RESOLVED, trigger: SYSTEM, guard: "", side_effects: "auto-resolve on next clean evaluation"}

      - entity: analytics_scope_policy
        description: "Analytics scope policy (maker-checker via P01; enforced by P02)."
        runtime: P01
        states: [DRAFT, PENDING_APPROVAL, ACTIVE, REJECTED, SUPERSEDED]
        initial: [DRAFT]
        terminal: [REJECTED, SUPERSEDED]
        transitions:
          - {from: null, action: "create/update (maker)", to: DRAFT, trigger: MAKER, guard: "P02 dimensions validated", side_effects: ""}
          - {from: DRAFT, action: "submit (with preview-as-role diff)", to: PENDING_APPROVAL, trigger: MAKER, guard: "", side_effects: "exposure diff captured"}
          - {from: PENDING_APPROVAL, action: "approve (P01 checker != maker)", to: ACTIVE, trigger: CHECKER, guard: "checker != maker", side_effects: "prior version -> SUPERSEDED; security_audit_log", p01_pattern: SEQUENTIAL}
          - {from: PENDING_APPROVAL, action: "reject", to: REJECTED, trigger: CHECKER, guard: "reason recorded", side_effects: ""}

      - entity: prediction_model
        description: "Prediction model; probabilistic requires fairness + DPO co-sign."
        runtime: P01
        states: [DRAFT, ACTIVE, RETIRED]
        initial: [DRAFT]
        terminal: [RETIRED]
        transitions:
          - {from: null, action: "register", to: DRAFT, trigger: ANALYST, guard: "methodology present; probabilistic: model card + exclusions", side_effects: ""}
          - {from: DRAFT, action: "assess fairness (probabilistic only)", to: DRAFT, trigger: ANALYST, guard: "", side_effects: "adverse-impact test recorded; fairness_status PASSED/FAILED/WAIVED"}
          - {from: DRAFT, action: "activate (P01 checker; probabilistic also DPO co-sign)", to: ACTIVE, trigger: CHECKER, guard: "approved_by != created_by; probabilistic requires fairness PASSED/WAIVED", side_effects: "", p01_pattern: PARALLEL_ALL_OF}
          - {from: ACTIVE, action: "retire / drift detected", to: RETIRED, trigger: SYSTEM, guard: "", side_effects: "results frozen read-only; re-review required"}

      - entity: data_subject_change
        description: "DPDP data-subject change propagation across analytics."
        runtime: MODULE_INTERNAL
        states: [RECEIVED, PROPAGATING, COMPLETED, BLOCKED_RETENTION, FAILED]
        initial: [RECEIVED]
        terminal: [COMPLETED, BLOCKED_RETENTION]
        transitions:
          - {from: null, action: "receive change (G01/DPO/consent withdrawal)", to: RECEIVED, trigger: SYSTEM, guard: "", side_effects: "impact analysis queued"}
          - {from: RECEIVED, action: "propagate", to: PROPAGATING, trigger: SYSTEM, guard: "", side_effects: "rectify snapshots / purge predictions / redact exports; P05 redaction marker"}
          - {from: PROPAGATING, action: "complete", to: COMPLETED, trigger: SYSTEM, guard: "propagation verified", side_effects: "audited (P05)"}
          - {from: PROPAGATING, action: "retention overrides erasure", to: BLOCKED_RETENTION, trigger: SYSTEM, guard: "legal basis recorded", side_effects: "data restricted not deleted"}
          - {from: PROPAGATING, action: "step failure", to: FAILED, trigger: SYSTEM, guard: "", side_effects: "retry (X.1) + alert"}
