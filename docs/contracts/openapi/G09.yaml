components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer JWT carrying resolved roles + tenant/entity scope; permissions resolved per request by Authorization.check (P02).
  headers:
    XCorrelationId:
      description: Correlation id echoed on every response and written to every P05 audit/log line (Foundation §1).
      schema:
        type: string
  parameters:
    limit:
      name: limit
      in: query
      required: false
      description: 'Page size (Foundation §1): default 25, max 100.'
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor for the next page (cursor pagination only; no offset paging).
      schema:
        type: string
    sort:
      name: sort
      in: query
      required: false
      description: Sort spec, e.g. field:asc|desc.
      schema:
        type: string
        example: created_at:desc
    artefactType:
      name: artefactType
      in: path
      required: true
      description: Statutory artefact type being signed/verified.
      schema:
        $ref: '#/components/schemas/ArtefactType'
  responses:
    ValidationFailed:
      description: '422 VALIDATION_FAILED — input failed a VAL-*/catalog rule. Module codes: ERR-G09-DA-NOT-RESOLVED, ERR-G09-INCOMPLETE-FINDINGS, ERR-G09-INQUIRY-DISPENSATION-INVALID, ERR-G09-SIGNATURE-REQUIRED, ERR-G09-NON-EMPLOYMENT-CERT-REQUIRED, ERR-G09-PROPORTIONALITY-REASONING-REQUIRED, ERR-G09-RECOVERY-CAP-EXCEEDED, ERR-G09-PROCEDURE-TEMPLATE-INVALID, ERR-G09-SUBSISTENCE-OUT-OF-BOUNDS, ERR-G09-PERSONAL-HEARING-DENIED.'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 401 UNAUTHENTICATED — no/invalid/expired session or embed token.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: '403 FORBIDDEN — authenticated but not permitted; never leaks existence of out-of-scope records (P02). Module code: ERR-G09-CONFIDENTIALITY-DENIED (sealed/confidential artefact).'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 404 NOT_FOUND — resource absent or outside the caller's scope (indistinguishable by design).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: '409 CONFLICT — idempotency replay / duplicate / state or uniqueness conflict. Module codes: ERR-G09-DUPLICATE-COMPLAINT, ERR-G09-DA-BIAS-CONFLICT, ERR-G09-INVALID-STATE-TRANSITION, ERR-G09-ACTOR-CONFLICT, ERR-G09-DEFENCE-WINDOW-CLOSED, ERR-G09-INSPECTION-NOT-AFFORDED, ERR-G09-NATURAL-JUSTICE-VIOLATION, ERR-G09-PENALTY-EXCEEDS-PROPOSED, ERR-G09-DUE-PROCESS-INCOMPLETE, ERR-G09-AUTHORITY-NOT-COMPETENT, ERR-G09-CONSULTATION-PENDING, ERR-G09-INVALID-SERVICE-MODE, ERR-G09-SIGNATURE-INVALID, ERR-G09-ICC-PROCEDURE-REQUIRED, ERR-G09-RESPONDENT-UNRESOLVED, ERR-G09-RETIREE-PROCEEDING-BARRED, ERR-G09-CASE-ABATED, ERR-G09-SLA-PAUSE-INVALID, ERR-G09-IDEMPOTENCY-CONFLICT, ERR-G09-AUDIT-CHAIN-BROKEN, ERR-G09-ORDER-IMMUTABLE, ERR-G09-APPEAL-TIME-BARRED, ERR-G09-EVIDENCE-TAMPERED.'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PreconditionFailed:
      description: 412 PRECONDITION_FAILED — a required precondition is not met (shared ERR-PRECOND), incl. an upstream module (G06/G10/G11/G12/G13) temporarily unavailable (retryable; 503 collapses here).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: 429 RATE_LIMITED — rate limit or brute-force lockout exceeded.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: 500 INTERNAL — unexpected server error or non-retryable upstream/KMS/PKI/eSign/storage failure (shared ERR-LOADFAIL).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      description: Canonical error envelope. 2xx returns the resource payload; every 4xx/5xx returns this envelope. The correlation id is the X-Correlation-Id response header, never a body field.
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: One of the 8 platform wire codes OR a module domain code carried in this field (e.g. ERR-G09-*).
            message:
              type: string
              description: Human-readable copy resolved from a MSG-*/ERR-* id.
            field:
              type:
              - string
              - 'null'
              description: Offending field for validation errors.
            details:
              type:
              - object
              - 'null'
              additionalProperties: true
              description: 'Structured discriminators, e.g. { reason: <REASON> }.'
