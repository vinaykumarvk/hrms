          content:
            application/json:
              schema: { $ref: '#/components/schemas/SanctionedPost' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Conflict (STRENGTH_INCONSISTENT, QUOTA_SPLIT_INVALID).
