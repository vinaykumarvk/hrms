  # ==========================================================================
  /analytics/models:
    post:
      tags: [Prediction Models]
      summary: Register a prediction model (deterministic or probabilistic)
      description: >
        Deterministic models (e.g. retirement) ship in Phase 1. Probabilistic
        models (attrition/succession) must carry a model card, methodology and
        excluded protected features, and require a fairness assessment before
        activation.
      operationId: registerModel
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PredictionModelCreate' }
      responses:
        <<: *writeErrors
        "201":
          description: >
            Model registered (DRAFT). 422 ERR-G14-METHODOLOGY if methodology is
            missing; 422 ERR-G14-FAIRNESS if a probabilistic model lacks a
            fairness assessment / model card.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PredictionModel' }
    get:
      tags: [Prediction Models]
      summary: List prediction models
      operationId: listModels
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: determinism
          in: query
          schema: { type: string, enum: [DETERMINISTIC, PROBABILISTIC] }
      responses:
        <<: *readErrors
        "200":
          description: Page of models.
          headers: *corrHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PredictionModelPage' }

