        posts the SR event. This returns the observed posting status per statutory item.
      operationId: getSrStatus
      responses:
        '200':
          description: SR posting status per item.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  changeRequestId:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SrItemStatus'
