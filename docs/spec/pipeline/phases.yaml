# HRMS build pipeline manifest — consumed by run.sh (the external driver).
# Per the council verdict (doc/evaluations/autonomous-master-goal-loop-council-report-20260701.md):
#   - the driver automates SEQUENCING; exit_criteria is verified OUTSIDE the model; gates are hard stops.
#   - one fresh session per phase; resumable; hard-stop on red.
#   - default is now agentic gate (`gate:auto`) when a real external check exists.
#   - use `gate:human` only for critical decisions listed in `gate_policy.human_required_when`.
#
# Fields per phase:
#   id            : stable id (also the state/approval key)
#   name          : human label
#   prompt        : the /goal prompt file fed to a fresh agent session
#   exit_criteria : a shell command that returns 0 (GREEN) / non-zero (RED), run by the driver, NOT the agent.
#                   If a phase's success cannot be expressed as a command yet, leave it as the `false` placeholder
#                   and set gate: human — the driver will always park for human verification.
#   gate          : auto  -> advance automatically when exit_criteria is GREEN
#                   human -> after GREEN, PARK and wait for approvals/<id>.approved before advancing
#   depends_on    : ids that must be `done` first

version: 1
defaults:
  phase_timeout_seconds: 3600        # per-phase wall-clock cap (blast-radius limiter)
  branch_required: true              # driver refuses to --execute on main
  default_gate: auto                  # agentic gate: GREEN external oracle auto-advances

gate_policy:
  model: agentic_by_default
  agentic_gate_means:
    - The phase has a real exit_criteria command.
    - The command runs outside the model and exits GREEN.
    - The phase manifest records structural evidence.
    - No critical-decision trigger fires.
  human_required_when:
    - Architecture strategy changes: monorepo/modulith/service extraction/rebuild decisions beyond the approved plan.
    - A phase requires copying, extracting, distributing, or productizing code whose legal/provenance/IP status is unclear.
    - Destructive or irreversible database/data migration operations are required.
    - Security/auth/RBAC/data-isolation policy is weakened or materially changed.
    - Production/UAT/go-live/cutover or rollback approval is required.
    - A phase cannot express success as executable checks and only has prose evidence.
    - A formal gate remains RED after repair and needs an explicit risk acceptance.

