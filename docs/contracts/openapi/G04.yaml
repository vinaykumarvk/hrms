                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditChainNode' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /lsr/audit/export:
    post:
      tags: [Audit & Evidence]
      operationId: exportEvidencePack
      summary: Generate a signed, checksummed evidence pack (P05 Audit.export)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeId]
              properties:
                employeeId: { type: string, format: uuid }
                leaveSpellLineageId: { type: string, format: uuid }
                fromDate: { type: string, format: date }
                toDate: { type: string, format: date }
      responses:
        '202':
          description: Evidence pack export accepted.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidencePack' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # FR-16 — Port conformance
  # ---------------------------------------------------------------------------
  /lsr/port/conformance/runs:
    get:
      tags: [Port Conformance]
      operationId: listConformanceRuns
      summary: List G12 port conformance runs (cursor)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - name: result
          in: query
          schema: { $ref: '#/components/schemas/ConformanceResult' }
      responses:
        '200':
          description: Page of conformance runs.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ConformanceRun' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
    post:
      tags: [Port Conformance]
      operationId: triggerConformanceRun
      summary: Trigger a G12 port conformance run (CI / Sys Admin)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contractVersion]
              properties:
                contractVersion: { type: string, maxLength: 32 }
      responses:
        '202':
          description: Conformance run accepted.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConformanceRun' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /lsr/port/conformance/runs/{conformanceId}:
    parameters:
      - $ref: '#/components/parameters/ConformanceId'
    get:
      tags: [Port Conformance]
      operationId: getConformanceRun
      summary: Conformance run result detail + checksum
      responses:
        '200':
          description: Conformance run detail.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConformanceRun' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # FR-17 — Capture integrity
  # ---------------------------------------------------------------------------
  /lsr/integrity/runs:
    post:
      tags: [Capture Integrity]
      operationId: triggerIntegrityRun
      summary: Trigger a source-ledger <-> outbox integrity reconciliation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scope: { $ref: '#/components/schemas/ReconScope' }
      responses:
        '202':
          description: Integrity run accepted.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationRun' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: '`ERR-G04-SCOPE-TOO-LARGE` or validation failure.'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /lsr/integrity/findings:
    get:
      tags: [Capture Integrity]
      operationId: listIntegrityFindings
      summary: List capture-integrity findings (cursor)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - name: findingType
          in: query
          schema: { $ref: '#/components/schemas/IntegrityFindingType' }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/IntegrityState' }
        - name: severity
          in: query
          schema: { $ref: '#/components/schemas/Severity' }
      responses:
        '200':
          description: Page of integrity findings.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/IntegrityFinding' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # FR-18 — Pre-pension certificate
  # ---------------------------------------------------------------------------
  /lsr/prepension/certificates:
    get:
      tags: [Pre-pension Certificate]
      operationId: listPrepensionCertificates
      summary: Retrieve pre-pension certificates (G11 retrieves latest)
      parameters:
        - name: employeeId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of certificates for the employee.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PrepensionCertificate' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
    post:
      tags: [Pre-pension Certificate]
      operationId: generatePrepensionCertificate
      summary: Generate a certificate from a PRE_PENSION reconciliation run
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeId, runId]
              properties:
                employeeId: { type: string, format: uuid }
                runId: { type: string, format: uuid }
      responses:
        '201':
          description: Certificate generated (PASS or FAIL).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrepensionCertificate' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422':
          description: '`ERR-G04-CERTIFICATE-FAILED` — blocking items remain.'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /lsr/prepension/certificates/{certificateId}/sign:
    parameters:
      - $ref: '#/components/parameters/CertificateId'
    post:
      tags: [Pre-pension Certificate]
      operationId: signPrepensionCertificate
      summary: SR Custodian signs a PASS certificate (P01)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Certificate signed.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrepensionCertificate' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412':
          description: '`ERR-G04-CERTIFICATE-FAILED` — cannot sign a FAIL certificate.'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

# =============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        OIDC/SSO (+MFA for high-privilege statutory roles) bearer token carrying
        resolved roles + tenant/entity scope; permissions resolved per request by
        P02 `Authorization.check`.

  headers:
    XCorrelationId:
      description: Correlation id echoed on every response and written to every P05 audit/log line.
      schema: { type: string }

  parameters:
    Limit:
      name: limit
      in: query
      description: Page size (default 25, max 100).
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous response's next_cursor.
      schema: { type: string }
    Sort:
      name: sort
      in: query
      description: 'Sort spec, e.g. field:asc|desc.'
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Idempotency key for unsafe POSTs; a repeat within 24h returns the original result.
      schema: { type: string, maxLength: 255 }
    MappingId:
      name: mappingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DlqId:
      name: dlqId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FindingId:
      name: findingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BatchId:
      name: batchId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RecordId:
      name: recordId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AlertId:
      name: alertId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConformanceId:
      name: conformanceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CertificateId:
      name: certificateId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    ValidationFailed:
      description: 422 — input failed a VAL-* rule (`VALIDATION_FAILED` / `ERR-G04-*`).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: 401 — no/invalid session (`UNAUTHENTICATED`).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 403 — authenticated but not permitted (`FORBIDDEN`); never leaks out-of-scope records.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 404 — resource absent or out of scope (`NOT_FOUND`).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 409 — idempotency replay / duplicate / state conflict (`CONFLICT`).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionFailed:
      description: 412 — a required precondition is not met (`PRECONDITION_FAILED`).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: 429 — rate limit exceeded (`RATE_LIMITED`).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Internal:
      description: 500 — unexpected server error, or non-retryable upstream failure (`INTERNAL` / `ERR-LOADFAIL`).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    # ---- Canonical error envelope (Foundation §4.1) ----
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: >-
                One of the 8 platform status codes (VALIDATION_FAILED,
                UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT,
                PRECONDITION_FAILED, RATE_LIMITED, INTERNAL) OR a module/domain
                code carried in this field (e.g. ERR-G04-SR-CONFLICT,
                SR_FACT_KEY_REQUIRED).
            message: { type: string }
            field:
              type: [string, "null"]
              description: Offending field for validation errors.
            details:
              type: [object, "null"]
              description: 'Structured discriminators, e.g. { reason, lineage, seq }.'
              additionalProperties: true

    NextCursor:
      type: [string, "null"]
      description: Opaque cursor for the next page; null when no further pages.

    # ---- Shared enums ----
    OutboxEventType:
      type: string
      enum: [LEAVE_APPROVED, LEAVE_CANCELLED, LEAVE_AMENDED]
    OutboxStatus:
      type: string
      enum: [PENDING, BLOCKED_AWAITING_ORIGINAL, IN_FLIGHT, POSTED, FAILED, DEAD_LETTERED, EXCLUDED]
    MappingDisposition:
      type: string
      enum: [POST_SR, EXCLUDED_NON_SR]
    QualifyingServiceRule:
      type: string
      enum: [QUALIFYING, NON_QUALIFYING, PARTIAL, RULE_REF]
    StraddleHandling:
      type: string
      enum: [SPLIT_BY_EFFECTIVE, PIN_TO_SPELL_START]
    MappingStatus:
      type: string
      enum: [DRAFT, PUBLISHED, RETIRED]
    MappingEventType:
      type: string
      enum: [APPROVED, CANCELLED, AMENDED]
    PostingOutcome:
      type: string
      enum: [SUCCESS, RETRYABLE_FAILURE, PERMANENT_FAILURE, DUPLICATE_NOOP]
    DlqFailureClass:
      type: string
      enum: [MAPPING_MISSING, VALIDATION_REJECT, UPSTREAM_DOWN, DATA_CONFLICT, SIGNATURE_INVALID, UNKNOWN]
    DlqState:
      type: string
      enum: [OPEN, IN_REVIEW, RESOLVED_REPLAYED, RESOLVED_DISCARDED]
    ReconRunType:
      type: string
      enum: [SCHEDULED, ON_DEMAND, PRE_PENSION, SOURCE_OUTBOX_INTEGRITY]
    ReconRunStatus:
      type: string
      enum: [RUNNING, COMPLETED, FAILED]
    ReconFindingType:
      type: string
      enum: [MISSING_SR, DUPLICATE_SR, DIVERGENT_FIELD, ORPHAN_CORRECTION, UNMAPPED_LEAVE, CORRECTION_WITHOUT_LINK]
    Severity:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    RemediationState:
      type: string
      enum: [OPEN, REMEDIATION_PROPOSED, APPROVED, APPLIED, WAIVED]
    CorrectionType:
      type: string
      enum: [REVERSAL, AMENDMENT, SUPERSEDE]
    CorrectionReasonCode:
      type: string
      enum: [LEAVE_CANCELLED, LEAVE_AMENDED, RECON_FIX, MIGRATION_FIX]
    BatchSourceType:
      type: string
      enum: [PAPER_SCAN, LEGACY_SYSTEM, SPREADSHEET]
    BatchStatus:
      type: string
      enum: [STAGED, VALIDATED, APPROVED, POSTED, PARTIALLY_POSTED, REJECTED]
    HistValidationState:
      type: string
      enum: [PENDING, VALID, REJECTED]
    HistConfidence:
      type: string
      enum: [HIGH, MEDIUM, LOW]
    HistAdjudicationState:
      type: string
      enum: [PROVISIONAL, ADJUDICATED_CONFIRMED, ADJUDICATED_REJECTED]
    ConformanceResult:
      type: string
      enum: [PASS, FAIL]
    IntegrityFindingType:
      type: string
      enum: [LEDGER_WITHOUT_OUTBOX, OUTBOX_WITHOUT_LEDGER, SIGNATURE_MISMATCH]
    IntegrityState:
      type: string
      enum: [OPEN, BACKFILLED, WAIVED]
    SrEventTypeCode:
      type: string
      description: G12-published G04 event codes (forward + *_CANCELLED reversal partners).
      enum:
        - EL_AVAILED
        - HPL_AVAILED
        - COMMUTED_LEAVE
        - STUDY_LEAVE
        - MATERNITY_LEAVE
        - LWP_SPELL
        - EOL_SPELL
        - EL_AVAILED_CANCELLED
        - HPL_AVAILED_CANCELLED
        - COMMUTED_LEAVE_CANCELLED
        - STUDY_LEAVE_CANCELLED
        - MATERNITY_LEAVE_CANCELLED
        - LWP_SPELL_CANCELLED
        - EOL_SPELL_CANCELLED

    # ---- Common value objects ----
    SpellWindow:
      type: object
      required: [start, end, days]
      properties:
        start: { type: string, format: date }
        end: { type: string, format: date }
        days: { type: number, format: float }
    ReconScope:
      type: object
      description: Bounded reconciliation/replay scope; oversized scope -> ERR-G04-SCOPE-TOO-LARGE.
      properties:
        orgUnitId: { type: string, format: uuid }
        employeeIds:
          type: array
          items: { type: string, format: uuid }
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date }

    # ---- E8 leave_event_outbox ----
    OutboxEvent:
      type: object
      properties:
        outboxId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        entityId: { type: [string, "null"], format: uuid }
        correlationId: { type: string, format: uuid }
        leaveSpellLineageId: { type: string, format: uuid }
        eventSequence: { type: integer }
        employeeId: { type: string, format: uuid }
        partitionKey: { type: string }
        leaveLedgerEntryId: { type: string, format: uuid }
        eventType: { $ref: '#/components/schemas/OutboxEventType' }
        leaveTypeCode: { type: string }
        spellStart: { type: string, format: date }
        spellEnd: { type: string, format: date }
        daysCount: { type: number, format: float }
        priorOutboxId: { type: [string, "null"], format: uuid }
        dedupeKey: { type: [string, "null"] }
        pinnedMappingVersion: { type: [integer, "null"] }
        status: { $ref: '#/components/schemas/OutboxStatus' }
        claimedAt: { type: [string, "null"], format: date-time }
        leaseExpiresAt: { type: [string, "null"], format: date-time }
        availableAt: { type: string, format: date-time }
        attemptCount: { type: integer }
        createdAt: { type: string, format: date-time }

    # ---- E9 sr_event_mapping ----
    EventMapping:
      allOf:
        - $ref: '#/components/schemas/EventMappingWrite'
        - type: object
          properties:
            mappingId: { type: string, format: uuid }
            mappingVersion: { type: integer }
            status: { $ref: '#/components/schemas/MappingStatus' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    EventMappingWrite:
      type: object
      required: [leaveTypeCode, eventType, disposition, straddleHandling, effectiveFrom]
      properties:
        leaveTypeCode: { type: string, maxLength: 32 }
        eventType: { $ref: '#/components/schemas/MappingEventType' }
        spellPredicate:
          type: [object, "null"]
          additionalProperties: true
          description: 'e.g. { daysCount_gte: 120 } => LONG_LEAVE.'
        disposition: { $ref: '#/components/schemas/MappingDisposition' }
        srEntryType:
          description: Target G12-published event code; null when EXCLUDED_NON_SR.
          anyOf:
            - $ref: '#/components/schemas/SrEventTypeCode'
            - type: "null"
        qualifyingServiceRule:
          anyOf:
            - $ref: '#/components/schemas/QualifyingServiceRule'
            - type: "null"
        qualifyingRuleRef: { type: [string, "null"], maxLength: 64 }
        statutoryRuleRef:
          type: [string, "null"]
          maxLength: 120
          description: Citation; NOT NULL for POST_SR (VAL-G04-CITATION).
        straddleHandling: { $ref: '#/components/schemas/StraddleHandling' }
        annotationTemplate: { type: [string, "null"] }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, "null"], format: date }

    # ---- E10 sr_posting_log ----
    PostingLogEntry:
      type: object
      properties:
        postingId: { type: string, format: uuid }
        outboxId: { type: string, format: uuid }
        correlationId: { type: string, format: uuid }
        leaveSpellLineageId: { type: string, format: uuid }
        eventSequence: { type: integer }
        sourceModule: { type: string, example: "G04" }
        sourceReferenceId: { type: string }
        sourceEventVersion: { type: integer }
        factKey: { type: string }
        dedupeKey: { type: string }
        mappingId: { type: string, format: uuid }
        srEventId: { type: [string, "null"] }
        srEntryType: { $ref: '#/components/schemas/SrEventTypeCode' }
        attemptNo: { type: integer }
        outcome: { $ref: '#/components/schemas/PostingOutcome' }
        httpStatus: { type: [integer, "null"] }
        errorCode: { type: [string, "null"] }
        errorDetail: { type: [string, "null"] }
        latencyMs: { type: [integer, "null"] }
        postedAt: { type: string, format: date-time }
        postedBy: { type: string }

    # ---- G12 canonical ingest port schemas ----
    SrIngestRequest:
      type: object
      required:
        - tenantId
        - employeeId
        - sourceModule
        - sourceReferenceId
        - sourceEventVersion
        - factKey
        - leaveSpellLineageId
        - eventTypeCode
        - correlationId
      properties:
        tenantId: { type: string }
        entityId: { type: string }
        employeeId: { type: string }
        sourceModule:
          type: string
          const: "G04"
          description: Canonical dedup-tuple member; G04 always sends "G04".
        sourceReferenceId:
          type: string
          description: 'Canonical dedup-tuple member — {leaveSpellLineageId}:{eventType}.'
        sourceEventVersion:
          type: integer
          description: Canonical dedup-tuple member — equals eventSequence (monotonic per lineage).
        factKey:
          type: string
          description: >-
            Mandatory semantic dedup field derived per the type's fact_correlation_rule;
            missing -> SR_FACT_KEY_REQUIRED.
        leaveSpellLineageId:
          type: string
          description: G03 business correlation key; persisted + indexed on the SR entry (>=7y).
        eventSequence: { type: integer }
        eventTypeCode: { $ref: '#/components/schemas/SrEventTypeCode' }
        correlationId: { type: string }
        spell: { $ref: '#/components/schemas/SpellWindow' }
        qualifyingServiceRule: { $ref: '#/components/schemas/QualifyingServiceRule' }
        statutoryRuleRef: { type: string, maxLength: 120 }
        annotations:
          type: array
          items:
            type: object
            additionalProperties: true
        isReversal:
          type: boolean
          default: false
        reversesSourceReferenceId:
          type: [string, "null"]
          description: Original spell's sourceReferenceId when this is a reversal.
        provenance:
          type: object
          properties:
            type: { type: string, enum: [LIVE_CAPTURE, HISTORICAL, REPLAY, BACKFILL] }
            mappingVersion: { type: integer }
            payloadVersion: { type: string }
    SrIngestReversalRequest:
      allOf:
        - $ref: '#/components/schemas/SrIngestRequest'
        - type: object
          required: [isReversal, reversesSourceReferenceId]
          properties:
            isReversal:
              type: boolean
              const: true
            reversesSourceReferenceId:
              type: string
              description: Original spell's sourceReferenceId being superseded.
    SrIngestResult:
      type: object
      required: [srEventId, status]
      properties:
        srEventId: { type: string }
        status: { type: string, enum: [CREATED] }
    SrIngestDuplicate:
      type: object
      required: [srEventId, status]
      properties:
        srEventId: { type: string }
        status: { type: string, enum: [DUPLICATE_NOOP] }
        code: { type: string, example: "ERR-G04-IDEMPOTENT-DUPLICATE" }

    # ---- E11 sr_dead_letter ----
    DeadLetter:
      type: object
      properties:
        dlqId: { type: string, format: uuid }
        outboxId: { type: string, format: uuid }
        correlationId: { type: string, format: uuid }
        leaveSpellLineageId: { type: string, format: uuid }
        failureClass: { $ref: '#/components/schemas/DlqFailureClass' }
        lastErrorCode: { type: string }
        lastErrorDetail: { type: [string, "null"] }
        attemptsExhausted: { type: integer }
        state: { $ref: '#/components/schemas/DlqState' }
        assignedTo: { type: [string, "null"], format: uuid }
        resolutionWorkflowId: { type: [string, "null"], format: uuid }
        resolutionNote: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ---- E12 reconciliation_run ----
    ReconciliationRunRequest:
      type: object
      required: [runType]
      properties:
        runType: { $ref: '#/components/schemas/ReconRunType' }
        scope: { $ref: '#/components/schemas/ReconScope' }
    ReconciliationRun:
      type: object
      properties:
        runId: { type: string, format: uuid }
        runType: { $ref: '#/components/schemas/ReconRunType' }
        scope:
          type: [object, "null"]
          additionalProperties: true
        leaveRecordsExamined: { type: integer }
        srEntriesExamined: { type: integer }
        pendingExcludedCount: { type: integer }
        findingsCount: { type: integer }
        status: { $ref: '#/components/schemas/ReconRunStatus' }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        triggeredBy: { type: [string, "null"], format: uuid }

    # ---- E13 reconciliation_finding ----
    ReconciliationFinding:
      type: object
      properties:
        findingId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        correlationId: { type: [string, "null"], format: uuid }
        leaveSpellLineageId: { type: [string, "null"], format: uuid }
        findingType: { $ref: '#/components/schemas/ReconFindingType' }
        severity: { $ref: '#/components/schemas/Severity' }
        leaveSnapshot:
          type: [object, "null"]
          additionalProperties: true
        srSnapshot:
          type: [object, "null"]
          additionalProperties: true
        divergentFields:
          type: [object, "null"]
          additionalProperties: true
        remediationState: { $ref: '#/components/schemas/RemediationState' }
        remediationWorkflowId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ---- E14 sr_correction_link ----
    CorrectionLink:
      type: object
      properties:
        linkId: { type: string, format: uuid }
        originalSrEventId: { type: string }
        correctingSrEventId: { type: string }
        leaveSpellLineageId: { type: string, format: uuid }
        correctionType: { $ref: '#/components/schemas/CorrectionType' }
        reasonCode: { $ref: '#/components/schemas/CorrectionReasonCode' }
        correlationId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }

    # ---- E15 historical_leave_batch ----
    HistoricalBatchWrite:
      type: object
      required: [batchLabel, sourceType]
      properties:
        batchLabel: { type: string, maxLength: 120 }
        sourceType: { $ref: '#/components/schemas/BatchSourceType' }
        sourceDocumentId: { type: [string, "null"], format: uuid }
        migrationRunId: { type: [string, "null"], format: uuid }
        records:
          type: array
          description: Staged legacy leave records (optional at create; may be loaded via P06).
          items: { $ref: '#/components/schemas/HistoricalRecordWrite' }
    HistoricalBatch:
      type: object
      properties:
        batchId: { type: string, format: uuid }
        batchLabel: { type: string }
        sourceType: { $ref: '#/components/schemas/BatchSourceType' }
        sourceDocumentId: { type: [string, "null"], format: uuid }
        migrationRunId: { type: [string, "null"], format: uuid }
        recordsTotal: { type: integer }
        recordsValid: { type: integer }
        recordsRejected: { type: integer }
        status: { $ref: '#/components/schemas/BatchStatus' }
        approvalWorkflowId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ---- E16 historical_leave_record ----
    HistoricalRecordWrite:
      type: object
      required: [govSourceId, serviceNoRaw, leaveTypeCode, spellStart, spellEnd, daysCount]
      properties:
        govSourceId: { type: string, maxLength: 64 }
        serviceNoRaw: { type: string, maxLength: 64 }
        leaveTypeCode: { type: string, maxLength: 32 }
        spellStart: { type: string, format: date }
        spellEnd: { type: string, format: date }
        daysCount: { type: number, format: float }
        statutoryRuleRef: { type: [string, "null"], maxLength: 120 }
    HistoricalRecord:
      type: object
      properties:
        recordId: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        employeeId: { type: [string, "null"], format: uuid }
        leaveSpellLineageId: { type: [string, "null"], format: uuid }
        govSourceId: { type: string }
        serviceNoRaw: { type: string }
        leaveTypeCode: { type: string }
        spellStart: { type: string, format: date }
        spellEnd: { type: string, format: date }
        daysCount: { type: number, format: float }
        qualifyingFlag:
          anyOf:
            - $ref: '#/components/schemas/QualifyingServiceRule'
            - type: "null"
        statutoryRuleRef: { type: [string, "null"] }
        confidence: { $ref: '#/components/schemas/HistConfidence' }
        adjudicationState: { $ref: '#/components/schemas/HistAdjudicationState' }
        validationState: { $ref: '#/components/schemas/HistValidationState' }
        rejectReason: { type: [string, "null"] }
        postedSrEventId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    # ---- E17 integration_config ----
    IntegrationConfigWrite:
      type: object
      required: [key, value, effectiveFrom]
      properties:
        key:
          type: string
          enum:
            - max_retries
            - backoff_base_ms
            - lease_timeout_ms
            - reaper_interval_ms
            - posting_sla_minutes
            - x3_breaker_threshold
            - live_posting_gate
        value:
          description: JSON value appropriate to the key.
          oneOf:
            - type: string
            - type: integer
            - type: boolean
            - type: object
              additionalProperties: true
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: [string, "null"], format: date-time }
    IntegrationConfig:
      allOf:
        - $ref: '#/components/schemas/IntegrationConfigWrite'
        - type: object
          properties:
            configId: { type: string, format: uuid }
            updatedBy: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    RelayState:
      type: object
      properties:
        state: { type: string, enum: [RUNNING, PAUSED] }
        reason: { type: [string, "null"] }
        changedBy: { type: string }
        changedAt: { type: string, format: date-time }

    # ---- E19 port_conformance_run ----
    ConformanceRun:
      type: object
      properties:
        conformanceId: { type: string, format: uuid }
        contractVersion: { type: string }
        dedupeRetentionDays:
          type: integer
          description: Must be >= 2557 (~7y) to PASS the gate.
        indexesVerified:
          type: object
          additionalProperties: { type: boolean }
        appendOnlyVerified: { type: boolean }
        dedupeReplayVerified: { type: boolean }
        result: { $ref: '#/components/schemas/ConformanceResult' }
        blocking: { type: [string, "null"] }
        evidenceChecksum: { type: string }
        runAt: { type: string, format: date-time }
        runBy: { type: string }

    # ---- E20 capture_integrity_finding ----
    IntegrityFinding:
      type: object
      properties:
        integrityId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        leaveLedgerEntryId: { type: [string, "null"], format: uuid }
        leaveSpellLineageId: { type: [string, "null"], format: uuid }
        findingType: { $ref: '#/components/schemas/IntegrityFindingType' }
        severity: { $ref: '#/components/schemas/Severity' }
        state: { $ref: '#/components/schemas/IntegrityState' }
        detail:
          type: [object, "null"]
          additionalProperties: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ---- E21 prepension_certificate ----
    PrepensionCertificate:
      type: object
      properties:
        certificateId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        openHighCriticalFindings: { type: integer }
        totalNonQualifyingDays: { type: number, format: float }
        lineageComplete: { type: boolean }
        provisionalEntriesRemaining: { type: integer }
        result: { $ref: '#/components/schemas/ConformanceResult' }
        checksum: { type: string }
        signedBy: { type: [string, "null"], format: uuid }
        signedAt: { type: [string, "null"], format: date-time }
        consumedByG11At: { type: [string, "null"], format: date-time }

    # ---- FR-09 qualifying impact ----
    QualifyingImpact:
      type: object
      properties:
        employeeId: { type: string, format: uuid }
        totalNonQualifyingDays: { type: number, format: float }
        spells:
          type: array
          items:
            type: object
            properties:
              leaveSpellLineageId: { type: string, format: uuid }
              leaveTypeCode: { type: string }
              qualifyingServiceRule: { $ref: '#/components/schemas/QualifyingServiceRule' }
              nonQualifyingDays: { type: number, format: float }
              statutoryRuleRef: { type: [string, "null"] }
              spell: { $ref: '#/components/schemas/SpellWindow' }

    # ---- FR-10 annotations ----
    StatutoryAnnotation:
      type: object
      properties:
        annotationId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        leaveSpellLineageId: { type: string, format: uuid }
        srEventId: { type: string }
        annotationType:
          type: string
          enum: [INCREMENT_DEFERRAL, SENIORITY_EFFECT, PROBATION_EXTENSION]
        text: { type: string }
        statutoryRuleRef: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    # ---- FR-12 replay/backfill ----
    ReplayRequest:
      type: object
      properties:
        dryRun: { type: boolean, default: true }
        scope: { $ref: '#/components/schemas/ReconScope' }
        leaveSpellLineageId: { type: string, format: uuid }
    ReplayResult:
      type: object
      properties:
        replayId: { type: string, format: uuid }
        dryRun: { type: boolean }
        candidateCount: { type: integer }
        status: { type: string, enum: [PLANNED, ACCEPTED, RUNNING, COMPLETED] }

    # ---- FR-13 monitoring ----
    DashboardSummary:
      type: object
      properties:
        p95PostingLagSeconds: { type: number, format: float }
        outboxPending: { type: integer }
        inFlight: { type: integer }
        strandedInFlight: { type: integer }
        dlqDepth: { type: integer }
        openReconFindings: { type: integer }
        openHighCriticalFindings: { type: integer }
        breakerState: { type: string, enum: [CLOSED, OPEN, HALF_OPEN] }
        livePostingGate: { type: string, enum: [open, closed] }
        latestConformanceResult: { $ref: '#/components/schemas/ConformanceResult' }
    MetricSeries:
      type: object
      properties:
        metric: { type: string }
        points:
          type: array
          items:
            type: object
            properties:
              t: { type: string, format: date-time }
              v: { type: number, format: float }
    AlertAck:
      type: object
      properties:
        alertId: { type: string, format: uuid }
        acknowledgedBy: { type: string, format: uuid }
        acknowledgedAt: { type: string, format: date-time }

    # ---- FR-14 audit ----
    AuditChainNode:
      type: object
      properties:
        leaveSpellLineageId: { type: string, format: uuid }
        eventSequence: { type: integer }
        stage: { type: string, enum: [CAPTURE, POST, CORRECTION, RECON, MIGRATION] }
        srEventId: { type: [string, "null"] }
        correlationId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        detail:
          type: [object, "null"]
          additionalProperties: true
    EvidencePack:
      type: object
      properties:
        exportId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        checksum: { type: string }
        status: { type: string, enum: [ACCEPTED, GENERATING, READY] }
        documentRef: { type: [string, "null"] }

    # ---- Workflow start (P01) ----
    WorkflowStarted:
      type: object
      properties:
        instanceId: { type: string, format: uuid }
        firstStage: { type: string }
        assignees:
          type: array
          items: { type: string, format: uuid }
        status: { type: string, enum: [STARTED, IN_PROGRESS] }
