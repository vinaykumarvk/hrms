      tags: [letter-generation]
      summary: Create a letter-generation request (enqueue)
      description: >
        Enqueues a per-letter generation request on `DocumentGen` (`letter_generation_requests`,
        status DRAFT). RECON v3.2. FR-G13-010.
      operationId: createLetterGenerationRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LetterGenerationRequestInput' }
      responses:
        '201':
          description: Request enqueued.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LetterGenerationRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
