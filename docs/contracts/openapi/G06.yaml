          content:
            application/json:
              schema:
                type: object
                properties:
                  sanctioned_post_id: { type: string, format: uuid }
                  sanctioned_strength: { type: integer }
                  filled_count: { type: integer }
                  current_vacancies: { type: integer }
                  anticipated_vacancies: { type: integer }
                  carried_forward_vacancies: { type: integer }
                  promotion_quota_vacancies: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
