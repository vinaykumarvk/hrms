openapi: 3.1.0
info:
  title: Government HRMS — G06 Promotion, Posting & Progression Monitoring
  version: 3.0.0
  description: >-
    OpenAPI contract for module G06 (Promotion / Posting / Progression). Grounded
    in docs/brd/v3/G06-promotion-posting-progression.md (Sections 5, 6, 9),
    docs/contracts/error-taxonomy.yaml (G06 bare-domain codes carried in
    error.code, mostly 409 CONFLICT), and docs/brd/PLATFORM_FOUNDATION.md §4.
    Conventions adopted verbatim from the platform: /api/v1 base path, JWT
    bearerAuth, X-Correlation-Id response header, Idempotency-Key on unsafe
    transaction-creating POSTs (24h replay), cursor pagination (limit default 25
    / max 100 + cursor -> next_cursor). All SR establishment events
    (PROMOTION / OFFICIATING / MACP / CONFIRMATION / POSTING / REVERSION) relay
    to the canonical G12 write-port POST /api/v1/sr/ingest (reversals via
    /sr/ingest/reversal), deduped on the tuple
    (source_module="G06", source_reference_id, source_event_version) with a
    mandatory fact_key + explicit tenant_id/entity_id. The pay-fixation SR event
    (PAY_FIXATION / ANNUAL_INCREMENT) is G10's, not G06's.
  x-ph08-statutory-wave:
    implementedRoutes:
      - POST /api/v1/promotions/seniority-lists
      - POST /api/v1/promotions/cases
      - POST /api/v1/promotions/cases/{id}:hold-dpc
      - POST /api/v1/promotions/orders/{id}:effect
      - POST /api/v1/promotions/macp
    statutoryScope: seniority, DPC, promotion orders, MACP, SR posting
    srWriter: G06
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Seniority
    description: Seniority lists, entries, objections, multi-stream construction.
  - name: Eligibility
    description: Eligibility rule engine and assessments.
  - name: Promotion Cases
    description: Promotion case creation, field assembly, candidates.
  - name: DPC & Panels
    description: DPC / promotion panels and proceedings.
  - name: Reservation Roster
    description: Reservation rosters, points, compliance.
  - name: Orders
    description: Promotion order generation, acceptance, refusal, SR posting.
  - name: Sealed Cover
    description: Sealed-cover handling and review DPC.
  - name: Probation
    description: Probation lifecycle on promotion.
  - name: Officiating
    description: Ad-hoc / officiating / in-situ arrangements.
  - name: Financial Upgradation
    description: ACP/MACP screening and sanction.
  - name: Postings
    description: Posting after promotion.
  - name: Progression
    description: Progression monitoring alerts and timeline.
  - name: Career & Succession
    description: Advisory career-path modelling and succession planning.
  - name: Establishment
    description: Sanctioned posts and vacancy computation.
  - name: Qualifying Service
    description: Qualifying-service ledger and exclusion rules.
  - name: Legal
    description: Legal-case linkage and sub-judice handling.
  - name: Corrections
    description: Correction lineage and retrospective recompute cascade.
  - name: Refusals
    description: Refusal-of-promotion consequence management.
  - name: SR Ingest
    description: Canonical G12 SR ledger write-port (facade relay from G06).

paths:
  # ---------------------------------------------------------------------------
  # FR-PPP-001 — Seniority list generation
  # ---------------------------------------------------------------------------
  /seniority-lists:
    post:
      tags: [Seniority]
      operationId: createSeniorityList
      summary: Create a cadre-wise seniority list and auto-generate entries.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeniorityListCreate'
      responses:
        '201':
          description: List created with generated entries.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeniorityList' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /seniority-lists/{id}:
    get:
      tags: [Seniority]
      operationId: getSeniorityList
      summary: Fetch a seniority list with its entries (cursor paginated).
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Seniority list with a page of entries.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SeniorityList'
                  - type: object
                    properties:
                      entries:
                        type: array
                        items: { $ref: '#/components/schemas/SeniorityEntry' }
                      next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /seniority-lists/{id}/entries/{entryId}:
    patch:
      tags: [Seniority]
      operationId: overrideSeniorityEntryRank
      summary: Manual rank override on a seniority entry (audited by P05).
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/EntryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rank_position, reason]
              properties:
                rank_position: { type: integer, minimum: 1 }
                reckoning_basis: { $ref: '#/components/schemas/ReckoningBasis' }
                tiebreak_value: { type: [string, "null"] }
                reason: { type: string, description: Mandatory reason (VAL-COMMENT / ERR-REASON-REQ). }
      responses:
        '200':
          description: Entry updated.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeniorityEntry' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # FR-PPP-002 — Publication, objections & finalisation
  # ---------------------------------------------------------------------------
  /seniority-lists/{id}/publish:
    post:
      tags: [Seniority]
      operationId: publishSeniorityList
      summary: Publish a tentative seniority list (P01 checker).
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objection_window_start, objection_window_end]
              properties:
                objection_window_start: { type: string, format: date }
                objection_window_end: { type: string, format: date }
      responses:
        '200':
          description: List published tentative; objection window open.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeniorityList' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /seniority-lists/{id}/objections:
    post:
      tags: [Seniority]
      operationId: fileSeniorityObjection
      summary: File an objection against a published seniority list.
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectionCreate'
      responses:
        '201':
          description: Objection filed.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Objection' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /objections/{id}/dispose:
    post:
      tags: [Seniority]
      operationId: disposeObjection
      summary: Dispose (uphold / reject / partially uphold) a seniority objection.
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disposal, disposal_remarks]
              properties:
                disposal:
                  type: string
                  enum: [UPHELD, REJECTED, PARTIALLY_UPHELD, TIME_BARRED, WITHDRAWN]
                disposal_remarks: { type: string }
                creates_correction_event: { type: boolean, default: false }
      responses:
        '200':
          description: Objection disposed.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Objection' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /seniority-lists/{id}/finalise:
    post:
      tags: [Seniority]
      operationId: finaliseSeniorityList
      summary: Finalise a seniority list (blocked while objections are open).
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: List finalised.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeniorityList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # FR-PPP-020 — Multi-stream inter-se seniority construction
  # ---------------------------------------------------------------------------
  /seniority-quota-rules:
    get:
      tags: [Seniority]
      operationId: listSeniorityQuotaRules
      summary: List rota-quota rules.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page of quota rules.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeniorityQuotaRulePage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Seniority]
      operationId: createSeniorityQuotaRule
      summary: Create a rota-quota rule.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeniorityQuotaRule' }
      responses:
        '201':
          description: Quota rule created.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeniorityQuotaRule' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Seniority]
      operationId: upsertSeniorityQuotaRule
      summary: Update a rota-quota rule version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeniorityQuotaRule' }
      responses:
        '200':
          description: Quota rule updated.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeniorityQuotaRule' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /seniority-lists/{id}/construct-combined:
    post:
      tags: [Seniority]
      operationId: constructCombinedSeniority
      summary: Build the combined multi-stream inter-se order (rota-quota).
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quota_rule_id]
              properties:
                quota_rule_id: { type: string, format: uuid }
      responses:
        '200':
          description: Combined list constructed.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeniorityList' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            Conflict (e.g. STREAM_TAG_MISSING, QUOTA_RULE_INVALID,
            SENIORITY_RANK_CONFLICT).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /seniority-lists/{id}/rotation-trace:
    get:
      tags: [Seniority]
      operationId: getRotationTrace
      summary: Fetch the rotation slot trace for a multi-stream list.
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Rotation slot trace.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  seniority_list_id: { type: string, format: uuid }
                  slots:
                    type: array
                    items:
                      type: object
                      properties:
                        quota_slot_label: { type: string }
                        rotation_cycle_no: { type: integer }
                        recruitment_stream: { $ref: '#/components/schemas/RecruitmentStream' }
                        employee_id: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # FR-PPP-003 — Eligibility rule engine & computation
  # ---------------------------------------------------------------------------
  /promotion-cases/{caseId}/compute-eligibility:
    post:
      tags: [Eligibility]
      operationId: computeEligibility
      summary: Batch-compute eligibility assessments for a case (async; progress).
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Batch computation accepted; assessment excerpt returned.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  caseId: { type: string }
                  assessed: { type: integer }
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/EligibilityAssessment' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /employees/{id}/eligibility:
    get:
      tags: [Eligibility]
      operationId: getEmployeeEligibility
      summary: Fetch a single employee's eligibility assessment (P02 field-masked).
      parameters:
        - $ref: '#/components/parameters/PathId'
        - name: caseId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Eligibility assessment.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EligibilityAssessment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /eligibility-rules:
    get:
      tags: [Eligibility]
      operationId: listEligibilityRules
      summary: List eligibility rules.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page of eligibility rules.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EligibilityRulePage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Eligibility]
      operationId: createEligibilityRule
      summary: Create an eligibility rule.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EligibilityRule' }
      responses:
        '201':
          description: Rule created.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EligibilityRule' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Eligibility]
      operationId: upsertEligibilityRule
      summary: Update an eligibility rule version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EligibilityRule' }
      responses:
        '200':
          description: Rule updated.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EligibilityRule' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # FR-PPP-004 — Promotion case creation & field assembly
  # ---------------------------------------------------------------------------
  /promotion-cases:
    post:
      tags: [Promotion Cases]
      operationId: createPromotionCase
      summary: Create a promotion case (vacancy validated vs sanctioned_posts).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromotionCaseCreate' }
      responses:
        '201':
          description: Case created.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromotionCase' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            Conflict (e.g. VACANCY_NOT_RECONCILED, STRENGTH_INCONSISTENT,
            QUOTA_SPLIT_INVALID, ERR-DUP-INSTANCE).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /promotion-cases/{id}/assemble-field:
    post:
      tags: [Promotion Cases]
      operationId: assembleCandidateField
      summary: Build the eligible-candidate field for a promotion case.
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                zone_extension_factor: { type: number, description: DoPT zone-of-consideration slab factor (Appendix D.1). }
      responses:
        '200':
          description: Field assembled.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  promotion_case_id: { type: string, format: uuid }
                  candidate_count: { type: integer }
                  status: { $ref: '#/components/schemas/PromotionCaseStatus' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Conflict (e.g. NO_ELIGIBLE_CANDIDATES, SENIORITY_LIST_NOT_FINAL).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
