      operationId: getBulkLetterJobStatus
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Job progress (record/processed/failed counts, percent, ETA).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkLetterJob' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # --- Acknowledgement campaigns (create/track) + acknowledgements — FR-G13-012 ---
  /acknowledgement-campaigns:
    post:
      tags: [acknowledgements]
      summary: Create a policy/letter acknowledgement campaign
      description: >
        Creates a sign-off/acknowledgement drive over an audience with cadence, SLA/escalation and
        deadline (`acknowledgement_campaigns`, status DRAFT). RECON v3.2. FR-G13-012.
      operationId: createAcknowledgementCampaign
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcknowledgementCampaignInput' }
      responses:
        '201':
          description: Campaign created.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcknowledgementCampaign' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [acknowledgements]
      summary: List acknowledgement campaigns (cursor-paginated)
      operationId: listAcknowledgementCampaigns
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AckCampaignStatus' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of campaigns.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcknowledgementCampaignPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /acknowledgement-campaigns/{id}:
    get:
      tags: [acknowledgements]
      summary: Get an acknowledgement campaign
      operationId: getAcknowledgementCampaign
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: The campaign.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcknowledgementCampaign' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /acknowledgement-campaigns/{id}:track:
    get:
      tags: [acknowledgements]
      summary: Track campaign progress (rollup counts)
      description: 'Returns assigned/acknowledged/pending/overdue rollups for the drive. RECON v3.2. FR-G13-012.'
      operationId: trackAcknowledgementCampaign
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Campaign progress rollup.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignTrackResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /acknowledgement-campaigns/{id}/acknowledgements:
    get:
      tags: [acknowledgements]
      summary: List per-employee acknowledgements in a campaign
      operationId: listDocumentAcknowledgements
      parameters:
        - $ref: '#/components/parameters/PathId'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AckStatus' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of acknowledgement records.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentAcknowledgementPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [acknowledgements]
      summary: Acknowledge a policy/letter (employee self, in-campaign)
      description: >
        The assigned employee acknowledges the active document version. Captures the non-repudiation
        snapshot (consent-text snapshot, app/browser version, IP, version_no) and transitions the record
        PENDING → ACKNOWLEDGED (`document_acknowledgements`, DM25). Acknowledging another employee's
        assignment ⇒ 403 FORBIDDEN. RECON v3.2. FR-G13-012.
      operationId: acknowledgeDocument
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcknowledgeRequest' }
      responses:
        '201':
          description: Acknowledgement recorded (non-repudiation snapshot captured).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentAcknowledgement' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /document-acknowledgements/{id}:record:
    post:
      tags: [acknowledgements]
      summary: Record/capture a policy acknowledgement (non-repudiation)
      description: >
        Records an acknowledgement against an existing assignment id — captures the write-once
        non-repudiation evidence (consent-text snapshot, app/browser version, IP, active version_no,
        optional `consent_records` linkage) and marks ACKNOWLEDGED (`document_acknowledgements`, DM25).
        Re-record on an already-ACKNOWLEDGED row ⇒ 409 CONFLICT (idempotent, write-once). RECON v3.2. FR-G13-012.
      operationId: recordAcknowledgement
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordAcknowledgementRequest' }
      responses:
        '200':
          description: Acknowledgement recorded.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentAcknowledgement' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Bearer JWT session carrying resolved roles + tenant/entity scope (P02). Never raw
        permissions — resolved per request by `Authorization.check`.

  headers:
    XCorrelationId:
      description: Correlation id echoed on every response and written to the P05 audit line (Foundation §1).
      schema: { type: string }

  parameters:
    DocumentId:
      name: id
      in: path
      required: true
      description: Document id (`documents` — platform-core).
      schema: { type: string, format: uuid }
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentCategoryId:
      name: id
      in: path
      required: true
      description: Document category id (`document_categories`; RECON v3.2).
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      required: false
      description: Page size (default 25, max 100).
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a prior `next_cursor`.
      schema: { type: string }
    Sort:
      name: sort
      in: query
      required: false
      description: '`field:asc|desc`.'
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Idempotency key for unsafe/transaction-initiating POSTs; a repeat within 24h returns the original result.
      schema: { type: string }

  responses:
    Unauthorized:
      description: '`UNAUTHENTICATED` (401) — no/invalid/expired session.'
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: >
        `FORBIDDEN` (403) — not permitted; never leaks existence of out-of-scope records. May carry
        `ERR-G13-SOD_VIOLATION`, `ERR-G13-CLASSIFICATION_LOCKED`, `ERR-G13-CLEARANCE_INSUFFICIENT`,
        `ERR-G13-HOLD_RELEASE_SOD`, `ERR-G13-SHARE_BLOCKED_DLP`, `ERR-G13-SHARE_LIMIT_REACHED`.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: >
        `NOT_FOUND` (404) — absent or out of scope (indistinguishable by design). May carry
        `ERR-G13-DOCUMENT_DISPOSED`.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: >
        `CONFLICT` (409) — idempotency replay / state or uniqueness conflict. May carry
        `ERR-G13-WORM_IMMUTABLE`, `ERR-G13-LEGAL_HOLD_ACTIVE`, `ERR-G13-RETENTION_PERMANENT`,
        `ERR-G13-ANCHOR_UNCONFIRMED`, `ERR-G13-DOCUMENT_LOCKED`, `ERR-G13-CHECKOUT_NOT_SUPPORTED`,
        `ERR-G13-DOCUMENT_NOT_ATTACHABLE`, `ERR-G13-LINK_CONFLICT`, `ERR-G13-ERASURE_EXEMPTED`.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: >
        `VALIDATION_FAILED` (422) — a VAL-* / catalog rule failed. May carry
        `ERR-G13-INVALID_FILE_TYPE`, `ERR-G13-FILE_TOO_LARGE`, `ERR-G13-EMPTY_FILE`,
        `ERR-G13-FETCH_INTENT_REQUIRED`, `ERR-G13-METADATA_INVALID`, `ERR-G13-MALWARE_DETECTED`,
        `ERR-G13-RENDER_RESOURCE_LIMIT`, `ERR-G13-INTEGRITY_FAILED`,
        `ERR-G13-RETENTION_SHORTEN_FORBIDDEN`, `ERR-G13-SIGNATURE_INVALID`,
        `ERR-G13-SIGNATURE_METHOD_NOT_ALLOWED`, `ERR-G13-SIGNATURE_LTV_REQUIRED`,
        `ERR-G13-RENDITION_FAILED`, `ERR-G13-REDACTION_INCOMPLETE`.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionFailed:
      description: >
        `PRECONDITION_FAILED` (412) — a required precondition is not met (includes retryable
        upstream-unavailable path; replaces v2 503).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: >
        `RATE_LIMITED` (429) — rate limit or brute-force lockout. May carry `ERR-G13-SHARE_LOCKED`,
        `ERR-G13-BREAK_GLASS_LOCKED`.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: >
        `INTERNAL` (500) — unexpected/non-retryable upstream failure (503 collapses here via X.3).
        May carry `ERR-G13-SIGNING_SERVICE_UNAVAILABLE`, `ERR-G13-KEY_SERVICE_UNAVAILABLE`,
        `ERR-G13-AUDIT_CHAIN_BROKEN` (all render `ERR-LOADFAIL`).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ---- Error envelope (Foundation §1) ------------------------------------
    Error:
      type: object
      description: Canonical error envelope (Foundation §1). Correlation id is in the `X-Correlation-Id` header, not the body.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: A standard platform code (VALIDATION_FAILED, FORBIDDEN, …) or a module code (`ERR-G13-*`).
              examples: [ERR-G13-WORM_IMMUTABLE, FORBIDDEN]
            message: { type: string }
            field:
              type: [string, "null"]
              description: Offending field for validation errors.
            details:
              type: [object, "null"]
              additionalProperties: true
              description: 'Structured discriminators, e.g. `{ reason: <REASON> }`.'

    # ---- Enums (Section 5.5) -----------------------------------------------
    ClassificationLevel:
      type: string
      enum: [PUBLIC, INTERNAL, CONFIDENTIAL, SECRET, TOP_SECRET]
    DocumentStatus:
      type: string
      enum: [DRAFT, SCANNING, QUARANTINED, ACTIVE, CHECKED_OUT, SUPERSEDED, ON_LEGAL_HOLD, DISPOSITION_DUE, DISPOSED, ARCHIVED, ORPHANED, DELETED]
    VersionKind:
      type: string
      enum: [ORIGINAL, NEW_VERSION, SUPERSEDE, CERTIFIED_COPY, REDACTED, SIGNED]
    SourceChannel:
      type: string
      enum: [WEB_UPLOAD, BULK, SCANNER, MOBILE, API, SYSTEM_GENERATED]
    ScanStatus:
      type: string
      enum: [PENDING, CLEAN, INFECTED, QUARANTINED, SKIPPED]
    OcrStatus:
      type: string
      enum: [PENDING, DONE, FAILED, NOT_APPLICABLE]
    DocCategory:
      type: string
      enum: [IDENTITY, SERVICE, FINANCIAL, DISCIPLINARY, MEDICAL, TRAINING, PENSION, STATUTORY, OTHER]
    FolderType:
      type: string
      enum: [CABINET, EMPLOYEE, MODULE, CASE, SHARED, SYSTEM]
    PrincipalType:
      type: string
      enum: [USER, ROLE, ORG_UNIT, RELATIONSHIP]
    AclEffect:
      type: string
      enum: [ALLOW, DENY]
    TagType:
      type: string
      enum: [CLASSIFICATION, KEYWORD, PII_CATEGORY, RETENTION_HINT, SYSTEM]
    TagOrigin:
      type: string
      enum: [USER, OCR, DLP, SYSTEM]
    RetentionTrigger:
      type: string
      enum: [ON_CREATE, ON_SUPERSEDE, ON_EMPLOYEE_RETIRE, ON_CASE_CLOSE, FISCAL_YEAR_END]
    DispositionAction:
      type: string
      enum: [DESTROY, ARCHIVE_TRANSFER, REVIEW]
    RetentionScope:
      type: string
      enum: [DOCUMENT, DOCUMENT_TYPE, FOLDER]
    RetentionStatus:
      type: string
      enum: [ACTIVE, DUE, HELD, DISPOSED]
    LegalHoldStatus:
      type: string
      enum: [PENDING_APPROVAL, ACTIVE, RELEASE_PROPOSED, RELEASED]
    HoldMatchBasis:
      type: string
      enum: [MANUAL, SAVED_SEARCH, EMPLOYEE, CASE]
    HoldNoticeStatus:
      type: string
      enum: [SENT, ACKNOWLEDGED, OVERDUE, ESCALATED]
    DocAuditAction:
      type: string
      enum: [VIEW, PREVIEW, DOWNLOAD, PRINT, SHARE, METADATA_UPDATE, VERSION_ADD, CLASSIFY, DISPOSE, HOLD_PLACE, HOLD_RELEASE, ACL_CHANGE, BREAK_GLASS, CLEARANCE_CHANGE, ERASURE]
    AuditResult:
      type: string
      enum: [SUCCESS, DENIED]
    AnchorTarget:
      type: string
      enum: [WORM, EXTERNAL_NOTARY, RFC3161_TSA]
    AnchorVerifyStatus:
      type: string
      enum: [PENDING, VERIFIED, BROKEN]
    ShareType:
      type: string
      enum: [INTERNAL_USER, EXTERNAL_LINK]
    ShareStatus:
      type: string
      enum: [ACTIVE, EXPIRED, REVOKED, LOCKED]
    LockStatus:
      type: string
      enum: [ACTIVE, RELEASED, EXPIRED, FORCE_RELEASED]
    CheckoutMode:
      type: string
      enum: [NONE, OPTIONAL, REQUIRED]
    SigningMode:
      type: string
      enum: [SEQUENTIAL, PARALLEL]
    SignatureRequestStatus:
      type: string
      enum: [DRAFT, SENT, IN_PROGRESS, COMPLETED, DECLINED, EXPIRED, CANCELLED]
    SignatureType:
      type: string
      enum: [AADHAAR_ESIGN, DSC_TOKEN, OTP_ESIGN, DRAWN]
    SignatureStatus:
      type: string
      enum: [PENDING, SIGNED, DECLINED]
    LtvStatus:
      type: string
      enum: [NONE, TIMESTAMPED, LTV_ENABLED]
    DispositionStatus:
      type: string
      enum: [PROPOSED, APPROVED, EXECUTED, REJECTED, BLOCKED_HOLD]
    ErasureMethod:
      type: string
      enum: [CRYPTO_SHRED, PHYSICAL_PURGE, EXEMPT_RETAINED]
    StorageClass:
      type: string
      enum: [HOT, WARM, COLD, WORM_LOCKED]
    KeyScope:
      type: string
      enum: [SHARED_CMK, DEDICATED_CMK]
    DlpSeverity:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    DlpAction:
      type: string
      enum: [TAG, RECLASSIFY, REDACT, BLOCK_SHARE]
    DlpFindingStatus:
      type: string
      enum: [OPEN, ACCEPTED, DISMISSED, REMEDIATED]
    ClearancePrincipalType:
      type: string
      enum: [USER, ROLE]
    ClearanceStatus:
      type: string
      enum: [PENDING_APPROVAL, ACTIVE, SUSPENDED, EXPIRED, REVOKED]
    DsrType:
      type: string
      enum: [ACCESS, ERASURE, RECTIFICATION, PORTABILITY]
    DsrStatus:
      type: string
      enum: [RECEIVED, UNDER_REVIEW, EXEMPTED, PARTIALLY_FULFILLED, FULFILLED, REJECTED]
    FetchIntent:
      type: string
      enum: [VIEW, DOWNLOAD]

    # ---- Pagination --------------------------------------------------------
    PageMeta:
      type: object
      properties:
        next_cursor:
          type: [string, "null"]
          description: Cursor for the next page, or null at the end.

    # ---- Core entities -----------------------------------------------------
    Document:
      type: object
      description: '`documents` — platform-core M11 vault master (reference), extended with gov columns.'
      properties:
        documentId: { type: string, format: uuid }
        docNo: { type: string, description: Human-readable business key. }
        tenantId: { type: string, format: uuid }
        entityId: { type: [string, "null"], format: uuid }
        documentTypeId: { type: string, format: uuid }
        documentTypeCode: { type: string }
        title: { type: string }
        category: { $ref: '#/components/schemas/DocCategory' }
        classification: { $ref: '#/components/schemas/ClassificationLevel' }
        securityDomain: { type: string }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        currentVersionId: { type: [string, "null"], format: uuid }
        currentVersionNo: { type: integer }
        folderId: { type: [string, "null"], format: uuid }
        isWorm: { type: boolean }
        isSealed: { type: boolean }
        legalHoldCount: { type: integer }
        anchorConfirmed: { type: boolean }
        dpdpErasureState: { type: [string, "null"] }
        linkCount: { type: integer }
        wormRetainUntil: { type: [string, "null"], format: date-time }
        dispositionDueDate: { type: [string, "null"], format: date }
        metadata:
          type: [object, "null"]
          additionalProperties: true
          description: Type-defined metadata validated against the W.2 form/JSON-Schema.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DocumentPage:
      type: object
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Document' }

    DocumentVersion:
      type: object
      description: '`document_versions` — platform-core (reference).'
      properties:
        versionId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        versionNo: { type: integer }
        versionKind: { $ref: '#/components/schemas/VersionKind' }
        supersededVersionId: { type: [string, "null"], format: uuid }
        derivedFromVersionId: { type: [string, "null"], format: uuid }
        storageObjectId: { type: [string, "null"], format: uuid }
        contentHash: { type: [string, "null"], description: SHA-256 of stored bytes. }
        sizeBytes: { type: [integer, "null"] }
        mimeType: { type: [string, "null"] }
        changeSummary: { type: [string, "null"] }
        scanStatus: { $ref: '#/components/schemas/ScanStatus' }
        ocrStatus: { $ref: '#/components/schemas/OcrStatus' }
        integrityVerified: { type: boolean }
        languageCode: { type: [string, "null"] }
        authorId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
    VersionPage:
      type: object
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/DocumentVersion' }

    DocumentCreateResult:
      type: object
      properties:
        documentId: { type: string, format: uuid }
        docNo: { type: string }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        currentVersionNo: { type: integer }
        securityDomain: { type: string }

    DocumentUploadRequest:
      type: object
      required: [documentTypeCode, title, file]
      properties:
        file:
          type: string
          format: binary
        documentTypeCode: { type: string }
        title: { type: string }
        folderId: { type: [string, "null"], format: uuid }
        classification:
          allOf: [ { $ref: '#/components/schemas/ClassificationLevel' } ]
          description: Optional; must be >= the type default (may raise, not lower).
        sourceChannel: { $ref: '#/components/schemas/SourceChannel' }
        metadata:
          type: [object, "null"]
          additionalProperties: true
    BulkUploadRequest:
      type: object
      required: [documentTypeCode, files]
      properties:
        documentTypeCode: { type: string }
        folderId: { type: [string, "null"], format: uuid }
        files:
          type: array
          maxItems: 100
          items:
            type: string
            format: binary
    BulkUploadResult:
      type: object
      properties:
        batchId: { type: string, format: uuid }
        results:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              status: { type: string, enum: [SUCCESS, FAILED] }
              documentId: { type: [string, "null"], format: uuid }
              error: { $ref: '#/components/schemas/Error' }
    ResumableUploadRequest:
      type: object
      required: [fileName, sizeBytes]
      properties:
        fileName: { type: string }
        sizeBytes: { type: integer }
        mimeType: { type: [string, "null"] }
    ResumableUploadSession:
      type: object
      properties:
        uploadSessionId: { type: string }
        uploadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        receivedBytes: { type: integer }

    AttachRequest:
      type: object
