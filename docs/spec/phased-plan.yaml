global_constraints:
  security:
    - Every API endpoint must be explicitly public or protected by project auth middleware.
    - Parameterized queries only.
    - Secrets via environment variables only.
    - No production console.log; use project logger.
    - No stack traces, internal paths, or secret IDs in API responses.
  data_integrity:
    - Multi-step writes use transactions.
    - Destructive or irreversible DB operations require approval.
    - List queries require bounded cursor pagination.
    - Schema changes must follow project.config.yaml and data-model amendment workflow.
  code_quality:
    - No TypeScript any or as any without an approved exception.
    - No swallowed errors.
    - No hardcoded localhost URLs in production paths.
    - No skeleton UI components.
  workflow:
    - P01 workflow behavior must be contract-tested before any HRMS module depends on it.
    - In-flight instances pin their workflow definition version.
    - Every workflow action writes a workflow action row and P05 audit evidence.
    - Maker-checker and no-self-approval are enforced centrally, not per module.

parallelizable_groups:
  group_A_workflow_extraction:
    can_run_in_parallel:
      - PUDA golden behavior tests
      - HRMS P01 schema gap analysis
      - workflow config schema extraction
      - workflow admin UI inventory
    sync_gate: Workflow platform adapter boundary approved.
  group_B_foundation_records:
    can_run_in_parallel:
      - G01 employee master
      - G12 SR ledger write-port
      - G13 document vault
    sync_gate: G01 identity event posts to G12 and can attach G13 documents.
  group_C_statutory_modules:
    can_run_in_parallel:
      - G04 leave to SR
      - G05 transfer/relieving/joining
      - G06 promotion/seniority
      - G07 training
      - G08 APAR
      - G09 disciplinary
    sync_gate: Each writer passes G12 SR ingestion conformance.
  group_D_money_and_analytics:
    can_run_in_parallel:
      - G10 payroll rule scaffolding
      - G11 pension rule-table scaffolding
      - G14 stub marts
    sync_gate: G11 input provenance gate receives live G03/G04/G09/G10/G12 facts.

phases:
  - id: PH-00
    name: Prove and Extract PUDA Workflow Platform
    planner_stage: CONFLICT/migration
    status: planned
    goal: >
      First prove that PUDA workflow behavior can be preserved behind a thin
      adapter boundary, then extract the reusable workflow runtime, separate
      generic platform code from PUDA domain code, and freeze the HRMS
      workflow-platform contract before HRMS feature development starts.
    requirements:
      - PUDA golden behavior is captured before any extraction.
      - A thin strangler boundary proves PUDA can consume workflow through an adapter.
      - "P01 workflow engine operations: startInstance, advance, approve, reject, sendBack, delegate, cancel, query."
      - "P01 patterns: SEQUENTIAL, PARALLEL_ALL_OF, PARALLEL_ANY_OF, CONDITIONAL, DYNAMIC_APPROVER."
      - P01 version pinning, SLA, idempotency, and SoD.
      - PUDA behavior remains unchanged through a PUDA adapter.
      - HRMS can consume the extracted runtime in-process.
      - Extraction provenance is recorded for every reused file.
    dependencies: []
    increments:
      - id: PH-00A
        name: Inventory, provenance, and golden tests
        duration: 3-5 days
        output: PUDA workflow inventory, source classification, golden behavior suite, and extraction risk register.
      - id: PH-00B
        name: Thin PUDA strangler boundary
        duration: 1 week
        output: Existing PUDA workflows execute through a boundary/facade without moving code into a shared package yet.
      - id: PH-00C
        name: Minimum workflow-core extraction
        duration: 1 week
        output: Pure transition/action/wait/fork/join/reference/config validation logic separated from PUDA domain semantics.
      - id: PH-00D
        name: Persistence, config, and adapter SPI
        duration: 1 week
        output: Postgres repositories, config publishing, resolver SPI, audit/notification/document/side-effect hooks.
      - id: PH-00E
        name: PUDA and HRMS conformance proof
        duration: 3-5 days
        output: PUDA adapter golden tests and HRMS synthetic workflow tests pass against the extracted package.
    expected_files:
      create:
        - docs/spec/puda-workflow-inventory.yaml
        - docs/spec/workflow-platform-extraction.md
        - docs/spec/workflow-platform-governance.md
        - docs/spec/workflow-platform-contract.yaml
        - docs/contracts/openapi/P01-workflow.yaml
        - docs/spec/workflow-platform-gap-analysis.yaml
        - docs/spec/workflow-conformance-suite.md
        - docs/spec/migration-coexistence-inventory.md
        - /Users/n15318/workflow-platform/package.json
        - /Users/n15318/workflow-platform/packages/workflow-core/**
        - /Users/n15318/workflow-platform/packages/workflow-postgres/**
        - /Users/n15318/workflow-platform/packages/workflow-config/**
        - /Users/n15318/workflow-platform/packages/workflow-resolvers/**
        - /Users/n15318/workflow-platform/packages/workflow-test-kit/**
        - /Users/n15318/workflow-platform/adapters/puda/**
        - /Users/n15318/workflow-platform/adapters/hrms/**
      modify:
        - docs/architecture.md
        - docs/brd/PLATFORM_FOUNDATION.md
        - docs/contracts/dependency-register.yaml
        - docs/data-model/00-platform-core.sql
      source_from_puda:
        - /Users/n15318/PUDA_workflow_engine/apps/api/src/workflow.ts
        - /Users/n15318/PUDA_workflow_engine/apps/api/src/work-queues.ts
        - /Users/n15318/PUDA_workflow_engine/apps/api/src/workflow.route-model.ts
        - /Users/n15318/PUDA_workflow_engine/apps/api/src/workflow-simulation.ts
        - /Users/n15318/PUDA_workflow_engine/apps/api/src/workflow-service-pack-certification.ts
        - /Users/n15318/PUDA_workflow_engine/apps/api/src/service-version.ts
        - /Users/n15318/PUDA_workflow_engine/apps/api/src/service-pack-sync.ts
        - /Users/n15318/PUDA_workflow_engine/apps/api/src/officer-routing-reconciliation.ts
        - /Users/n15318/PUDA_workflow_engine/apps/api/migrations/039_work_queue_routing_foundation.sql
        - /Users/n15318/PUDA_workflow_engine/apps/api/migrations/043_workflow_waits_and_waiting_states.sql
        - /Users/n15318/PUDA_workflow_engine/apps/api/migrations/046_workflow_fork_join.sql
        - /Users/n15318/PUDA_workflow_engine/apps/api/migrations/089_workflow_references.sql
        - /Users/n15318/PUDA_workflow_engine/apps/api/migrations/096_workflow_config_publish_review.sql
        - /Users/n15318/PUDA_workflow_engine/apps/api/migrations/168_one_published_version_per_service.sql
    implementation_steps:
      - Inventory PUDA workflow runtime into generic, adapter, and domain-only buckets.
      - Record source commit, file provenance, license status, and extraction disposition for every candidate.
      - Capture PUDA golden behavior before extraction using current service-pack certification and workflow tests.
      - Add a thin boundary in PUDA so existing workflows call a workflow facade before code is moved.
      - Create workflow-core with pure state, transition, guard, action, wait, fork/join, and route-model logic.
      - Create workflow-postgres repositories with tenant-aware transactions and RLS-compatible query boundaries.
      - Create workflow-config for W.1 schema, config validation, versioning, publish review, and evidence packs.
      - Create workflow-resolvers with resolver interfaces and initial WORK_QUEUE resolver.
      - Move PUDA-specific application, authority, LAC, LOI, payment, and service-pack semantics into the PUDA adapter.
      - Create HRMS adapter stubs for employee, position, org-unit, document, notification, audit, and SR side-effect hooks.
      - Amend HRMS P01 contract where current schema lacks durable task/wait/fork/reference/resolution snapshots.
      - Produce the initial migration/coexistence inventory for historical workflow states and pending cases.
    generated_tests:
      unit:
        - workflow-core transition guard tests
        - action classification tests
        - wait and fork/join resolver tests
        - route-model path preview tests
        - config validation tests
      integration:
        - PUDA adapter golden workflow certification
        - Postgres transaction/idempotency tests
        - workflow publish/version pinning tests
        - pending task routing tests
      contract:
        - P01 OpenAPI schema validation
        - HRMS adapter contract tests with synthetic employee/org fixtures
    review_criteria:
      - PUDA test suite for workflow behavior remains green.
      - A PUDA workflow runs through the strangler boundary before the shared package is consumed.
      - HRMS P01 contract explicitly covers tasks, assignee snapshots, wait states, fork/join, references, SLA, and publish governance.
      - No HRMS module imports PUDA application or LAC domain code.
      - All reusable packages are free of PUDA-specific table names and business constants.
      - Adapter hooks are narrow, documented, and testable.
      - Provenance and IP review is complete for extracted code.
    rollback_retry_policy:
      rollback: Keep PUDA production behavior unchanged; if extraction breaks PUDA golden tests, revert extracted package consumption and continue PUDA through the original code path while fixing the adapter.
      retry: "Re-extract in smaller slices: facade first, workflow-core second, config third, Postgres fourth, UI last."
      quarantine: Do not start HRMS module feature coding until PH-00 exit criteria pass.
    exit_criteria:
      - Workflow platform package builds and typechecks.
      - PUDA adapter can run at least one simple workflow, one wait workflow, one fork/join workflow, and one reference workflow.
      - HRMS adapter can run synthetic start/approve/reject/sendBack flows against HRMS-like employee/org fixtures.
      - P01 contract and schema gap report are reviewed and accepted.

  - id: PH-01
    name: Amend HRMS Foundation Contracts and Schema for Workflow Reality
    planner_stage: PARTIAL modifications
    status: planned
    goal: >
      Align HRMS platform contracts, OpenAPI, data model, and architecture docs
      with the extracted workflow runtime before implementing business modules.
    requirements:
      - HRMS P01 contract must not rely only on workflow_instances/workflow_actions if runtime needs tasks and assignment state.
      - Existing BRD v3 convention that says "use workflow_actions not workflow_tasks" must be reconciled with the runtime need for durable actionable tasks.
      - All amendments must preserve the non-greenfield rule and PrimeSoft/P01 ownership.
      - Authority-resolution snapshots must be immutable enough to replay and legally explain historical decisions.
      - Legacy and in-flight workflow state mapping must be defined before migration dry runs.
    dependencies: [PH-00]
    expected_files:
      create:
        - docs/spec/p01-schema-amendment.yaml
        - docs/spec/authority-resolution-contract.yaml
        - docs/spec/legacy-workflow-coexistence-map.yaml
        - docs/tests/P01-workflow-platform-tests.md
      modify:
        - docs/architecture.md
        - docs/brd/PLATFORM_FOUNDATION.md
        - docs/brd/MODULE_RECONCILIATION.md
        - docs/contracts/state-machines.yaml
        - docs/contracts/auth-matrix.yaml
        - docs/data-model/00-platform-core.sql
    implementation_steps:
      - "Resolve naming: actionable work items are P01-owned workflow_tasks or workflow_work_items, not module-owned local task tables."
      - Add or confirm durable tables for assignment snapshots, resolver outputs, waits, fork/join execution, references, publish review, and evidence packs.
      - Define how workflow tasks relate to workflow_actions and P05 audit.
      - Define versioning and in-flight pinning semantics for W.1 process definitions.
      - Register authority resolver types and error taxonomy for not-resolved, ambiguous, SoD-blocked, and delegation-expired cases.
      - Define resolver evidence fields: input facts, as-of date, candidate set, selected actor, exclusion reasons, rule version, config version, and source data version.
      - Define migration/coexistence state mapping for pending approvals, closed approvals, imported actions, and externally retained cases.
    generated_tests:
      contract:
        - schema load test 00-platform-core.sql with workflow amendments
        - RLS coverage test for all workflow runtime tables
        - P01 error-envelope conformance tests
        - historical resolver replay test using changed hierarchy after approval
      review:
        - BRD/convention diff review proving old v1 workflow_tasks references are either superseded or formalized as P01-owned runtime work items
    review_criteria:
      - No contradiction remains between PLATFORM_FOUNDATION, architecture, data model, and P01 OpenAPI.
      - Workflow runtime tables are tenant-scoped and RLS-protected where applicable.
      - G14 can read pending workflow/SLA facts without inventing a parallel task model.
      - A past workflow decision can be explained without re-evaluating against today's hierarchy.
    rollback_retry_policy:
      rollback: Keep PH-00 extracted runtime behind adapter stubs; do not mutate module schemas until P01 amendment is approved.
      retry: If workflow_tasks naming conflicts with existing platform terminology, use workflow_work_items but keep API semantics unchanged.
      quarantine: Any unresolved platform-vs-runtime conflict blocks only workflow-dependent implementation, not documentation refinement.
    exit_criteria:
      - P01 schema amendment approved.
      - P01 OpenAPI contract exists.
      - Full core schema load succeeds.

  - id: PH-02
    name: Define Missing HRMS Master Data, Hierarchy, and Authority Matrices
    planner_stage: MISSING data
    status: planned
    goal: >
      Prepare the HRMS contract, schema, and fixture substrate needed by workflow
      resolution: employees, positions, org units, reporting relationships,
      authority matrices, delegation, acting charge, committees, and seeded
      statutory roles. This phase does not implement full operational G01, G12,
      or G13 services; it gives the workflow platform reliable facts to resolve
      G03 and G05.
    requirements:
      - G01 employee master, positions, position_history, and employee_job_assignments.
      - Reporting manager and reports_to_position hierarchy.
      - Statutory authority matrices for appointing, transfer, disciplinary, appellate, reviewing, accepting, pension, payroll, and SR custodian roles.
      - Delegation and acting-charge windows with effective dates.
      - Committee/panel model for DPC and inquiry committees.
      - Authority fixtures include historical as-of cases and corrected hierarchy cases.
    dependencies: [PH-01]
    expected_files:
      create:
        - docs/spec/hrms-authority-model.yaml
        - docs/spec/hrms-seed-data-plan.yaml
        - docs/tests/authority-resolution-tests.md
      modify:
        - docs/data-model/01-G01-employee-profile.sql
        - docs/data-model/06-G06-promotion-posting-progression.sql
        - docs/data-model/09-G09-disciplinary-punishment.sql
        - docs/contracts/auth-matrix.yaml
    implementation_steps:
      - Map every state-machine trigger in docs/contracts/state-machines.yaml to a resolver type.
      - Define authority matrix tables or confirm existing module tables cover them.
      - Seed sample tenant/entity/org/position hierarchy sufficient for G03 and G05 vertical slices.
      - Define committee membership, quorum, recusal, and voting result semantics as contracts and fixtures; full committee workflows can wait for G06/G09.
      - Add test fixtures for vacant manager, delegated manager, acting charge, conflict of interest, and cross-entity authority.
      - Add fixture cases for historical approvals where later employee, position, or hierarchy corrections must not rewrite the original resolver result.
    generated_tests:
      unit:
        - reporting-chain L1/L2/skip-level resolution
        - position-authority resolution by employee as-of date
        - org-unit-head fallback
        - delegation and acting-charge precedence
        - committee quorum and recusal
      data:
        - no overlapping effective-dated authority assignments
        - tenant/entity scoping enforcement
        - SoD test data for self-approval denial
    review_criteria:
      - Every resolver output is explainable and auditable.
      - Ambiguous authority is blocked, never guessed.
      - Effective-dated lookup rules are deterministic.
      - HRMS seed data can drive G03 and G05 without ad hoc test-only bypasses.
      - Operational implementation remains scoped to facts and fixtures; broad employee-master workflows stay in PH-03 and PH-07.
    rollback_retry_policy:
      rollback: Revert seed additions independently of schema additions; no destructive data changes without approval.
      retry: If statutory authority tables are under-specified, add a temporary read-only fixture adapter and quarantine affected flows.
      quarantine: Committee workflows can be deferred behind resolver stubs while reporting-chain and position-authority continue.
    exit_criteria:
      - Authority resolver fixtures cover G03 leave and G05 transfer.
      - G01 employee/position hierarchy loads with RLS enabled.
      - Auth matrix includes all workflow actors needed for Phase 4 vertical slices.

  - id: PH-03
    name: Implement Core Platform Services and Systems of Record
    planner_stage: service
    status: planned
    goal: >
      Implement reusable services that all modules consume: embedded P01,
      P02 authorization integration, P05 audit hooks, G01 employee master, G12
      SR ingestion, G13 document vault, X.1 jobs, X.2 notifications, and X.3
      integration adapters.
    requirements:
      - P01 embedded workflow service from extracted platform.
      - Authority Resolution Service with HRMS adapter.
      - G01 employee master service.
      - G12 append-only SR ingestion service.
      - G13 document metadata/vault service.
      - P05 mutation audit and security audit.
      - X.1/X.2/X.3 service boundaries.
      - Migration staging and reconciliation services for historical employee, SR, document, and workflow facts.
    dependencies: [PH-02]
    expected_files:
      create:
        - apps/api/src/platform/workflow/**
        - apps/api/src/platform/authority-resolution/**
        - apps/api/src/platform/audit/**
        - apps/api/src/modules/g01/**
        - apps/api/src/modules/g12/**
        - apps/api/src/modules/g13/**
        - apps/api/src/jobs/**
        - apps/api/src/notifications/**
        - apps/api/src/migration/staging/**
      modify:
        - package.json
        - tsconfig.json
        - docs/contracts/dependency-register.yaml
    implementation_steps:
      - Add workflow-platform dependency as workspace/path dependency.
      - Implement HRMS workflow adapter repositories and transaction boundary.
      - Implement AuthorityResolver.resolve with REPORTING_CHAIN, POSITION_AUTHORITY, ORG_UNIT_HEAD, NAMED_ROLE, NAMED_USER, WORK_QUEUE, COMMITTEE, and DELEGATION_OR_ACTING_CHARGE.
      - Implement G12 sr_ingest with idempotency, semantic dedup, provenance, source-driven reversal, and append-only persistence.
      - Implement G13 document metadata and storage adapter with legal hold and retention hooks.
      - Implement G01 service APIs for read-only master lookup and governed changes.
      - Implement read-only migration staging loaders and reconciliation reports for employee identity, SR history, documents, and legacy workflow cases.
      - Persist authority-resolution evidence with each workflow assignment and action.
    generated_tests:
      unit:
        - authority resolver precedence
        - SR semantic-dedup
        - document legal-hold blocks disposal
        - P02 field masking serialization
      integration:
        - workflow start -> task -> approve -> action/audit row
        - G01 identity event -> G12 SR ingest
        - document attach by module reference
        - RLS tenant isolation on all foundation services
        - migration staging import -> reconciliation report without mutating production records
      security:
        - protected endpoint coverage
        - no stack traces in error responses
        - no production console.log
    review_criteria:
      - Services expose contracts but do not leak table internals across module boundaries.
      - All unsafe writes are transactional and idempotent where required.
      - Audit evidence exists for workflow action, SR write, document mutation, and authority resolution.
      - Migration staging cannot bypass production validation, RLS, or audit.
    rollback_retry_policy:
      rollback: Disable new service routes behind feature flags; preserve schema migrations if non-destructive and unused.
      retry: Re-run focused service tests with synthetic data before enabling module code.
      quarantine: If G12 append-only semantics fail, block all SR writers but allow non-SR services to continue.
    exit_criteria:
      - Foundation services pass unit, integration, RLS, and security checks.
      - G01, G12, G13 can be exercised with seeded data.
      - P01 can execute synthetic HRMS flows through the HRMS adapter.

