paths:
  /sr/ingest:
    post:
      tags:
      - sr-ingest
      summary: Append a disciplinary reference event to the G12 SR ledger
      operationId: srIngest
      description: 'Reference-writer port. G09 relays PENALTY/EXONERATION/SUSPENSION outcomes verbatim to the single canonical G12 write-port POST /api/v1/sr/ingest (module-local /orders/{id}/post-to-sr is an internal façade only). Event types: MINOR_PENALTY / MAJOR_PENALTY / CENSURE / SUSPENSION / SUSPENSION_REVOKED and reversal partners MINOR_PENALTY_REVERSAL / MAJOR_PENALTY_REVERSAL. Syntactic dedup on the tuple (source_module, source_reference_id, source_event_version); semantic dedup on fact_key for qualifying-service-bearing types.'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Idempotency key for unsafe transaction-creating POSTs; 24h replay window (Foundation §4). REQUIRED for this propagating action; domain idempotency_keys ledger (TTL 7d) guarantees exactly-once. A known key with a mismatched request fingerprint returns 409 ERR-G09-IDEMPOTENCY-CONFLICT (DI-19).
        schema:
          type: string
          maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SrIngestRequest'
      responses:
        '201':
          description: Event appended, or idempotent/semantic-duplicate no-op (see ingestionStatus).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SrIngestResponse'
        '401': &id001
          $ref: '#/components/responses/Unauthorized'
        '403': &id002
          $ref: '#/components/responses/Forbidden'
        '404': &id003
          $ref: '#/components/responses/NotFound'
        '409': &id004
          $ref: '#/components/responses/Conflict'
        '412': &id005
          $ref: '#/components/responses/PreconditionFailed'
        '422': &id006
          $ref: '#/components/responses/ValidationFailed'
        '429': &id007
          $ref: '#/components/responses/RateLimited'
        '500': &id008
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
