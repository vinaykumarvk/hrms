      - Persist calculation trace and rule version snapshots.
      - Integrate X.3 sandbox stubs for bank, treasury, pension disbursement, and identity verification.
    generated_tests:
      unit:
        - payroll formula tests
        - arrears and deductions
        - qualifying-service calculation
        - pension/gratuity/commutation deterministic calculation
      integration:
        - G03 LOP affects payroll
        - G09 penalty affects qualifying service
        - G10 last-pay-drawn feeds G11
        - G11 writes separation/PPO SR events
      financial_controls:
        - maker-checker for payroll lock and pension sanction
        - reproducibility tests for same inputs/rule versions
    review_criteria:
      - No money calculation proceeds without provenance completeness.
      - Rule versions are snapshotted.
      - Payroll and pension officers are separated by SoD where required.
      - Financial exports are generated through X.3, not hardcoded integrations.
    rollback_retry_policy:
      rollback: Disable payroll/pension execution routes; keep read-only previews available if safe.
      retry: Re-run deterministic calculation suite after every rule change.
      quarantine: G11 calculation can remain in preview mode until all upstream provenance gaps are resolved.
    exit_criteria:
      - G10/G11 pass deterministic, integration, and SoD tests.
      - Pension case cannot pass gate with incomplete SR/service facts.

  - id: PH-10
    name: Build Analytics, Enterprise Hardening, and Release Readiness
    planner_stage: integration
    status: planned
    goal: >
      Build G14 analytics and complete enterprise-grade security, observability,
      performance, migration, deployment, and release evidence for HRMS.
    requirements:
      - G14 read-only dashboards and marts.
      - Role-scoped analytics with P02/RLS enforcement.
      - NFR validation for API p95, dashboard LCP, audit, backup, DR, accessibility, and security.
      - P06 migration dry runs, reconciliation certification, coexistence handling, and production cutover plan.
    dependencies: [PH-09]
    expected_files:
      create:
        - apps/api/src/modules/g14/**
        - apps/web/src/modules/g14/**
        - apps/api/src/migration/**
        - ops/**
        - docs/release/**
      modify:
        - docs/contracts/openapi/G14.yaml
        - docs/architecture.md
        - docs/phased-plan.md
    implementation_steps:
      - Build G14 marts for employee, workflow SLA, SR completeness, pension pipeline, disciplinary aging, payroll, and compliance.
      - Add dashboard APIs with cache/read-replica strategy.
      - "Run full security review: authz, RLS, PII masking, audit, secrets, dependency policy."
      - Run performance tests for workflow-heavy paths, list pagination, dashboard queries, payroll/pension batch jobs.
      - Run P06 migration dry runs and reconciliation reports.
      - Certify imported employee records, SR entries, documents, authority history, workflow cases, and audit trails against source evidence.
      - Execute coexistence plan for any pending approvals or external cases that are not migrated into P01.
      - Prepare deployment runbooks, rollback plans, evidence pack, and UAT scripts.
    generated_tests:
      analytics:
        - dashboard scope-leak matrix
        - mart refresh idempotency
        - drill-through authorization
      nfr:
        - API p95 tests
        - dashboard LCP tests
        - batch-job period-lock tests
        - backup/restore drill
      security:
        - authz matrix tests
        - RLS forced-policy tests
        - audit-read-is-audited tests
        - dependency and secrets scans
      release:
        - full e2e regression
        - migration dry-run evidence
        - migration reconciliation and certification evidence
        - UAT acceptance pack
    review_criteria:
      - G14 never mutates source modules.
      - Dashboards cannot show out-of-scope rows or masked PII.
      - Release evidence maps requirements to code, tests, logs, and screenshots.
      - Migration exceptions have explicit owners, disposition, and legal/business acceptance.
      - Remaining risks have owners and dates.
    rollback_retry_policy:
      rollback: Disable analytics marts independently of transactional modules; retain operational HRMS.
      retry: Rebuild marts from source events if refresh fails.
      quarantine: Analytics gaps do not block statutory transactional go-live unless required by contract.
    exit_criteria:
      - All modules pass integration and release-readiness checks.
      - Migration dry runs complete with accepted reconciliation.
      - Production runbooks and rollback plan approved.

  - id: PH-11
    name: UAT and Cutover Governance Rehearsal
    planner_stage: implementation
    status: planned
    goal: >
      Rehearse UAT execution, defect triage, cutover control, rollback authority,
      support handoff, operational RACI, and hypercare governance after PH-10
      release readiness, while keeping real UAT sign-off and production go-live
      approval as human-only decisions.
    requirements:
      - UAT scripts from PH-10 are converted into an execution journal with rehearsal outcomes.
      - UAT sign-off remains explicitly marked `UAT_SIGNOFF_HUMAN_REQUIRED`.
      - Defects, exceptions, and residual risks have severity, owner, target date, and decision path.
      - Cutover rehearsal uses non-production checks only and records `NO_PRODUCTION_MUTATION`.
      - Go-live, CAB approval, rollback execution, and production cutover remain `GO_LIVE_HUMAN_APPROVAL_PENDING`.
      - Hypercare, support handoff, incident severity, SLA ownership, and operational RACI are documented.
    dependencies: [PH-10]
    expected_files:
      create:
        - docs/spec/ph-11-uat-cutover-governance-plan.md
        - docs/spec/ph-11-verdict.md
        - docs/release/uat-execution-journal.md
        - docs/release/uat-defect-triage.md
        - docs/release/cutover-control-board.md
        - docs/release/hypercare-plan.md
        - docs/release/support-handoff.md
        - docs/release/operational-raci.md
        - ops/cutover-rehearsal-runbook.md
        - ops/local-release-smoke.sh
        - apps/api/test/ph11-uat-governance.test.cjs
      modify:
        - docs/spec/pipeline/phases.yaml
        - docs/spec/manifest.json
        - docs/phased-plan.md
    implementation_steps:
      - Freeze the PH-11 detailed plan and wire PH-11A through PH-11E as agentic gates with external checks.
      - Execute UAT rehearsal evidence from the PH-10 UAT pack and record unresolved business sign-off explicitly.
      - Build defect triage governance with owner/date/severity/decision-path evidence.
      - Rehearse cutover locally with release-freeze, rollback-authority, and no-production-mutation controls.
      - Prepare support handoff, operational RACI, hypercare, incident severity, and SLA owner evidence.
      - Run full API and web regressions before declaring governance rehearsal complete.
    generated_tests:
      governance:
        - UAT sign-off cannot be marked agent-approved.
        - Go-live approval remains human pending.
        - Operational readiness documents contain owner/date markers.
      release:
        - local release smoke validates non-production artifacts only.
        - PH-11A through PH-11E pipeline checks pass.
        - full API and web checks pass.
    review_criteria:
      - PH-11 never performs or approves production cutover.
      - Every approval-sensitive artifact contains a human-pending marker.
      - Defects, residual risks, and operational tasks have named owners and dates.
      - Local release smoke cannot use production credentials, URLs, or destructive operations.
    rollback_retry_policy:
      rollback: Revert PH-11 governance artifacts only; no production state exists to roll back.
      retry: Re-run failed rehearsal checks after correcting the evidence artifact or local smoke condition.
      quarantine: A blocked business approval parks production release but does not invalidate completed development evidence.
    exit_criteria:
      - UAT/cutover governance rehearsal is complete.
      - PH-11A through PH-11E checks pass.
      - Full API and web regression passes.
      - Manifest records `GO_LIVE_HUMAN_APPROVAL_PENDING`.

  - id: PH-12
    name: Release Board Readiness and Target-Environment Dry Run
    planner_stage: implementation
    status: planned
    goal: >
      Prepare the complete human release-board decision package and target-
      environment readiness dry-run checks after PH-11 governance rehearsal,
      while keeping UAT sign-off, CAB approval, go-live, production cutover,
      production credentials, and rollback execution as human-only decisions.
    requirements:
      - Release-board dossier summarizes PH-10 and PH-11 evidence with owner/date/status.
      - Human approval checklist distinguishes UAT, CAB, go-live, rollback, legal, security, migration, and operations decisions.
      - Target-environment readiness check defaults to dry-run and requires no production credentials.
      - Board agenda, go/no-go decision record, and rollback authorization templates are complete but not pre-approved.
      - Final verdict records release-board ready state while preserving `GO_LIVE_HUMAN_APPROVAL_PENDING`.
    dependencies: [PH-11]
    expected_files:
      create:
        - docs/spec/ph-12-release-board-readiness-plan.md
        - docs/spec/ph-12-verdict.md
        - docs/release/release-board-dossier.md
        - docs/release/human-approval-checklist.md
        - docs/release/target-environment-readiness.md
        - docs/release/environment-evidence-manifest.md
        - docs/release/release-board-agenda.md
        - docs/release/go-no-go-decision-record-template.md
        - docs/release/rollback-authorization-template.md
        - ops/target-environment-readiness-check.sh
        - apps/api/test/ph12-release-board-readiness.test.cjs
      modify:
        - docs/spec/pipeline/phases.yaml
        - docs/spec/manifest.json
        - docs/phased-plan.md
    implementation_steps:
      - Freeze the PH-12 detailed plan and wire PH-12A through PH-12E as executable agentic gates.
      - Build a release-board dossier from PH-10/PH-11 evidence and explicit pending human decisions.
      - Build a human approval checklist with owner/date/status for each release decision.
      - Build a target-environment dry-run readiness script that does not require production credentials or mutate infrastructure.
      - Prepare board agenda, go/no-go decision record template, and rollback authorization template.
      - Run full API and web regressions before declaring release-board readiness complete.
    generated_tests:
      governance:
        - Release-board documents cannot claim UAT, CAB, go-live, cutover, or rollback approval.
        - Approval checklist contains owner/date/status for every critical decision.
      target_environment:
        - Dry-run script refuses production-like values and emits `PH12_TARGET_READINESS_DRY_RUN_GREEN`.
        - Target-environment execution remains human-run after approval.
      release:
        - PH-12A through PH-12E pipeline checks pass.
        - Full API and web checks pass.
    review_criteria:
      - PH-12 never performs production deployment or cutover.
      - Every approval-sensitive artifact contains human-pending markers.
      - Dry-run checks cannot require or leak production credentials.
      - Templates are ready for human signing but contain no pre-filled approval.
    rollback_retry_policy:
      rollback: Revert PH-12 readiness artifacts only; no production state exists to roll back.
      retry: Re-run failed readiness checks after correcting the dossier, checklist, target dry-run, or templates.
      quarantine: Missing human approvals park release-board progression but do not invalidate completed development evidence.
    exit_criteria:
      - Release-board package is complete and machine-checked.
      - Target-environment readiness dry-run passes without production credentials.
      - PH-12A through PH-12E checks pass.
      - Full API and web regression passes.
      - Manifest records release-board ready with human approval pending.

  - id: PH-13
    name: Release Candidate Seal and Approval Intake
    planner_stage: implementation
    status: planned
    goal: >
      Seal the PH-12 release-board package as a machine-verifiable release
      candidate, prepare human approval intake and change-ticket guardrails,
      and create archive/handoff evidence while keeping all human release
      decisions pending.
    requirements:
      - Release-candidate manifest identifies the sealed evidence package and its scope.
      - Evidence checksum manifest records SHA-256 hashes for release-board artifacts.
      - Checksum verifier recomputes hashes without mutating source artifacts.
      - Human approval intake and change-ticket template keep approvals pending and require external human records.
      - Evidence archive index, handoff memo, and post-board action register have owner/date/status.
      - Final verdict records release-candidate sealed with `GO_LIVE_HUMAN_APPROVAL_PENDING`.
    dependencies: [PH-12]
    expected_files:
      create:
        - docs/spec/ph-13-release-candidate-seal-plan.md
        - docs/spec/ph-13-verdict.md
        - docs/release/release-candidate-manifest.md
        - docs/release/evidence-checksum-manifest.json
        - docs/release/human-approval-intake.md
        - docs/release/change-ticket-template.md
        - docs/release/evidence-archive-index.md
        - docs/release/release-handoff-memo.md
        - docs/release/post-board-action-register.md
        - ops/verify-release-candidate-seal.sh
        - ops/validate-human-approval-intake.sh
        - apps/api/test/ph13-release-candidate-seal.test.cjs
      modify:
        - docs/spec/pipeline/phases.yaml
        - docs/spec/manifest.json
        - docs/phased-plan.md
    implementation_steps:
      - Freeze PH-13 plan and wire PH-13A through PH-13E as executable gates.
      - Build the release-candidate manifest and checksum manifest from PH-12 board artifacts.
      - Add a non-mutating checksum verifier and governance tests.
      - Add human approval intake and change-ticket templates that keep approvals pending.
      - Add evidence archive index, release handoff memo, and post-board action register.
      - Run full API and web regressions before declaring release-candidate seal complete.
    generated_tests:
      seal:
        - Checksum manifest parses and every sealed artifact exists.
        - Checksum verifier recomputes hashes and fails on mismatch.
      approval_intake:
        - Approval intake cannot claim UAT, CAB, go-live, target smoke, cutover, or rollback approval.
        - Change-ticket template requires human owner/date/status.
      release:
        - PH-13A through PH-13E pipeline checks pass.
        - Full API and web checks pass.
    review_criteria:
      - PH-13 never performs production deployment or approval.
      - Every approval-sensitive artifact contains human-pending markers.
      - Checksum verification is read-only.
      - No production credentials are required or stored.
    rollback_retry_policy:
      rollback: Revert PH-13 seal/intake/archive artifacts only; no production state exists to roll back.
      retry: Recompute and re-verify the seal after correcting any release evidence drift.
      quarantine: Missing human approvals keep the release candidate sealed but not approved.
    exit_criteria:
      - Release candidate evidence package is sealed and machine-verified.
      - Approval-intake guardrails are complete.
      - Archive and handoff package is complete.
      - PH-13A through PH-13E checks pass.
      - Full API and web regression passes.

  - id: PH-14
    name: Post-Seal Drift Watch and Board-Day Readiness
    planner_stage: implementation
    status: planned
    goal: >
      Watch the sealed PH-13 release candidate for evidence drift, prepare
      board-day run cards and no-go quarantine handling, and define approval-
      evidence quarantine/redaction rules while keeping human approvals and
      production execution outside the agentic pipeline.
    requirements:
      - PH-13 checksum seal still verifies with no sealed artifact drift.
      - Drift watch documents and report record `DRIFT_STATUS_GREEN` or fail closed.
      - Board-day run card and no-go quarantine plan are ready without executing production actions.
      - Approval evidence quarantine and redaction rules prevent secrets/PII from entering the repository.
      - Final verdict records post-seal drift watch green with `GO_LIVE_HUMAN_APPROVAL_PENDING`.
    dependencies: [PH-13]
    expected_files:
      create:
        - docs/spec/ph-14-post-seal-drift-watch-plan.md
        - docs/spec/ph-14-verdict.md
        - docs/release/release-candidate-drift-watch.md
        - docs/release/post-seal-drift-report.md
        - docs/release/board-day-run-card.md
        - docs/release/no-go-quarantine-plan.md
        - docs/release/approval-evidence-quarantine.md
        - docs/release/approval-evidence-redaction-guide.md
        - docs/release/board-decision-intake-playbook.md
        - ops/check-release-candidate-drift.sh
        - ops/board-day-readiness-check.sh
        - apps/api/test/ph14-post-seal-drift-watch.test.cjs
      modify:
        - docs/spec/pipeline/phases.yaml
        - docs/spec/manifest.json
        - docs/phased-plan.md
    implementation_steps:
      - Freeze PH-14 plan and wire PH-14A through PH-14E as executable gates.
      - Add a drift-watch checker that runs the PH-13 checksum verifier and fails closed on drift.
      - Add board-day run card and no-go quarantine materials for human release-board use.
      - Add approval-evidence quarantine, redaction guide, and decision-intake playbook.
      - Run full API and web regressions before declaring post-seal drift watch complete.
    generated_tests:
      drift_watch:
        - PH-13 seal verifier passes.
        - Drift report records `SEALED_ARTIFACTS_UNCHANGED`.
      board_day:
        - Board-day checks require no production credentials or execution.
        - No-go quarantine rules keep release blocked on drift or missing approval.
      release:
        - PH-14A through PH-14E pipeline checks pass.
        - Full API and web checks pass.
    review_criteria:
      - PH-14 never performs approval, target smoke, production cutover, or rollback.
      - Drift checks fail closed.
      - Approval evidence handling rejects secrets and PII in repository artifacts.
      - Every board-day action remains human-owned.
    rollback_retry_policy:
      rollback: Revert PH-14 drift-watch/readiness artifacts only; no production state exists to roll back.
      retry: Rerun PH-13B reseal if drift is legitimate and approved by the release board.
      quarantine: Any checksum drift, missing approval evidence, or production credential request quarantines release progression.
    exit_criteria:
      - Post-seal drift watch passes.
      - Board-day readiness and no-go quarantine checks pass.
      - Approval-evidence quarantine/redaction package is complete.
      - PH-14A through PH-14E checks pass.
      - Full API and web regression passes.

ui_remediation_2026_07_11:
  plan_id: HRMS-UIR-20260711
  title: Council-Amended UI Release Remediation Plan
  status: proposed_awaiting_architecture_and_contract_decisions
  classification: standard
  objective: >
    Close every finding from the 2026-07-11 UI review through an explicit
    disposition and make all 16 blocking UI gates pass with deterministic,
    role-aware, responsive, accessibility, authorization-negative, and
    regression evidence while preserving existing API, RBAC, workflow, data,
    and error contracts.
  source_artifacts:
    - docs/reviews/ui-review-all-2026-07-11.md
    - doc/evaluations/hrms-ui-remediation-council-report-20260711.md
    - docs/architecture.md
    - docs/spec/ph-05-ui-implementation-plan.md
    - docs/spec/ph-05-verdict.md
    - docs/contracts/auth-matrix.yaml
    - docs/contracts/error-taxonomy.yaml
  council_constraints:
    - The 27 findings and 28 backlog rows overlap; consolidation must not erase traceability.
    - Every original UI-01 through UI-28 item receives fix, merge, defer, or reject disposition with evidence.
    - All 16 blocking gates must pass; backlog completion percentage is not a release criterion.
    - Do not invent workspace, password-reset, session-expiry, workflow-export, locale, or confirmation semantics.
    - UI routing never widens server-enforced authorization or data scope.
    - Production dependencies require the repository amendment workflow.
    - Preserve current functional forms, API payloads, RBAC checks, and module state behavior unless an approved contract changes.
  finding_closure_schema:
    required_fields:
      - finding_or_backlog_id
      - source_evidence
      - disposition
      - blocking_gate
      - affected_personas
      - affected_journeys
      - expected_files
      - automated_tests
      - manual_evidence
      - viewport_matrix
      - theme_matrix
      - authorization_negative_cases
      - rollback_trigger
      - owner
      - target_date
      - closure_status
  critical_journeys:
    - id: CJ-EMPLOYEE
      persona: Employee
      flow: authenticate, enter Me workspace, navigate to profile and leave, submit a permitted request, observe recoverable status
    - id: CJ-MANAGER
      persona: Manager
      flow: authenticate, enter My Team, open workflow inbox, review and act on a task with mandatory reason and safe confirmation
    - id: CJ-ADMIN
      persona: HR or payroll administrator
      flow: authenticate, enter Admin, navigate to governed configuration or payroll, perform a permitted finalizing action, verify denial boundaries
  evidence_matrix:
    viewports: ["360x800", "768x1024", "1280x800"]
    personas: [employee, manager, admin, denied_user]
    modes: [ready, loading, empty, error, no_permission, partial_data, session_expired]
    interaction: [pointer, keyboard, screen_reader_smoke]
    themes: >
      Light is mandatory. Dark is added to the mandatory matrix only if the
      architecture decision confirms a shipped dark theme; otherwise dark mode
      is explicitly deferred with owner and date.
  parallel_groups:
    PG-0-entry:
      after: UIR-00
      can_run_in_parallel: [UIR-01, UIR-02]
      sync_gate: UIR-G1
    PG-1-contracts:
      after: UIR-G1
      can_run_in_parallel: [UIR-03, UIR-04]
      sync_gate: UIR-G2
    PG-2-ui-slices:
      after: UIR-05
      can_run_in_parallel:
        - UIR-06A-login
        - UIR-06B-workflow
        - UIR-06C-payroll
      sync_gate: UIR-G4
  phases:
    - id: UIR-00
      name: Resolve Conflicts and Freeze the Remediation Envelope
      planner_stage: CONFLICT/migration
      status: blocked_pending_human_decisions
      goal: >
        Resolve architecture and product-contract conflicts before changing UI
        behavior or introducing dependencies, and create the closure ledger that
        prevents any original finding from disappearing.
      requirements:
        - Decide the authoritative design-system contract: Tailwind plus shadcn, or an approved architecture amendment for equivalent local primitives.
        - Approve any new routing, component, i18n, or browser-test production/development dependencies through dependency policy.
        - Freeze route and destination ownership for Inbox and G01 through G14.
        - Freeze Me, My Team, and Admin data-scope behavior with server-enforced authorization expectations.
        - Freeze supported login, password-reset, session-expiry, workflow-config, evidence-export, error-reference, and sensitive-action confirmation behavior.
        - Classify each UI-01 through UI-28 row as fix, merge, defer, or reject with rationale.
      dependencies: []
      expected_files:
        create:
          - docs/spec/ui-remediation/finding-closure-ledger.yaml
          - docs/spec/ui-remediation/design-system-decision.md
          - docs/spec/ui-remediation/route-workspace-contract.md
          - docs/spec/ui-remediation/auth-action-contract-decisions.md
          - docs/spec/ui-remediation/critical-journey-acceptance.md
        modify:
          - docs/architecture.md
          - docs/spec/ph-05-ui-implementation-plan.md
          - package.json
          - package-lock.json
      generated_tests:
        contract:
          - closure ledger schema validation covers UI-01 through UI-28 exactly once
          - route table has a unique destination and permission for every visible navigation entry
          - workspace matrix includes positive and negative scope assertions
      review_criteria:
        - No unresolved equal-evidence product choice is hidden in implementation steps.
        - Dependency changes have explicit approval and deterministic versions.
        - Deferred items have owner, rationale, target date, and non-blocking gate evidence.
        - Architecture and PH-05 no longer contradict each other on the design system.
      rollback_retry_policy:
        rollback: Revert decision artifacts only; no runtime behavior changes in this phase.
        retry: Time-box unresolved decisions and quarantine the affected finding while unrelated evidence work continues.
        quarantine: Workspace, reset, export, session, locale, or action behavior without an approved contract cannot enter implementation.
      exit_criteria:
        - Architecture and dependency decision is approved.
        - UI-01 through UI-28 have stable dispositions.
        - Route, workspace, auth, and sensitive-action contracts are accepted.

    - id: UIR-01
      name: Restore Baseline and Apply Design-Neutral Partial Repairs
      planner_stage: PARTIAL modifications
      status: planned
      goal: >
        Restore deterministic verification, capture the pre-migration baseline,
        and close low-blast-radius confirmed defects that do not depend on the
        design-system decision.
      requirements:
        - Replace the broken sibling-linked TypeScript dependency through the approved dependency source.
        - Clean-install and record web typecheck, build, tests, and PH-05E output before UI changes.
        - Preserve and record existing user changes on the active feature branch.
        - Remove the production StandardOperationalStates gallery.
        - Correct 100vh to a 100dvh strategy, direct aria-invalid expression, password-toggle state naming, and reduced-motion handling.
        - Add the global error boundary without changing API behavior.
      dependencies: [UIR-00]
      finding_coverage: [UI-05, UI-09, UI-14, UI-16]
      expected_files:
        create:
          - apps/web/src/app/ErrorBoundary.tsx
          - apps/web/test/ui-remediation-baseline.test.cjs
          - docs/evidence/ui-remediation/baseline-command-log.md
        modify:
          - package.json
          - package-lock.json
          - apps/web/src/main.tsx
          - apps/web/src/app/AppShell.tsx
          - apps/web/src/app/LoginPanel.tsx
          - apps/web/src/workflow/TaskActionPanel.tsx
          - apps/web/src/styles.css
      generated_tests:
        unit:
          - ErrorBoundary renders retry and safe recovery actions
          - false operational-state gallery is absent from ready shell
          - password toggle exposes accessible name and pressed state
        static:
          - no 100vh remains in web production source
          - prefers-reduced-motion rule exists
        commands:
          - npm run web:typecheck
          - npm run web:build
          - npm run web:test
          - bash docs/spec/pipeline/checks/ph-05e.sh
      review_criteria:
        - All command failures are product failures, not missing-tool failures.
        - No production dependency beyond UIR-00 approval is introduced.
        - Error UI does not reveal stack traces, paths, secrets, or PII.
      rollback_retry_policy:
        rollback: Revert each design-neutral fix independently; restore the prior package lock only if clean install remains reproducible.
        retry: Repair dependency resolution before any later phase; do not waive typecheck.
        quarantine: A failing error-boundary slice does not block baseline evidence, but blocks UIR-06.
      exit_criteria:
        - Clean-install web checks and PH-05E are green or remaining RED items are documented product defects assigned to later phases.
        - Pre-change build size, screenshots where possible, and command logs are sealed.

    - id: UIR-02
      name: Create Deterministic Personas, Fixtures, and Acceptance Oracles
      planner_stage: MISSING data
      status: planned
      goal: >
        Make every critical role, workspace, denial, loading, error, and recovery
        scenario reproducible so later UI evidence is independent of ambient backend state.
      requirements:
        - Seed Employee, Manager, Admin, and denied-user personas with explicit permission sets.
        - Seed Me, My Team, and Admin workspace data with non-overlapping records.
        - Provide deterministic loading, empty, error, partial-data, session-expired, and stale-cache controls in test-only adapters.
        - Define deep-link and cached-data authorization-negative fixtures.
        - Map all 16 blocking gates and UI-01 through UI-28 to acceptance evidence.
      dependencies: [UIR-00]
      finding_coverage: [UI-17]
      expected_files:
        create:
          - apps/web/test/fixtures/ui-personas.ts
          - apps/web/test/fixtures/ui-workspaces.ts
          - apps/web/test/fixtures/ui-state-controls.ts
          - docs/spec/ui-remediation/gate-acceptance-matrix.yaml
          - docs/spec/ui-remediation/authorization-negative-matrix.yaml
        modify:
          - apps/web/src/api/fixtureHrmsClient.ts
      generated_tests:
        fixture:
          - each persona has deterministic grants and denials
          - workspace fixture records never cross persona scope
          - every canonical state can be selected without production code paths
      review_criteria:
        - Fixtures contain synthetic data only and no real PII.
        - Test-only controls cannot be enabled in production builds.
        - Every blocking gate has at least one observable oracle.
      rollback_retry_policy:
        rollback: Remove fixture additions without changing production client behavior.
        retry: Regenerate synthetic IDs and rerun determinism tests.
        quarantine: Missing backend scenarios may use contract-faithful test adapters but cannot be claimed as live integration proof.
      exit_criteria:
        - All personas, workspaces, canonical states, and negative cases reproduce deterministically.
        - Finding closure ledger links to the acceptance matrix.

    - id: UIR-03
      name: Implement Approved Workspace and Session Service Semantics
      planner_stage: service
      status: planned_if_contract_requires
      goal: >
        Supply only the server-enforced service behavior required by accepted
        workspace, session, reset, export, and error-reference contracts.
      requirements:
        - Workspace scope is resolved by P02/RLS-backed services, never client labels alone.
        - Session-expiry semantics preserve intended destination without exposing protected data.
        - Password-reset and evidence-export services are implemented only if approved and absent.
        - User-safe error references preserve correlation while internal details remain server-side.
      dependencies: [UIR-01, UIR-02]
      finding_coverage: [UI-03, UI-07, UI-08, UI-15, UI-24]
      expected_files:
        inspect_then_modify:
          - apps/api/src/**
          - apps/web/src/api/hrmsClient.ts
          - docs/contracts/auth-matrix.yaml
          - docs/contracts/error-taxonomy.yaml
      generated_tests:
        service:
          - Employee cannot resolve My Team or Admin scope
          - stale and cached workspace reads fail closed after scope change
          - session expiry invalidates protected requests and retains only safe redirect metadata
          - reset and export operations follow maker-checker/audit policy where applicable
      review_criteria:
        - No client-side workspace state is treated as authorization.
        - No new error code, auth behavior, or export behavior exists without contract amendment.
        - Sensitive operations are audited without logging PII values or tokens.
      rollback_retry_policy:
        rollback: Disable new optional service routes and retain existing fail-closed behavior.
        retry: Correct service contract implementation without weakening denial tests.
        quarantine: Unsupported reset/export functions remain hidden or clearly unavailable; no no-op control ships.
      exit_criteria:
        - Required service behaviors pass positive and negative scope/session tests.

    - id: UIR-04
      name: Expose Approved UI-Supporting API Contracts
      planner_stage: API
      status: planned_if_contract_requires
      goal: >
        Expose typed, protected, bounded endpoints needed by the accepted UI
        journeys without changing unrelated module contracts.
      requirements:
        - Every endpoint is explicitly protected by project auth middleware unless the contract marks it public.
        - Workspace list/read operations are bounded and scoped.
        - Reset, session, export, and supported workflow-config verbs have typed request/response and safe errors.
        - Unsupported workflow-config controls are removed from UI rather than backed by invented endpoints.
      dependencies: [UIR-01, UIR-02, UIR-03]
      finding_coverage: [UI-03, UI-07, UI-08, UI-15, UI-24]
      expected_files:
        inspect_then_modify:
          - apps/api/src/http/**
          - apps/api/src/routes/**
          - apps/api/src/openapi/contractRegistry.ts
          - docs/contracts/openapi/P01-workflow.yaml
          - apps/web/src/api/hrmsClient.ts
      generated_tests:
        contract:
          - auth and scope denial for every new route
          - schema and error-envelope validation
          - bounded pagination for list operations
          - idempotency for unsafe operations
      review_criteria:
        - OpenAPI, code, client types, and tests agree.
        - No route leaks another workspace through deep link, cache, or stale token.
        - No hardcoded localhost, token, PII, or stack trace appears.
      rollback_retry_policy:
        rollback: Feature-disable the individual new route and hide its UI entry.
        retry: Amend and regenerate the contract before implementation correction.
        quarantine: One unsupported route blocks only its UI verb, not unrelated critical journeys.
      exit_criteria:
        - Required UI-supporting APIs pass contract, auth, scope, idempotency, and error tests.

    - id: UIR-05
      name: Establish the Approved Design System and Test Harness
      planner_stage: UI
      status: planned
      goal: >
        Build a small, approved, accessible foundation and browser harness before
        migrating critical journeys or dozens of controls.
      requirements:
        - Follow the UIR-00 design-system decision; if Tailwind/shadcn is approved, configure it and add only approved deterministic dependencies.
        - Define framework-neutral tokens and component contracts for Button, Input, Select, Field, Alert, Card, Dialog, Drawer, Table, Skeleton, and live notifications.
        - Enforce focus-visible, disabled/loading, 44px targets, reduced motion, semantic colors, and safe responsive defaults in primitives.
        - Retain old CSS during migration and prevent duplicate visual systems from expanding.
        - Install/configure approved browser and accessibility tooling with viewport and persona fixtures.
      dependencies: [UIR-01, UIR-02]
      finding_coverage: [UI-04, UI-11, UI-12, UI-14, UI-17, UI-18, UI-28]
      expected_files:
        create_or_modify_per_decision:
          - tailwind.config.ts
          - components.json
          - apps/web/src/components/ui/**
          - apps/web/src/styles/tokens.css
          - apps/web/src/lib/cn.ts
          - apps/web/test/e2e/**
          - apps/web/playwright.config.ts
        modify:
          - package.json
          - package-lock.json
          - apps/web/src/styles.css
      generated_tests:
        component:
          - every primitive has default, hover, active, focus-visible, disabled, loading, and error coverage where applicable
          - Dialog and Drawer trap focus, close on Escape, return focus, and lock body scroll
        browser:
          - primitive gallery at 360x800, 768x1024, and 1280x800
          - keyboard and axe smoke tests
          - measured contrast pairs meet WCAG AA
      review_criteria:
        - The foundation proves the architecture decision without a whole-app rewrite.
        - shadcn/Tailwind usage is required only if UIR-00 approved it; otherwise equivalent local contracts are documented.
        - Bundle and CSS size deltas are recorded.
      rollback_retry_policy:
        rollback: Remove the new foundation slice and keep existing CSS/components unchanged.
        retry: Correct tokens/primitives before migrating critical flows.
        quarantine: A failing primitive blocks only consumers of that primitive; existing functional UI remains available behind a feature flag.
      exit_criteria:
        - Minimal primitive set passes component, keyboard, contrast, and viewport tests.
        - Clean install, typecheck, build, and existing web tests remain green.

    - id: UIR-06
      name: Repair Shell and Critical Journeys by Vertical Slice
      planner_stage: UI
      status: planned
      goal: >
        Make navigation, workspaces, login, workflow, and payroll trustworthy,
        responsive, accessible, and contract-correct using the approved foundation.
      dependencies: [UIR-03, UIR-04, UIR-05]
      finding_coverage:
        - UI-01
        - UI-02
        - UI-03
        - UI-04
        - UI-06
        - UI-07
        - UI-08
        - UI-10
        - UI-12
        - UI-13
        - UI-15
        - UI-21
        - UI-23
        - UI-24
        - UI-25
        - UI-26
        - UI-27
      increments:
        - id: UIR-06A-shell
          requirements:
            - Real destinations and progressive disclosure for every visible nav item.
            - Active state and heading focus transfer.
            - Mobile drawer with hamburger, icons, backdrop, Escape, focus management, scroll lock, and safe areas.
            - Workspace content/scope matches the approved contract and denies deep links/cache leakage.
          expected_files:
            - apps/web/src/App.tsx
            - apps/web/src/app/AppShell.tsx
            - apps/web/src/app/navigation.ts
            - apps/web/src/app/WorkspaceSwitcher.tsx
            - apps/web/src/styles.css
          generated_tests:
            - click every nav entry and assert destination, heading focus, active state, and permission
            - mobile drawer keyboard/touch tests at 360x800
            - workspace positive and negative authorization tests
        - id: UIR-06B-login
          requirements:
            - Async loading and double-submit prevention.
            - Error clearing and field-linked validation.
            - Intended redirect and session-expiry message where contract supports them.
            - Reset panel only where approved; otherwise no misleading control.
          expected_files:
            - apps/web/src/app/LoginPanel.tsx
            - apps/web/src/app/session.ts
          generated_tests:
            - delayed login and rapid double-click
            - invalid credential accessibility tree
            - reset/session redirect contract tests
        - id: UIR-06C-workflow
          requirements:
            - Validate, simulate, review, publish, and export controls produce visible supported outcomes or are removed/quarantined.
            - Mandatory reason and safe, user-readable feedback remain intact.
            - Confirm only actions classified as irreversible or finalizing.
          expected_files:
            - apps/web/src/workflow/**
          generated_tests:
            - every visible verb changes visible state or invokes a supported API
            - maker-checker and denial tests
            - keyboard confirmation and cancel tests
        - id: UIR-06D-payroll
          requirements:
            - Finalizing payroll actions use the approved confirmation policy.
            - Disabled actions explain prerequisites accessibly.
            - Lifecycle status and errors remain contract-faithful and user-safe.
          expected_files:
            - apps/web/src/modules/g10/**
          generated_tests:
            - irreversible/finalizing action confirmation and cancellation
            - permission and lifecycle denial matrices
      review_criteria:
        - CJ-EMPLOYEE, CJ-MANAGER, and CJ-ADMIN pass at all three viewports.
        - No visible no-op, dead destination, false state, or client-only authorization exists.
        - Keyboard traversal and axe have no blocking violations.
        - Existing API payload and RBAC tests remain green.
      rollback_retry_policy:
        rollback: Feature-flag routing, workspace behavior, and each critical flow independently; retain hash parity until routed parity passes.
        retry: Correct one vertical slice without weakening acceptance or authorization-negative tests.
        quarantine: Unsupported reset/export/config verbs are hidden while login, inbox, and supported workflow actions continue.
      exit_criteria:
        - All critical journeys and their denial cases pass browser, keyboard, responsive, and accessibility checks.

    - id: UIR-07
      name: Migrate Remaining Modules and Conditional Quality Features
      planner_stage: UI
      status: planned
      goal: >
        Apply the proven shell/primitives to remaining module surfaces, close
        reproduced responsive and state gaps, and implement conditional
        architecture/requirements obligations without widening release scope.
      requirements:
        - Migrate remaining module controls incrementally; preserve real fields, client calls, RBAC, and canonical states.
        - Reflow record tables into cards below the approved breakpoint unless the content is a true matrix.
        - Provide critical empty/error/retry/live feedback; add layout-matching skeletons only where measured value justifies them.
        - Implement i18n and dark theme only if UIR-00 confirms them as shipped requirements; otherwise record explicit deferrals.
        - Add search/filter only to accepted list-view requirements, with bounded/debounced queries and URL state where approved.
      dependencies: [UIR-06]
      finding_coverage: [UI-13, UI-19, UI-20, UI-21, UI-22, UI-23, UI-27, UI-28]
      expected_files:
        inspect_then_modify:
          - apps/web/src/modules/g01/**
          - apps/web/src/modules/g02/**
          - apps/web/src/modules/g03/**
          - apps/web/src/modules/g04/**
          - apps/web/src/modules/g05/**
          - apps/web/src/modules/g06/**
          - apps/web/src/modules/g07/**
          - apps/web/src/modules/g08/**
          - apps/web/src/modules/g09/**
          - apps/web/src/modules/g11/**
          - apps/web/src/modules/g12/**
          - apps/web/src/modules/g13/**
          - apps/web/src/modules/g14/**
          - apps/web/src/locales/**
          - apps/web/src/styles/**
      generated_tests:
        module:
          - canonical state and mutation regressions for every migrated module
          - responsive table/card tests with long values
          - locale parity and long-string tests if i18n is approved
          - light/dark contrast snapshots if dark theme is approved
        performance:
          - bundle delta and route chunk report
          - throttled loading and CLS evidence for skeletonized views
      review_criteria:
        - No skeleton or thin functional component is introduced.
        - Conditional features link to approved requirements or explicit deferrals.
        - Every migrated module retains permission and error behavior.
      rollback_retry_policy:
        rollback: Roll back one module migration to its prior functional presentation without reverting the shared shell.
        retry: Remediate module-specific visual/accessibility regressions behind the module flag.
        quarantine: A failing non-critical module or conditional feature does not reopen proven critical journeys.
      exit_criteria:
        - Every UI-01 through UI-28 ledger entry is fixed, merged to closed evidence, or formally deferred/rejected.
        - All reproduced mobile overflow, contrast, and state failures are closed.

    - id: UIR-08
      name: Integrate, Validate, and Prepare the Human Release Decision
      planner_stage: integration
      status: planned
      goal: >
        Prove the amended UI against all blocking gates and produce a human
        approval package without claiming evidence that was not executed.
      dependencies: [UIR-07]
      finding_coverage: [UI-01, UI-02, UI-03, UI-04, UI-05, UI-06, UI-07, UI-08, UI-09, UI-10, UI-11, UI-12, UI-13, UI-14, UI-15, UI-16, UI-17, UI-18, UI-19, UI-20, UI-21, UI-22, UI-23, UI-24, UI-25, UI-26, UI-27, UI-28]
      expected_files:
        create:
          - docs/evidence/ui-remediation/final-command-log.md
          - docs/evidence/ui-remediation/screenshot-matrix/**
          - docs/evidence/ui-remediation/accessibility-summary.md
          - docs/evidence/ui-remediation/keyboard-traversal.md
          - docs/evidence/ui-remediation/authorization-negative-results.md
          - docs/release/ui-remediation-readiness.md
        modify:
          - docs/spec/ui-remediation/finding-closure-ledger.yaml
          - docs/reviews/ui-review-all-2026-07-11.md
          - docs/spec/ph-05-verdict.md
      generated_tests:
        full_regression:
          - clean install, typecheck, build, web tests, API tests, and PH-05E
          - CJ-EMPLOYEE, CJ-MANAGER, and CJ-ADMIN at all required viewports
          - denied-user, deep-link, stale-cache, and session-expiry negatives
          - keyboard-only and axe scans on login, shell, workflow, payroll, and representative module
          - light and conditional dark screenshots
        human_validation:
          - representative employee, manager, and admin task walkthrough
          - keyboard or screen-reader user critical-journey walkthrough
      review_criteria:
        - All 16 blocking gates are PASS; PARTIAL is not release-ready for this remediation plan.
        - Every evidence claim names the command/artifact and execution result.
        - No unresolved P0/P1 finding lacks accepted defer/reject authority.
        - Human validation issues are triaged before release decision.
      rollback_retry_policy:
        rollback: Revert or disable the failing vertical slice; do not waive a blocking gate.
        retry: Rerun only after root-cause remediation and then rerun the full critical-journey matrix.
        quarantine: One module may be disabled if its absence does not break a signed critical journey; shell, auth, authorization, and workflow safety cannot be quarantined for release.
      exit_criteria:
        - Blocking gates are 16 of 16 PASS.
        - Finding ledger has no unowned or unexplained open item.
        - Required screenshot, keyboard, accessibility, role, viewport, command, and regression evidence is complete.
        - Human release owner records GO or NO-GO.
  gates:
    - id: UIR-G0
      after: UIR-00
      pass_when:
        - Architecture/dependency decision approved.
        - Route/workspace/auth/action contracts frozen.
        - UI-01 through UI-28 dispositions complete.
      blocks: [UIR-01, UIR-02]
    - id: UIR-G1
      after: [UIR-01, UIR-02]
      pass_when:
        - Deterministic build/test baseline exists.
        - Persona, workspace, canonical-state, and authorization-negative fixtures pass.
      blocks: [UIR-03, UIR-04, UIR-05]
    - id: UIR-G2
      after: [UIR-03, UIR-04]
      pass_when:
        - Required service/API contracts pass scope, auth, error, and idempotency tests.
        - Unsupported behaviors are explicitly hidden or quarantined.
      blocks: [UIR-06]
    - id: UIR-G3
      after: UIR-05
      pass_when:
        - Approved primitives and harness pass viewport, keyboard, contrast, and build tests.
      blocks: [UIR-06]
    - id: UIR-G4
      after: UIR-06
      pass_when:
        - Three critical journeys and denial cases pass at all viewports.
      blocks: [UIR-07]
    - id: UIR-G5
      after: UIR-08
      pass_when:
        - All 16 blocking gates pass.
        - Finding ledger and evidence package are complete.
      outcome: human_release_decision

phase_gates:
  gate_0_workflow_platform_extraction:
    after: PH-00
    gate: agentic
    pass_when:
      - PUDA golden workflow behavior preserved.
      - PUDA strangler boundary proves existing workflows can call the platform facade.
      - HRMS adapter synthetic workflows pass.
      - P01 contract/schema gap report passes the executable PH-00 gate.
      - No PUDA code is copied into reusable packages without provenance clearance; unresolved provenance blocks external distribution/productization, not internal facade-only HRMS build.
    blocks:
      - PH-01
      - all HRMS workflow-dependent coding
  gate_1_platform_contract_freeze:
    after: PH-01
    gate: agentic
    pass_when:
      - P01 OpenAPI exists.
      - P01 schema amendments approved.
      - HRMS architecture updated.
    blocks:
      - PH-02
  gate_2_authority_resolution:
    after: PH-02
    gate: agentic
    pass_when:
      - Reporting-chain and position-authority resolution pass tests.
      - Ambiguous and SoD-blocked cases fail closed.
    blocks:
      - PH-03
  gate_3_vertical_slice_exit:
    after: PH-06
    gate: agentic
    pass_when:
      - G03 and G05 flows run from UI through API to workflow, audit, notification, document, and SR evidence.
      - No hardcoded approval path remains.
    blocks:
      - PH-07
      - PH-08
      - PH-09

traceability:
  requirements_sources:
    - docs/brd/v3/*.md
    - docs/contracts/state-machines.yaml
    - docs/contracts/auth-matrix.yaml
    - docs/contracts/dependency-register.yaml
  evidence_required_per_phase:
    - changed files
    - generated tests
    - test logs
    - schema load logs where applicable
    - screenshots for UI phases
    - API contract validation logs
    - SR conformance evidence for every writer
    - P05 audit evidence for workflow and statutory writes
