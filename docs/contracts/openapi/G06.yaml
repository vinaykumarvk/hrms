  # ---------------------------------------------------------------------------
  # Canonical G12 SR ingestion write-port (G06 facade relay)
  # ---------------------------------------------------------------------------
  /sr/ingest:
    post:
      tags: [SR Ingest]
      operationId: srIngest
      summary: >-
        Canonical SR ledger write-port. G06 relays establishment events
        (PROMOTION / OFFICIATING / MACP / CONFIRMATION / POSTING / REVERSION)
        here. Idempotent; deduped on
        (source_module="G06", source_reference_id, source_event_version).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SrIngestRequest' }
      responses:
        '201':
          description: SR event appended (or idempotent replay of the original).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SrIngestResult' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Conflict (idempotent duplicate; original sr_event_id returned).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412':
          description: Precondition failed (SR_POSTING_FAILED — held for retry; upstream down).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /sr/ingest/reversal:
    post:
      tags: [SR Ingest]
      operationId: srIngestReversal
      summary: >-
        Canonical SR reversal/correction write-port. Uses is_reversal=true +
        reverses_source_reference_id and, where published, a *_CANCELLED partner
        code (PROMOTION_CANCELLED / OFFICIATING_CANCELLED).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SrReversalRequest' }
      responses:
        '201':
          description: SR reversal appended; G12 auto-spawns the corrigendum.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SrIngestResult' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412':
          description: Precondition failed (SR_POSTING_FAILED — held for retry).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT carrying resolved roles + tenant/entity scope (P02).

  headers:
    XCorrelationId:
      description: Correlation id echoed on every response and written to every audit/log line.
      schema: { type: string }

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    EntryId:
      name: entryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PointId:
      name: pointId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required on unsafe transaction-creating POSTs; 24h replay returns the original result.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      description: Page size (default 25, max 100).
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      description: Opaque forward cursor from a prior response's next_cursor.
      schema: { type: string }
    Sort:
      name: sort
      in: query
      description: Sort expression, e.g. field:asc or field:desc.
      schema: { type: string }

  responses:
    ValidationFailed:
      description: 422 — input failed a VAL-* / VAL-G06-* rule.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: 401 — no/invalid/expired session.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 403 — authenticated but not permitted (never leaks out-of-scope existence).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 404 — resource absent or out of scope.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: >-
        409 — idempotency replay, duplicate workflow start, or a G06 domain
        state/uniqueness conflict (bare domain code carried in error.code).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionFailed:
      description: >-
        412 — a required precondition is not met (e.g. ENTITY_SUB_JUDICE,
        SR_POSTING_FAILED, upstream G08/G09/G10/G12 unavailable).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: 429 — rate limit exceeded.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: 500 — unexpected server error (503 collapses here per X.3 mapping).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ---- Canonical error envelope ----
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: >-
                One of the 8 platform wire codes (VALIDATION_FAILED /
                UNAUTHENTICATED / FORBIDDEN / NOT_FOUND / CONFLICT /
                PRECONDITION_FAILED / RATE_LIMITED / INTERNAL) OR a G06 bare
                domain code (e.g. VACANCY_NOT_RECONCILED, MACP_CAP_REACHED,
                ENTITY_SUB_JUDICE, SR_POSTING_FAILED) carried in this field.
              example: VACANCY_NOT_RECONCILED
            message:
              type: string
              example: Case vacancy (13) does not match sanctioned promotion-quota vacancies (12).
            field:
              type: [string, "null"]
              example: vacancy_count
            details:
              type: [object, "null"]
              additionalProperties: true
              example: { case_vacancy: 13, sanctioned_promotion_quota: 12 }

    NextCursor:
      type: [string, "null"]
      description: Opaque cursor for the next page; null when exhausted.

    # ---- Common enums ----
    ReservationCategory:
      type: string
      enum: [GEN, SC, ST, OBC, EWS, PWBD]
    RecruitmentStream:
      type: string
      enum: [DIRECT, PROMOTEE, LDCE, DEPUTATION_ABSORPTION]
    ReckoningBasis:
      type: string
      enum: [DOJ_GRADE, REGULARISATION_DATE, MERIT_BATCH, DOB_TIEBREAK, ROSTER_POINT, EXAM_RESULT]
    Benchmark:
      type: string
      enum: [GOOD, VERY_GOOD, OUTSTANDING]
    DpcVerdict:
      type: string
      enum: [FIT, NOT_FIT, UNFIT, SEALED_COVER, DEFERRED, SUPERSEDED]
    PromotionCaseStatus:
      type: string
      enum:
        - DRAFT
        - FIELD_ASSEMBLED
        - ELIGIBILITY_DONE
        - PANEL_CONSTITUTED
        - DPC_HELD
        - SELECT_LIST_APPROVED
        - ORDERS_ISSUED
        - INTERIM_STAYED
        - CLOSED
        - CANCELLED
    ProbationStatus:
      type: string
      enum: [ON_PROBATION, EXTENDED, DECLARED_SATISFACTORY, REVERTED, DISCHARGED]
    FinancialUpgradationStatus:
      type: string
      enum: [DUE, UNDER_SCREENING, SANCTIONED, DEFERRED, REJECTED, EFFECTED]
    AlertType:
      type: string
      enum:
        - DUE_FOR_PROMOTION
        - MACP_DUE
        - STAGNATION
        - INCREMENT_DUE
        - PROBATION_ENDING
        - APAR_GAP_BLOCKING
        - SEALED_COVER_REVIEW_DUE
        - REFUSAL_DEBARMENT_ENDING
    AlertStatus:
      type: string
      enum: [OPEN, ACKNOWLEDGED, ACTIONED, DISMISSED, EXPIRED]
    LegalLinkedEntityType:
      type: string
      enum: [PROMOTION_CASE, PROMOTION_ORDER, SENIORITY_LIST, ROSTER, CANDIDATE]
    SrEventType:
      type: string
      enum:
        - PROMOTION
        - OFFICIATING
        - REVERSION
        - MACP
        - CONFIRMATION
        - POSTING
    SrReversalEventType:
      type: string
      enum: [PROMOTION_CANCELLED, OFFICIATING_CANCELLED]

    # ---- Seniority ----
    SeniorityListCreate:
      type: object
      required: [cadre_id, grade_designation_id, as_on_date, list_type]
      properties:
        list_no: { type: string, maxLength: 40 }
        cadre_id: { type: string, format: uuid }
        grade_designation_id: { type: string, format: uuid }
        org_unit_scope_id: { type: [string, "null"], format: uuid, description: NULL = state-wide. }
        as_on_date: { type: string, format: date }
        list_type: { type: string, enum: [TENTATIVE, FINAL] }
        is_multi_stream: { type: boolean, default: false }
        quota_rule_id: { type: [string, "null"], format: uuid }
    SeniorityList:
      type: object
      properties:
        tenant_id: { type: string, format: uuid }
        entity_id: { type: [string, "null"], format: uuid }
        seniority_list_id: { type: string, format: uuid }
        list_no: { type: string }
        cadre_id: { type: string, format: uuid }
        grade_designation_id: { type: string, format: uuid }
        org_unit_scope_id: { type: [string, "null"], format: uuid }
        as_on_date: { type: string, format: date }
        list_type: { type: string, enum: [TENTATIVE, FINAL] }
        status:
          type: string
          enum:
            - DRAFT
            - PUBLISHED_TENTATIVE
            - OBJECTIONS_OPEN
            - OBJECTIONS_CLOSED
            - FINALISED
            - UNDER_CORRECTION
            - SUPERSEDED
        is_multi_stream: { type: boolean }
        quota_rule_id: { type: [string, "null"], format: uuid }
        objection_window_start: { type: [string, "null"], format: date }
        objection_window_end: { type: [string, "null"], format: date }
        supersedes_list_id: { type: [string, "null"], format: uuid }
        correction_event_id: { type: [string, "null"], format: uuid }
        subject_to_litigation: { type: boolean }
        document_id: { type: [string, "null"], format: uuid }
        workflow_instance_id: { type: [string, "null"], format: uuid }
    SeniorityEntry:
      type: object
      properties:
        seniority_entry_id: { type: string, format: uuid }
        seniority_list_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        rank_position: { type: integer, minimum: 1 }
        recruitment_stream: { $ref: '#/components/schemas/RecruitmentStream' }
        quota_slot_label: { type: [string, "null"] }
        rotation_cycle_no: { type: [integer, "null"] }
        reckoning_basis: { $ref: '#/components/schemas/ReckoningBasis' }
        entry_into_grade_date: { type: string, format: date }
        tiebreak_value: { type: [string, "null"] }
        reservation_category: { $ref: '#/components/schemas/ReservationCategory' }
        is_provisional: { type: boolean }
        superseded_by_correction: { type: boolean }
        remarks: { type: [string, "null"] }
    ObjectionCreate:
      type: object
      required: [raised_by_employee_id, objection_type, grounds]
      properties:
        raised_by_employee_id: { type: string, format: uuid }
        target_entry_id: { type: [string, "null"], format: uuid }
        objection_type:
          type: string
          enum: [WRONG_POSITION, WRONG_DATE, OMISSION, CATEGORY_ERROR, STREAM_QUOTA_ERROR, OTHER]
        grounds: { type: string }
        supporting_document_id: { type: [string, "null"], format: uuid }
    Objection:
      type: object
      properties:
        objection_id: { type: string, format: uuid }
        objection_no: { type: string }
        seniority_list_id: { type: string, format: uuid }
        raised_by_employee_id: { type: string, format: uuid }
        target_entry_id: { type: [string, "null"], format: uuid }
        objection_type: { type: string }
        grounds: { type: string }
        supporting_document_id: { type: [string, "null"], format: uuid }
        status:
          type: string
          enum: [SUBMITTED, UNDER_REVIEW, UPHELD, REJECTED, PARTIALLY_UPHELD, TIME_BARRED, WITHDRAWN]
        disposal_remarks: { type: [string, "null"] }
        disposed_by: { type: [string, "null"], format: uuid }
        disposed_at: { type: [string, "null"], format: date-time }

    SeniorityQuotaRule:
      type: object
      required: [rule_code, cadre_id, grade_designation_id, dr_quota_ratio, promotee_quota_ratio, rotation_method, rotation_start_slot]
      properties:
        quota_rule_id: { type: string, format: uuid }
        rule_code: { type: string, maxLength: 40 }
        cadre_id: { type: string, format: uuid }
        grade_designation_id: { type: string, format: uuid }
        dr_quota_ratio: { type: integer }
        promotee_quota_ratio: { type: integer }
        ldce_quota_ratio: { type: integer, default: 0 }
        rotation_method: { type: string, enum: [ROTA_QUOTA, RUNNING_ACCOUNT, SEPARATE_STREAM] }
        rotation_start_slot: { type: string, enum: [DR_FIRST, PROMOTEE_FIRST] }
        unfilled_quota_carry_forward: { type: boolean, default: true }
        policy_reference: { type: [string, "null"] }
        effective_from: { type: [string, "null"], format: date }
        effective_to: { type: [string, "null"], format: date }
        is_active: { type: boolean }
    SeniorityQuotaRulePage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SeniorityQuotaRule' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    # ---- Eligibility ----
    EligibilityRule:
      type: object
      required: [rule_code, from_grade_id, to_grade_id, channel, min_qualifying_service_years, apar_lookback_years, apar_benchmark, apar_min_count_meeting_benchmark]
      properties:
        eligibility_rule_id: { type: string, format: uuid }
        rule_code: { type: string, maxLength: 40 }
        from_grade_id: { type: string, format: uuid }
        to_grade_id: { type: string, format: uuid }
        channel: { type: string, enum: [PROMOTION, MACP, OFFICIATING, LDCE] }
        min_qualifying_service_years: { type: number }
        min_qualifying_service_months: { type: [integer, "null"] }
        service_exclusion_rule_id: { type: [string, "null"], format: uuid }
        apar_lookback_years: { type: integer }
        apar_benchmark: { $ref: '#/components/schemas/Benchmark' }
        apar_min_count_meeting_benchmark: { type: integer }
        require_apar_communicated: { type: boolean, default: true }
        requires_vigilance_clearance: { type: boolean, default: true }
        disqualify_if_penalty_current: { type: boolean, default: true }
        qualification_exam_ref: { type: [string, "null"] }
        requires_exam_pass: { type: boolean, default: false }
        requires_cert_currency: { type: boolean, default: true }
        roster_applicable: { type: boolean, default: true }
        effective_from: { type: [string, "null"], format: date }
        effective_to: { type: [string, "null"], format: date }
        is_active: { type: boolean }
    EligibilityRulePage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/EligibilityRule' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    EligibilityAssessment:
      type: object
      properties:
        assessment_id: { type: string, format: uuid }
        promotion_case_id: { type: [string, "null"], format: uuid }
        employee_id: { type: string, format: uuid }
        eligibility_rule_id: { type: string, format: uuid }
        qsl_snapshot_id: { type: string, format: uuid }
        qualifying_service_years: { type: number }
        apar_pass: { type: boolean }
        apar_communicated: { type: boolean }
        apar_representation_status: { type: string, enum: [NONE, PENDING, DISPOSED, NOT_APPLICABLE] }
        apar_usable: { type: boolean }
        vigilance_status: { type: string, enum: [CLEAR, SEALED_COVER, NOT_CLEAR, PENDING] }
        disciplinary_status: { type: string, enum: [CLEAR, PENALTY_CURRENT, CHARGE_PENDING] }
        qualification_met: { type: boolean }
        exam_result_id: { type: [string, "null"], format: uuid }
        obc_creamy_layer_status: { type: [string, "null"], enum: [NON_CREAMY, CREAMY, NA] }
        ews_cert_valid_on_crucial_date: { type: [boolean, "null"] }
        overall_result: { type: string, enum: [ELIGIBLE, NOT_ELIGIBLE, SEALED_COVER, PROVISIONALLY_ELIGIBLE] }
        failure_reasons:
          type: [array, "null"]
          items: { type: string }
        rule_trace_json: { type: [object, "null"], additionalProperties: true }
        assessed_at: { type: string, format: date-time }

    # ---- Promotion case / panel / candidate ----
    PromotionCaseCreate:
      type: object
      required: [from_grade_id, to_grade_id, cadre_id, sanctioned_post_id, vacancy_year, promotion_mode, eligibility_rule_id, crucial_date]
      properties:
        from_grade_id: { type: string, format: uuid }
        to_grade_id: { type: string, format: uuid }
        cadre_id: { type: string, format: uuid }
        org_unit_scope_id: { type: [string, "null"], format: uuid }
        sanctioned_post_id: { type: string, format: uuid }
        vacancy_count: { type: integer, minimum: 0, description: Derived/validated from sanctioned_posts (VAL-G06-VACANCY-RECON). }
        vacancy_year: { type: integer }
        promotion_mode: { type: string, enum: [SENIORITY_FIT, SELECTION_MERIT, SENIORITY_CUM_FITNESS, LDCE] }
        eligibility_rule_id: { type: string, format: uuid }
        crucial_date: { type: string, format: date }
    PromotionCase:
      type: object
      properties:
        promotion_case_id: { type: string, format: uuid }
        case_no: { type: string }
        from_grade_id: { type: string, format: uuid }
        to_grade_id: { type: string, format: uuid }
        cadre_id: { type: string, format: uuid }
        org_unit_scope_id: { type: [string, "null"], format: uuid }
        sanctioned_post_id: { type: string, format: uuid }
        vacancy_count: { type: integer, minimum: 0 }
        vacancy_year: { type: integer }
        promotion_mode: { type: string, enum: [SENIORITY_FIT, SELECTION_MERIT, SENIORITY_CUM_FITNESS, LDCE] }
        eligibility_rule_id: { type: string, format: uuid }
        crucial_date: { type: string, format: date }
        status: { $ref: '#/components/schemas/PromotionCaseStatus' }
        subject_to_litigation: { type: boolean }
        workflow_instance_id: { type: [string, "null"], format: uuid }
    PanelMember:
      type: object
      properties:
        member_employee_id: { type: [string, "null"], format: uuid }
        external_member_name: { type: [string, "null"] }
        member_role: { type: string, enum: [CHAIRPERSON, MEMBER, SECRETARY, COMMISSION_NOMINEE, EXPERT] }
        attendance: { type: [string, "null"], enum: [PRESENT, ABSENT, RECUSED] }
        recusal_reason: { type: [string, "null"] }
    PanelCreate:
      type: object
      required: [panel_type, quorum_required, members]
      properties:
        panel_type:
          type: string
          enum: [DPC, DEPARTMENTAL_SELECTION_COMMITTEE, REVIEW_DPC, SUPPLEMENTARY_DPC, SCREENING_COMMITTEE]
        convened_date: { type: [string, "null"], format: date }
        panel_valid_from: { type: [string, "null"], format: date }
        panel_valid_until: { type: [string, "null"], format: date }
        quorum_required: { type: integer }
        members:
          type: array
          items: { $ref: '#/components/schemas/PanelMember' }
    Panel:
      type: object
      properties:
        panel_id: { type: string, format: uuid }
        promotion_case_id: { type: string, format: uuid }
        panel_type: { type: string }
        workflow_instance_id: { type: [string, "null"], format: uuid }
        convened_date: { type: [string, "null"], format: date }
        panel_valid_from: { type: [string, "null"], format: date }
        panel_valid_until: { type: [string, "null"], format: date }
        quorum_required: { type: integer }
        status: { type: string, enum: [CONSTITUTED, CONVENED, CONCLUDED, EXPIRED, DISSOLVED] }
        members:
          type: array
          items: { $ref: '#/components/schemas/PanelMember' }
    DpcProceedingCreate:
      type: object
      required: [promotion_case_id, meeting_date, benchmark_applied, quorum_met, select_list_count]
      properties:
        promotion_case_id: { type: string, format: uuid }
        meeting_date: { type: string, format: date }
        benchmark_applied: { $ref: '#/components/schemas/Benchmark' }
        quorum_met: { type: boolean }
        minutes_document_id: { type: [string, "null"], format: uuid }
        select_list_count: { type: integer }
        reserve_list_count: { type: integer, default: 0 }
        sealed_cover_count: { type: integer, default: 0 }
    DpcProceeding:
      type: object
      properties:
        proceeding_id: { type: string, format: uuid }
        panel_id: { type: string, format: uuid }
        promotion_case_id: { type: string, format: uuid }
        meeting_date: { type: string, format: date }
        benchmark_applied: { $ref: '#/components/schemas/Benchmark' }
        quorum_met: { type: boolean }
        minutes_document_id: { type: [string, "null"], format: uuid }
        select_list_count: { type: integer }
        reserve_list_count: { type: integer }
        sealed_cover_count: { type: integer }
        status: { type: string, enum: [DRAFT_MINUTES, APPROVED, RATIFIED] }
        approved_by: { type: [string, "null"], format: uuid }
    Candidate:
      type: object
      properties:
        candidate_id: { type: string, format: uuid }
        promotion_case_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        seniority_entry_id: { type: [string, "null"], format: uuid }
        zone_of_consideration: { type: string, enum: [IN_ZONE, EXTENDED_ZONE, OUT_OF_ZONE] }
        eligibility_assessment_id: { type: [string, "null"], format: uuid }
        reservation_category: { $ref: '#/components/schemas/ReservationCategory' }
        selected_on_own_merit: { type: boolean }
        roster_point_id: { type: [string, "null"], format: uuid }
        dpc_verdict: { $ref: '#/components/schemas/DpcVerdict' }
        select_list_rank: { type: [integer, "null"] }
        is_selected: { type: boolean }
        remarks: { type: [string, "null"] }
    CandidatePage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Candidate' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    # ---- Reservation roster ----
    ReservationRoster:
      type: object
      required: [roster_no, cadre_id, grade_designation_id, roster_type, cycle_size, policy_version, consequential_seniority_mode]
      properties:
        roster_id: { type: string, format: uuid }
        roster_no: { type: string, maxLength: 40 }
        cadre_id: { type: string, format: uuid }
        grade_designation_id: { type: string, format: uuid }
        roster_type: { type: string, enum: [PROMOTION_RESERVATION, DIRECT_RECRUITMENT, POST_BASED, VACANCY_BASED] }
        cycle_size: { type: integer }
        policy_version: { type: string }
        roster_applicable: { type: boolean, default: true }
        enabling_provision_ref: { type: [string, "null"] }
        quantifiable_data_doc_id: { type: [string, "null"], format: uuid }
        consequential_seniority_mode: { type: string, enum: [CONSEQUENTIAL, CATCH_UP], default: CATCH_UP }
        status: { type: string, enum: [ACTIVE, REVISED, ARCHIVED] }
    RosterPoint:
      type: object
      properties:
        roster_point_id: { type: string, format: uuid }
        roster_id: { type: string, format: uuid }
        point_number: { type: integer }
        reserved_for: { $ref: '#/components/schemas/ReservationCategory' }
        is_horizontal_pwbd: { type: boolean }
