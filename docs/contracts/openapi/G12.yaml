      operationId: getRevocationFeed
      security: []
      responses:
        '200':
          description: Signed revocation feed.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevocationFeed' }
        '500': { $ref: '#/components/responses/Internal' }

  # ============================== FR-12 ACCESS LOG ==========================
  /sr/access-log:
    get:
      tags: [AccessLog]
      summary: Query the SR access log (fail-closed)
      operationId: getAccessLog
      parameters:
        - name: employee_id
          in: query
          schema: { type: string, format: uuid }
        - name: actor
          in: query
          schema: { type: string }
        - name: action
          in: query
          schema: { $ref: '#/components/schemas/AccessAction' }
        - name: from_date
          in: query
          schema: { type: string, format: date }
        - name: to_date
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of access-log entries.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AccessLogEntry' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  # ============================== FR-13 SUBSCRIPTIONS =======================
  /sr/subscriptions:
    post:
      tags: [Subscriptions]
      summary: Register a pull-feed subscription
      operationId: createSubscription
      description: >
        Single authenticated PULL_FEED at launch. WEBHOOK / MESSAGE_BUS are deferred;
        registering them returns `SR_DELIVERY_MODE_DEFERRED`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionCreate' }
      responses:
        '201':
          description: Subscription registered.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '409':
          description: '`SR_DELIVERY_MODE_DEFERRED` — WEBHOOK/MESSAGE_BUS registered while deferred.'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/subscriptions/{id}/activate:
    post:
      tags: [Subscriptions]
      summary: Activate a subscription
      operationId: activateSubscription
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Subscription activated.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /sr/feed:
    get:
      tags: [Subscriptions]
      summary: Pull the authenticated SR change feed
      operationId: getFeed
      description: Cursor over the `service_register_events` change feed from a sequence watermark.
      parameters:
        - name: since_seq
          in: query
          description: Return changes after this global feed sequence.
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of feed events.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

