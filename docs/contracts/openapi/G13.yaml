        validFrom: { type: [string, "null"], format: date }
        validUntil: { type: [string, "null"], format: date }
        proposedBy: { type: [string, "null"], format: uuid }
        approvedBy: { type: [string, "null"], format: uuid }
    ClearanceProposeRequest:
      type: object
      required: [principalType, principalRef, clearanceLevel, justification]
      properties:
        principalType: { $ref: '#/components/schemas/ClearancePrincipalType' }
        principalRef: { type: string }
        clearanceLevel: { $ref: '#/components/schemas/ClassificationLevel' }
        orgScopeRef: { type: [string, "null"] }
        justification: { type: string }
        validFrom: { type: [string, "null"], format: date }
        validUntil: { type: [string, "null"], format: date }
    ClearancePage:
      type: object
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/SecurityClearance' }

    DataSubjectRequest:
      type: object
      description: GAP gov-specific — DPDP DSR + erasure precedence lattice.
      properties:
        dsrId: { type: string, format: uuid }
        subjectRef: { type: string }
        type: { $ref: '#/components/schemas/DsrType' }
        status: { $ref: '#/components/schemas/DsrStatus' }
        consentRefId: { type: [string, "null"], format: uuid }
        receivedAt: { type: string, format: date-time }
        erasureMethod: { type: [string, "null"], allOf: [ { $ref: '#/components/schemas/ErasureMethod' } ] }
        legalBasisExemption: { type: [string, "null"] }
        affectedDocumentCount: { type: [integer, "null"] }
        adjudicatedBy: { type: [string, "null"], format: uuid }
        executedBy: { type: [string, "null"], format: uuid }
    DsrInput:
      type: object
      required: [subjectRef, type]
      properties:
        subjectRef: { type: string }
        type: { $ref: '#/components/schemas/DsrType' }
        consentRefId: { type: [string, "null"], format: uuid }
    DsrAdjudicateRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [FULFILL, EXEMPT, REJECT, PARTIAL] }
        legalBasisExemption: { type: [string, "null"] }
        comment: { type: [string, "null"] }

    RehomeRequest:
      type: object
      properties:
        action: { type: string, enum: [RELINK, RETAIN, PROPOSE_DISPOSITION], default: RELINK }
        folderId: { type: [string, "null"], format: uuid }
        moduleCode: { type: [string, "null"] }
        entityName: { type: [string, "null"] }
        entityRefId: { type: [string, "null"] }
        linkRole: { type: [string, "null"] }
        retentionPolicyId: { type: [string, "null"], format: uuid }

    # =======================================================================
    # RECON v3.2 — letter/document config, letter generation, acknowledgements
    # (BRD §5.2 E27–E36; SQL Sections F/G). ADD-ONLY.
    # =======================================================================

    # ---- RECON enums (Section 5.5) ----------------------------------------
    ConfigStatus:
      type: string
      description: '`g13_config_status` — lifecycle of a RECON config master.'
      enum: [ACTIVE, INACTIVE]
    LetterRequestStatus:
      type: string
      description: '`g13_letter_request_status` — letter-generation request lifecycle.'
      enum: [DRAFT, PENDING_RESOLUTION, VALIDATION_ERROR, AWAITING_SIGNATURE, SCHEDULED, GENERATED, ISSUED, FAILED, CANCELLED]
    BulkJobStatus:
      type: string
      description: '`g13_bulk_job_status` — bulk letter/sign-off job lifecycle.'
      enum: [QUEUED, IN_PROGRESS, HELD, AWAITING_EMPLOYEE_ACTION, AWAITING_ACK, COMPLETE, FAILED]
    AckCampaignStatus:
      type: string
      description: '`g13_ack_campaign_status` — acknowledgement campaign lifecycle.'
      enum: [DRAFT, ACTIVE, CLOSING, COMPLETE]
    AckStatus:
      type: string
      description: '`g13_ack_status` — per-employee acknowledgement lifecycle.'
      enum: [PENDING, ACKNOWLEDGED, OVERDUE]

    # ---- Document categories (+ profile-field linkage) — E27/E28 ----------
    DocumentCategory:
      type: object
      description: '`document_categories` — tenant category master (DOCCAT_N).'
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        entityId: { type: [string, "null"], format: uuid }
        categoryCode: { type: string, description: 'Business key, DOCCAT_N (unique per tenant).' }
        name: { type: string }
        status: { $ref: '#/components/schemas/ConfigStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DocumentCategoryInput:
      type: object
      required: [categoryCode, name]
      properties:
        categoryCode: { type: string, maxLength: 60 }
        name: { type: string, maxLength: 200 }
        status: { type: [string, "null"], allOf: [ { $ref: '#/components/schemas/ConfigStatus' } ] }
    DocumentCategoryPage:
      type: object
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/DocumentCategory' }
    CategoryProfileField:
      type: object
      description: '`document_category_profile_fields` — category ↔ G01 profile-field slug linkage.'
      properties:
        id: { type: string, format: uuid }
        documentCategoryId: { type: string, format: uuid }
        profileFieldKey: { type: string, description: 'G01-owned employee-profile field slug (text key, no FK).' }
        displayOrder: { type: integer }
    CategoryProfileFieldInput:
      type: object
      required: [profileFieldKey]
      properties:
        profileFieldKey: { type: string, maxLength: 200 }
        displayOrder: { type: [integer, "null"], default: 0 }
    CategoryProfileFieldList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CategoryProfileField' }

    # ---- Generated-document file-name formats — E29 -----------------------
    TemplateNameFormat:
      type: object
      description: '`document_template_name_formats` — generated-document naming (DOCFORMAT_N).'
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        entityId: { type: [string, "null"], format: uuid }
        formatCode: { type: string }
        formatName: { type: string }
        templateFolder: { type: [string, "null"] }
        isDefault: { type: boolean }
        nameFormat: { type: string }
        prefix: { type: [string, "null"] }
        suffix: { type: [string, "null"] }
        status: { $ref: '#/components/schemas/ConfigStatus' }
    TemplateNameFormatInput:
      type: object
      required: [formatCode, formatName, nameFormat]
      properties:
        formatCode: { type: string, maxLength: 60 }
        formatName: { type: string, maxLength: 160 }
        templateFolder: { type: [string, "null"], maxLength: 160 }
        isDefault: { type: [boolean, "null"], default: false }
        nameFormat: { type: string, maxLength: 500 }
        prefix: { type: [string, "null"], maxLength: 120 }
        suffix: { type: [string, "null"], maxLength: 120 }
        status: { type: [string, "null"], allOf: [ { $ref: '#/components/schemas/ConfigStatus' } ] }
    TemplateNameFormatPage:
      type: object
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/TemplateNameFormat' }

    # ---- Merge-field catalogue — E32 --------------------------------------
    MergeField:
      type: object
      description: '`merge_field_catalog` — {{token}} → source dictionary entry.'
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        entityId: { type: [string, "null"], format: uuid }
        fieldKey: { type: string, description: 'Token inside `{{ }}` (unique per tenant), e.g. LETTER_SERIAL_NO.' }
        label: { type: string }
        source: { type: string, description: 'Originating module/system (open set), e.g. M06_PAYROLL / SYSTEM.' }
        resolutionNote: { type: [string, "null"] }
        status: { $ref: '#/components/schemas/ConfigStatus' }
    MergeFieldInput:
      type: object
      required: [fieldKey, label, source]
      properties:
        fieldKey: { type: string, maxLength: 80 }
        label: { type: string, maxLength: 200 }
        source: { type: string, maxLength: 60 }
        resolutionNote: { type: [string, "null"], maxLength: 255 }
        status: { type: [string, "null"], allOf: [ { $ref: '#/components/schemas/ConfigStatus' } ] }
    MergeFieldPage:
      type: object
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/MergeField' }

    # ---- Policy-letter settings (per company) — E30 -----------------------
    PolicyLetterSettings:
      type: object
      description: '`policy_letter_settings` — per-company sign-off/ack text + CTC letter-render settings.'
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        entityId: { type: [string, "null"], format: uuid }
        companyCode: { type: string }
        policySignoffText: { type: string }
        letterAckText: { type: string }
        letterCtcFontSize: { type: [string, "null"] }
        letterCtcFont: { type: [string, "null"] }
        letterCtcPadding: { type: [string, "null"] }
        blockPolicyOnMobile: { type: boolean }
    PolicyLetterSettingsInput:
      type: object
      required: [companyCode, policySignoffText, letterAckText]
      properties:
        companyCode: { type: string, maxLength: 40 }
        policySignoffText: { type: string }
        letterAckText: { type: string }
        letterCtcFontSize: { type: [string, "null"], maxLength: 20 }
        letterCtcFont: { type: [string, "null"], maxLength: 160 }
        letterCtcPadding: { type: [string, "null"], maxLength: 20 }
        blockPolicyOnMobile: { type: [boolean, "null"], default: false }
    PolicyLetterSettingsPage:
      type: object
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/PolicyLetterSettings' }

    # ---- Self-generate settings — E31 -------------------------------------
    SelfGenerateSetting:
      type: object
      description: '`self_generate_settings` — self-service letter-generation defaults (SELFGEN_N). Letter-head / signing-authority / signature values are logical refs to masters outside G13.'
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        entityId: { type: [string, "null"], format: uuid }
        settingCode: { type: string }
        name: { type: string }
        companies: { type: array, items: { type: string } }
        companyCodes: { type: array, items: { type: string } }
        userAssignment: { type: [string, "null"] }
        letterGenerationAccess: { type: array, items: { type: string } }
        defaultLetterHeadHtmlRef: { type: [string, "null"] }
        defaultLetterHeadDocxRef: { type: [string, "null"] }
        defaultSigningAuthority1: { type: [string, "null"] }
        defaultSigningAuthority2: { type: [string, "null"] }
        defaultSigningAuthority3: { type: [string, "null"] }
        defaultSigningAuthority4: { type: [string, "null"] }
        defaultSignature1: { type: [string, "null"] }
        defaultSignature2: { type: [string, "null"] }
        defaultSignature3: { type: [string, "null"] }
        defaultSignature4: { type: [string, "null"] }
        status: { $ref: '#/components/schemas/ConfigStatus' }
    SelfGenerateSettingInput:
      type: object
      required: [settingCode, name]
      properties:
        settingCode: { type: string, maxLength: 60 }
        name: { type: string, maxLength: 160 }
        companies: { type: array, items: { type: string } }
        companyCodes: { type: array, items: { type: string } }
        userAssignment: { type: [string, "null"] }
        letterGenerationAccess: { type: array, items: { type: string } }
        defaultLetterHeadHtmlRef: { type: [string, "null"], maxLength: 60 }
        defaultLetterHeadDocxRef: { type: [string, "null"], maxLength: 60 }
        defaultSigningAuthority1: { type: [string, "null"], maxLength: 60 }
        defaultSigningAuthority2: { type: [string, "null"], maxLength: 60 }
        defaultSigningAuthority3: { type: [string, "null"], maxLength: 60 }
        defaultSigningAuthority4: { type: [string, "null"], maxLength: 60 }
        defaultSignature1: { type: [string, "null"], maxLength: 60 }
        defaultSignature2: { type: [string, "null"], maxLength: 60 }
        defaultSignature3: { type: [string, "null"], maxLength: 60 }
        defaultSignature4: { type: [string, "null"], maxLength: 60 }
        status: { type: [string, "null"], allOf: [ { $ref: '#/components/schemas/ConfigStatus' } ] }
    SelfGenerateSettingPage:
      type: object
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/SelfGenerateSetting' }

    # ---- Letter generation requests — E33 ---------------------------------
    LetterGenerationRequest:
      type: object
      description: '`letter_generation_requests` — per-letter generation queue row.'
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        entityId: { type: [string, "null"], format: uuid }
        requestNo: { type: string, description: 'Business key, unique per tenant.' }
        letterType: { type: string }
        templateRef: { type: [string, "null"], format: uuid, description: 'Logical ref to the M11 letter template.' }
        documentTypeId: { type: [string, "null"], format: uuid }
        employeeId: { type: [string, "null"], format: uuid, description: 'Null for candidate letters.' }
        subjectName: { type: [string, "null"] }
        requestedBy: { type: [string, "null"], format: uuid }
        requestContext: { type: [string, "null"] }
        mergeFieldsTotal: { type: integer }
        mergeFieldsResolved: { type: integer }
        signerSummary: { type: [string, "null"] }
        signatureRequestId: { type: [string, "null"], format: uuid }
        generatedDocumentId: { type: [string, "null"], format: uuid }
        scheduledAt: { type: [string, "null"], format: date-time }
        validationError: { type: [string, "null"], description: 'Populated when status = VALIDATION_ERROR (e.g. unresolved merge token).' }
        status: { $ref: '#/components/schemas/LetterRequestStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LetterGenerationRequestInput:
      type: object
      required: [requestNo, letterType]
      properties:
        requestNo: { type: string, maxLength: 40 }
        letterType: { type: string, maxLength: 120 }
        templateRef: { type: [string, "null"], format: uuid }
        documentTypeId: { type: [string, "null"], format: uuid }
        employeeId: { type: [string, "null"], format: uuid }
        subjectName: { type: [string, "null"], maxLength: 200 }
        requestContext: { type: [string, "null"], maxLength: 120 }
        scheduledAt: { type: [string, "null"], format: date-time }
    LetterGenerateRequest:
      type: object
      description: Optional generation overrides (file-name format, target folder).
      properties:
        nameFormatCode: { type: [string, "null"], description: 'DOCFORMAT_N to name the produced document.' }
        folderId: { type: [string, "null"], format: uuid }
    LetterSignRequest:
      type: object
      required: [method]
      properties:
        method: { type: string, description: 'Signature method; must be in the type''s allowed list (else ERR-G13-SIGNATURE_METHOD_NOT_ALLOWED).', examples: [DSC_TOKEN, AADHAAR_ESIGN] }
        signerRef: { type: [string, "null"] }
        comment: { type: [string, "null"] }
    MergeResolutionResult:
      type: object
      description: Result of resolving a request's merge tokens against `merge_field_catalog`.
      properties:
        requestId: { type: string, format: uuid }
        mergeFieldsTotal: { type: integer }
        mergeFieldsResolved: { type: integer }
        unresolvedTokens: { type: array, items: { type: string }, description: 'Tokens with no catalogue/source value; non-empty ⇒ VALIDATION_ERROR.' }
        status: { $ref: '#/components/schemas/LetterRequestStatus' }
    LetterGenerationRequestPage:
      type: object
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/LetterGenerationRequest' }

    # ---- Bulk letter jobs — E34 -------------------------------------------
    BulkLetterJob:
      type: object
      description: '`bulk_letter_jobs` — batch letter/sign-off job progress (JOB-M11-BULKLTR).'
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        entityId: { type: [string, "null"], format: uuid }
        jobNo: { type: string }
        jobName: { type: string }
        templateRef: { type: [string, "null"], format: uuid }
        jobRef: { type: [string, "null"], format: uuid, description: 'Logical ref to core `jobs(id)` (no FK).' }
        recordCount: { type: integer }
        processedCount: { type: integer }
        failedCount: { type: integer }
        progressPct: { type: number, format: float }
        eta: { type: [string, "null"], format: date-time }
        status: { $ref: '#/components/schemas/BulkJobStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BulkLetterJobStartRequest:
      type: object
      required: [jobNo, jobName]
      properties:
        jobNo: { type: string, maxLength: 40 }
        jobName: { type: string, maxLength: 200 }
        templateRef: { type: [string, "null"], format: uuid }
        recordCount: { type: [integer, "null"], default: 0 }
    BulkLetterJobPage:
      type: object
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/BulkLetterJob' }

    # ---- Acknowledgement campaigns — E35 ----------------------------------
    AcknowledgementCampaign:
      type: object
      description: '`acknowledgement_campaigns` — sign-off/policy acknowledgement drive.'
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        entityId: { type: [string, "null"], format: uuid }
        campaignNo: { type: string }
        name: { type: string }
        documentId: { type: [string, "null"], format: uuid }
        documentTitle: { type: [string, "null"] }
        documentVersionNo: { type: [integer, "null"] }
        purpose: { type: [string, "null"] }
        audienceDescription: { type: [string, "null"] }
        audienceUagRef: { type: [string, "null"] }
        reminderCadence: { type: [string, "null"] }
        escalateAfterSlaTo: { type: [string, "null"] }
        startedAt: { type: [string, "null"], format: date-time }
        deadline: { type: [string, "null"], format: date }
        assignedCount: { type: integer }
        acknowledgedCount: { type: integer }
        pendingCount: { type: integer }
        overdueCount: { type: integer }
        status: { $ref: '#/components/schemas/AckCampaignStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AcknowledgementCampaignInput:
      type: object
      required: [campaignNo, name]
      properties:
        campaignNo: { type: string, maxLength: 40 }
        name: { type: string, maxLength: 200 }
        documentId: { type: [string, "null"], format: uuid }
        documentTitle: { type: [string, "null"], maxLength: 255 }
        documentVersionNo: { type: [integer, "null"] }
        purpose: { type: [string, "null"], maxLength: 160 }
        audienceDescription: { type: [string, "null"], maxLength: 200 }
        audienceUagRef: { type: [string, "null"], maxLength: 80 }
        reminderCadence: { type: [string, "null"], maxLength: 80 }
        escalateAfterSlaTo: { type: [string, "null"], maxLength: 80 }
        deadline: { type: [string, "null"], format: date }
    CampaignTrackResult:
      type: object
      description: Progress rollup for an acknowledgement campaign.
      properties:
        campaignId: { type: string, format: uuid }
        assignedCount: { type: integer }
        acknowledgedCount: { type: integer }
        pendingCount: { type: integer }
        overdueCount: { type: integer }
        status: { $ref: '#/components/schemas/AckCampaignStatus' }
    AcknowledgementCampaignPage:
      type: object
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AcknowledgementCampaign' }

    # ---- Per-employee acknowledgement records — E36 -----------------------
    DocumentAcknowledgement:
      type: object
      description: '`document_acknowledgements` — per-employee non-repudiation acknowledgement (DM25).'
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        entityId: { type: [string, "null"], format: uuid }
        campaignId: { type: [string, "null"], format: uuid }
        documentId: { type: [string, "null"], format: uuid }
        documentTitle: { type: [string, "null"] }
        documentVersionNo: { type: [integer, "null"], description: 'Version active at acknowledgement time (DM25).' }
        employeeId: { type: string, format: uuid }
        consentTextSnapshot: { type: [string, "null"], description: 'Write-once snapshot of the consent text shown (DM25).' }
        appVersion: { type: [string, "null"], description: 'Browser/app version captured (DM25).' }
        ipAddress: { type: [string, "null"] }
        assignedAt: { type: string, format: date-time }
        dueDate: { type: [string, "null"], format: date }
        acknowledgedAt: { type: [string, "null"], format: date-time }
        consentRecordId: { type: [string, "null"], format: uuid, description: 'Platform DPDP consent linkage.' }
        status: { $ref: '#/components/schemas/AckStatus' }
    AcknowledgeRequest:
      type: object
      description: In-campaign employee acknowledgement; the server captures IP/app version and snapshots consent text.
      required: [employeeId]
      properties:
        employeeId: { type: string, format: uuid, description: 'Must be the caller''s own assignment (else 403 FORBIDDEN).' }
        documentVersionNo: { type: [integer, "null"] }
        consentTextSnapshot: { type: [string, "null"] }
        appVersion: { type: [string, "null"] }
        consentRecordId: { type: [string, "null"], format: uuid }
    RecordAcknowledgementRequest:
      type: object
      description: Records non-repudiation evidence against an existing acknowledgement assignment (write-once).
      properties:
        consentTextSnapshot: { type: [string, "null"] }
        appVersion: { type: [string, "null"] }
        documentVersionNo: { type: [integer, "null"] }
        consentRecordId: { type: [string, "null"], format: uuid }
    DocumentAcknowledgementPage:
      type: object
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/DocumentAcknowledgement' }
