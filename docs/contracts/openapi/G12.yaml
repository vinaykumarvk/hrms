            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyBatch' }
        '409':
          description: '`SR_LEGACY_UNMATCHED` — a record is not matched to a master employee.'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412':
          description: '`SR_SECOND_CUSTODIAN_REQUIRED` — confidence-flagged promotion lacks a co-signer.'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
